[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codequest"
version = "0.1.0"
description = "A terminal game that teaches programming from beginner to advanced"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Giovanni" }]

dependencies = [
    # The [syntax] extra is what supplies tree-sitter, and without it
    # TextArea.code_editor(language="python") returns a plain Document with no
    # highlighting and raises nothing at all. tests/unit/test_editor_highlighting.py
    # asserts the capability so the silent version cannot come back.
    # The floor is 8.0 because the code is written against the 8.x API, not 0.79's.
    "textual[syntax]>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.27",          # used only by the optional mentor module
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "textual-dev>=1.5",
    # Textual's Pilot API is async, so the whole TUI suite needs an async runner.
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.0",
]
# Build-only: never installed for someone who just plays the game. Produces the
# portable --onedir executable (see codequest.spec) for the pendrive use case.
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
codequest = "codequest.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codequest"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "tests" is on the path so suites can import the shared builders from conftest.py
# explicitly, instead of relying on pytest's implicit rootdir insertion.
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
# Textual's Pilot API is async and every TUI test is a coroutine. "auto" avoids
# decorating each one, which would be pure ceremony.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: tests that take more than a second",
    "posix_only: tests that need resource limits, skipped on Windows",
]
