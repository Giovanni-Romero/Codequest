id: ai-reasoning-01
title: Encontre o caminho de estados mais curto
track: ai-engineering
island: reasoning-and-decision-making
order: 1
difficulty: challenging
tags: [ai-engineering, reasoning, search, bfs]
xp: 45
concepts: [state-space-search]
teaching:
  analogy: Uma carta do porto não é uma decisão por si só. Ela lista onde cada canal leva; uma busca registra quais canais foram tentados até uma rota alcançar o destino.
  explanation: A busca em largura explora um grafo de estados sem pesos, uma camada de distância por vez. Uma fila guarda caminhos ainda não inspecionados, enquanto um conjunto de visitados impede que estados repetidos criem trabalho infinito. O primeiro caminho até o objetivo removido da fila é, portanto, o mais curto em número de ações.
  worked_example: |
    from collections import deque
    queue = deque([("dock", ["dock"])])
    visited = {"dock"}
    print(queue, visited)
  key_points:
    - Estados e ações devem ser representados explicitamente.
    - A fila preserva comprimentos crescentes de caminho.
    - Marque um estado como visitado quando ele entrar na fila.
    - Um objetivo inalcançável retorna um caminho vazio.
brief: >
  Escreva `find_shortest_path(graph, start, goal) -> list`. `graph` mapeia cada estado string
  para uma lista de estados vizinhos string; todo vizinho também deve ser uma chave do grafo.
  Valide o grafo completo e os extremos string, rejeitando containers malformados. Use busca
  em largura na ordem declarada dos vizinhos. Retorne o caminho de estados mais curto incluindo
  os dois extremos, ou `[]` quando o objetivo for inalcançável. Lance `ValueError` para entrada inválida.
signature:
  entrypoint: find_shortest_path
  stub: |
    def find_shortest_path(graph, start, goal):
        # Retorne o caminho mais curto em um grafo de estados explícito.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [{dock: [reef, bay], reef: [goal], bay: [island], island: [goal], goal: []}, dock, goal]
      expect: [dock, reef, goal]
    - args: [{a: [b], b: [], c: []}, a, c]
      expect: []
  hidden:
    - args: [{a: [b], b: [a, c], c: []}, a, c]
      expect: [a, b, c]
    - args: [{only: []}, only, only]
      expect: [only]
    - args: [not-a-graph, a, b]
      raises: ValueError
    - args: [{a: b, b: []}, a, b]
      raises: ValueError
    - args: [{a: [missing]}, a, missing]
      raises: ValueError
hints:
  - level: 1
    text: "Qual ordem da fronteira garante que uma rota de duas ações seja inspecionada antes de qualquer rota de três ações?"
  - level: 2
    text: "Guarde pares `(state, path)` em `collections.deque` e mantenha um conjunto de visitados."
  - level: 3
    text: "Padrão: remova pela esquerda, retorne ao chegar no objetivo e adicione cada vizinho inédito com `path + [neighbor]`."
solution: |
  def find_shortest_path(graph, start, goal):
      from collections import deque
      if not isinstance(graph, dict) or not graph or not isinstance(start, str) or not isinstance(goal, str):
          raise ValueError("invalid graph")
      if any(not isinstance(state, str) or not isinstance(neighbors, list) or any(not isinstance(neighbor, str) for neighbor in neighbors) for state, neighbors in graph.items()):
          raise ValueError("invalid graph")
      if start not in graph or goal not in graph or any(neighbor not in graph for neighbors in graph.values() for neighbor in neighbors):
          raise ValueError("unknown state")
      queue = deque([(start, [start])])
      visited = {start}
      while queue:
          state, path = queue.popleft()
          if state == goal:
              return path
          for neighbor in graph[state]:
              if neighbor not in visited:
                  visited.add(neighbor)
                  queue.append((neighbor, path + [neighbor]))
      return []
