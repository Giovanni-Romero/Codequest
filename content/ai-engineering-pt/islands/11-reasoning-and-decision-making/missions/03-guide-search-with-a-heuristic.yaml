id: ai-reasoning-03
title: Guie a busca com uma heurística
track: ai-engineering
island: reasoning-and-decision-making
order: 3
difficulty: challenging
tags: [ai-engineering, reasoning, search, heuristic]
xp: 45
concepts: [heuristic-search]
teaching:
  analogy: Uma estimativa da carta pode enviar o navegador à boia que parece mais próxima do porto. Ela muda a prioridade, não os canais existentes nem a veracidade da rota.
  explanation: A busca gulosa pela melhor escolha expande o estado da fronteira com a menor estimativa declarada de custo restante. Um heap torna essa prioridade explícita. A heurística pode reduzir expansões, mas uma estimativa enganosa pode escolher uma rota mais longa; por isso, a auditoria retornada deve preservar a evidência.
  worked_example: |
    import heapq
    frontier = [(2, 0, "reef"), (1, 1, "bay")]
    print(heapq.heappop(frontier)[2])
  key_points:
    - Uma heurística classifica estados da fronteira; ela não muda a validade do grafo.
    - Estimativas menores recebem prioridade.
    - Um contador de inserção torna estimativas iguais determinísticas.
    - Um conjunto de visitados ainda impede trabalho cíclico.
brief: >
  Escreva `heuristic_path(graph, heuristics, start, goal) -> dict`. Valide o grafo completo
  de strings e exija uma heurística numérica finita para cada estado, excluindo `bool`.
  Execute busca gulosa ordenada por `(heuristic, ordem de inserção)`. Retorne `path` e os
  estados `expanded` ordenados; use um caminho vazio quando o objetivo for inalcançável.
  Lance `ValueError` para entrada malformada, estimativas ausentes ou números não finitos.
signature:
  entrypoint: heuristic_path
  stub: |
    def heuristic_path(graph, heuristics, start, goal):
        # Priorize a fronteira com estimativas declaradas de custo restante.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args:
        - {start: [reef, bay], reef: [goal], bay: [island], island: [goal], goal: []}
        - {start: 3, reef: 2, bay: 1, island: 1, goal: 0}
        - start
        - goal
      expect: {path: [start, bay, island, goal], expanded: [start, bay, island, goal]}
    - args: [{a: [b], b: [], goal: []}, {a: 2, b: 1, goal: 0}, a, goal]
      expect: {path: [], expanded: [a, b]}
  hidden:
    - args: [{a: [b, c], b: [goal], c: [goal], goal: []}, {a: 2, b: 1, c: 1, goal: 0}, a, goal]
      expect: {path: [a, b, goal], expanded: [a, b, goal]}
    - args: [{a: [b], b: [a, goal], goal: []}, {a: 2, b: 1, goal: 0}, a, goal]
      expect: {path: [a, b, goal], expanded: [a, b, goal]}
    - args: [{a: []}, {a: .nan}, a, a]
      raises: ValueError
    - args: [{a: [b], b: []}, {a: 1}, a, b]
      raises: ValueError
    - args: [{a: []}, {a: 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF}, a, a]
      raises: ValueError
hints:
  - level: 1
    text: "Qual campo deve decidir o próximo estado e o que deve decidir um empate?"
  - level: 2
    text: "Insira tuplas `(estimate, counter, state, path)` em `heapq`."
  - level: 3
    text: "Incremente o contador a cada inserção e ignore estados já expandidos."
solution: |
  def heuristic_path(graph, heuristics, start, goal):
      import heapq
      import math
      def finite_number(value):
          if type(value) not in (int, float):
              return False
          try:
              return math.isfinite(value)
          except OverflowError:
              return False
      if not isinstance(graph, dict) or not graph or not isinstance(heuristics, dict) or not isinstance(start, str) or not isinstance(goal, str):
          raise ValueError("invalid input")
      if any(not isinstance(state, str) or not isinstance(neighbors, list) or any(not isinstance(neighbor, str) for neighbor in neighbors) for state, neighbors in graph.items()):
          raise ValueError("invalid graph")
      if start not in graph or goal not in graph or any(neighbor not in graph for neighbors in graph.values() for neighbor in neighbors):
          raise ValueError("unknown state")
      if set(heuristics) != set(graph) or not all(finite_number(value) for value in heuristics.values()):
          raise ValueError("invalid heuristics")
      frontier = [(heuristics[start], 0, start, [start])]
      counter = 0
      expanded = []
      visited = set()
      while frontier:
          _, _, state, path = heapq.heappop(frontier)
          if state in visited:
              continue
          visited.add(state)
          expanded.append(state)
          if state == goal:
              return {"path": path, "expanded": expanded}
          for neighbor in graph[state]:
              if neighbor not in visited:
                  counter += 1
                  heapq.heappush(frontier, (heuristics[neighbor], counter, neighbor, path + [neighbor]))
      return {"path": [], "expanded": expanded}
