brief: |
  Escreva `evaluate_dataset(cases, predictions, metrics)`. Casos usam `case_id`, `capability` e
  `expected`; IDs são strings não vazias e únicos. Métricas mapeiam cada capacidade para `exact`, e
  previsões mapeiam cada ID para um escalar. Devolva `{"status": "invalid_dataset", "invalid": [...]}`
  para IDs de linhas inválidas na ordem, incluindo IDs duplicados depois da primeira ocorrência. Caso
  contrário, devolva `ok` com registros de nota por capacidade em ordem de primeira ocorrência. Valide
  todas as entradas antes de devolver.
