    - args: [[{case_id: a, capability: search, input: {q: x}, expected: [one]}, {case_id: b, capability: search, input: {q: x}, expected: [one]}], [search, answer], 1]
      expect: {counts: {search: 2, answer: 0}, missing: [answer], overrepresented: [search], duplicates: [b]}
  hidden:
