      expect: {counts: {search: 0}, missing: [search], overrepresented: [], duplicates: []}
    - args: [[{case_id: a, capability: search, input: 1, expected: 1}, {case_id: a, capability: search, input: 2, expected: 2}], [search], 2]
      raises: ValueError
    - args: [[{case_id: a, capability: search, input: 1, expected: 1}], [search, search], 2]
      raises: ValueError
