brief: |
  Escreva `audit_eval_dataset(cases, required_capabilities, max_per_capability)`. Cada caso deve ter
  exatamente `case_id`, `capability`, `input` e `expected`; IDs são strings não vazias e únicos.
  Cada capacidade exigida é uma string não vazia e única, e cada caso usa uma delas. Devolva
  `counts`, `missing`, `overrepresented` e `duplicates` na ordem declarada ou de entrada. Um duplicado
  tem `input` e `expected` iguais aos de um caso anterior, mesmo quando essas cargas são listas ou dicionários.
  Valide toda a entrada antes de devolver e gere `ValueError` para dados inválidos.
