id: ai-evals-03
title: Desafie atalhos
track: ai-engineering
island: evals
order: 3
difficulty: moderate
tags: [ai-engineering, evals, adversarial]
xp: 30
concepts: [adversarial-cases]
teaching:
  analogy: |
    Uma fechadura Ã© testada com a chave normal, uma chave torta, uma cÃ³pia e forÃ§a na porta.
  explanation: |
    Casos adversariais miram atalhos que um sistema pode usar. Um controle benigno prova que o recurso ainda funciona na entrada comum. Cada ataque precisa de um controle pareado; rejeitar pode esconder um caminho normal quebrado. DiagnÃ³sticos separam ataques ausentes e defesas falhas.
  worked_example: |
    samples = [{"kind": "benign", "ok": True}, {"kind": "malformed", "ok": False}]
    print([row["kind"] for row in samples if not row["ok"]])
  key_points:
    - Um caminho feliz não prova resistência a um atalho.
    - Mantenha cada ataque pareado a um controle benigno da mesma capacidade.
    - Registre um ataque ignorado separadamente de um controle quebrado.
brief: |
  Escreva `audit_adversarial_cases(cases, required_attacks)`. Um caso tem as chaves exatas `case_id`,
  `capability`, `kind`, `expected` e `actual`; `kind` é `benign` ou um tipo de ataque exigido. IDs e tipos
  de ataque exigidos são strings não vazias e únicos. Cada par `(capability, kind)` é único, assim um ataque
  repetido não pode esconder um diagnóstico conflitante. Casos benignos estão quebrados quando `actual`
  difere de `expected`. Casos de ataque são ignorados quando `actual` difere de `expected`. Devolva, em
  ordem, `missing`, `broken`, `missed` e `unpaired`; um ataque não está pareado quando sua capacidade não
  tem um controle benigno. Valide tudo e gere `ValueError` para entradas inválidas.
signature:
  entrypoint: audit_adversarial_cases
  stub: |
    def audit_adversarial_cases(cases, required_attacks):
        # Verifique controles e ataques em vez de confiar em um caminho feliz.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{case_id: b, capability: parse, kind: benign, expected: ok, actual: ok}, {case_id: a, capability: parse, kind: malformed, expected: reject, actual: reject}], [malformed, hostile]]
      expect: {missing: [hostile], broken: [], missed: [], unpaired: []}
    - args: [[{case_id: b, capability: parse, kind: benign, expected: ok, actual: fail}, {case_id: a, capability: route, kind: hostile, expected: reject, actual: reject}], [hostile]]
      expect: {missing: [], broken: [b], missed: [], unpaired: [a]}
  hidden:
    - args: [[{case_id: b, capability: parse, kind: benign, expected: ok, actual: ok}, {case_id: a, capability: parse, kind: shortcut, expected: reject, actual: reject}], [shortcut]]
      expect: {missing: [], broken: [], missed: [], unpaired: []}
    - args: [[{case_id: a, capability: parse, kind: shortcut, expected: reject, actual: reject}, {case_id: z, capability: parse, kind: shortcut, expected: reject, actual: reject}], [shortcut]]
      raises: ValueError
    - args: [[{case_id: b, capability: parse, kind: benign, expected: ok, actual: ok}, {case_id: a, capability: parse, kind: other, expected: reject, actual: reject}], [shortcut]]
      raises: ValueError
    - args: [[{case_id: b, capability: parse, kind: benign, expected: ok, actual: ok}, {case_id: a, capability: parse, kind: [shortcut], expected: reject, actual: reject}], [shortcut]]
      raises: ValueError
    - args: [[{case_id: b, capability: parse, kind: benign, expected: ok, actual: ok}, {case_id: a, capability: parse, kind: shortcut, expected: reject, actual: reject}, {case_id: z, capability: parse, kind: benign, expected: ok, actual: ok, extra: x}], [shortcut]]
      raises: ValueError
hints:
  - {level: 1, text: "Que evidência mostra que uma defesa funciona sem quebrar o uso comum?"}
  - {level: 2, text: "Valide cada linha, colete capacidades benignas e depois classifique ataques na ordem de entrada."}
  - {level: 3, text: "Num registro de portões, guarde primeiro os locais de passagem normal; depois marque cada tentativa de força sem um deles."}
solution: |
  def audit_adversarial_cases(cases, required_attacks):
      if not isinstance(cases, list) or not isinstance(required_attacks, list) or any(not isinstance(kind, str) or not kind for kind in required_attacks) or len(set(required_attacks)) != len(required_attacks):
          raise ValueError("invalid attacks")
      ids = set()
      attack_pairs = set()
      benign = set()
      for case in cases:
          if not isinstance(case, dict) or set(case) != {"case_id", "capability", "kind", "expected", "actual"}:
              raise ValueError("invalid case")
          case_id, capability, kind = case["case_id"], case["capability"], case["kind"]
          if not isinstance(case_id, str) or not case_id or not isinstance(capability, str) or not capability or not isinstance(kind, str) or kind not in ["benign", *required_attacks] or case_id in ids:
              raise ValueError("invalid identity")
          ids.add(case_id)
          pair = (capability, kind)
          if pair in attack_pairs:
              raise ValueError("duplicate capability/kind")
          attack_pairs.add(pair)
          if kind == "benign":
              benign.add(capability)
      present = [kind for kind in required_attacks if any(case["kind"] == kind for case in cases)]
      return {"missing": [kind for kind in required_attacks if kind not in present], "broken": [case["case_id"] for case in cases if case["kind"] == "benign" and case["actual"] != case["expected"]], "missed": [case["case_id"] for case in cases if case["kind"] != "benign" and case["actual"] != case["expected"]], "unpaired": [case["case_id"] for case in cases if case["kind"] != "benign" and case["capability"] not in benign]}
