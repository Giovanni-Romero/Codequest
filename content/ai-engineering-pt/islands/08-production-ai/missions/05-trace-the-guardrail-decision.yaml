solution: |
  def apply_guardrails(request, response, policy):
      def labels(value, keys, name):
          if not isinstance(value, dict) or set(value) != set(keys):
              raise ValueError("invalid " + name)
          result = []
          for key in keys:
              item = value[key]
              if not isinstance(item, list) or any(type(x) is not str or not x for x in item) or len(set(item)) != len(item):
                  raise ValueError("invalid " + name)
              result.append(item)
          return result
      inputs, = labels(request, ("input_labels",), "request")
      outputs, = labels(response, ("output_labels",), "response")
      rules, blocked_in, blocked_out = labels(policy, ("prompt_rules", "blocked_input_labels", "blocked_output_labels"), "policy")
      matches = [item for item in blocked_in if item in inputs]
      if matches:
          return {"status": "rejected", "layer": "input", "matches": matches}
      matches = [item for item in blocked_out if item in outputs]
      if matches:
          return {"status": "rejected", "layer": "output", "matches": matches}
      return {"status": "allowed", "guidance": list(rules)}
  
  def build_safe_trace(events):
      if not isinstance(events, list) or not events:
          raise ValueError("invalid events")
      stages = ["input", "provider", "output"]
      clean = []
      failed = None
      for index, event in enumerate(events):
          if index >= len(stages) or not isinstance(event, dict) or set(event) != {"stage", "status", "elapsed_ms", "input_size", "output_size", "failure_reason"}:
              raise ValueError("invalid event")
          if event["stage"] != stages[index] or type(event["status"]) is not str or event["status"] not in {"ok", "error"}:
              raise ValueError("invalid event")
          if any(type(event[key]) is not int or event[key] < 0 for key in ("elapsed_ms", "input_size", "output_size")):
              raise ValueError("invalid event")
          reason = event["failure_reason"]
          if (event["status"] == "error") != (type(reason) is str and bool(reason)) or failed is not None:
              raise ValueError("invalid event")
          clean.append({key: event[key] for key in ("stage", "status", "elapsed_ms", "input_size", "output_size", "failure_reason")})
          if event["status"] == "error":
              failed = event
      result = {"status": "failed" if failed else "complete", "total_elapsed_ms": sum(event["elapsed_ms"] for event in clean), "events": clean}
      if failed:
          result.update(failure_stage=failed["stage"], failure_reason=failed["failure_reason"])
      return result
  
  def trace_guarded_run(request, response, policy, events):
      decision = apply_guardrails(request, response, policy)
      trace = build_safe_trace(events)
      if decision["status"] == "allowed":
          if trace["status"] != "complete" or len(trace["events"]) != 3:
              raise ValueError("trace mismatch")
          return {"status": "allowed", "layer": None, "matches": [], "trace": trace}
      if trace["status"] != "failed" or trace["failure_stage"] != decision["layer"] or trace["failure_reason"] != "blocked_" + decision["layer"]:
          raise ValueError("trace mismatch")
      return {"status": "rejected", "layer": decision["layer"], "matches": decision["matches"], "trace": trace}
