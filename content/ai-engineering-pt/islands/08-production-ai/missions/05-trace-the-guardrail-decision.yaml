teaching:
  analogy: Uma portaria registra qual checkpoint parou a visita, nunca a conversa privada.
  explanation: Uma decisão e um trace precisam concordar. Bloqueio de entrada termina na entrada; saída termina na saída. O trace segue só com metadados.
  worked_example: 'etapas = ["chegada", "saída"]

    print(etapas[-1])'
  key_points:
  - Decisão e trace descrevem a mesma etapa.
  - Valide todo o trace antes de decidir.
  - Evidência segura omite payloads.
brief: Escreva `trace_guarded_run(request, response, policy, events) -> dict`. Reutilize os formatos exatos de guardrail e trace. Valide todas as entradas antes de derivar a decisão. Um trace de rejeição termina na etapa de erro correspondente; trabalho permitido tem três etapas bem-sucedidas. Retorne apenas metadados da decisão e o trace seguro.
