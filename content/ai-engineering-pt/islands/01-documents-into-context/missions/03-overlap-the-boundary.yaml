id: ai-documents-03
title: Sobreponha a fronteira
track: ai-engineering
island: documents-into-context
order: 3
difficulty: moderate
tags: [ai-engineering, chunking, overlap]
xp: 30

concepts:
  - chunk-overlap

teaching:
  analogy: |
    Duas folhas de um mapa compartilham uma faixa estreita nas bordas. O litoral
    repetido permite que o navegador alinhe as folhas em vez de adivinhar como uma
    continua na outra.

    Chunks sobrepostos repetem uma fronteira controlada pela mesma razão: uma frase
    cortada entre dois chunks mantém contexto vizinho suficiente para fazer sentido.

  explanation: |
    Overlap é a quantidade de palavras repetidas de um chunk no seguinte. O deslocamento
    entre inícios é o stride: `max_words - overlap`. O overlap deve ser menor que o chunk,
    ou o início nunca avança. Quando um chunk alcançar o fim, pare para que o overlap
    restante não crie caudas redundantes.

  worked_example: |
    # Crie cartões de rota com três paradas e uma parada repetida.
    stops = ["A", "B", "C", "D", "E"]
    cards = []
    for start in range(0, len(stops), 2):
        cards.append(stops[start : start + 3])
        if start + 3 >= len(stops):
            break
    print(cards)  # [["A", "B", "C"], ["C", "D", "E"]]

  key_points:
    - Stride é o tamanho do chunk menos o overlap; ele deve permanecer positivo.
    - Mais overlap repete mais contexto e consome mais do orçamento posterior.
    - Pare quando o chunk atual alcançar o fim para evitar fragmentos redundantes.
    - Overlap zero é válido e se comporta como chunking de janela fixa.

brief: |
  Escreva `chunk_with_overlap`. Ela recebe texto, um `max_words` positivo e um overlap.
  Retorne chunks consecutivos com no máximo `max_words` palavras. Cada chunk depois do
  primeiro repete a quantidade pedida de palavras do chunk anterior.

  Normalize o whitespace e retorne uma lista vazia para texto vazio. Levante `ValueError`
  quando `max_words` não for positivo, quando overlap for negativo ou quando overlap for
  maior ou igual a `max_words`. Não gere chunks que sejam apenas caudas redundantes.

signature:
  entrypoint: chunk_with_overlap
  stub: |
    def chunk_with_overlap(text, max_words, overlap):
        # Avance por max_words menos overlap até um chunk alcançar o fim.
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["one two three four five six", 3, 1]
      expect: ["one two three", "three four five", "five six"]
    - args: ["alpha beta gamma delta", 2, 0]
      expect: ["alpha beta", "gamma delta"]
  hidden:
    - args: ["", 3, 1]
      expect: []
    - args: ["  \t\n ", 2, 1]
      expect: []
    - args: ["anchor", 4, 3]
      expect: ["anchor"]
    - args: ["a b c d e", 4, 3]
      expect: ["a b c d", "b c d e"]
    - args: ["one two", 0, 0]
      raises: ValueError
    - args: ["one two", 2, -1]
      raises: ValueError
    - args: ["one two", 2, 2]
      raises: ValueError
    - args: ["one two", 2, 3]
      raises: ValueError

hints:
  - level: 1
    text: |
      A que distância o próximo chunk pode começar se precisa repetir as últimas palavras?
  - level: 2
    text: |
      Calcule um stride positivo como `max_words - overlap`. Pare depois de adicionar um
      chunk cujo final tenha alcançado a quantidade de palavras.
  - level: 3
    text: |
      O mesmo padrão para janelas sobrepostas de calendário é:

          step = window_size - shared_days
          for start in range(0, len(days), step):
              windows.append(days[start : start + window_size])
              if start + window_size >= len(days):
                  break

      Aplique-o às palavras e depois junte cada fatia.

solution: |
  def chunk_with_overlap(text, max_words, overlap):
      if max_words <= 0:
          raise ValueError("max_words must be positive")
      if overlap < 0 or overlap >= max_words:
          raise ValueError("overlap must be between zero and max_words")

      words = text.split()
      if not words:
          return []

      chunks = []
      stride = max_words - overlap
      for start in range(0, len(words), stride):
          chunks.append(" ".join(words[start : start + max_words]))
          if start + max_words >= len(words):
              break
      return chunks
