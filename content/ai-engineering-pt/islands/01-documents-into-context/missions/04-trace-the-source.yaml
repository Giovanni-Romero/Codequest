id: ai-documents-04
title: Rastreie a origem
track: ai-engineering
island: documents-into-context
order: 4
difficulty: moderate
tags: [ai-engineering, chunking, provenance, metadata]
xp: 30

concepts:
  - chunk-metadata

teaching:
  analogy: |
    Uma citação solta num pedaço de papel é difícil de confiar. Uma ficha de biblioteca
    com o código do livro e a posição permite voltar à estante e conferir.

    Um chunk também precisa de identidade. Seu texto serve ao modelo; seus metadados
    permitem que a aplicação cite, inspecione e substitua esse texto depois.

  explanation: |
    Metadados são dados que descrevem outro dado. Cada chunk precisa de sua origem, de
    sua posição dentro dela e de um identificador estável construído com ambos. Um índice
    de lista sozinho não é durável porque combinar listas muda os índices. Manter texto e
    proveniência juntos torna cada transformação posterior rastreável.

  worked_example: |
    # Etiquete legendas de fotos sem alterar o texto.
    album = "trip-7"
    captions = ["station", "harbour"]
    labelled = []
    for position, caption in enumerate(captions):
        labelled.append({"id": f"{album}:{position}", "caption": caption})
    print(labelled)

  key_points:
    - Texto sozinho não sustenta uma citação confiável.
    - Um identificador estável combina a origem com a posição dentro dela.
    - Mantenha o texto original intacto para a proveniência não alterar a evidência.
    - Uma entrada vazia não produz registros de metadados.

brief: |
  Escreva `add_chunk_metadata`. Ela recebe um `source_id` não vazio e uma lista de chunks.
  Retorne um dicionário por chunk com exatamente estas chaves: `chunk_id`, `source_id`,
  `position` e `text`.

  As posições começam em zero. Construa `chunk_id` como `<source_id>:<position>`.
  Preserve a ordem e o texto exatamente. Retorne uma lista vazia quando não houver chunks.
  Levante `ValueError` quando `source_id` estiver vazio ou contiver apenas whitespace.

signature:
  entrypoint: add_chunk_metadata
  stub: |
    def add_chunk_metadata(source_id, chunks):
        # Anexe origem e posição estáveis sem alterar o texto.
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["manual", ["first part", "second part"]]
      expect:
        - {chunk_id: "manual:0", source_id: manual, position: 0, text: "first part"}
        - {chunk_id: "manual:1", source_id: manual, position: 1, text: "second part"}
    - args: ["note-9", ["same", "same"]]
      expect:
        - {chunk_id: "note-9:0", source_id: note-9, position: 0, text: same}
        - {chunk_id: "note-9:1", source_id: note-9, position: 1, text: same}
  hidden:
    - args: ["empty", []]
      expect: []
    - args: ["A", [""]]
      expect:
        - {chunk_id: "A:0", source_id: A, position: 0, text: ""}
    - args: ["doc:west", ["one", "two", "three"]]
      expect:
        - {chunk_id: "doc:west:0", source_id: "doc:west", position: 0, text: one}
        - {chunk_id: "doc:west:1", source_id: "doc:west", position: 1, text: two}
        - {chunk_id: "doc:west:2", source_id: "doc:west", position: 2, text: three}
    - args: ["", ["text"]]
      raises: ValueError
    - args: ["   ", ["text"]]
      raises: ValueError

hints:
  - level: 1
    text: |
      Quais dois valores continuam estáveis mesmo se esses registros forem misturados
      depois com chunks de outros documentos?
  - level: 2
    text: |
      Use `enumerate` para obter cada posição a partir de zero. Combine origem e posição
      para formar o identificador.
  - level: 3
    text: |
      Este é o padrão para etiquetar fotografias:

          labelled = []
          for number, caption in enumerate(captions):
              labelled.append({"photo_id": f"{album}:{number}", "caption": caption})

      Seu registro carrega os quatro campos declarados do chunk.

solution: |
  def add_chunk_metadata(source_id, chunks):
      if not source_id.strip():
          raise ValueError("source_id must not be empty")

      return [
          {
              "chunk_id": f"{source_id}:{position}",
              "source_id": source_id,
              "position": position,
              "text": text,
          }
          for position, text in enumerate(chunks)
      ]
