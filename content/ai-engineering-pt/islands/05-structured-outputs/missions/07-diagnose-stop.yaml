id: ai-structured-outputs-07
title: Diagnostique a parada
track: ai-engineering
island: structured-outputs
order: 7
difficulty: moderate
tags: [ai-engineering, structured-outputs, retry, taxonomy]
xp: 30
concepts: [validation-retry, failure-taxonomy]
teaching:
  analogy: |
    Um relatório de manutenção diz se o trem parou por uma peça solta, um alarme de segurança
    ou o fim da janela de reparo. A linha final precisa explicar a parada.
  explanation: |
    Um resultado diagnóstico torna visível a regra de encerramento. Falhas de parse e schema
    podem ser repetidas; policy, provider e timeout não podem. Se todas as tentativas permitidas
    forem reparáveis e nenhuma tiver sucesso, a razão estável é o esgotamento.
  worked_example: |
    events = ["loose", "loose"]
    used = len(events)
    allowed = 2
    reason = "retry_limit" if used == allowed else events[-1]
    print(reason)
  key_points:
    - Relate a primeira falha permanente encontrada.
    - Relate esgotamento somente depois de usar o limite.
    - Preserve classes distintas para que operadores possam agir.
brief: |
  Escreva `stop_reason(events, limit)`. `events` deve ser uma lista em que cada elemento é um
  dicionário com `kind` textual igual a parse, schema, policy, provider, timeout ou success.
  `limit` deve ser inteiro não negativo e não pode ser bool. Valide a lista completa antes de
  qualquer retorno terminal e então inspecione somente o prefixo limitado: retorne `"success"`,
  a classe permanente policy/provider/timeout ou `"retry_limit"`. Lance `ValueError` para
  container, elemento, tipo primitivo, classe ou limite inválido.
signature: {entrypoint: stop_reason, stub: "def stop_reason(events, limit):\n    # Explique a primeira condição terminal.\n    pass"}
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{kind: parse}, {kind: success}], 2]
      expect: success
    - args: [[{kind: schema}], 1]
      expect: retry_limit
  hidden:
    - args: [[{kind: provider}, {kind: nope}], 1]
      raises: ValueError
    - args: [[{kind: provider}, {kind: [timeout]}], 2]
      raises: ValueError
    - args: [[{kind: provider}, {kind: {name: timeout}}], 2]
      raises: ValueError
    - args: [[{kind: [provider]}], 1]
      raises: ValueError
    - args: [[{kind: {name: provider}}], 1]
      raises: ValueError
    - args: [[], 0]
      expect: retry_limit
    - args: [[{kind: provider}, {kind: success}], 2]
      expect: provider
    - args: [[{kind: timeout}], 3]
      expect: timeout
    - args: [[{kind: schema}, {kind: success}], 1]
      expect: retry_limit
    - args: [[{kind: success}], 1]
      expect: success
    - args: [[{kind: policy}], 1]
      expect: policy
    - args: [[{kind: nope}], 1]
      raises: ValueError
    - args: [null, 1]
      raises: ValueError
    - args: [[], -1]
      raises: ValueError
    - args: [[], true]
      raises: ValueError
hints:
  - {level: 1, text: "Qual evento encerra o processo agora, e qual apenas consome outra chance?"}
  - {level: 2, text: "Separe sucesso, classes terminais e a razão usada depois do limite."}
  - level: 3
    text: |
      Uma oficina pode percorrer `ordens[:limite]`, retornar em `finished`, devolver a classe
      para `cancelled` ou `unsafe` e usar `window_closed` somente depois do laço.
solution: |
  def stop_reason(events, limit):
      if not isinstance(events, list) or not isinstance(limit, int) or isinstance(limit, bool) or limit < 0:
          raise ValueError("invalid input")
      kinds = {"parse", "schema", "policy", "provider", "timeout", "success"}
      if any(not isinstance(event, dict) or not isinstance(event.get("kind"), str) or event.get("kind") not in kinds for event in events):
          raise ValueError("invalid event")
      for event in events[:limit]:
          kind = event["kind"]
          if kind == "success" or kind in {"policy", "provider", "timeout"}:
              return "success" if kind == "success" else kind
      return "retry_limit"
