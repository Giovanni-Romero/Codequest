id: ai-structured-outputs-04
title: Nomeie a falha
track: ai-engineering
island: structured-outputs
order: 4
difficulty: moderate
tags: [ai-engineering, structured-outputs, taxonomy]
xp: 30
concepts: [failure-taxonomy]
teaching:
  analogy: |
    Um painel de aeroporto separa problemas de clima, segurança, mecânica e horário. A palavra
    vaga “atraso” não informa qual equipe deve agir.
  explanation: |
    Uma taxonomia de falhas dá uma classe estável a cada problema. Falhas de parse, schema,
    policy, provider e timeout pedem ações diferentes. Preserve a classe original em vez de
    reduzir tudo a uma mensagem de exceção.
  worked_example: |
    codes = {"WX": "weather", "ME": "mechanical"}
    code = "WX"
    category = codes.get(code, "unknown")
    print(category)
    print(category != "unknown")
  key_points:
    - A classificação faz parte do contrato do resultado.
    - Rejeite uma entrada desconhecida em vez de adivinhar seu significado.
    - A classe não deve depender de palavras incidentais de uma mensagem.
brief: |
  Escreva `classify_failure(event)`. Aceite um dicionário com `kind` textual igual a `parse`,
  `schema`, `policy`, `provider` ou `timeout`, além de `detail` textual opcional. Retorne
  `{"kind": kind, "retryable": true/false}`, sendo true somente para parse e schema. Lance
  `ValueError` para container, kind, tipo primitivo ou detail inválido.
signature: {entrypoint: classify_failure, stub: "def classify_failure(event):\n    # Preserve a classe estável.\n    pass"}
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [{kind: parse}]
      expect: {kind: parse, retryable: true}
    - args: [{kind: timeout, detail: slow}]
      expect: {kind: timeout, retryable: false}
  hidden:
    - args: [null]
      raises: ValueError
    - args: [{kind: schema}]
      expect: {kind: schema, retryable: true}
    - args: [{kind: policy}]
      expect: {kind: policy, retryable: false}
    - args: [{kind: provider}]
      expect: {kind: provider, retryable: false}
    - args: [{kind: nope}]
      raises: ValueError
    - args: [{kind: [parse]}]
      raises: ValueError
    - args: [{kind: {name: parse}}]
      raises: ValueError
    - args: [{kind: parse, detail: 4}]
      raises: ValueError
hints:
  - {level: 1, text: "Qual rótulo estável permite que a próxima etapa escolha uma ação diferente?"}
  - {level: 2, text: "Use um conjunto finito de classes e um mapa separado de repetição."}
  - level: 3
    text: |
      Uma central de atendimento pode manter `repetivel = {"endereco": True, "etiqueta": True}`
      e devolver a categoria original ao lado do booleano consultado.
solution: |
  def classify_failure(event):
      kinds = {"parse", "schema", "policy", "provider", "timeout"}
      if not isinstance(event, dict) or not isinstance(event.get("kind"), str) or event.get("kind") not in kinds:
          raise ValueError("invalid failure")
      if "detail" in event and not isinstance(event["detail"], str):
          raise ValueError("detail must be text")
      return {"kind": event["kind"], "retryable": event["kind"] in {"parse", "schema"}}
