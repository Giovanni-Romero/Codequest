id: ai-structured-outputs-05
title: Analise e valide
track: ai-engineering
island: structured-outputs
order: 5
difficulty: moderate
tags: [ai-engineering, structured-outputs, schema, parsing]
xp: 30
concepts: [output-schema, safe-output-parsing]
teaching:
  analogy: |
    Um depósito primeiro abre uma caixa lacrada e depois confere o conteúdo com o pedido. Caixa
    que não abre e item errado são problemas diferentes.
  explanation: |
    Analise o JSON antes de inspecionar seus campos. Uma falha do decoder é falha de parse; um
    dicionário com campos errados é falha de schema. Separar essas etapas torna decisões de
    reparo e diagnósticos confiáveis.
  worked_example: |
    import json
    raw = '{"sku": "A1"}'
    item = json.loads(raw)
    is_object = isinstance(item, dict)
    print(item["sku"] if is_object else "bad shape")
  key_points:
    - Confirme o objeto de nível superior antes de inspecionar campos.
    - Retorne razões diferentes para defeitos de sintaxe e de schema.
    - Valide todos os campos obrigatórios depois do parse.
brief: |
  Escreva `parse_card(text)`. A entrada deve ser uma string que contém um objeto JSON com
  exatamente `name` e `count`. O nome deve ser string não vazia; count deve ser inteiro não
  negativo e não pode ser bool. Retorne `{"status": "ok", "value": {"name": ..., "count": ...}}`
  para dados válidos, `{"status": "failed", "reason": "parse"}` para entrada não textual,
  malformada ou não objeto e `{"status": "failed", "reason": "schema"}` para objeto com campos
  ou valores inválidos.
signature: {entrypoint: parse_card, stub: "def parse_card(text):\n    # Separe decoder e schema.\n    pass"}
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: ['{"name": "Ada", "count": 2}']
      expect: {status: ok, value: {name: Ada, count: 2}}
    - args: ['{"name": "Ada"}']
      expect: {status: failed, reason: schema}
  hidden:
    - args: [null]
      expect: {status: failed, reason: parse}
    - args: ['{bad}']
      expect: {status: failed, reason: parse}
    - args: ['[1]']
      expect: {status: failed, reason: parse}
    - args: ['{"name": "A", "count": true}']
      expect: {status: failed, reason: schema}
    - args: ['{"name": "A", "count": -1}']
      expect: {status: failed, reason: schema}
    - args: ['{"name": "", "count": 1}']
      expect: {status: failed, reason: schema}
    - args: ['{"name": "A", "count": 1.5}']
      expect: {status: failed, reason: schema}
    - args: ['{"name": "B", "count": 0}']
      expect: {status: ok, value: {name: B, count: 0}}
    - args: ['{"name": "C", "count": 8, "extra": 1}']
      expect: {status: failed, reason: schema}
hints:
  - {level: 1, text: "Em que momento você sabe que o texto é JSON, e quando sabe que os campos estão corretos?"}
  - {level: 2, text: "Use `json.loads` primeiro e depois valide o formato exato do dicionário."}
  - level: 3
    text: |
      Um leitor de manifesto pode capturar `JSONDecodeError` como `parse`, confirmar que o valor
      é dicionário e então comparar `set(valor)` para classificar a segunda etapa como `schema`.
solution: |
  import json

  def parse_card(text):
      if not isinstance(text, str):
          return {"status": "failed", "reason": "parse"}
      try:
          value = json.loads(text)
      except json.JSONDecodeError:
          return {"status": "failed", "reason": "parse"}
      if not isinstance(value, dict):
          return {"status": "failed", "reason": "parse"}
      if set(value) != {"name", "count"}:
          return {"status": "failed", "reason": "schema"}
      if not isinstance(value["name"], str) or not value["name"]:
          return {"status": "failed", "reason": "schema"}
      if not isinstance(value["count"], int) or isinstance(value["count"], bool) or value["count"] < 0:
          return {"status": "failed", "reason": "schema"}
      return {"status": "ok", "value": value}
