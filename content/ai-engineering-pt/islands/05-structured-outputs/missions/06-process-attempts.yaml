id: ai-structured-outputs-06
title: Processe tentativas em ordem
track: ai-engineering
island: structured-outputs
order: 6
difficulty: moderate
tags: [ai-engineering, structured-outputs, parsing, retry]
xp: 30
concepts: [safe-output-parsing, validation-retry]
teaching:
  analogy: |
    Um revisor lê rascunhos em ordem. Ele publica o primeiro aceitável, para diante de uma
    afirmação proibida e encerra quando a cota de revisão acaba.
  explanation: |
    Um processador limitado combina parse seguro com uma política de repetição. Cada string é
    analisada apenas como dado; falhas de parse continuam reparáveis. Um objeto válido encerra
    com sucesso, enquanto um marcador de policy é permanente. A ordem faz parte do contrato.
  worked_example: |
    drafts = ["bad", "ready"]
    for draft in drafts:
        if draft == "ready":
            print("publish")
            break
  key_points:
    - Analise cada tentativa completa; nunca a execute.
    - Pare imediatamente em sucesso ou falha permanente.
    - Um limite inteiro não negativo é uma fronteira de segurança.
brief: |
  Escreva `read_attempts(texts, limit)`. `texts` deve ser uma lista de strings, e `limit` deve
  ser inteiro não negativo e não pode ser bool. Cada valor analisado com sucesso deve ser um
  dicionário cujo `status` textual seja exatamente `ok`, `schema` ou `policy`; valide a lista
  completa antes de qualquer retorno terminal, inclusive além do prefixo limitado. JSON
  malformado é reparável. Depois inspecione somente `texts[:limit]`: retorne o primeiro objeto
  `ok`, `{"status": "failed", "reason": "policy"}` para policy, continue após schema ou parse
  e devolva `{"status": "exhausted"}` ao final. Lance `ValueError` para entrada ou status inválido.
signature: {entrypoint: read_attempts, stub: "def read_attempts(texts, limit):\n    # Processe tentativas em ordem.\n    pass"}
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [['{"status": "schema"}', '{"status": "ok", "value": 4}'], 2]
      expect: {status: ok, value: 4}
    - args: [['{"status": "policy"}', '{"status": "ok"}'], 2]
      expect: {status: failed, reason: policy}
  hidden:
    - args: [['{"status": "policy"}', 7], 1]
      raises: ValueError
    - args: [['{"status": "policy"}', '{"status": []}'], 2]
      raises: ValueError
    - args: [['{"status": "policy"}', '{"status": {}}'], 2]
      raises: ValueError
    - args: [['{"status": "schema"}', '{"status": []}'], 1]
      raises: ValueError
    - args: [['{"status": "schema"}', '{"status": {}}'], 1]
      raises: ValueError
    - args: [['{"status": "policy"}', 7], 2]
      raises: ValueError
    - args: [[], 0]
      expect: {status: exhausted}
    - args: ['bad', 1]
      raises: ValueError
    - args: [['bad', '{"status": "ok"}'], 1]
      expect: {status: exhausted}
    - args: [['bad', '{"status": "ok", "value": 9}'], 2]
      expect: {status: ok, value: 9}
    - args: [['{"status": "unknown"}'], 1]
      raises: ValueError
    - args: [['{"status": "schema"}'], -1]
      raises: ValueError
    - args: [[], true]
      raises: ValueError
hints:
  - {level: 1, text: "O que deve acontecer primeiro: interpretar o texto ou decidir se a tentativa é reparável?"}
  - {level: 2, text: "Analise com `json.loads`, valide todos os status e processe somente o prefixo do limite."}
  - level: 3
    text: |
      Um contador de cédulas pode tratar erro de decoder como rascunho reparável, retornar em
      `accepted`, falhar em `blocked` e informar esgotamento após o prefixo inspecionado.
solution: |
  import json

  def read_attempts(texts, limit):
      if not isinstance(texts, list) or not isinstance(limit, int) or isinstance(limit, bool) or limit < 0:
          raise ValueError("invalid input")
      if any(not isinstance(text, str) for text in texts):
          raise ValueError("texts must be strings")
      parsed = []
      for text in texts:
          try:
              value = json.loads(text)
          except json.JSONDecodeError:
              parsed.append(None)
              continue
          if not isinstance(value, dict) or not isinstance(value.get("status"), str) or value.get("status") not in {"ok", "schema", "policy"}:
              raise ValueError("invalid status")
          parsed.append(value)
      for value in parsed[:limit]:
          if value is None:
              continue
          if value["status"] == "ok":
              return value
          if value["status"] == "policy":
              return {"status": "failed", "reason": "policy"}
      return {"status": "exhausted"}
