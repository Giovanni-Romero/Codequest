id: ai-structured-outputs-01
title: Declare o formato
track: ai-engineering
island: structured-outputs
order: 1
difficulty: moderate
tags: [ai-engineering, structured-outputs, schema]
xp: 30
concepts: [output-schema]
teaching:
  analogy: |
    Um ingresso de museu informa o nome do visitante, a data e a galeria permitida. Um ingresso
    bonito, mas sem data, continua inutilizável.
  explanation: |
    Um schema declara quais campos uma saída deve conter e o tipo de cada valor. Campos
    obrigatórios e opcionais seguem regras diferentes. Valores permitidos acrescentam uma regra
    de negócio além da sintaxe JSON. Valide o objeto completo antes de aceitá-lo.
  worked_example: |
    ticket = {"name": "Ana", "zone": "blue"}
    required = {"name", "zone"}
    allowed = {"red", "blue"}
    has_fields = required <= ticket.keys()
    valid_zone = ticket["zone"] in allowed
    print(has_fields and valid_zone)
  key_points:
    - Verifique o tipo do container, pois uma lista não é um objeto de saída.
    - Confira tipos primitivos explicitamente, pois JSON não expressa regras de negócio.
    - Trate campo opcional e valor nulo como escolhas diferentes.
brief: |
  Escreva `validate_card(card)`. Aceite somente um dicionário com exatamente os campos
  obrigatórios `name` e `count`, além do campo opcional `status`. `name` deve ser uma string não
  vazia; `count` deve ser um inteiro não negativo e não pode ser bool; `status` deve ser a string
  `"new"` ou `"done"`. Retorne exatamente `{"name": ..., "count": ..., "status": ...}`, usando
  `"new"` como padrão. Lance `ValueError` para container, tipo, valor, campo ausente ou extra inválido.
signature:
  entrypoint: validate_card
  stub: |
    def validate_card(card):
        # Transforme uma saída solta em registro completo.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible: [{args: [{name: Ada, count: 2}], expect: {name: Ada, count: 2, status: new}}, {args: [{name: Bob, count: 0, status: done}], expect: {name: Bob, count: 0, status: done}}]
  hidden: [{args: [null], raises: ValueError}, {args: [{name: Ada, count: true}], raises: ValueError}, {args: [{name: Ada, count: -1}], raises: ValueError}, {args: [{name: Ada, count: 1, status: paused}], raises: ValueError}, {args: [{name: Ada, count: 1, extra: x}], raises: ValueError}, {args: [{name: Zed, count: 9, status: new}], expect: {name: Zed, count: 9, status: new}}]
hints:
  - {level: 1, text: "Quais fatos precisam ser verdadeiros antes que outra função use esse registro?"}
  - {level: 2, text: "Valide o dicionário, as chaves exatas, cada tipo primitivo e os valores permitidos."}
  - level: 3
    text: |
      Para uma ficha de biblioteca, compare `set(ficha)` com os nomes obrigatórios e opcionais;
      valide páginas com `isinstance(valor, int) and not isinstance(valor, bool)`.
solution: |
  def validate_card(card):
      if not isinstance(card, dict) or set(card) not in ({"name", "count"}, {"name", "count", "status"}):
          raise ValueError("invalid card shape")
      if not isinstance(card["name"], str) or not card["name"]:
          raise ValueError("name must be non-empty text")
      if not isinstance(card["count"], int) or isinstance(card["count"], bool) or card["count"] < 0:
          raise ValueError("count must be a non-negative integer")
      status = card.get("status", "new")
      if not isinstance(status, str) or status not in {"new", "done"}:
          raise ValueError("invalid status")
      return {"name": card["name"], "count": card["count"], "status": status}
