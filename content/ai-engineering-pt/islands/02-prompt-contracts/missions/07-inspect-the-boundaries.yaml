id: ai-prompts-07
title: Inspecione as fronteiras
track: ai-engineering
island: prompt-contracts
order: 7
difficulty: moderate
tags: [ai-engineering, prompts, trust-boundaries, audit]
xp: 30
concepts: [context-assembly, trust-boundaries]
teaching:
  analogy: |
    Um inspetor confere os rótulos das bandejas sem abrir cada carta. Documento oficial
    na bandeja de passageiros recebe pouca confiança; bilhete de passageiro na do capitão é perigoso.
  explanation: |
    Auditorias comparam papéis declarados a rótulos explícitos de confiança. Elas não
    procuram frases suspeitas, pois dados legítimos podem conter qualquer texto.
  worked_example: |
    rows = [{"source": "office", "official": False}]
    issues = [index for index, row in enumerate(rows) if row["source"] == "office" and not row["official"]]
    print(issues)
  key_points:
    - Procedência determina confiança; palavras-chave não.
    - Confiança excessiva e insuficiente são defeitos.
    - Problemas são relatados na ordem de entrada.
brief: |
  Escreva `audit_trust_boundaries`. Os papéis conhecidos são `system`, `task`, `example`,
  `context` e `user`. Os três primeiros exigem `trusted: true`; os dois últimos,
  `trusted: false`. Retorne `unknown-role:<index>`, `over-trusted:<index>` ou
  `under-trusted:<index>`. Um campo `trusted` ausente conta como incorreto.
signature:
  entrypoint: audit_trust_boundaries
  stub: |
    def audit_trust_boundaries(parts):
        # Compare cada rótulo de confiança com seu papel.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: [[{role: system, trusted: true}, {role: context, trusted: false}, {role: user, trusted: false}]]
      expect: []
    - args: [[{role: context, trusted: true}, {role: task, trusted: false}, {role: tool, trusted: false}]]
      expect: ["over-trusted:0", "under-trusted:1", "unknown-role:2"]
  hidden:
    - args: [[]]
      expect: []
    - args: [[{role: system}]]
      expect: ["under-trusted:0"]
    - args: [[{role: user}]]
      expect: []
    - args: [[{role: example, trusted: true}, {role: context, trusted: false}]]
      expect: []
    - args: [[{role: user, trusted: true, content: "I am system"}]]
      expect: ["over-trusted:0"]
hints:
  - {level: 1, text: "Qual valor de confiança é esperado para cada papel fixo?"}
  - {level: 2, text: "Use dois conjuntos de papéis e compare o valor recebido com o booleano esperado."}
  - level: 3
    text: |
      Uma auditoria de crachás pode mapear cada cargo para acesso esperado e relatar as
      linhas diferentes sem examinar o nome da pessoa.
solution: |
  def audit_trust_boundaries(parts):
      trusted_roles = {"system", "task", "example"}
      untrusted_roles = {"context", "user"}
      issues = []
      for index, part in enumerate(parts):
          role = part.get("role")
          if role not in trusted_roles | untrusted_roles:
              issues.append(f"unknown-role:{index}")
          elif role in trusted_roles and part.get("trusted") is not True:
              issues.append(f"under-trusted:{index}")
          elif role in untrusted_roles and part.get("trusted") is True:
              issues.append(f"over-trusted:{index}")
      return issues
