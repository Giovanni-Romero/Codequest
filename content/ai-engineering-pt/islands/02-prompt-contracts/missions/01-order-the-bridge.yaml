id: ai-prompts-01
title: Organize a ponte
track: ai-engineering
island: prompt-contracts
order: 1
difficulty: moderate
tags: [ai-engineering, prompts, instruction-hierarchy]
xp: 30
concepts: [instruction-hierarchy]
teaching:
  analogy: |
    A tripulação separa ordens permanentes da tarefa do dia, exemplos de treinamento,
    relatórios de carga e pedidos de passageiros. Misturar os papéis torna a autoridade incerta.
  explanation: |
    A hierarquia dá a cada parte do prompt uma função declarada. Regras de sistema vêm
    antes da tarefa, exemplos demonstram comportamento, contexto fornece evidência e
    dados do usuário trazem o pedido. Uma ordem estável torna tudo inspecionável.
  worked_example: |
    priority = {"captain": 0, "crew": 1, "visitor": 2}
    notes = [{"role": "visitor"}, {"role": "captain"}]
    ordered = sorted(notes, key=lambda note: priority[note["role"]])
    print(ordered)
  key_points:
    - Um trecho recebe autoridade pelo papel, não por parecer confiante.
    - Uma ordenação estável preserva partes com o mesmo papel.
    - Papéis desconhecidos tornam o contrato ambíguo e devem ser recusados.
brief: |
  Escreva `order_prompt_parts`. A função recebe dicionários com `role` e `content`.
  Retorne novos dicionários na ordem `system`, `task`, `example`, `context` e `user`,
  preservando a ordem original dentro de cada papel. Lance `ValueError` para papel
  desconhecido, campo ausente ou conteúdo vazio. Não altere a entrada.
signature:
  entrypoint: order_prompt_parts
  stub: |
    def order_prompt_parts(parts):
        # Coloque cada papel declarado em sua posição de autoridade.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: [[{role: user, content: question}, {role: system, content: rules}, {role: task, content: answer}]]
      expect: [{role: system, content: rules}, {role: task, content: answer}, {role: user, content: question}]
    - args: [[{role: example, content: first}, {role: example, content: second}, {role: context, content: evidence}]]
      expect: [{role: example, content: first}, {role: example, content: second}, {role: context, content: evidence}]
  hidden:
    - args: [[]]
      expect: []
    - args: [[{role: system, content: one}]]
      expect: [{role: system, content: one}]
    - args: [[{role: tool, content: run}]]
      raises: ValueError
    - args: [[{role: user}]]
      raises: ValueError
    - args: [[{role: user, content: "  "}]]
      raises: ValueError
hints:
  - {level: 1, text: "Qual prioridade fixa pertence a cada papel?"}
  - {level: 2, text: "Valide primeiro e use uma ordenação estável com um mapa de papel para prioridade."}
  - level: 3
    text: |
      Outra fila de prioridade pode usar
      `sorted(items, key=lambda item: ranks[item["category"]])` depois da validação.
solution: |
  def order_prompt_parts(parts):
      ranks = {"system": 0, "task": 1, "example": 2, "context": 3, "user": 4}
      copied = []
      for part in parts:
          if "role" not in part or "content" not in part:
              raise ValueError("each part needs role and content")
          if part["role"] not in ranks or not str(part["content"]).strip():
              raise ValueError("invalid prompt part")
          copied.append(dict(part))
      return sorted(copied, key=lambda part: ranks[part["role"]])
