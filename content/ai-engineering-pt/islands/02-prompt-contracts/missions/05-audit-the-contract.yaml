id: ai-prompts-05
title: Audite o contrato
track: ai-engineering
island: prompt-contracts
order: 5
difficulty: moderate
tags: [ai-engineering, prompts, audit]
xp: 30
concepts: [instruction-hierarchy, prompt-templates]
teaching:
  analogy: |
    Antes da partida, um oficial confere os papéis em vez de reescrevê-los: existem
    ordens obrigatórias, a sequência é válida e cada campo nomeado possui valor.
  explanation: |
    A auditoria encontra defeitos estruturais antes da renderização. Códigos estáveis
    tornam falhas testáveis e úteis. Diagnosticar permanece separado de corrigir.
  worked_example: |
    required = ["captain", "destination"]
    form = {"destination": "Lisbon"}
    issues = [f"missing:{name}" for name in required if name not in form]
    print(issues)
  key_points:
    - A auditoria observa o contrato sem inventar valores ausentes.
    - Ordem de papéis e presença de variáveis são falhas distintas.
    - Códigos estáveis são mais automatizáveis que mensagens livres.
brief: |
  Escreva `audit_prompt_contract(parts, required_variables, variables)`. Retorne códigos
  nesta ordem: `missing-system`, `missing-task`, `unknown-role:<index>`,
  `role-order:<index>` e `missing-variable:<name>` na ordem declarada. Nomes obrigatórios
  repetidos produzem um único problema. Um contrato válido retorna lista vazia.
signature:
  entrypoint: audit_prompt_contract
  stub: |
    def audit_prompt_contract(parts, required_variables, variables):
        # Relate defeitos estruturais sem reparar o prompt.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: [[{role: system}, {role: task}, {role: user}], [question], {question: hello}]
      expect: []
    - args: [[{role: user}, {role: tool}, {role: system}], [question, audience], {question: hello}]
      expect: [missing-task, "unknown-role:1", "role-order:2", "missing-variable:audience"]
  hidden:
    - args: [[], [], {}]
      expect: [missing-system, missing-task]
    - args: [[{role: system}, {role: task}], [x, x], {}]
      expect: ["missing-variable:x"]
    - args: [[{role: system}, {role: context}, {role: task}], [], {}]
      expect: ["role-order:2"]
    - args: [[{role: system}, {role: task}, {role: example}, {role: context}, {role: user}], [x], {x: 0}]
      expect: []
hints:
  - {level: 1, text: "Cada classe de defeito pode ser verificada separadamente na ordem de saída?"}
  - {level: 2, text: "Use um mapa de prioridade, guarde a última prioridade válida e um conjunto para variáveis repetidas."}
  - level: 3
    text: |
      Uma lista de conferência pode registrar cabeçalhos ausentes, percorrer linhas em
      busca de ordem inválida e depois relatar campos não preenchidos.
solution: |
  def audit_prompt_contract(parts, required_variables, variables):
      ranks = {"system": 0, "task": 1, "example": 2, "context": 3, "user": 4}
      roles = [part.get("role") for part in parts]
      issues = []
      if "system" not in roles:
          issues.append("missing-system")
      if "task" not in roles:
          issues.append("missing-task")

      previous = -1
      for index, role in enumerate(roles):
          if role not in ranks:
              issues.append(f"unknown-role:{index}")
              continue
          rank = ranks[role]
          if rank < previous:
              issues.append(f"role-order:{index}")
          previous = rank

      checked = set()
      for name in required_variables:
          if name not in checked and name not in variables:
              issues.append(f"missing-variable:{name}")
          checked.add(name)
      return issues
