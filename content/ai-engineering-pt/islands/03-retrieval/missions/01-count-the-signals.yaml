id: ai-retrieval-01
title: Conte os sinais
track: ai-engineering
island: retrieval
order: 1
difficulty: moderate
tags: [ai-engineering, retrieval, sparse-representation]
xp: 30
concepts: [sparse-representation]
teaching:
  analogy: |
    Um livro do porto registra apenas a carga realmente embarcada. Dez tipos possíveis
    não exigem dez linhas vazias; o escrivão anota somente os que apareceram.
  explanation: |
    Uma representação esparsa armazena apenas termos observados e suas contagens.
    Normalizar maiúsculas e pontuação produz os mesmos atributos para textos equivalentes.
  worked_example: |
    cargo = "Tea rice tea".lower().split()
    counts = {}
    for item in cargo:
        counts[item] = counts.get(item, 0) + 1
    print(counts)
  key_points:
    - Mapas esparsos omitem termos ausentes em vez de armazenar zeros.
    - Contagens preservam repetições; um conjunto as perderia.
    - Normalização determinística torna pontuações reproduzíveis.
brief: |
  Escreva `term_counts`. Separe o texto por espaços, use `casefold`, remova `.,!?;:`
  das extremidades de cada termo, ignore resultados vazios e retorne um dicionário de
  termos para suas contagens.
signature:
  entrypoint: term_counts
  stub: |
    def term_counts(text):
        # Construa o vetor esparso de termos do texto.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: ["Port port, TIDE!"]
      expect: {port: 2, tide: 1}
    - args: ["red blue red"]
      expect: {red: 2, blue: 1}
  hidden:
    - args: [""]
      expect: {}
    - args: ["   \n\t "]
      expect: {}
    - args: ["... !!!"]
      expect: {}
    - args: ["Straße STRASSE"]
      expect: {strasse: 2}
    - args: ["anchor; anchor: buoy?"]
      expect: {anchor: 2, buoy: 1}
hints:
  - {level: 1, text: "Qual normalização precisa ocorrer antes de dois tokens compartilharem uma contagem?"}
  - {level: 2, text: "Para cada token, aplique `casefold`, remova pontuação das bordas e atualize o dicionário."}
  - level: 3
    text: |
      Um inventário pode normalizar cada nome e usar
      `stock[name] = stock.get(name, 0) + 1` quando ele não estiver vazio.
solution: |
  def term_counts(text):
      counts = {}
      for raw in text.split():
          term = raw.casefold().strip(".,!?;:")
          if term:
              counts[term] = counts.get(term, 0) + 1
      return counts
