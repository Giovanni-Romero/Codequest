id: ai-retrieval-04
title: Defina o piso
track: ai-engineering
island: retrieval
order: 4
difficulty: moderate
tags: [ai-engineering, retrieval, thresholds]
xp: 30
concepts: [top-k-ranking, relevance-thresholds]
teaching:
  analogy: |
    O farol mais próximo ainda pode estar além da distância segura. Ser o primeiro da
    lista não o torna próximo o bastante para confiar.
  explanation: |
    Um limiar separa o ranking relativo da aceitação. Até o melhor resultado pode ser
    recusado. Um piso explícito também cria um estado determinístico de nenhuma correspondência.
  worked_example: |
    candidates = [{"name": "north", "signal": 0.8}, {"name": "west", "signal": 0.2}]
    accepted = [item["name"] for item in candidates if item["signal"] >= 0.5]
    print(accepted)
  key_points:
    - Melhor resultado não significa resultado relevante.
    - Igualdade com o piso é aceita.
    - Nenhum resultado é uma saída válida da recuperação.
brief: |
  Escreva `accept_relevant`. Receba resultados já ordenados, um máximo `k` e
  `min_score`. Retorne IDs com score no mínimo igual ao piso, preservando ordem e
  limitando a `k`. Lance `ValueError` para `k` negativo ou piso fora de 0 a 1.
signature:
  entrypoint: accept_relevant
  stub: |
    def accept_relevant(results, k, min_score):
        # Mantenha apenas candidatos que superem o piso explícito.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: [[{id: A, score: 0.9}, {id: B, score: 0.5}, {id: C, score: 0.2}], 3, 0.5]
      expect: [A, B]
    - args: [[{id: A, score: 0.4}], 1, 0.5]
      expect: []
  hidden:
    - args: [[], 3, 0.5]
      expect: []
    - args: [[{id: A, score: 1.0}], 0, 0.0]
      expect: []
    - args: [[{id: A, score: 0.9}, {id: B, score: 0.8}], 1, 0.0]
      expect: [A]
    - args: [[], -1, 0.5]
      raises: ValueError
    - args: [[], 1, -0.1]
      raises: ValueError
    - args: [[], 1, 1.1]
      raises: ValueError
hints:
  - {level: 1, text: "Quais dois limites independentes decidem se outro ID pode entrar?"}
  - {level: 2, text: "Filtre por `score >= min_score`, preserve a ordem e pare após `k` itens aceitos."}
  - level: 3
    text: |
      Um monitor percorre sinais do mais forte ao mais fraco, guarda os que superam um
      mínimo e para ao atingir a quantidade solicitada.
solution: |
  def accept_relevant(results, k, min_score):
      if k < 0 or not 0 <= min_score <= 1:
          raise ValueError("invalid retrieval limits")
      accepted = []
      for result in results:
          if result["score"] >= min_score:
              accepted.append(result["id"])
              if len(accepted) == k:
                  break
      return accepted[:k]
