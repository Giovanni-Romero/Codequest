id: ai-retrieval-07
title: Inspecione o ranking
track: ai-engineering
island: retrieval
order: 7
difficulty: moderate
tags: [ai-engineering, retrieval, ranking, audit]
xp: 30
concepts: [top-k-ranking, relevance-thresholds]
teaching:
  analogy: |
    Um inspetor confere o painel de chegadas: navios demais, IDs repetidos, tempos fora
    de ordem e sinais abaixo do limite são defeitos diferentes.
  explanation: |
    A auditoria verifica as promessas do ranking e do limiar. Ela relata códigos estáveis
    sem ordenar ou apagar dados silenciosamente. Assim as falhas ficam observáveis.
  worked_example: |
    rows = [{"name": "A", "rank": 1}, {"name": "A", "rank": 2}]
    seen = set()
    duplicates = []
    for row in rows:
        if row["name"] in seen:
            duplicates.append(row["name"])
        seen.add(row["name"])
    print(duplicates)
  key_points:
    - Auditar nunca repara os resultados medidos.
    - Ranking, unicidade, limiar e quantidade são invariantes independentes.
    - Posições estáveis tornam o registro defeituoso rastreável.
brief: |
  Escreva `audit_ranked_results(results, k, min_score)`. Retorne `too-many` primeiro se
  a lista exceder `k`. Depois acrescente `duplicate:<id>`, `order:<index>` quando um
  score subir e `below-threshold:<index>`. Vários problemas seguem essa ordem. Valide limites.
signature:
  entrypoint: audit_ranked_results
  stub: |
    def audit_ranked_results(results, k, min_score):
        # Confira as promessas do ranking sem mudar a lista.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: [[{id: A, score: 0.9}, {id: B, score: 0.6}], 2, 0.5]
      expect: []
    - args: [[{id: A, score: 0.4}, {id: A, score: 0.8}], 1, 0.5]
      expect: [too-many, "below-threshold:0", "duplicate:A", "order:1"]
  hidden:
    - args: [[], 0, 0.0]
      expect: []
    - args: [[{id: A, score: 0.5}], 1, 0.5]
      expect: []
    - args: [[{id: A, score: 0.2}], 1, 0.3]
      expect: ["below-threshold:0"]
    - args: [[], -1, 0.5]
      raises: ValueError
    - args: [[], 1, 1.1]
      raises: ValueError
hints:
  - {level: 1, text: "Qual invariante vale para a lista e quais valem durante a varredura?"}
  - {level: 2, text: "Confira o tamanho; depois mantenha IDs vistos e o score anterior."}
  - level: 3
    text: |
      Uma auditoria pode relatar excesso de linhas e então rastrear códigos repetidos,
      valores fora de ordem e valores abaixo de um mínimo.
solution: |
  def audit_ranked_results(results, k, min_score):
      if k < 0 or not 0 <= min_score <= 1:
          raise ValueError("invalid retrieval limits")
      issues = []
      if len(results) > k:
          issues.append("too-many")
      seen = set()
      previous = None
      for index, result in enumerate(results):
          result_id = result["id"]
          score = result["score"]
          if result_id in seen:
              issues.append(f"duplicate:{result_id}")
          seen.add(result_id)
          if previous is not None and score > previous:
              issues.append(f"order:{index}")
          if score < min_score:
              issues.append(f"below-threshold:{index}")
          previous = score
      return issues
