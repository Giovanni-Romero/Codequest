id: ai-retrieval-05
title: Pontue a frota
track: ai-engineering
island: retrieval
order: 5
difficulty: moderate
tags: [ai-engineering, retrieval, sparse-representation, similarity]
xp: 30
concepts: [sparse-representation, similarity-scoring]
teaching:
  analogy: |
    Um oficial transforma cada relatório recebido no mesmo código compacto antes de
    compará-lo ao pedido de socorro. A prosa não é comparada por intuição.
  explanation: |
    Pontuar documentos combina normalização, contagens esparsas e similaridade de
    cosseno. A ordem original é mantida, pois ranking é responsabilidade posterior.
  worked_example: |
    wanted = {"water", "rope"}
    manifests = [{"id": "A", "items": {"rope"}}, {"id": "B", "items": {"fuel"}}]
    scores = [{"id": row["id"], "score": len(wanted & row["items"])} for row in manifests]
    print(scores)
  key_points:
    - Consulta e documentos usam a mesma normalização.
    - A pontuação não reordena candidatos.
    - IDs repetidos destroem procedência e são recusados.
brief: |
  Escreva `score_documents(query, documents)`. Cada documento tem `id` único e `text`.
  Crie contagens esparsas com as regras da missão 1 e retorne dicionários ordenados como
  a entrada, contendo `id` e `score` de cosseno. Vetor vazio recebe `0.0`. Lance
  `ValueError` para ID repetido.
signature:
  entrypoint: score_documents
  stub: |
    def score_documents(query, documents):
        # Represente e pontue cada documento sem ordená-lo ainda.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: ["port map", [{id: A, text: "port map"}, {id: B, text: "tide table"}]]
      expect: [{id: A, score: 0.9999999999999998}, {id: B, score: 0.0}]
    - args: [anchor, [{id: A, text: anchor}, {id: B, text: "anchor anchor"}]]
      expect: [{id: A, score: 1.0}, {id: B, score: 1.0}]
  hidden:
    - args: [query, []]
      expect: []
    - args: ["", [{id: A, text: text}]]
      expect: [{id: A, score: 0.0}]
    - args: ["a b", [{id: A, text: a}]]
      expect: [{id: A, score: 0.7071067811865475}]
    - args: ["PORT!", [{id: A, text: "port,"}]]
      expect: [{id: A, score: 1.0}]
    - args: [x, [{id: A, text: x}, {id: A, text: y}]]
      raises: ValueError
hints:
  - {level: 1, text: "O vetor da consulta pode ser criado uma vez antes do laço?"}
  - {level: 2, text: "Reutilize o mesmo tokenizador nos dois lados e a fórmula de cosseno da missão 2."}
  - level: 3
    text: |
      Uma busca pode codificar o pedido uma vez, codificar cada item em ordem, adicionar
      registros `{id, score}` e recusar IDs já vistos.
solution: |
  def score_documents(query, documents):
      from math import sqrt

      def vector(text):
          counts = {}
          for raw in text.split():
              term = raw.casefold().strip(".,!?;:")
              if term:
                  counts[term] = counts.get(term, 0) + 1
          return counts

      query_vector = vector(query)
      query_size = sqrt(sum(weight * weight for weight in query_vector.values()))
      results = []
      seen = set()
      for document in documents:
          if document["id"] in seen:
              raise ValueError("document IDs must be unique")
          seen.add(document["id"])
          document_vector = vector(document["text"])
          document_size = sqrt(sum(weight * weight for weight in document_vector.values()))
          score = 0.0
          if query_size and document_size:
              dot = sum(
                  weight * document_vector.get(term, 0)
                  for term, weight in query_vector.items()
              )
              score = dot / (query_size * document_size)
          results.append({"id": document["id"], "score": score})
      return results
