id: ai-retrieval-03
title: Ordene os ancoradouros
track: ai-engineering
island: retrieval
order: 3
difficulty: moderate
tags: [ai-engineering, retrieval, ranking]
xp: 30
concepts: [similarity-scoring, top-k-ranking]
teaching:
  analogy: |
    Um porto oferece primeiro os ancoradouros mais próximos. Quando dois estão à mesma
    distância, manter a ordem da carta evita mudanças arbitrárias.
  explanation: |
    Top-k seleciona no máximo os `k` candidatos com maior pontuação. Empates mantêm a
    ordem original. Ranking compara candidatos; ainda não decide se algum é bom o bastante.
  worked_example: |
    docks = [{"id": "A", "distance": 4}, {"id": "B", "distance": 2}]
    closest = sorted(docks, key=lambda dock: dock["distance"])[:1]
    print([dock["id"] for dock in closest])
  key_points:
    - Maior similaridade vem primeiro.
    - Empates estáveis tornam a recuperação reproduzível.
    - "`k` pode ser zero ou maior que o corpus."
brief: |
  Escreva `rank_top_k`. A função recebe dicionários com `id` único e `score` numérico.
  Retorne os melhores IDs em ordem decrescente de pontuação, mantendo a entrada nos
  empates e limitando a `k`. Lance `ValueError` para `k` negativo, ID repetido ou score não numérico.
signature:
  entrypoint: rank_top_k
  stub: |
    def rank_top_k(results, k):
        # Ordene por pontuação mantendo empates estáveis.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: [[{id: A, score: 0.2}, {id: B, score: 0.9}, {id: C, score: 0.5}], 2]
      expect: [B, C]
    - args: [[{id: first, score: 0.7}, {id: second, score: 0.7}], 2]
      expect: [first, second]
  hidden:
    - args: [[], 3]
      expect: []
    - args: [[{id: A, score: 1.0}], 0]
      expect: []
    - args: [[{id: A, score: 0.1}], 5]
      expect: [A]
    - args: [[{id: A, score: 1}, {id: A, score: 0}], 1]
      raises: ValueError
    - args: [[{id: A, score: high}], 1]
      raises: ValueError
    - args: [[], -1]
      raises: ValueError
hints:
  - {level: 1, text: "Qual chave coloca maiores pontuações primeiro sem perturbar empates?"}
  - {level: 2, text: "Valide IDs e scores, use a ordenação estável com score negativo e corte a lista."}
  - level: 3
    text: |
      Um placar pode validar nomes únicos, ordenar com
      `key=lambda entry: -entry["points"]` e pegar o prefixo pedido.
solution: |
  def rank_top_k(results, k):
      if k < 0:
          raise ValueError("k must not be negative")
      seen = set()
      for result in results:
          if result["id"] in seen or not isinstance(result["score"], (int, float)):
              raise ValueError("invalid result")
          seen.add(result["id"])
      ranked = sorted(results, key=lambda result: -result["score"])
      return [result["id"] for result in ranked[:k]]
