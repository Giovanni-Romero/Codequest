id: ai-rag-06
title: Fundamente o rascunho
track: ai-engineering
island: rag
order: 6
difficulty: moderate
tags: [ai-engineering, rag, generation, citations]
xp: 30

concepts: [retrieval-generation-separation, citation-provenance]

teaching:
  analogy: |
    Um editor confere cada frase contra o pacote de pesquisa, não contra toda a biblioteca.
    Frases sustentadas ficam; as demais voltam com uma observação precisa.
  explanation: |
    Registros recuperados e afirmações geradas continuam artefatos diferentes. A fundamentação
    os compara sem reescrever nenhum. Separar afirmações aceitas e rejeitadas preserva trabalho
    útil enquanto torna visíveis citações ausentes e inventadas.
  worked_example: |
    references = {"A", "B"}
    notes = [["A"], [], ["C"]]
    accepted = []
    rejected = []
    for index, cited in enumerate(notes):
        (accepted if cited and set(cited) <= references else rejected).append(index)
    print(accepted, rejected)
  key_points:
    - Compare com o conjunto desta execução porque o corpus inteiro não foi fornecido.
    - Não altere o rascunho porque geração e validação são etapas separadas.
    - Nomeie falhas sem citação e sem suporte separadamente porque os reparos diferem.

brief: |
  Escreva `partition_grounded_claims(records, claims)`. `records` e `claims` são listas. Registros têm valores `record_id`
  únicos. Afirmações têm `text` string e uma lista de IDs de citação. Retorne índices em
  `grounded` e rejeições com `index`, `reason` e `unsupported_ids` ordenados. Afirmações sem
  citação usam `uncited`; IDs desconhecidos usam `unsupported`. Rejeite entrada malformada.

signature:
  entrypoint: partition_grounded_claims
  stub: |
    def partition_grounded_claims(records, claims):
        # Mantenha recuperação e geração separadas enquanto confere sua ligação.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: [[{record_id: A}], [{text: safe, citations: [A]}]]
      expect: {grounded: [0], rejected: []}
    - args: [[{record_id: A}], [{text: first, citations: []}, {text: second, citations: [A, X]}]]
      expect: {grounded: [], rejected: [{index: 0, reason: uncited, unsupported_ids: []}, {index: 1, reason: unsupported, unsupported_ids: [X]}]}
  hidden:
    - args: [null, []]
      raises: ValueError
    - args: [[], null]
      raises: ValueError
    - args: [[], []]
      expect: {grounded: [], rejected: []}
    - args: [[{record_id: A}, {record_id: B}], [{text: both, citations: [B, A]}]]
      expect: {grounded: [0], rejected: []}
    - args: [[], [{text: claim, citations: [Z, Y, Z]}]]
      expect: {grounded: [], rejected: [{index: 0, reason: unsupported, unsupported_ids: [Y, Z]}]}
    - args: [[{record_id: A}, {record_id: A}], []]
      raises: ValueError
    - args: [[], [{text: claim, citations: A}]]
      raises: ValueError

hints:
  - {level: 1, text: "Cada afirmação aponta apenas para registros do pacote recuperado?"}
  - {level: 2, text: "Monte os IDs disponíveis e separe índices sem alterar as afirmações."}
  - level: 3
    text: |
      Um revisor pode adicionar um índice a `accepted` quando suas referências formam um
      subconjunto não vazio dos IDs de pesquisa; caso contrário, registra os IDs ausentes.

solution: |
  def partition_grounded_claims(records, claims):
      if not isinstance(records, list) or not isinstance(claims, list):
          raise ValueError("records and claims must be lists")
      available = set()
      for record in records:
          if not isinstance(record, dict) or not isinstance(record.get("record_id"), str):
              raise ValueError("invalid record")
          if record["record_id"] in available:
              raise ValueError("record IDs must be unique")
          available.add(record["record_id"])
      grounded = []
      rejected = []
      for index, claim in enumerate(claims):
          if not isinstance(claim, dict) or not isinstance(claim.get("text"), str):
              raise ValueError("invalid claim")
          citations = claim.get("citations")
          if not isinstance(citations, list) or any(not isinstance(item, str) for item in citations):
              raise ValueError("citations must be a list")
          if not citations:
              rejected.append({"index": index, "reason": "uncited", "unsupported_ids": []})
              continue
          unsupported = sorted(set(citations) - available)
          if unsupported:
              rejected.append({"index": index, "reason": "unsupported", "unsupported_ids": unsupported})
          else:
              grounded.append(index)
      return {"grounded": grounded, "rejected": rejected}
