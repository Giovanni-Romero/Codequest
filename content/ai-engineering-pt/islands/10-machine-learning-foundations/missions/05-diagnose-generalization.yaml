id: ai-ml-05
title: Diagnostique a generalização
track: ai-engineering
island: machine-learning-foundations
order: 5
difficulty: challenging
tags: [ai-engineering, machine-learning, generalization, diagnostics]
xp: 45
concepts: [supervised-learning-contract, baselines-and-generalization]
teaching:
  analogy: Um navegador que memoriza o porto de ontem pode desenhar uma rota antiga perfeita e falhar na entrada de hoje. Você compara prática, validação e a carta antiga antes de confiar na habilidade.
  explanation: Underfitting significa que o modelo não consegue superar nem um baseline simples. Overfitting aparece quando a perda de treino é muito menor que a de validação. Generalização significa que o desempenho reservado supera o baseline sem uma diferença excessiva entre treino e validação. Limites explícitos transformam essas palavras em um diagnóstico reproduzível.
  worked_example: |
    erros_ensaio = 2
    erros_reais = 5
    diferenca_permitida = 1
    diferenca = erros_reais - erros_ensaio
    estado = "fragil" if diferenca > diferenca_permitida else "estavel"
    print(estado, diferenca)
  key_points:
    - Desempenho de treino sozinho não estabelece utilidade.
    - Um baseline separa aprendizado de complexidade desnecessária.
    - A diferença aceitável de generalização precisa ser declarada antes do diagnóstico.
brief: >
  Escreva `diagnose_generalization(train_loss, validation_loss, baseline_loss, max_gap) -> dict`.
  Aceite números finitos não negativos, excluindo `bool`, com `max_gap` finito e não negativo.
  Retorne `diagnosis`, `generalization_gap` (`validation_loss - train_loss`) e
  `beats_baseline`. Diagnostique `underfitting` quando as duas perdas forem pelo menos o
  baseline; caso contrário, `overfitting` quando a diferença exceder `max_gap`;
  `generalizes` quando a validação superar o baseline; e `no_gain` nos demais casos.
  Lance `ValueError` para entrada inválida.
signature:
  entrypoint: diagnose_generalization
  stub: |
    def diagnose_generalization(train_loss, validation_loss, baseline_loss, max_gap):
        # Retorne um diagnóstico de ajuste baseado em evidências.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [0.4, 0.45, 0.7, 0.1]
      expect: {diagnosis: generalizes, generalization_gap: 0.05, beats_baseline: true}
    - args: [0.8, 0.9, 0.7, 0.2]
      expect: {diagnosis: underfitting, generalization_gap: 0.1, beats_baseline: false}
  hidden:
    - args: [0.1, 0.5, 0.6, 0.2]
      expect: {diagnosis: overfitting, generalization_gap: 0.4, beats_baseline: true}
    - args: [0.5, 0.7, 0.7, 0.3]
      expect: {diagnosis: no_gain, generalization_gap: 0.2, beats_baseline: false}
    - args: [0.2, 0.3, 0.5, 0.1]
      expect: {diagnosis: generalizes, generalization_gap: 0.1, beats_baseline: true}
    - args: [-0.1, 0.2, 0.3, 0.1]
      raises: ValueError
    - args: [true, 0.2, 0.3, 0.1]
      raises: ValueError
    - args: [0.1, .nan, 0.3, 0.1]
      raises: ValueError
    - args: [0.1, 0.2, 0.3, -0.1]
      raises: ValueError
    - args: [0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF, 0.2, 0.3, 0.1]
      raises: ValueError
hints:
  - level: 1
    text: "Qual comparação separa um modelo fraco de outro que memorizou suas linhas de treino?"
  - level: 2
    text: "Verifique primeiro a falha contra o baseline, depois a diferença treino-validação e então a melhoria reservada."
  - level: 3
    text: "Padrão: `diferenca = erro_posterior - erro_pratica`; compare com um limite declarado."
solution: |
  def diagnose_generalization(train_loss, validation_loss, baseline_loss, max_gap):
      import math
      values = (train_loss, validation_loss, baseline_loss, max_gap)
      for value in values:
          if type(value) not in (int, float) or value < 0:
              raise ValueError("invalid metric")
          try:
              if not math.isfinite(value):
                  raise ValueError("invalid metric")
          except OverflowError as error:
              raise ValueError("invalid metric") from error
      gap = round(validation_loss - train_loss, 12)
      if train_loss >= baseline_loss and validation_loss >= baseline_loss:
          diagnosis = "underfitting"
      elif gap > max_gap:
          diagnosis = "overfitting"
      elif validation_loss < baseline_loss:
          diagnosis = "generalizes"
      else:
          diagnosis = "no_gain"
      return {"diagnosis": diagnosis, "generalization_gap": gap, "beats_baseline": validation_loss < baseline_loss}
