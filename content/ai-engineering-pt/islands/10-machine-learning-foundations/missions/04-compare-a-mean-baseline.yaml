id: ai-ml-04
title: Compare com um baseline de média
track: ai-engineering
island: machine-learning-foundations
order: 4
difficulty: challenging
tags: [ai-engineering, machine-learning, baselines, evaluation]
xp: 45
concepts: [supervised-learning-contract, baselines-and-generalization]
teaching:
  analogy: Uma nova previsão de maré só merece seu lugar se superar a regra antiga de usar a maré média. Um gráfico complicado não é evidência por si só.
  explanation: Um baseline é uma referência simples que revela se a complexidade do modelo compra desempenho útil. Para targets numéricos, a média dos targets de treino é um baseline determinístico. Modelo e baseline precisam ser medidos nos mesmos targets reservados e com a mesma métrica. O erro absoluto médio mantém a comparação legível.
  worked_example: |
    espera_habitual = 12
    esperas_reais = [10, 14, 11]
    novos_palpites = [11, 13, 12]
    erro_antigo = sum(abs(espera_habitual - valor) for valor in esperas_reais) / len(esperas_reais)
    erro_novo = sum(abs(palpite - valor) for palpite, valor in zip(novos_palpites, esperas_reais)) / len(esperas_reais)
    print(erro_antigo, erro_novo)
  key_points:
    - Construa o baseline com targets de treino, nunca com targets reservados.
    - Compare os dois preditores em exemplos e métricas idênticos.
    - Complexidade só se justifica por melhoria mensurável.
brief: >
  Escreva `compare_mean_baseline(train_targets, heldout_targets, model_predictions) -> dict`.
  Aceite uma lista não vazia de treino e listas não vazias de mesmo tamanho de targets
  reservados e previsões, todas com números finitos e sem `bool`. Use a média dos targets
  de treino como baseline constante. Retorne `baseline_value`, `baseline_mae`, `model_mae`,
  `improvement` (`baseline_mae - model_mae`) e `winner` como `model`, `baseline` ou `tie`.
  Lance `ValueError` para entrada inválida ou aritmética não finita.
signature:
  entrypoint: compare_mean_baseline
  stub: |
    def compare_mean_baseline(train_targets, heldout_targets, model_predictions):
        # Compare um modelo com uma referência só de treino em dados reservados.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[0, 2], [1, 3], [1, 2]]
      expect: {baseline_value: 1.0, baseline_mae: 1.0, model_mae: 0.5, improvement: 0.5, winner: model}
    - args: [[2, 2], [1, 3], [2, 2]]
      expect: {baseline_value: 2.0, baseline_mae: 1.0, model_mae: 1.0, improvement: 0.0, winner: tie}
  hidden:
    - args: [[0, 2], [1, 3], [0, 0]]
      expect: {baseline_value: 1.0, baseline_mae: 1.0, model_mae: 2.0, improvement: -1.0, winner: baseline}
    - args: [[-2, 2], [-1, 1], [-1, 1]]
      expect: {baseline_value: 0.0, baseline_mae: 1.0, model_mae: 0.0, improvement: 1.0, winner: model}
    - args: [[], [1], [1]]
      raises: ValueError
    - args: [[1], [], []]
      raises: ValueError
    - args: [[1], [1, 2], [1]]
      raises: ValueError
    - args: [[true], [1], [1]]
      raises: ValueError
    - args: [[1], [.inf], [1]]
      raises: ValueError
    - args: [not-a-list, [1], [1]]
      raises: ValueError
hints:
  - level: 1
    text: "Qual é o preditor honesto mais fraco que o novo modelo precisa superar exatamente nas mesmas linhas reservadas?"
  - level: 2
    text: "Calcule a média apenas dos targets de treino, crie uma previsão constante e então calcule os dois MAEs reservados."
  - level: 3
    text: "Padrão: `mae = sum(abs(palpite - real) for palpite, real in pares) / len(pares)`."
solution: |
  def compare_mean_baseline(train_targets, heldout_targets, model_predictions):
      import math
      def valid(values):
          if not isinstance(values, list) or not values:
              return False
          for value in values:
              if type(value) not in (int, float):
                  return False
              try:
                  if not math.isfinite(value):
                      return False
              except OverflowError:
                  return False
          return True
      if not valid(train_targets) or not valid(heldout_targets) or not valid(model_predictions) or len(heldout_targets) != len(model_predictions):
          raise ValueError("invalid evaluation data")
      try:
          baseline_value = sum(train_targets) / len(train_targets)
          baseline_mae = sum(abs(baseline_value - target) for target in heldout_targets) / len(heldout_targets)
          model_mae = sum(abs(prediction - target) for prediction, target in zip(model_predictions, heldout_targets)) / len(heldout_targets)
          improvement = baseline_mae - model_mae
          if not all(math.isfinite(value) for value in (baseline_value, baseline_mae, model_mae, improvement)):
              raise ValueError("non-finite result")
      except OverflowError as error:
          raise ValueError("non-finite result") from error
      winner = "model" if model_mae < baseline_mae else "baseline" if model_mae > baseline_mae else "tie"
      return {"baseline_value": baseline_value, "baseline_mae": baseline_mae, "model_mae": model_mae, "improvement": improvement, "winner": winner}
