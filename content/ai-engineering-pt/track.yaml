id: ai-engineering
name: Engenharia de IA
language: python
version: "0.1"
description: |
  Construa sistemas de IA confiáveis, de fundamentos determinísticos a frameworks de produção.
  As oito primeiras ilhas cobrem contexto rastreável, contratos de prompt, recuperação, RAG, saídas estruturadas, evals, ferramentas e garantias de produção.

runner: python
file_extension: .py

islands:
  - 01-documents-into-context
  - 02-prompt-contracts
  - 03-retrieval
  - 04-rag
  - 05-structured-outputs
  - 06-evals
  - 07-tools-and-agents
  - 08-production-ai
  - 09-mathematical-statistical-foundations
