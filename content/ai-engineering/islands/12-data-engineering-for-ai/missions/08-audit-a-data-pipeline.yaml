hints:
  - level: 1
    text: "What evidence must survive each boundary from raw records to the derived artifact?"
  - level: 2
    text: "Validate once, retain ordered failures, measure the source, transform valid rows, then hash both sides."
  - level: 3
    text: "Repeat the filter-and-sort step into a second list and compare its canonical digest with `output_version`."
solution: |
  def audit_data_pipeline(records, contract, unique_field, transformation_version):
      import hashlib
      import json
      import math
      if not isinstance(records, list) or not records or any(not isinstance(record, dict) for record in records):
          raise ValueError("invalid records")
      if not isinstance(contract, dict) or not contract or not isinstance(unique_field, str) or not isinstance(transformation_version, str) or not transformation_version:
          raise ValueError("invalid pipeline")
      expected = {"type", "nullable", "min", "max", "allowed"}
      supported = {"string", "integer", "number", "boolean"}
      def finite_number(value):
          if type(value) not in (int, float):
              return False
          try:
              return math.isfinite(value)
          except OverflowError:
              return False
      def scalar(value):
          return value is None or type(value) in (str, int, bool) or (type(value) is float and math.isfinite(value))
      for field, spec in contract.items():
          if not isinstance(field, str) or not isinstance(spec, dict) or set(spec) != expected or spec["type"] not in supported or type(spec["nullable"]) is not bool:
              raise ValueError("invalid field contract")
          if spec["type"] not in {"integer", "number"} and (spec["min"] is not None or spec["max"] is not None):
              raise ValueError("invalid bound")
          if spec["min"] is not None and not finite_number(spec["min"]):
              raise ValueError("invalid bound")
          if spec["max"] is not None and not finite_number(spec["max"]):
              raise ValueError("invalid bound")
          if spec["min"] is not None and spec["max"] is not None and spec["min"] > spec["max"]:
              raise ValueError("invalid bounds")
          if spec["allowed"] is not None and (not isinstance(spec["allowed"], list) or not all(scalar(value) for value in spec["allowed"])):
              raise ValueError("invalid allowed values")
      if unique_field not in contract or contract[unique_field]["nullable"]:
          raise ValueError("invalid unique field")
      def check(record):
          for field, spec in contract.items():
              if field not in record:
                  return field, "missing"
              value = record[field]
              if value is None:
                  if spec["nullable"]:
                      continue
                  return field, "null"
              kind = spec["type"]
              matches = (kind == "string" and isinstance(value, str)) or (kind == "integer" and type(value) is int) or (kind == "number" and finite_number(value)) or (kind == "boolean" and type(value) is bool)
              if not matches:
                  return field, "type"
              if spec["min"] is not None and value < spec["min"]:
                  return field, "min"
              if spec["max"] is not None and value > spec["max"]:
                  return field, "max"
              if spec["allowed"] is not None and not any(type(value) is type(candidate) and value == candidate for candidate in spec["allowed"]):
                  return field, "allowed"
          for field in record:
              if field not in contract:
                  return field, "unexpected"
          return None, None
      violations = []
      valid_records = []
      for index, record in enumerate(records):
          field, reason = check(record)
          if reason:
              violations.append({"index": index, "field": field, "reason": reason})
          else:
              valid_records.append(dict(record))
      identifiers = []
      for record in records:
          value = record.get(unique_field)
          if value is not None and not scalar(value):
              raise ValueError("invalid identifier")
          if value is not None:
              identifiers.append((type(value).__name__, value))
      fields = list(contract)
      total = len(records)
      populated = sum(field in record and record[field] is not None for record in records for field in fields)
      populated_rows = sum(all(field in record and record[field] is not None for field in fields) for record in records)
      consistency = sum(set(record) == set(fields) for record in records) / total
      uniqueness = len(set(identifiers)) / len(identifiers) if identifiers else 0.0
      def json_value(value):
          if value is None or type(value) in (str, int, float, bool):
              return True
          if isinstance(value, list):
              return all(json_value(item) for item in value)
          if isinstance(value, dict):
              return all(type(key) is str and json_value(item) for key, item in value.items())
          return False
      def fingerprint(value):
          if not json_value(value):
              raise ValueError("non-canonical data")
          try:
              payload = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)
              digest = hashlib.sha256(payload.encode("utf-8")).hexdigest()
          except (TypeError, ValueError, OverflowError, UnicodeError) as caught:
              raise ValueError("non-canonical data") from caught
          return digest
      input_version = fingerprint(records)
      try:
          output = sorted(valid_records, key=lambda record: (type(record[unique_field]).__name__, record[unique_field]))
          reproduced = sorted((dict(record) for record in valid_records), key=lambda record: (type(record[unique_field]).__name__, record[unique_field]))
      except TypeError as caught:
          raise ValueError("unsortable identifier") from caught
      output_version = fingerprint(output)
      reproduced_version = fingerprint(reproduced)
      return {
          "contract": {"valid_rows": len(valid_records), "invalid_rows": len(violations), "violations": violations},
          "quality": {
              "completeness": round(populated / (total * len(fields)), 6),
              "validity": round(populated_rows / total, 6),
              "uniqueness": round(uniqueness, 6),
              "consistency": round(consistency, 6),
          },
          "output": output,
          "lineage": {"input_version": input_version, "output_version": output_version, "transformation_version": transformation_version},
          "reproducible": output_version == reproduced_version,
      }
