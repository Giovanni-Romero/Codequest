        quality: {completeness: 0.833333, validity: 0.666667, uniqueness: 1.0, consistency: 1.0}
        output: [{id: 1, score: 3}, {id: 2, score: 4}]
        lineage: {input_version: 90ea7124d197abebadec991e89d5e5aa2b428b5a91e937ab7ca99dfc8d5e7649, output_version: 05fb1013da50b04e5a5a41fd513f2c31a6d85dca01416a833aeb14afc058399a, transformation_version: clean-sort-v1}
        reproducible: true
