      expect:
        contract: {valid_rows: 0, invalid_rows: 1, violations: [{index: 0, field: id, reason: type}]}
        quality: {completeness: 1.0, validity: 1.0, uniqueness: 1.0, consistency: 1.0}
        output: []
        lineage: {input_version: 4baccf9c959d768a613a90a8d30491d198a3b6b2b68ebfcfef5b8d1848454276, output_version: 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945, transformation_version: v1}
