id: ai-data-08
title: Audit a data pipeline
track: ai-engineering
island: data-engineering-for-ai
order: 8
difficulty: challenging
tags: [ai-engineering, data, pipeline, capstone]
xp: 45
concepts: [data-contracts, data-quality, dataset-versioning, reproducible-pipelines]
teaching:
  analogy: "A trustworthy cargo pipeline joins four records: rejected crates, quality dimensions, immutable seals, and proof that the declared transformation repeats exactly."
  explanation: An auditable data pipeline validates every row, measures the unmodified source, deterministically filters and sorts valid output, and links both content versions to transformation logic. The report keeps diagnostic evidence instead of hiding defects behind one success flag.
  worked_example: |
    audit = {"invalid_rows": 1, "reproducible": True}
    print(audit)
  key_points:
    - Contract violations remain ordered and traceable.
    - Quality metrics describe the original dataset.
    - Input, output, and transformation versions form lineage.
    - Reproducibility compares artifacts, not intentions.
brief: >
  Write `audit_data_pipeline(records, contract, unique_field, transformation_version) -> dict`.
  Use the complete field contract from mission 1 and require a non-nullable unique field in
  that contract. Return `contract` counts and ordered violations, `quality` metrics from
  mission 3, valid `output` rows sorted by the unique field, `lineage` with canonical input
  and output SHA-256 versions plus `transformation_version`, and `reproducible`, proven by
  repeating the transformation and comparing output versions. Invalid rows are reported and
  excluded; malformed contracts, containers, non-canonical data, or unsortable values raise
  `ValueError`. Do not mutate inputs.
signature:
  entrypoint: audit_data_pipeline
  stub: |
    def audit_data_pipeline(records, contract, unique_field, transformation_version):
        # Join contract, quality, lineage, and reproducibility evidence.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
