id: ai-tools-01
title: Define the tool contract
track: ai-engineering
island: tools-and-agents
order: 1
difficulty: moderate
tags: [ai-engineering, tools, contracts]
xp: 30
concepts: [tool-contracts]
teaching:
  analogy: |
    A delivery form names every package field before a driver can leave the depot.
  explanation: |
    A tool contract is a checked boundary, not a suggestion in a docstring. Validate its complete shape before inspecting a call. Type declarations make the expected inputs explicit. A valid result describes an effect but never performs it.
  worked_example: |
    form = {"recipient": "str", "boxes": "int"}
    print(form["recipient"])
  key_points:
    - Validate structure before values.
    - Check a type before comparing it with declared choices.
    - A returned effect is data, not execution.
brief: |
  Write `validate_tool_call(contract, call)`. A contract has exactly `name`, `inputs`,
  `output`, `errors`, and `effect`; type names are `str`, `int`, `float`, `bool`, `list`,
  `dict`, and `none`. A call has exactly `tool` and `arguments`. Return `ready` with the
  original request and effect when everything matches. Otherwise return `invalid_contract`
  or `invalid_call` with invalid field names in declaration order. Never execute an effect.
signature:
  entrypoint: validate_tool_call
  stub: |
    def validate_tool_call(contract, call):
        # Validate a declared tool boundary before planning its effect.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [{name: lookup, inputs: {query: str}, output: dict, errors: [missing], effect: read}, {tool: lookup, arguments: {query: birds}}]
      expect: {status: ready, request: {tool: lookup, arguments: {query: birds}}, effect: read}
    - args: [{name: lookup, inputs: {query: str}, output: dict, errors: [missing], effect: read}, {tool: lookup, arguments: {}}]
      expect: {status: invalid_call, fields: [query]}
  hidden:
    - args: [{name: ping, inputs: {}, output: none, errors: [], effect: read}, {tool: ping, arguments: {}}]
      expect: {status: ready, request: {tool: ping, arguments: {}}, effect: read}
    - args: [{name: add, inputs: {count: int}, output: none, errors: [], effect: write}, {tool: add, arguments: {count: true}}]
      expect: {status: invalid_call, fields: [count]}
    - args: [{name: bad, inputs: {x: set}, output: none, errors: [], effect: read}, {tool: bad, arguments: {x: a}}]
      expect: {status: invalid_contract, fields: [inputs]}
    - args: [{name: bad, inputs: {x: str}, output: none, errors: [x, x], effect: read}, {tool: bad, arguments: {x: a}}]
      expect: {status: invalid_contract, fields: [errors]}
    - args: [{name: ok, inputs: {x: str}, output: none, errors: [], effect: ""}, {tool: ok, arguments: {x: a}}]
      expect: {status: invalid_contract, fields: [effect]}
    - args: [{name: ok, inputs: {x: str}, output: none, errors: [], effect: read, extra: x}, {tool: ok, arguments: {x: a}}]
      expect: {status: invalid_contract, fields: [name]}
hints:
  - {level: 1, text: "Which facts must hold before an argument value can be trusted?"}
  - {level: 2, text: "Validate both exact key sets, then compare each argument to its declared type."}
  - {level: 3, text: "For a parcel form, keep `{\"weight\": \"float\"}` separate from the submitted `{\"weight\": 2.5}`."}
solution: |
  def validate_tool_call(contract, call):
      fields = ["name", "inputs", "output", "errors", "effect"]
      allowed = {"str", "int", "float", "bool", "list", "dict", "none"}
      bad = []
      if not isinstance(contract, dict) or set(contract) != set(fields):
          return {"status": "invalid_contract", "fields": ["name"]}
      if not isinstance(contract["name"], str) or not contract["name"]: bad.append("name")
      inputs = contract["inputs"]
      if not isinstance(inputs, dict) or any(not isinstance(k, str) or not k or not isinstance(v, str) or v not in allowed for k, v in inputs.items()): bad.append("inputs")
      if not isinstance(contract["output"], str) or contract["output"] not in allowed: bad.append("output")
      errors = contract["errors"]
      if not isinstance(errors, list) or any(not isinstance(x, str) or not x for x in errors) or len(set(errors)) != len(errors): bad.append("errors")
      if not isinstance(contract["effect"], str) or not contract["effect"]: bad.append("effect")
      if bad: return {"status": "invalid_contract", "fields": bad}
      if not isinstance(call, dict) or set(call) != {"tool", "arguments"}:
          return {"status": "invalid_call", "fields": ["tool"]}
      bad = []
      if not isinstance(call["tool"], str) or call["tool"] != contract["name"]: bad.append("tool")
      args = call["arguments"]
      if not isinstance(args, dict): return {"status": "invalid_call", "fields": bad + ["arguments"]}
      for key, declared in inputs.items():
          value = args.get(key, object())
          valid = type(value) is {"str": str, "int": int, "float": float, "bool": bool, "list": list, "dict": dict}.get(declared) if declared != "none" else value is None
          if not valid: bad.append(key)
      bad.extend(key for key in args if key not in inputs)
      if bad: return {"status": "invalid_call", "fields": bad}
      return {"status": "ready", "request": {"tool": call["tool"], "arguments": dict(args)}, "effect": contract["effect"]}
