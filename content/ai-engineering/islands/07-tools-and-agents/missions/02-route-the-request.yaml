id: ai-tools-02
title: Route the request
track: ai-engineering
island: tools-and-agents
order: 2
difficulty: moderate
tags: [ai-engineering, tools, routing]
xp: 30
concepts: [tool-routing, tool-contracts]
teaching:
  analogy: |
    A dispatcher sends a parcel only to a licensed driver whose route fits the address.
  explanation: |
    Routing selects from declared capabilities and authority, never from a convenient name. Validate the whole catalogue before choosing. One eligible tool is a route; several are ambiguity. A refusal is a correct outcome.
  worked_example: |
    routes = ["north", "south"]
    print("north" in routes)
  key_points:
    - Permission and capability are separate checks.
    - Preserve catalogue order in an ambiguity report.
    - Do not guess a tool from its name.
brief: |
  Write `route_tool(task, tools)`. A task has exactly `capability`, `arguments`, and
  `allowed_tools`. Each tool has exactly `name`, `capabilities`, `required_arguments`, and
  `effect`. Validate every record and declared-unique list. Route one allowed capability match
  with all required arguments, refuse unauthorized/no_match, or return ordered ambiguous candidates.
signature:
  entrypoint: route_tool
  stub: |
    def route_tool(task, tools):
        # Select one authorized capability match without guessing.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [{capability: search, arguments: {query: birds}, allowed_tools: [lookup]}, [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}]]
      expect: {status: routed, tool: lookup, arguments: {query: birds}, effect: read}
    - args: [{capability: search, arguments: {query: birds}, allowed_tools: [one, two]}, [{name: one, capabilities: [search], required_arguments: [query], effect: read}, {name: two, capabilities: [search], required_arguments: [query], effect: read}]]
      expect: {status: refused, reason: ambiguous, candidates: [one, two]}
  hidden:
    - args: [{capability: search, arguments: {}, allowed_tools: []}, []]
      expect: {status: refused, reason: no_match}
    - args: [{capability: search, arguments: {query: x}, allowed_tools: [write]}, [{name: read, capabilities: [search], required_arguments: [query], effect: read}, {name: write, capabilities: [save], required_arguments: [query], effect: write}]]
      expect: {status: refused, reason: unauthorized}
    - args: [{capability: search, arguments: {}, allowed_tools: [one, one]}, [{name: one, capabilities: [search], required_arguments: [], effect: read}]]
      raises: ValueError
    - args: [{capability: search, arguments: {}, allowed_tools: [one]}, [{name: one, capabilities: [search, search], required_arguments: [], effect: read}]]
      raises: ValueError
    - args: [{capability: search, arguments: {}, allowed_tools: [one]}, [{name: one, capabilities: [search], required_arguments: [], effect: read}, {name: late, capabilities: [x], required_arguments: [], effect: 1}]]
      raises: ValueError
    - args: [{capability: search, arguments: {query: x, extra: y}, allowed_tools: [one]}, [{name: one, capabilities: [search], required_arguments: [query], effect: read}]]
      expect: {status: routed, tool: one, arguments: {query: x, extra: y}, effect: read}
hints:
  - {level: 1, text: "When is a tool both permitted and able to help?"}
  - {level: 2, text: "Validate all declarations first, then build an ordered eligible list."}
  - {level: 3, text: "For a depot, append each eligible driver to a list; choose only when its length is one."}
solution: |
  def route_tool(task, tools):
      if not isinstance(task, dict) or set(task) != {"capability", "arguments", "allowed_tools"} or not isinstance(tools, list): raise ValueError("invalid input")
      if not isinstance(task["capability"], str) or not task["capability"] or not isinstance(task["arguments"], dict) or not isinstance(task["allowed_tools"], list) or any(not isinstance(x, str) or not x for x in task["allowed_tools"]) or len(set(task["allowed_tools"])) != len(task["allowed_tools"]): raise ValueError("invalid task")
      names = set()
      for tool in tools:
          if not isinstance(tool, dict) or set(tool) != {"name", "capabilities", "required_arguments", "effect"}: raise ValueError("invalid tool")
          if not isinstance(tool["name"], str) or not tool["name"] or tool["name"] in names or not isinstance(tool["effect"], str) or not tool["effect"]: raise ValueError("invalid tool")
          names.add(tool["name"])
          for key in ("capabilities", "required_arguments"):
              values = tool[key]
              if not isinstance(values, list) or any(not isinstance(x, str) or not x for x in values) or len(set(values)) != len(values): raise ValueError("invalid tool")
      capable = [tool for tool in tools if task["capability"] in tool["capabilities"]]
      eligible = [tool for tool in capable if tool["name"] in task["allowed_tools"] and all(key in task["arguments"] for key in tool["required_arguments"])]
      if len(eligible) == 1:
          tool = eligible[0]; return {"status": "routed", "tool": tool["name"], "arguments": dict(task["arguments"]), "effect": tool["effect"]}
      if len(eligible) > 1: return {"status": "refused", "reason": "ambiguous", "candidates": [tool["name"] for tool in eligible]}
      return {"status": "refused", "reason": "unauthorized" if capable and not any(tool["name"] in task["allowed_tools"] for tool in capable) else "no_match"}
