id: ai-tools-04
title: Deduplicate the effect
track: ai-engineering
island: tools-and-agents
order: 4
difficulty: moderate
tags: [ai-engineering, tools, idempotency]
xp: 30
concepts: [idempotent-effects, orchestration-gates]
teaching:
  analogy: |
    A bank transfer receipt lets a clerk recognize a retry without sending the money twice.
  explanation: |
    Idempotency gives a request a durable identity. Compare nested payloads by typed equality, not hash keys. A matching prior request is a replay; a reused identity with different content is a conflict. The returned commands remain plans.
  worked_example: |
    receipt = {"id": "A", "amount": 5}
    print(receipt["id"])
  key_points:
    - IDs and keys both protect against duplicate effects.
    - "`True` and `1` are not the same typed payload."
    - Compare nested payloads without hashing them.
brief: |
  Write `plan_idempotent_effects(requests, applied)`. A request has exact `operation_id`,
  `idempotency_key`, `action`, and `payload`; an applied record adds `result`. Validate all records.
  Identical retries replay stored results. An ID or key reused with different typed action/payload
  conflicts. Return ordered conflict operations, or ordered execute plans and replays.
signature:
  entrypoint: plan_idempotent_effects
  stub: |
    def plan_idempotent_effects(requests, applied):
        # Plan at-most-once effects as returned data.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{operation_id: a, idempotency_key: one, action: save, payload: {x: 1}}, {operation_id: b, idempotency_key: two, action: save, payload: [2]}], [{operation_id: a, idempotency_key: one, action: save, payload: {x: 1}, result: done}]]
      expect: {status: ready, execute: [{operation_id: b, idempotency_key: two, action: save, payload: [2]}], replayed: [{operation_id: a, result: done}]}
    - args: [[{operation_id: a, idempotency_key: one, action: save, payload: 2}], [{operation_id: a, idempotency_key: one, action: save, payload: 1, result: done}]]
      expect: {status: conflict, operations: [a]}
  hidden:
    - args: [[], []]
      expect: {status: ready, execute: [], replayed: []}
    - args: [[{operation_id: a, idempotency_key: one, action: save, payload: true}], [{operation_id: a, idempotency_key: one, action: save, payload: 1, result: done}]]
      expect: {status: conflict, operations: [a]}
    - args: [[{operation_id: a, idempotency_key: one, action: save, payload: {x: [1]}}], []]
      expect: {status: ready, execute: [{operation_id: a, idempotency_key: one, action: save, payload: {x: [1]}}], replayed: []}
    - args: [[{operation_id: a, idempotency_key: one, action: save, payload: 1}, {operation_id: a, idempotency_key: two, action: save, payload: 1}], []]
      expect: {status: conflict, operations: [a]}
    - args: [[{operation_id: a, idempotency_key: one, action: save, payload: 1}, {operation_id: b, idempotency_key: one, action: save, payload: 1}], []]
      expect: {status: conflict, operations: [b]}
    - args: [[{operation_id: a, idempotency_key: one, action: save, payload: 1, extra: x}], []]
      raises: ValueError
    - args: [[{operation_id: a, idempotency_key: one, action: save, payload: {items: [true]}}], [{operation_id: a, idempotency_key: one, action: save, payload: {items: [1]}, result: done}]]
      expect: {status: conflict, operations: [a]}
    - args: [[{operation_id: a, idempotency_key: one, action: save, payload: {x: [1]}}, {operation_id: a, idempotency_key: one, action: save, payload: {x: [1]}}], []]
      expect: {status: ready, execute: [{operation_id: a, idempotency_key: one, action: save, payload: {x: [1]}}], replayed: []}
hints:
  - {level: 1, text: "Which identity must agree before a retry can be replayed?"}
  - {level: 2, text: "Keep earlier records in lists and compare values with both type and equality."}
  - {level: 3, text: "For receipts, compare `(type(amount), amount)` before deciding that two forms match."}
solution: |
  def plan_idempotent_effects(requests, applied):
      base = {"operation_id", "idempotency_key", "action", "payload"}
      if not isinstance(requests, list) or not isinstance(applied, list): raise ValueError("invalid input")
      def valid(row, extra=False):
          return isinstance(row, dict) and set(row) == (base | ({"result"} if extra else set())) and all(isinstance(row[k], str) and row[k] for k in ("operation_id", "idempotency_key", "action"))
      if any(not valid(row) for row in requests) or any(not valid(row, True) for row in applied): raise ValueError("invalid record")
      def equal(left, right):
          if type(left) is not type(right): return False
          if isinstance(left, list): return len(left) == len(right) and all(equal(a, b) for a, b in zip(left, right))
          if isinstance(left, dict): return set(left) == set(right) and all(equal(left[key], right[key]) for key in left)
          return left == right
      def same(a, b): return equal(a["action"], b["action"]) and equal(a["payload"], b["payload"])
      seen, conflicts = [], []
      for row in requests + applied:
          for old in seen:
              if row["operation_id"] == old["operation_id"] or row["idempotency_key"] == old["idempotency_key"]:
                  if row["operation_id"] != old["operation_id"] or row["idempotency_key"] != old["idempotency_key"] or not same(row, old):
                      if row["operation_id"] not in conflicts: conflicts.append(row["operation_id"])
          seen.append(row)
      if conflicts:
          operations = []
          for row in requests:
              if row["operation_id"] in conflicts and row["operation_id"] not in operations: operations.append(row["operation_id"])
          return {"status": "conflict", "operations": operations}
      execute, replayed, planned = [], [], []
      for row in requests:
          prior = next((old for old in applied if old["operation_id"] == row["operation_id"] or old["idempotency_key"] == row["idempotency_key"]), None)
          if prior: replayed.append({"operation_id": row["operation_id"], "result": prior["result"]})
          elif not any(row["operation_id"] == old["operation_id"] and row["idempotency_key"] == old["idempotency_key"] and same(row, old) for old in planned):
              execute.append(dict(row)); planned.append(row)
      return {"status": "ready", "execute": execute, "replayed": replayed}
