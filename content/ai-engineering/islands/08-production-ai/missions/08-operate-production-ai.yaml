id: ai-production-08
title: Operate production AI
track: ai-engineering
island: production-ai
order: 8
difficulty: moderate
tags:
- ai-engineering
- production
- deterministic
xp: 30
concepts:
- layered-guardrails
- observability-traces
- latency-cost-budget
- graceful-degradation
teaching:
  analogy: A control tower clears every flight plan, checks runway limits, then handles each aircraft in a fixed order.
  explanation: Production operation connects guardrails, traces, budgets, and graceful fallback. Earlier deterministic controls win over provider data. Safe records show what happened without copying private request or response payloads.
  worked_example: "queue = [\"north\", \"south\"]\nfor lane in queue:\n    print(lane)"
  key_points:
  - Validate the entire batch first.
  - Budget all declared calls before work.
  - Output controls discard unsafe provider output.
brief: 'Write `operate_production_ai(requests, policy, budget, fallbacks) -> dict`. Validate the complete batch first. Budget declared calls before processing. Then process in input order: input guardrail, supplied provider status, output guardrail. Preserve only safe trace metadata; guardrail rejections have result `None`, provider failures use a fallback, and no rejection attempts recovery.'
signature:
  entrypoint: operate_production_ai
  stub: "def operate_production_ai(requests, policy, budget, fallbacks):\n    # Return deterministic production evidence; never call a provider.\n    pass\n"
constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128
  forbidden_builtins:
  - eval
  - exec
