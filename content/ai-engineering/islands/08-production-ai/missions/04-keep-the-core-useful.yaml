id: ai-production-04
title: Keep the core useful
track: ai-engineering
island: production-ai
order: 4
difficulty: moderate
tags:
- ai-engineering
- production
- deterministic
xp: 30
concepts:
- graceful-degradation
- layered-guardrails
teaching:
  analogy: A paper map still gets you home when the navigation app has no signal.
  explanation: Graceful degradation preserves the useful core while an optional provider fails. A fallback is explicit, not a hidden imitation. Validation prevents a fake success from hiding an outage.
  worked_example: 'core = {"route": "home"}

    print(core["route"])'
  key_points:
  - Core behavior survives provider failure.
  - Each failure has its own fallback.
  - A success and failure have different valid shapes.
brief: Write `resolve_provider_result(core_result, provider_result, fallbacks) -> dict`. Validate the provider and the three ordered fallbacks before returning. Preserve core_result exactly. Successful results use the provider value; offline, timeout, and rejected results use the matching fallback and expose a typed degradation reason.
signature:
  entrypoint: resolve_provider_result
  stub: "def resolve_provider_result(core_result, provider_result, fallbacks):\n    # Return deterministic production evidence; never call a provider.\n    pass\n"
constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128
  forbidden_builtins:
  - eval
  - exec
tests:
  visible:
  - args:
    - id: 1
    - status: ok
      value: answer
      reason: null
    - &id001
      - &id004
        status: offline
        value: cached
      - &id003
        status: timeout
        value: later
      - &id002
        status: rejected
        value: safe
    expect:
      status: ok
      core:
        id: 1
      result: answer
  - args:
    - id: 1
    - status: offline
      value: null
      reason: down
    - *id001
    expect:
      status: offline
      core:
        id: 1
      result: cached
      degraded: true
      reason: down
  - args:
    - 0
    - status: rejected
      value: null
      reason: policy
    - *id001
    expect:
      status: rejected
      core: 0
      result: safe
      degraded: true
      reason: policy
  hidden:
  - args:
    - {}
    - status: ok
      value: null
      reason: why
    - *id001
    raises: ValueError
  - args:
    - {}
    - status: offline
      value: x
      reason: down
    - *id001
    raises: ValueError
  - args:
    - {}
    - status: timeout
      value: null
      reason: ''
    - *id001
    raises: ValueError
  - args:
    - {}
    - status: offline
      value: null
      reason: down
    - - *id002
      - *id003
      - *id004
    raises: ValueError
  - args:
    - {}
    - status: offline
      value: null
      reason: down
    - - *id004
      - *id003
    raises: ValueError
  - args:
    - true
    - status: timeout
      value: null
      reason: slow
    - *id001
    expect:
      status: timeout
      core: true
      result: later
      degraded: true
      reason: slow
hints:
- level: 1
  text: What remains useful with the optional service absent?
- level: 2
  text: Map each failure status to one declared fallback.
- level: 3
  text: 'For a menu: `choice = fallbacks[status] if status != "ok" else value`. '
solution: "def resolve_provider_result(core_result, provider_result, fallbacks):\n    states = [\"offline\", \"timeout\", \"rejected\"]\n    if not isinstance(provider_result, dict) or set(provider_result) != {\"status\", \"value\", \"reason\"} or provider_result[\"status\"] not in {\"ok\", *states}: raise ValueError(\"invalid provider\")\n    if not isinstance(fallbacks, list) or len(fallbacks) != 3: raise ValueError(\"invalid fallbacks\")\n    values = {}\n    for expected, row in zip(states, fallbacks):\n        if not isinstance(row, dict) or set(row) != {\"status\", \"value\"} or row[\"status\"] != expected: raise ValueError(\"invalid fallback\")\n        values[expected] = row[\"value\"]\n    status, value, reason = provider_result[\"status\"], provider_result[\"value\"], provider_result[\"reason\"]\n    if status == \"ok\":\n        if reason is not None: raise ValueError(\"invalid provider\")\n        return {\"status\": \"ok\", \"core\": core_result, \"result\": value}\n    if value\
  \ is not None or type(reason) is not str or not reason: raise ValueError(\"invalid provider\")\n    return {\"status\": status, \"core\": core_result, \"result\": values[status], \"degraded\": True, \"reason\": reason}\n"
