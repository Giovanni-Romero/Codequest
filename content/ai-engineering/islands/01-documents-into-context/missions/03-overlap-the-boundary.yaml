id: ai-documents-03
title: Overlap the boundary
track: ai-engineering
island: documents-into-context
order: 3
difficulty: moderate
tags: [ai-engineering, chunking, overlap]
xp: 30

concepts:
  - chunk-overlap

teaching:
  analogy: |
    Two map sheets share a narrow strip at their edges. The repeated coastline lets a
    navigator align them instead of guessing how one sheet connects to the next.

    Overlapping chunks repeat a controlled boundary for the same reason: a phrase split
    across two chunks keeps enough neighbouring context to remain meaningful.

  explanation: |
    Overlap is the number of words repeated from one chunk in the next. The movement
    between starts is the stride: `max_words - overlap`. Overlap must be smaller than
    the chunk size or the start never advances. Once a chunk reaches the end, stop so
    the remaining overlap does not create redundant tail chunks.

  worked_example: |
    # Make route cards of three stops with one repeated stop.
    stops = ["A", "B", "C", "D", "E"]
    cards = []
    for start in range(0, len(stops), 2):
        cards.append(stops[start : start + 3])
        if start + 3 >= len(stops):
            break
    print(cards)  # [["A", "B", "C"], ["C", "D", "E"]]

  key_points:
    - Stride is chunk size minus overlap; it must always remain positive.
    - More overlap repeats more context and consumes more of the later context budget.
    - Stop when the current chunk reaches the end to avoid redundant tail fragments.
    - Zero overlap is valid and behaves like fixed-window chunking.

brief: |
  Write `chunk_with_overlap`. It receives text, a positive `max_words`, and an overlap.
  Return consecutive word chunks with at most `max_words` words. Each chunk after the
  first repeats the requested number of words from the previous chunk.

  Normalize whitespace and return an empty list for empty text. Raise `ValueError` when
  `max_words` is not positive, when overlap is negative, or when overlap is greater than
  or equal to `max_words`. Do not generate chunks that are only redundant tails.

signature:
  entrypoint: chunk_with_overlap
  stub: |
    def chunk_with_overlap(text, max_words, overlap):
        # Move by max_words minus overlap until a chunk reaches the end.
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["one two three four five six", 3, 1]
      expect: ["one two three", "three four five", "five six"]
    - args: ["alpha beta gamma delta", 2, 0]
      expect: ["alpha beta", "gamma delta"]
  hidden:
    - args: ["", 3, 1]
      expect: []
    - args: ["  \t\n ", 2, 1]
      expect: []
    - args: ["anchor", 4, 3]
      expect: ["anchor"]
    - args: ["a b c d e", 4, 3]
      expect: ["a b c d", "b c d e"]
    - args: ["one two", 0, 0]
      raises: ValueError
    - args: ["one two", 2, -1]
      raises: ValueError
    - args: ["one two", 2, 2]
      raises: ValueError
    - args: ["one two", 2, 3]
      raises: ValueError

hints:
  - level: 1
    text: |
      How far may the next chunk start if it must repeat the last few words?
  - level: 2
    text: |
      Compute a positive stride as `max_words - overlap`. Stop after appending a chunk
      whose end has reached the word count.
  - level: 3
    text: |
      The same pattern for overlapping calendar windows is:

          step = window_size - shared_days
          for start in range(0, len(days), step):
              windows.append(days[start : start + window_size])
              if start + window_size >= len(days):
                  break

      Apply it to words, then join each slice.

solution: |
  def chunk_with_overlap(text, max_words, overlap):
      if max_words <= 0:
          raise ValueError("max_words must be positive")
      if overlap < 0 or overlap >= max_words:
          raise ValueError("overlap must be between zero and max_words")

      words = text.split()
      if not words:
          return []

      chunks = []
      stride = max_words - overlap
      for start in range(0, len(words), stride):
          chunks.append(" ".join(words[start : start + max_words]))
          if start + max_words >= len(words):
              break
      return chunks
