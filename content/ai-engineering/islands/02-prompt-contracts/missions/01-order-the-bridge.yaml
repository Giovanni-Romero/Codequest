id: ai-prompts-01
title: Order the bridge
track: ai-engineering
island: prompt-contracts
order: 1
difficulty: moderate
tags: [ai-engineering, prompts, instruction-hierarchy]
xp: 30

concepts: [instruction-hierarchy]

teaching:
  analogy: |
    A bridge crew separates standing orders from today's task, training examples,
    cargo reports, and a passenger request. Mixing the papers makes authority unclear.
  explanation: |
    Instruction hierarchy gives each prompt part a declared job. System rules outrank
    the task, examples demonstrate behavior, context supplies evidence, and user data
    states the request. Stable ordering makes the request inspectable and repeatable.
  worked_example: |
    priority = {"captain": 0, "crew": 1, "visitor": 2}
    notes = [{"role": "visitor"}, {"role": "captain"}]
    ordered = sorted(notes, key=lambda note: priority[note["role"]])
    print(ordered)
  key_points:
    - A text segment has authority because of its role, not because it sounds confident.
    - Stable ordering preserves the order of parts with the same role.
    - Unknown roles make the contract ambiguous and must be rejected.

brief: |
  Write `order_prompt_parts`. It receives dictionaries containing `role` and `content`.
  Return fresh dictionaries ordered by `system`, `task`, `example`, `context`, then
  `user`, preserving input order within a role. Raise `ValueError` for an unknown role,
  a missing field, or empty content. Do not mutate the input.

signature:
  entrypoint: order_prompt_parts
  stub: |
    def order_prompt_parts(parts):
        # Put every declared role in its authority position.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: [[{role: user, content: question}, {role: system, content: rules}, {role: task, content: answer}]]
      expect: [{role: system, content: rules}, {role: task, content: answer}, {role: user, content: question}]
    - args: [[{role: example, content: first}, {role: example, content: second}, {role: context, content: evidence}]]
      expect: [{role: example, content: first}, {role: example, content: second}, {role: context, content: evidence}]
  hidden:
    - args: [[]]
      expect: []
    - args: [[{role: system, content: one}]]
      expect: [{role: system, content: one}]
    - args: [[{role: tool, content: run}]]
      raises: ValueError
    - args: [[{role: user}]]
      raises: ValueError
    - args: [[{role: user, content: "  "}]]
      raises: ValueError

hints:
  - {level: 1, text: "Which fixed priority belongs to each role?"}
  - {level: 2, text: "Validate first, then use a stable sort with a role-to-rank mapping."}
  - level: 3
    text: |
      A different priority queue can be ordered with
      `sorted(items, key=lambda item: ranks[item["category"]])` after validation.

solution: |
  def order_prompt_parts(parts):
      ranks = {"system": 0, "task": 1, "example": 2, "context": 3, "user": 4}
      copied = []
      for part in parts:
          if "role" not in part or "content" not in part:
              raise ValueError("each part needs role and content")
          if part["role"] not in ranks or not str(part["content"]).strip():
              raise ValueError("invalid prompt part")
          copied.append(dict(part))
      return sorted(copied, key=lambda part: ranks[part["role"]])
