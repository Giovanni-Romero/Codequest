id: ai-prompts-03
title: Pack earned context
track: ai-engineering
island: prompt-contracts
order: 3
difficulty: moderate
tags: [ai-engineering, prompts, context, budgeting]
xp: 30

concepts: [prompt-templates, context-assembly]

teaching:
  analogy: |
    A lifeboat loads useful supplies under a weight limit. A large useless crate earns
    no space, and one oversized crate must not stop smaller useful items from boarding.
  explanation: |
    Context assembly chooses evidence before generation. Relevance and budget are input
    rules, not something the model repairs later. Stable scanning makes the same request
    produce the same context every time.
  worked_example: |
    supplies = [{"name": "water", "useful": True, "weight": 2}]
    loaded = [item["name"] for item in supplies if item["useful"]]
    print(loaded)
  key_points:
    - Irrelevant context consumes attention without helping the task.
    - The hard budget is never exceeded.
    - Skipping one item does not end the scan.

brief: |
  Write `assemble_context`. Each chunk has `text` and `relevant`. Scan in order and
  return the text of relevant, non-empty chunks that fit within `max_words`. Skip a
  chunk that does not fit and continue. Raise `ValueError` for a negative budget.

signature:
  entrypoint: assemble_context
  stub: |
    def assemble_context(chunks, max_words):
        # Select only evidence that is relevant and affordable.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: [[{text: "alpha beta", relevant: true}, {text: noise, relevant: false}, {text: gamma, relevant: true}], 3]
      expect: ["alpha beta", gamma]
    - args: [[{text: "one two three", relevant: true}, {text: four, relevant: true}], 1]
      expect: [four]
  hidden:
    - args: [[], 4]
      expect: []
    - args: [[{text: " ", relevant: true}], 2]
      expect: []
    - args: [[{text: one, relevant: true}], 0]
      expect: []
    - args: [[{text: one, relevant: false}], 4]
      expect: []
    - args: [[{text: one, relevant: true}], -1]
      raises: ValueError

hints:
  - {level: 1, text: "Which two conditions must a chunk satisfy before it earns budget?"}
  - {level: 2, text: "Track used words while scanning; use `continue` for empty, irrelevant, or oversized chunks."}
  - level: 3
    text: |
      A packing loop can skip unusable parcels, append affordable ones, and update a
      running weight without stopping at the first parcel that is too heavy.

solution: |
  def assemble_context(chunks, max_words):
      if max_words < 0:
          raise ValueError("max_words must not be negative")
      selected = []
      used = 0
      for chunk in chunks:
          text = " ".join(chunk["text"].split())
          if not chunk["relevant"] or not text:
              continue
          cost = len(text.split())
          if used + cost <= max_words:
              selected.append(text)
              used += cost
      return selected
