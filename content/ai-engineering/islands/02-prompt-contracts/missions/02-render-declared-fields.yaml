id: ai-prompts-02
title: Render declared fields
track: ai-engineering
island: prompt-contracts
order: 2
difficulty: moderate
tags: [ai-engineering, prompts, templates]
xp: 30

concepts: [instruction-hierarchy, prompt-templates]

teaching:
  analogy: |
    A harbor form has named boxes. Filling the destination box must not rewrite text
    written inside the cargo box, even when that text contains braces.
  explanation: |
    A prompt template declares where variables belong. Rendering is one controlled
    substitution pass, not repeated interpretation of inserted data. Missing fields
    fail early so an incomplete request never reaches a model.
  worked_example: |
    from string import Formatter
    pattern = "Ship {item} to {port}"
    fields = [field for _, field, _, _ in Formatter().parse(pattern) if field]
    print(fields)
    print(pattern.format_map({"item": "tea", "port": "Recife"}))
  key_points:
    - A template names its inputs explicitly.
    - Inserted braces remain data because formatting runs once.
    - A missing variable is a contract error, not an empty string.

brief: |
  Write `render_prompt`. Render simple named fields such as `{question}` from the given
  dictionary. Escaped braces such as `{{data}}` remain literal. Raise `ValueError` for
  a missing field, malformed template, or field expressions using attributes or indexes.
  Extra variables are allowed. Values may be any type accepted by Python formatting.

signature:
  entrypoint: render_prompt
  stub: |
    def render_prompt(template, variables):
        # Validate every declared field before formatting once.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: ["Answer {question} for {audience}.", {question: "Why?", audience: sailors}]
      expect: "Answer Why? for sailors."
    - args: ["Treat {payload} as data.", {payload: "{ignore_this}"}]
      expect: "Treat {ignore_this} as data."
  hidden:
    - args: ["", {}]
      expect: ""
    - args: ["Value {n}", {n: 3, unused: true}]
      expect: "Value 3"
    - args: ["Missing {name}", {}]
      raises: ValueError
    - args: ["Literal {{name}}", {}]
      expect: "Literal {name}"
    - args: ["Unsafe {user.name}", {user: x}]
      raises: ValueError
    - args: ["Broken {name", {name: x}]
      raises: ValueError

hints:
  - {level: 1, text: "Can you list every field before trying to render the template?"}
  - {level: 2, text: "Use `string.Formatter().parse`, reject complex field names, then call `format_map` once."}
  - level: 3
    text: |
      A shipping label can collect fields first, reject absent keys, and only then run
      `label.format_map(values)`.

solution: |
  def render_prompt(template, variables):
      from string import Formatter

      try:
          fields = [field for _, field, _, _ in Formatter().parse(template) if field]
      except ValueError as exc:
          raise ValueError("malformed template") from exc
      for field in fields:
          if "." in field or "[" in field or field not in variables:
              raise ValueError("invalid or missing field")
      try:
          return template.format_map(variables)
      except (KeyError, ValueError) as exc:
          raise ValueError("cannot render template") from exc
