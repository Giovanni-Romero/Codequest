id: ai-retrieval-01
title: Count the signals
track: ai-engineering
island: retrieval
order: 1
difficulty: moderate
tags: [ai-engineering, retrieval, sparse-representation]
xp: 30

concepts: [sparse-representation]

teaching:
  analogy: |
    A harbor ledger lists only cargo that is actually aboard. Ten possible cargo types
    do not require ten empty rows; the clerk records the three that appeared.
  explanation: |
    A sparse representation stores only observed terms and their counts. Normalizing
    case and edge punctuation makes equivalent text produce the same features. The
    result is simple enough to inspect by hand.
  worked_example: |
    cargo = "Tea rice tea".lower().split()
    counts = {}
    for item in cargo:
        counts[item] = counts.get(item, 0) + 1
    print(counts)
  key_points:
    - Sparse maps omit absent terms instead of storing zeros.
    - Counts preserve repetition; a set would lose it.
    - Deterministic normalization makes later scores reproducible.

brief: |
  Write `term_counts`. Split text on whitespace, lowercase with `casefold`, strip
  `.,!?;:` from both ends of each term, ignore empty results, and return a dictionary
  mapping each remaining term to its count.

signature:
  entrypoint: term_counts
  stub: |
    def term_counts(text):
        # Build the sparse term vector for this text.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: ["Port port, TIDE!"]
      expect: {port: 2, tide: 1}
    - args: ["red blue red"]
      expect: {red: 2, blue: 1}
  hidden:
    - args: [""]
      expect: {}
    - args: ["   \n\t "]
      expect: {}
    - args: ["... !!!"]
      expect: {}
    - args: ["Straße STRASSE"]
      expect: {strasse: 2}
    - args: ["anchor; anchor: buoy?"]
      expect: {anchor: 2, buoy: 1}

hints:
  - {level: 1, text: "What normalization must happen before two tokens can share a count?"}
  - {level: 2, text: "For each split token, call `casefold`, strip edge punctuation, then update a dictionary."}
  - level: 3
    text: |
      An inventory loop can normalize each item name and use
      `stock[name] = stock.get(name, 0) + 1` when the name is not empty.

solution: |
  def term_counts(text):
      counts = {}
      for raw in text.split():
          term = raw.casefold().strip(".,!?;:")
          if term:
              counts[term] = counts.get(term, 0) + 1
      return counts
