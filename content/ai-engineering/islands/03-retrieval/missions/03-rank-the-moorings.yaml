id: ai-retrieval-03
title: Rank the moorings
track: ai-engineering
island: retrieval
order: 3
difficulty: moderate
tags: [ai-engineering, retrieval, ranking]
xp: 30

concepts: [similarity-scoring, top-k-ranking]

teaching:
  analogy: |
    A harbor assigns the closest available moorings first. When two are equally close,
    keeping chart order avoids arbitrary changes between identical requests.
  explanation: |
    Top-k ranking selects at most the best `k` scored candidates. Scores sort descending
    and ties keep their original order. Ranking says which candidates are best relative
    to each other; it does not yet say whether any candidate is good enough.
  worked_example: |
    docks = [{"id": "A", "distance": 4}, {"id": "B", "distance": 2}]
    closest = sorted(docks, key=lambda dock: dock["distance"])[:1]
    print([dock["id"] for dock in closest])
  key_points:
    - Higher similarity ranks first.
    - Stable ties make repeated retrieval reproducible.
    - "`k` may be zero or larger than the corpus."

brief: |
  Write `rank_top_k`. It receives dictionaries with unique `id` and numeric `score`.
  Return the best IDs by descending score, preserving input order for ties. Return at
  most `k` IDs. Raise `ValueError` for negative `k`, duplicate IDs, or non-numeric scores.

signature:
  entrypoint: rank_top_k
  stub: |
    def rank_top_k(results, k):
        # Rank by score while keeping ties stable.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: [[{id: A, score: 0.2}, {id: B, score: 0.9}, {id: C, score: 0.5}], 2]
      expect: [B, C]
    - args: [[{id: first, score: 0.7}, {id: second, score: 0.7}], 2]
      expect: [first, second]
  hidden:
    - args: [[], 3]
      expect: []
    - args: [[{id: A, score: 1.0}], 0]
      expect: []
    - args: [[{id: A, score: 0.1}], 5]
      expect: [A]
    - args: [[{id: A, score: 1}, {id: A, score: 0}], 1]
      raises: ValueError
    - args: [[{id: A, score: high}], 1]
      raises: ValueError
    - args: [[], -1]
      raises: ValueError

hints:
  - {level: 1, text: "What sort key puts higher scores first without disturbing ties?"}
  - {level: 2, text: "Validate IDs and scores, use Python's stable sort with a negative score, then slice."}
  - level: 3
    text: |
      A leaderboard can validate unique names, sort entries with
      `key=lambda entry: -entry["points"]`, and take the requested prefix.

solution: |
  def rank_top_k(results, k):
      if k < 0:
          raise ValueError("k must not be negative")
      seen = set()
      for result in results:
          if result["id"] in seen or not isinstance(result["score"], (int, float)):
              raise ValueError("invalid result")
          seen.add(result["id"])
      ranked = sorted(results, key=lambda result: -result["score"])
      return [result["id"] for result in ranked[:k]]
