id: ai-structured-outputs-08
title: Build the output pipeline
track: ai-engineering
island: structured-outputs
order: 8
difficulty: moderate
tags: [ai-engineering, structured-outputs, pipeline]
xp: 30
concepts: [output-schema, safe-output-parsing, validation-retry, failure-taxonomy]
teaching:
  analogy: |
    A clinic registers a form, checks its fields, allows a small correction window, and records
    whether the visit succeeded or stopped for a known reason.
  explanation: |
    A structured-output pipeline exposes parse, schema, retry, and failure taxonomy boundaries.
    It returns application data only after validation. Its attempt budget is fixed, and permanent
    failures are not hidden behind retries.
  worked_example: |
    records = [{"valid": False}, {"valid": True, "value": "ok"}]
    result = next((row["value"] for row in records if row["valid"]), None)
    print(result)
  key_points:
    - Treat provider-shaped text as untrusted data.
    - Distinguish parse, schema, and policy outcomes.
    - A bounded pipeline must return a stable result when attempts run out.
brief: |
  Write `structured_result(texts, limit)`. `texts` must be a list whose every element is a string;
  validate the complete list before any terminal return. `limit` must be a non-negative integer
  and not bool. Within the bounded prefix, the exact object `{"value": string}` returns
  `{"status": "ok", "value": value}`, and the exact object `{"policy": true}`—with JSON boolean
  true, not a number—returns `{"status": "failed", "reason": "policy"}`. Malformed JSON, every
  other container or primitive, false/numeric policy, and every wrong schema are repairable.
  Return `{"status": "exhausted", "reason": "retry_limit"}` when the prefix ends without a terminal result.
signature:
  entrypoint: structured_result
  stub: |
    def structured_result(texts, limit):
        # Produce validated data or a typed, bounded failure artifact.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [['{"value": "ready"}'], 1]
      expect: {status: ok, value: ready}
    - args: [['{"policy": true}', '{"value": "late"}'], 2]
      expect: {status: failed, reason: policy}
  hidden:
    - args: [['{"policy": true}', 7], 1]
      raises: ValueError
    - args: [['{"policy": 1}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['{"policy": 1.0}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['{"policy": false}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [[], 0]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['bad', '{"value": "fixed"}'], 2]
      expect: {status: ok, value: fixed}
    - args: [['{"value": 3}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['{"value": "x", "extra": 1}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['{"policy": true}', '{"value": "x"}'], 2]
      expect: {status: failed, reason: policy}
    - args: [null, 1]
      raises: ValueError
    - args: [['{"value": "x"}'], -1]
      raises: ValueError
    - args: [['{"value": "different"}'], 1]
      expect: {status: ok, value: different}
    - args: [['bad', '{"value": "late"}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [[], true]
      raises: ValueError
hints:
  - {level: 1, text: "What exact artifact should a caller receive for success, permanent failure, and exhausted repair?"}
  - {level: 2, text: "Parse JSON, accept one exact schema, stop on policy, and count only bounded attempts."}
  - level: 3
    text: |
      A form processor can use `json.loads`, accept only `set(value) == {"answer"}` with a
      string, return a typed success record, and return a stable exhaustion record after its loop.
solution: |
  import json

  def structured_result(texts, limit):
      if not isinstance(texts, list) or not isinstance(limit, int) or isinstance(limit, bool) or limit < 0:
          raise ValueError("invalid input")
      if any(not isinstance(text, str) for text in texts):
          raise ValueError("texts must be strings")
      for text in texts[:limit]:
          try:
              value = json.loads(text)
          except (TypeError, json.JSONDecodeError):
              continue
          if isinstance(value, dict) and set(value) == {"policy"} and type(value["policy"]) is bool and value["policy"] is True:
              return {"status": "failed", "reason": "policy"}
          if isinstance(value, dict) and set(value) == {"value"} and isinstance(value["value"], str):
              return {"status": "ok", "value": value["value"]}
      return {"status": "exhausted", "reason": "retry_limit"}
