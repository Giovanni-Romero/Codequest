id: ai-structured-outputs-01
title: Declare the shape
track: ai-engineering
island: structured-outputs
order: 1
difficulty: moderate
tags: [ai-engineering, structured-outputs, schema]
xp: 30
concepts: [output-schema]
teaching:
  analogy: |
    A museum ticket lists the visitor name, date, and allowed gallery. A ticket that looks neat
    but has no date is still unusable.
  explanation: |
    A schema states the fields an output must contain and the type of each value. Required and
    optional fields are different rules. Allowed values add a business rule beyond JSON syntax.
    Validate the complete object before accepting it.
  worked_example: |
    ticket = {"name": "Ana", "zone": "blue"}
    required = {"name", "zone"}
    allowed = {"red", "blue"}
    print(required <= ticket.keys() and ticket["zone"] in allowed)
  key_points:
    - Check the container type because a list is not an output object.
    - Check primitive types explicitly because JSON syntax does not express your business rules.
    - Treat optional and nullable as separate choices.
brief: |
  Write `validate_card(card)`. Accept only a dictionary with exactly the required fields `name`
  and `count`, plus optional `status`. `name` must be a non-empty string; `count` must be a
  non-negative integer and not bool; `status` must be the string `"new"` or `"done"`. Return
  exactly `{"name": ..., "count": ..., "status": ...}`, defaulting status to `"new"`.
  Raise `ValueError` for a wrong container, primitive type, value, missing field, or extra field.
signature:
  entrypoint: validate_card
  stub: |
    def validate_card(card):
        # Turn a loose output into a complete application record.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [{name: Ada, count: 2}]
      expect: {name: Ada, count: 2, status: new}
    - args: [{name: Bob, count: 0, status: done}]
      expect: {name: Bob, count: 0, status: done}
  hidden:
    - args: [null]
      raises: ValueError
    - args: [{name: Ada, count: true}]
      raises: ValueError
    - args: [{name: Ada, count: -1}]
      raises: ValueError
    - args: [{name: Ada, count: 1, status: paused}]
      raises: ValueError
    - args: [{name: Ada, count: 1, extra: x}]
      raises: ValueError
    - args: [{name: Zed, count: 9, status: new}]
      expect: {name: Zed, count: 9, status: new}
hints:
  - {level: 1, text: "Which facts must be true before another function can use this record?"}
  - {level: 2, text: "Validate the dictionary, its exact keys, each primitive type, and the allowed status values."}
  - level: 3
    text: |
      For a library card, compare `set(card)` with the required and optional names, then use
      `isinstance(value, int) and not isinstance(value, bool)` for a page count.
solution: |
  def validate_card(card):
      if not isinstance(card, dict) or set(card) not in ({"name", "count"}, {"name", "count", "status"}):
          raise ValueError("invalid card shape")
      if not isinstance(card["name"], str) or not card["name"]:
          raise ValueError("name must be non-empty text")
      if not isinstance(card["count"], int) or isinstance(card["count"], bool) or card["count"] < 0:
          raise ValueError("count must be a non-negative integer")
      status = card.get("status", "new")
      if not isinstance(status, str) or status not in {"new", "done"}:
          raise ValueError("invalid status")
      return {"name": card["name"], "count": card["count"], "status": status}
