id: ai-evals-02
title: Measure capabilities
track: ai-engineering
island: evals
order: 2
difficulty: moderate
tags: [ai-engineering, evals, metrics]
xp: 30
concepts: [capability-metrics]
teaching:
  analogy: |
    A school report keeps math and reading marks separate, because one average cannot explain both skills.
  explanation: |
    A capability metric states how one slice of behavior is judged. Exact scalar equality must include type, so `True` is not the same answer as `1`. List containment is useful only when declared items are unique strings. Report each capability separately before computing any broader decision.
  worked_example: |
    expected = ["helmet", "lights"]
    actual = ["lights", "helmet", "bell"]
    print(all(item in actual for item in expected))
  key_points:
    - A metric belongs to a capability, not to an entire product by default.
    - Exact equality includes both value and type when the contract says so.
    - A score without its passed and total counts hides evidence.
brief: |
  Write `score_capabilities(cases, predictions, metrics)`. Cases have exact keys `case_id`,
  `capability`, and `expected`; IDs are unique non-empty strings. `predictions` maps every case
  ID to a value. `metrics` maps every capability to `exact` or `contains_all`. Exact accepts only
  scalar expected values and compares both type and value. `contains_all` accepts unique string
  lists and passes when every expected string is in the predicted unique-string list. Return a
  first-seen ordered list of `capability`, `metric`, `passed`, `total`, and `score`; reject bad data.
signature:
  entrypoint: score_capabilities
  stub: |
    def score_capabilities(cases, predictions, metrics):
        # Turn case results into per-capability evidence.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{case_id: a, capability: route, expected: north}, {case_id: b, capability: tags, expected: [safe, short]}], {a: north, b: [short, safe, extra]}, {route: exact, tags: contains_all}]
      expect: [{capability: route, metric: exact, passed: 1, total: 1, score: 1.0}, {capability: tags, metric: contains_all, passed: 1, total: 1, score: 1.0}]
    - args: [[{case_id: a, capability: route, expected: north}, {case_id: b, capability: route, expected: south}], {a: north, b: east}, {route: exact}]
      expect: [{capability: route, metric: exact, passed: 1, total: 2, score: 0.5}]
  hidden:
    - args: [[{case_id: a, capability: flag, expected: true}], {a: 1}, {flag: exact}]
      expect: [{capability: flag, metric: exact, passed: 0, total: 1, score: 0.0}]
    - args: [[], {}, {}]
      expect: []
    - args: [[{case_id: a, capability: route, expected: x}, {case_id: a, capability: route, expected: y}], {a: x}, {route: exact}]
      raises: ValueError
    - args: [[{case_id: a, capability: tags, expected: [x, x]}], {a: [x]}, {tags: contains_all}]
      raises: ValueError
    - args: [[{case_id: a, capability: route, expected: x}], {a: x}, {route: unknown}]
      raises: ValueError
    - args: [[{case_id: a, capability: route, expected: x}], {a: x}, {route: [exact]}]
      raises: ValueError
    - args: [[{case_id: a, capability: route, expected: [x]}], {a: [x]}, {route: exact}]
      raises: ValueError
hints:
  - {level: 1, text: "Which facts make one result comparable with the next result?"}
  - {level: 2, text: "Validate the complete contract, group by first-seen capability, then count each metric's passes."}
  - {level: 3, text: "For quiz answers, an exact check can be `type(given) is type(answer) and given == answer`."}
solution: |
  def score_capabilities(cases, predictions, metrics):
      if not isinstance(cases, list) or not isinstance(predictions, dict) or not isinstance(metrics, dict):
          raise ValueError("invalid container")
      seen_ids = set()
      order = []
      for case in cases:
          if not isinstance(case, dict) or set(case) != {"case_id", "capability", "expected"}:
              raise ValueError("invalid case")
          case_id, capability = case["case_id"], case["capability"]
          if not isinstance(case_id, str) or not case_id or not isinstance(capability, str) or not capability or case_id in seen_ids or case_id not in predictions or capability not in metrics or not isinstance(metrics[capability], str) or metrics[capability] not in {"exact", "contains_all"}:
              raise ValueError("invalid contract")
          seen_ids.add(case_id)
          if capability not in order:
              order.append(capability)
          expected, predicted = case["expected"], predictions[case_id]
          if metrics[capability] == "exact":
              if isinstance(expected, (list, dict, set)) or isinstance(predicted, (list, dict, set)):
                  raise ValueError("exact expects scalar")
          else:
              if not isinstance(expected, list) or not isinstance(predicted, list) or any(not isinstance(value, str) for value in expected + predicted) or len(set(expected)) != len(expected) or len(set(predicted)) != len(predicted):
                  raise ValueError("invalid list metric")
      if set(predictions) != seen_ids or set(metrics) != set(order):
          raise ValueError("unexpected mapping")
      result = []
      for capability in order:
          selected = [case for case in cases if case["capability"] == capability]
          metric = metrics[capability]
          passed = sum((type(predictions[case["case_id"]]) is type(case["expected"]) and predictions[case["case_id"]] == case["expected"]) if metric == "exact" else all(value in predictions[case["case_id"]] for value in case["expected"]) for case in selected)
          total = len(selected)
          result.append({"capability": capability, "metric": metric, "passed": passed, "total": total, "score": passed / total})
      return result
