constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: [[1, 2, 3], "double"]
      expect: [2, 4, 6]
    - args: [[1, 2, 3], "square"]
      expect: [1, 4, 9]
  hidden:
    - args: [[1, 2, 3], "negate"]
      expect: [-1, -2, -3]
    - args: [[1, 2, 3], "hoist"]
      expect: [1, 2, 3]
    - args: [[], "double"]
      expect: []
    - args: [[], "nonsense"]
      expect: []
    - args: [[0], "negate"]
      expect: [0]
    - args: [[-4], "square"]
      expect: [16]
    - args: [[5], "double"]
      expect: [10]

hints:
  - level: 1
    text: |
      Se você escrevesse {"double": double(n)} no seu dicionário, o que estaria de fato
      guardado nele - e você ainda poderia escolher rodá-lo depois? O que muda se você
      deixar os parênteses de fora?
  - level: 2
    text: |
      Faça um dicionário cujos valores são os três nomes de função sem parênteses. Use
      .get para procurar a manobra; se voltar None, retorne uma cópia dos números. Caso
      contrário percorra os números, chame a função encontrada em cada um, e junte os
      resultados.
  - level: 3
    text: |
      Procurar e aplicar, num livro diferente:

          tratador = ACOES.get(comando)
          if tratador is None:
              return list(valores)
          resultado = []
          for valor in valores:
              resultado.append(tratador(valor))
          return resultado

      A sua monta o livro a partir de três manobras que você mesmo escreveu logo acima.

solution: |
  def double(n):
      return n * 2


  def square(n):
      return n * n


  def negate(n):
      return -n


  def run_drill(numbers, drill):
      book = {"double": double, "square": square, "negate": negate}

      handler = book.get(drill)
      if handler is None:
          return list(numbers)

      result = []
      for number in numbers:
          result.append(handler(number))
      return result
