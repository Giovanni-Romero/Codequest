# Missao 11 de Colecoes. Missao de alivio, julgamento invertido da missao 10.
# Reforca: list-comprehension, indexing-and-slicing, nested-structures, when-not-to-comprehend.
# Schema reference: docs/mission-schema.md

id: py-collections-11
title: O relatório legível
track: python
island: collections
order: 11
difficulty: simple
tags: [list-comprehension, readability]
xp: 20

concepts:
  - list-comprehension
  - indexing-and-slicing
  - nested-structures
  - when-not-to-comprehend

teaching:
  analogy: |
    Nem todo nó precisa ser chique. Às vezes o laço mais simples segura a linha
    perfeitamente bem, e usar algo elaborado seria só se exibir. Este é um desses - uma
    troca direta e plana de uma coisa por outra, exatamente para o que uma comprehension
    foi feita.

  explanation: |
    O julgamento da missão anterior corta nos dois sentidos. Uma comprehension que
    retira um valor de cada item, sem laço aninhado e sem condição escondida, geralmente
    é a opção mais legível, não a menos - é a forma que esta missão te dá.

    A regra nunca foi "evite comprehensions". Foi "leia o que você escreveu e pergunte
    se ainda está claro". Aqui, está.

  worked_example: |
    # Retirando so os emails de uma lista de contatos, nao nomes de caixotes
    contatos = [{"name": "Ana", "email": "a@ship.io"}, {"name": "Bo", "email": "b@ship.io"}]
    emails = [contato["email"] for contato in contatos]
    print(emails)      # ['a@ship.io', 'b@ship.io']

  key_points:
    - Uma comprehension plana - um laço, uma expressão, nada aninhado dentro - geralmente é a escolha legível.
    - A diferença da missão anterior é forma - um nível de acesso aqui, dois aninhados lá.
    - Retirar um campo de uma lista de dicionários é um dos usos mais comuns de comprehension que existe.
    - Uma fatia se combina bem com uma comprehension - corte primeiro ou filtre o resultado, o que ler mais claro para você.

brief: |
  Escreva uma função chamada crate_names que recebe a lista completa de dicionários de
  caixote (cada um com um "name" e um "weight") e quantos nomes retornar, e retorna só
  os nomes dos primeiros dessa quantidade de caixotes, em ordem, como uma lista.

  Esse é um bom encaixe para uma única comprehension sobre uma fatia da lista - uma
  transformação plana, sem laço aninhado, sem condição escondida. Não há ferramenta
  errada aqui, só a que lê com mais clareza - um laço também seria uma escolha
  perfeitamente válida.

signature:
  entrypoint: crate_names
  stub: |
    def crate_names(crates, count):
        # Pegue os primeiros "count" caixotes, depois retire so seus nomes.
        # seu codigo aqui
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args:
        - [{"name": "rope", "weight": 1}, {"name": "salt", "weight": 2}, {"name": "nails", "weight": 3}]
        - 2
      expect: ["rope", "salt"]
    - args:
        - [{"name": "solo", "weight": 9}]
        - 5
      expect: ["solo"]
  hidden:
    - args: [[], 3]
      expect: []
    - args:
        - [{"name": "a", "weight": 0}, {"name": "b", "weight": 0}]
        - 0
      expect: []
    - args:
        - [{"name": "x", "weight": 1}, {"name": "y", "weight": 1}, {"name": "z", "weight": 1}]
        - 1
      expect: ["x"]
    - args:
        - [{"name": "p", "weight": 1}, {"name": "q", "weight": 1}, {"name": "r", "weight": 1}, {"name": "s", "weight": 1}]
        - 3
      expect: ["p", "q", "r"]

hints:
  - level: 1
    text: |
      Quantos níveis você precisa alcançar dentro de cada item para pegar o que precisa?
      Compare com a missão anterior. E como você mantém só os primeiros itens de uma
      lista com segurança - que ferramenta da segunda missão desta ilha faz isso?
  - level: 2
    text: |
      Corte a lista para os primeiros count itens, depois use uma comprehension para
      retirar o campo "name" de cada um.
  - level: 3
    text: |
      Mesma forma, retirando idades dos primeiros passageiros de uma lista de embarque:

          idades = [passageiro["age"] for passageiro in passageiros[:limite]]

      A sua retira um campo diferente, de caixotes em vez de passageiros.

solution: |
  def crate_names(crates, count):
      return [crate["name"] for crate in crates[:count]]
