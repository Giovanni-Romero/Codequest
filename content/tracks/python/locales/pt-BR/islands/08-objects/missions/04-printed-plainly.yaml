constraints:
  forbidden_imports: [dataclasses]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["rope", ["coil", "coil"], "rope", ["coil", "coil"]]
      expect: {label: "Crate('rope', 2 items)", same: true, size: 2}
    - args: ["rope", ["coil"], "sail", ["coil"]]
      expect: {label: "Crate('rope', 1 items)", same: false, size: 1}
  hidden:
    # Caixote vazio. A etiqueta ainda reporta uma contagem e o len é 0, não ausente.
    - args: ["rope", [], "rope", []]
      expect: {label: "Crate('rope', 0 items)", same: true, size: 0}
    # Mesmo nome, conteúdo diferente. As duas metades do __eq__ têm de ser checadas.
    - args: ["rope", ["coil"], "rope", ["coil", "coil"]]
      expect: {label: "Crate('rope', 1 items)", same: false, size: 1}
    # Mesmo conteúdo, outra ordem. Listas comparam em ordem, então não é o mesmo caixote.
    - args: ["rope", ["a", "b"], "rope", ["b", "a"]]
      expect: {label: "Crate('rope', 2 items)", same: false, size: 2}
    # Um nome vazio é um nome, e continua ganhando as aspas dele.
    - args: ["", ["coil"], "", ["coil"]]
      expect: {label: "Crate('', 1 items)", same: true, size: 1}
    # Um nome que contém uma aspa. É por isso que o !r existe em vez do str().
    - args: ["o'brien", [], "o'brien", []]
      expect: {label: "Crate(\"o'brien\", 0 items)", same: true, size: 0}
    # O primeiro caixote está vazio e o segundo não. `size` reporta o primeiro, sempre.
    - args: ["rope", [], "sail", ["coil", "coil", "coil"]]
      expect: {label: "Crate('rope', 0 items)", same: false, size: 0}

hints:
  - level: 1
    text: |
      `repr(caixote)`, `caixote_a == caixote_b` e `len(caixote)` são três chamadas que você
      já sabe escrever. O que tem de existir na classe antes de cada uma delas dar uma
      resposta útil em vez de um endereço, um False, ou um TypeError?
  - level: 2
    text: |
      `__repr__` é um `return` só, com uma f-string dentro. A contagem dentro dessa string é
      o número de itens - o mesmo número que `__len__` devolve, então você pode chamar
      `len(self.items)` nos dois lugares.

      `__eq__` recebe `self` e `other` e devolve uma expressão booleana ligada por `and`.
      `__len__` recebe só `self`.

      Depois o `inspect_pair` constrói os dois caixotes e chama as três funções embutidas.
  - level: 3
    text: |
      Os mesmos três, numa sacola de compras:

          class Bag:
              def __init__(self, shop, goods):
                  self.shop = shop
                  self.goods = goods

              def __repr__(self):
                  return f"Bag({self.shop!r}, {len(self.goods)} things)"

              def __eq__(self, other):
                  return self.shop == other.shop and self.goods == other.goods

              def __len__(self):
                  return len(self.goods)


          def compare(shop_a, goods_a, shop_b, goods_b):
              primeira = Bag(shop_a, goods_a)
              segunda = Bag(shop_b, goods_b)
              return {"text": repr(primeira), "match": primeira == segunda, "count": len(primeira)}

      A sua diz `items` onde esta diz `things`, e as chaves do dicionário são outras.

solution: |
  class Crate:
      def __init__(self, name, items):
          self.name = name
          self.items = items

      def __repr__(self):
          return f"Crate({self.name!r}, {len(self.items)} items)"

      def __eq__(self, other):
          return self.name == other.name and self.items == other.items

      def __len__(self):
          return len(self.items)


  def inspect_pair(name_a, items_a, name_b, items_b):
      first = Crate(name_a, items_a)
      second = Crate(name_b, items_b)

      return {
          "label": repr(first),
          "same": first == second,
          "size": len(first),
      }
