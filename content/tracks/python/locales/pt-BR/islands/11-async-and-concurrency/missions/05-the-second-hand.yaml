tests:
  visible:
    - args: [[30, 10, 20]]
      expect:
        results: ["waited 30ms", "waited 10ms", "waited 20ms"]
        threads: 3
        longest_ms: 30
    - args: [[40]]
      expect:
        results: ["waited 40ms"]
        threads: 1
        longest_ms: 40
  hidden:
    # Nenhuma thread. O laço de join roda zero vezes e `max` levantaria erro sem o default.
    - args: [[]]
      expect:
        results: []
        threads: 0
        longest_ms: 0
    # Duas esperas idênticas. Coletado por chegada isso seria cara ou coroa; por posição, não.
    - args: [[10, 10]]
      expect:
        results: ["waited 10ms", "waited 10ms"]
        threads: 2
        longest_ms: 10
    - args: [[5, 25, 15]]
      expect:
        results: ["waited 5ms", "waited 25ms", "waited 15ms"]
        threads: 3
        longest_ms: 25
    # Um sono de tamanho zero ainda inicia, roda e é juntado como qualquer outra thread.
    - args: [[0, 20]]
      expect:
        results: ["waited 0ms", "waited 20ms"]
        threads: 2
        longest_ms: 20
    # Três iguais. Em sequência isso seria 60ms; sobreposto é 20.
    - args: [[20, 20, 20]]
      expect:
        results: ["waited 20ms", "waited 20ms", "waited 20ms"]
        threads: 3
        longest_ms: 20

hints:
  - level: 1
    text: |
      Uma thread não consegue te entregar o valor de retorno dela. Onde ela põe a resposta
      então, para a função conseguir ler depois do join?

      E o que há de errado com `results.append(...)` dentro da thread, dado que dois dos
      casos de teste têm durações idênticas?
  - level: 2
    text: |
      `results = [None] * len(waits)` antes de tudo começar. Toda posição já está reservada.

      O trabalhador recebe o número da posição além da duração:

          def run(index, ms):
              time.sleep(ms / 1000)
              results[index] = f"waited {ms}ms"

      Construa as threads com `enumerate(waits)`, dê `start()` em cada uma conforme cria e
      guarde numa lista. Depois um segundo laço sobre essa lista chamando `join()`. Dois
      laços, não um — um `join` dentro do primeiro laço espera cada thread antes de iniciar
      a próxima, e você voltou para a missão 1.

      `max(waits, default=0)` resolve o caso vazio numa chamada só.
  - level: 3
    text: |
      O mesmo formato, com os dois laços mantidos separados:

          import threading
          import time


          def stamp(letters):
              marks = [None] * len(letters)

              def press(slot, letter):
                  time.sleep(letter["ms"] / 1000)
                  marks[slot] = letter["id"] + "-stamped"

              crew = []
              for slot, letter in enumerate(letters):
                  hand = threading.Thread(target=press, args=(slot, letter))
                  crew.append(hand)
                  hand.start()

              for hand in crew:
                  hand.join()

              return {"marks": marks, "hands": len(crew)}

      A sua trabalha com números simples em vez de dicts, e tem uma terceira chave que não
      precisa de thread nenhuma.

solution: |
  import threading
  import time


  def second_hand(waits):
      results = [None] * len(waits)

      def run(index, ms):
          time.sleep(ms / 1000)
          results[index] = f"waited {ms}ms"

      threads = []
      for index, ms in enumerate(waits):
          thread = threading.Thread(target=run, args=(index, ms))
          threads.append(thread)
          thread.start()

      for thread in threads:
          thread.join()

      return {
          "results": results,
          "threads": len(waits),
          "longest_ms": max(waits, default=0),
      }
