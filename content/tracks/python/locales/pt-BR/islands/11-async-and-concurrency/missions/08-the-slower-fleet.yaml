tests:
  visible:
    # Dez cálculos minúsculos. Duzentos microssegundos de trabalho, cinco mil de custo.
    # Este é o argumento inteiro da missão num caso só.
    - args:
        [
          [
            {name: j0, us: 20, kind: compute},
            {name: j1, us: 20, kind: compute},
            {name: j2, us: 20, kind: compute},
            {name: j3, us: 20, kind: compute},
            {name: j4, us: 20, kind: compute},
            {name: j5, us: 20, kind: compute},
            {name: j6, us: 20, kind: compute},
            {name: j7, us: 20, kind: compute},
            {name: j8, us: 20, kind: compute},
            {name: j9, us: 20, kind: compute},
          ],
          500,
        ]
      expect:
        sequential_us: 200
        concurrent_us: 5200
        difference_us: -5000
        choice: sequential
    # Três chamadas de rede de verdade. Agora o custo é ruído e a concorrência é a resposta.
    - args:
        [
          [
            {name: a, us: 100000, kind: wait},
            {name: b, us: 100000, kind: wait},
            {name: c, us: 100000, kind: wait},
          ],
          500,
        ]
      expect:
        sequential_us: 300000
        concurrent_us: 101500
        difference_us: 198500
        choice: concurrent
  hidden:
    # Nenhum trabalho. Os dois totais são 0, a diferença é 0, e empate fica com o laço.
    - args: [[], 500]
      expect:
        sequential_us: 0
        concurrent_us: 0
        difference_us: 0
        choice: sequential
    # Uma espera só. Não há nada com que sobrepô-la, então o ramo é perda pura —
    # e este é o caso que as pessoas erram com mais frequência.
    - args: [[{name: solo, us: 5000, kind: wait}], 500]
      expect:
        sequential_us: 5000
        concurrent_us: 5500
        difference_us: -500
        choice: sequential
    - args: [[{name: solo, us: 500, kind: wait}], 500]
      expect:
        sequential_us: 500
        concurrent_us: 1000
        difference_us: -500
        choice: sequential
    # Misturado, e perde por dois mil. O trabalho de cálculo não pode ser sobreposto, então
    # tudo o que a concorrência comprou foi uma espera que já ia acontecer.
    - args: [[{name: net, us: 80000, kind: wait}, {name: hash, us: 40000, kind: compute}], 1000]
      expect:
        sequential_us: 120000
        concurrent_us: 122000
        difference_us: -2000
        choice: sequential
    # Seis esperas minúsculas. Espera se sobrepõe e mesmo assim perde, porque mal havia espera.
    - args:
        [
          [
            {name: t0, us: 30, kind: wait},
            {name: t1, us: 30, kind: wait},
            {name: t2, us: 30, kind: wait},
            {name: t3, us: 30, kind: wait},
            {name: t4, us: 30, kind: wait},
            {name: t5, us: 30, kind: wait},
          ],
          200,
        ]
      expect:
        sequential_us: 180
        concurrent_us: 1230
        difference_us: -1050
        choice: sequential
    # Ramos de graça. Sem custo a concorrência não consegue perder na espera — que é o jeito
    # mais limpo de ver que o custo é o argumento inteiro.
    - args: [[{name: a, us: 50000, kind: wait}, {name: b, us: 50000, kind: wait}], 0]
      expect:
        sequential_us: 100000
        concurrent_us: 50000
        difference_us: 50000
        choice: concurrent

hints:
  - level: 1
    text: |
      Nada roda nesta missão. Todo número vem da fórmula de três termos do enunciado.

      O termo que pega as pessoas: o custo é multiplicado por **todos** os trabalhos, não só
      pelos que esperam. Um ramo custa o mesmo tendo sido uma boa ideia ou não.
  - level: 2
    text: |
      `sequential_us` é um `sum` com uma expressão geradora sobre `job["us"]`.

      Para o outro, separe os trabalhos em duas listas de durações — as esperas e os
      cálculos — com duas compreensões filtrando por `job["kind"]`.

      Depois: `len(jobs) * overhead_us + max(waits, default=0) + sum(computes)`. O
      `default=0` é o que impede `max` de levantar erro quando não há espera nenhuma.

      `choice` é uma expressão condicional só, e a comparação é `<` estrito.
  - level: 3
    text: |
      O mesmo formato de três termos, escolhendo entre um forno e vários:

          def bake(trays, oven_setup):
              one_oven = sum(tray["minutes"] for tray in trays)

              proving = [t["minutes"] for t in trays if t["stage"] == "prove"]
              kneading = [t["minutes"] for t in trays if t["stage"] == "knead"]
              many_ovens = len(trays) * oven_setup + max(proving, default=0) + sum(kneading)

              return {
                  "one": one_oven,
                  "many": many_ovens,
                  "pick": "many" if many_ovens < one_oven else "one",
              }


          print(bake([{"minutes": 60, "stage": "prove"},
                      {"minutes": 60, "stage": "prove"}], 5))
          # {'one': 120, 'many': 70, 'pick': 'many'}

      Fermentar se sobrepõe, sovar não, e todo forno custa o mesmo para acender. A sua tem
      uma chave a mais: a diferença entre os dois totais, nessa ordem.

solution: |
  def fleet(jobs, overhead_us):
      sequential_us = sum(job["us"] for job in jobs)

      waits = [job["us"] for job in jobs if job["kind"] == "wait"]
      computes = [job["us"] for job in jobs if job["kind"] == "compute"]

      concurrent_us = len(jobs) * overhead_us + max(waits, default=0) + sum(computes)
      difference_us = sequential_us - concurrent_us

      choice = "concurrent" if concurrent_us < sequential_us else "sequential"

      return {
          "sequential_us": sequential_us,
          "concurrent_us": concurrent_us,
          "difference_us": difference_us,
          "choice": choice,
      }
