# Missão 6 de Async e Concorrência. Não introduz nada.
# Reforça: threads, gather, blocking-vs-nonblocking.
#
# Missão de alívio, e o caso de honestidade desta ilha. Em CPython um `counter += 1` sem
# lock num laço curto quase sempre produz o total certo, porque o interpretador raramente
# troca de thread no meio do comando nesses tamanhos. Ou seja: a versão errada passa no teste.
#
# O enunciado diz isso em voz alta. Precedente: a regra da honestidade da Ilha 8 e a missão
# 1 da Ilha 10, onde `values.index()` num try também teria passado. Um jogo que fingisse
# detectar a falta do lock estaria mentindo, e "quase sempre certo" é exatamente o formato
# do bug sendo ensinado - um teste que ficasse verde na versão sem lock estaria
# *reproduzindo* o bug em vez de pegá-lo.
#
# Sem sonos: threads mais um lock, nada a esperar.
# Referência do schema: docs/mission-schema.md

id: py-async-06
title: A contagem compartilhada
track: python
island: async-and-concurrency
order: 6
difficulty: challenging
tags: [async, threads, locks, relief]
xp: 45

concepts:
  - threads

teaching:
  analogy: |
    Uma folha de contagem na parede e quatro pessoas contando engradados.

    Cada uma faz as mesmas três coisas sem parar: lê o número na folha, soma um de cabeça,
    escreve o número novo de volta.

    Agora imagine duas delas lendo "41" no mesmo instante. As duas pensam "42". As duas
    escrevem "42". Passaram dois engradados e a folha avançou um.

    Ninguém errou. Cada um dos três passos foi feito corretamente. O bug é que eles puderam
    se sobrepor, e a correção é uma regra que ninguém pode quebrar: quem está na folha
    segura a caneta, e todo o resto espera por ela.

  explanation: |
    Threads compartilham memória. É isso que as torna úteis e é isso que as torna perigosas.

    `counter = counter + 1` parece uma coisa e são três: ler, somar, guardar. Uma thread pode
    ser interrompida entre quaisquer duas delas, e se uma segunda thread ler antes de a
    primeira ter guardado, um dos incrementos some. Isso é uma **condição de corrida**, e a
    assinatura dela é que a resposta fica errada *às vezes*.

    Um **`threading.Lock`** é uma ficha que só uma thread pode segurar:

        lock = threading.Lock()

        with lock:
            counter = counter + 1

    Quem chegar em segundo espera no `with` até o primeiro sair. Os três passos viram uma
    coisa indivisível — *atômica* é a palavra — e a contagem fica certa toda vez.

    Dois custos, e são o motivo de você não simplesmente trancar tudo:

    - **Um lock serializa o que ele cobre.** O código dentro do lock roda uma thread por
      vez. Segure-o durante uma operação lenta e você escreveu um programa sequencial que
      ainda paga por threads.
    - **Dois locks tomados em ordens diferentes travam.** A thread A segura um e quer o
      outro; a thread B segura o outro e quer o primeiro. As duas esperam para sempre.

    Agora a parte honesta, e leia duas vezes.

    **Em CPython, a versão desta missão sem o lock normalmente vai dar a resposta certa do
    mesmo jeito.** O interpretador roda um trecho de bytecode antes de considerar trocar de
    thread, e nesses tamanhos a troca raramente cai no meio do incremento. O teste não
    consegue distinguir as duas versões, e não está fingindo que consegue.

    Isso não é motivo para pular o lock — é o motivo de o bug ser famoso. Código certo em
    teste, certo em desenvolvimento, e errado uma vez por semana em produção sob carga é o
    pior tipo que existe. Escreva o lock porque a correção não deve vir da sorte.

  worked_example: |
    # Uma lista compartilhada em vez de um contador, protegida do mesmo jeito
    import threading


    def gather_names(crews):
        lock = threading.Lock()
        roll = []

        def sign(crew):
            for name in crew:
                with lock:
                    roll.append(name.upper())

        hands = [threading.Thread(target=sign, args=(crew,)) for crew in crews]
        for hand in hands:
            hand.start()
        for hand in hands:
            hand.join()

        return len(roll)


    print(gather_names([["ana", "bo"], ["cy"]]))     # 3
    # A ordem de `roll` é não determinística. O tamanho dela não é, e é isso que é lido.

  key_points:
    - "`counter = counter + 1` são três operações. Uma thread pode ser interrompida entre quaisquer duas delas, e um incremento some."
    - "Um `Lock` usado com `with` torna um bloco atômico: uma thread lá dentro por vez, todo o resto espera."
    - "Um lock serializa o que ele cobre. Segurá-lo durante trabalho lento te dá um programa sequencial que ainda paga por threads."
    - "Dois locks tomados em ordens diferentes por duas threads travam. Tome sempre na mesma ordem."
    - "Em CPython a versão sem lock normalmente passa do mesmo jeito. 'Normalmente' é o bug — correção que vem da sorte é a que falha em produção."

brief: |
  Conte engradados de quatro lados ao mesmo tempo, e acerte o número.

  Escreva uma função chamada shared_tally que recebe um número de `workers` e um número de
  `steps`, e devolve:

      {"total": ..., "expected": ..., "safe": ...}

  Inicie `workers` threads. Cada uma incrementa um **único contador compartilhado** `steps`
  vezes, e todo incremento acontece dentro de um `threading.Lock`.

  Inicie todas, junte todas, depois leia o contador.

  `total` é o valor final do contador. `expected` é `workers * steps`. `safe` é se os dois
  são iguais — um booleano simples, que com um lock correto é sempre `True`.

  `workers` igual a 0 dá total 0. `steps` igual a 0 também.

  Sendo franco com você: nesses tamanhos a versão **sem** o lock quase certamente também
  produz o total certo, e esta missão não consegue notar a diferença. Isso não é uma
  brecha, é a lição. Uma condição de corrida que aparece uma vez a cada dez mil execuções
  ainda te custa uma noite, e o motivo de escrever o lock é que a correção não deveria
  depender do interpretador estar de bom humor.

  Importe `threading` você mesmo.

signature:
  entrypoint: shared_tally
  stub: |
    def shared_tally(workers, steps):
        # Um contador, um lock, `workers` threads disputando os dois.
        # seu código aqui
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: [4, 250]
      expect:
        total: 1000
        expected: 1000
        safe: true
    - args: [1, 10]
      expect:
        total: 10
        expected: 10
        safe: true
  hidden:
    # Nenhum trabalhador. Nada inicia, nada é juntado, e o contador nunca se move.
    - args: [0, 100]
      expect:
        total: 0
        expected: 0
        safe: true
    # Trabalhadores sem nada a fazer. Três threads iniciam e terminam na hora.
    - args: [3, 0]
      expect:
        total: 0
        expected: 0
        safe: true
    # Oito threads e quatro mil incrementos — o caso com mais chance de perder um.
    - args: [8, 500]
      expect:
        total: 4000
        expected: 4000
        safe: true
    - args: [2, 1]
      expect:
        total: 2
        expected: 2
        safe: true
    - args: [5, 200]
      expect:
        total: 1000
        expected: 1000
        safe: true

hints:
  - level: 1
    text: |
      O contador tem de ser uma coisa só que toda thread enxerga. Um `counter = 0` na função
      externa, reatribuído dentro da interna, não é isso — reatribuir um nome dentro de uma
      função aninhada cria um *novo local* e o externo nunca muda.

      Duas saídas. Quais são?
  - level: 2
    text: |
      Ou declare `nonlocal counter` no topo do trabalhador, ou mantenha a contagem dentro de
      um container mutável — `tally = {"count": 0}` — e altere esse. O container não precisa
      de palavra-chave e é o estilo mais comum.

      Então:

          lock = threading.Lock()

          def run():
              for _ in range(steps):
                  with lock:
                      tally["count"] = tally["count"] + 1

      Construa `workers` threads com `threading.Thread(target=run)`, inicie todas num laço,
      junte todas num segundo laço, e leia `tally["count"]` depois.

      Note que não há argumento nenhum a passar: toda thread roda o mesmo serviço.
  - level: 3
    text: |
      O mesmo lock, protegendo um máximo compartilhado em vez de uma soma:

          import threading


          def deepest(crews, casts):
              lock = threading.Lock()
              best = {"depth": 0}

              def sound():
                  for cast in range(casts):
                      with lock:
                          if cast > best["depth"]:
                              best["depth"] = cast

              hands = [threading.Thread(target=sound) for _ in range(crews)]
              for hand in hands:
                  hand.start()
              for hand in hands:
                  hand.join()

              return best["depth"]


          print(deepest(3, 5))     # 4

      A sua soma em vez de comparar, e informa dois números a mais junto da resposta.

solution: |
  import threading


  def shared_tally(workers, steps):
      lock = threading.Lock()
      tally = {"count": 0}

      def run():
          for _ in range(steps):
              with lock:
                  tally["count"] = tally["count"] + 1

      threads = [threading.Thread(target=run) for _ in range(workers)]

      for thread in threads:
          thread.start()

      for thread in threads:
          thread.join()

      expected = workers * steps
      return {
          "total": tally["count"],
          "expected": expected,
          "safe": tally["count"] == expected,
      }
