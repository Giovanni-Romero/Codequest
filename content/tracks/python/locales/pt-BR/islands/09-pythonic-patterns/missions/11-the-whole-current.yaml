constraints:
  forbidden_builtins: [list, range, map]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["harbour", 100, 3]
      expect:
        log: ["open harbour", "shut harbour"]
        lines: ["1: 303", "2: 306", "3: 309"]
        calls: 3
        name: measure
    - args: ["harbour", 0, 2]
      expect:
        log: ["open harbour", "shut harbour"]
        lines: ["1: 3", "2: 6"]
        calls: 2
        name: measure
  hidden:
    # Nada pedido. O portão ainda abre e fecha, e o measure nunca é chamado.
    - args: ["harbour", 100, 0]
      expect:
        log: ["open harbour", "shut harbour"]
        lines: []
        calls: 0
        name: measure
    # Um pedido, e é o primeiro valor além do limiar, não o próprio limiar.
    - args: ["north", 10, 1]
      expect:
        log: ["open north", "shut north"]
        lines: ["1: 33"]
        calls: 1
        name: measure
    # Estritamente maior: 5 não passa contra um limiar de 5.
    - args: ["north", 5, 2]
      expect:
        log: ["open north", "shut north"]
        lines: ["1: 18", "2: 21"]
        calls: 2
        name: measure
    # Um limiar bem lá longe, então o filtro preguiçoso realmente tem de caminhar até ele.
    - args: ["deep", 10000, 2]
      expect:
        log: ["open deep", "shut deep"]
        lines: ["1: 30003", "2: 30006"]
        calls: 2
        name: measure
    # Um nome vazio ainda monta as duas linhas do log.
    - args: ["", 0, 1]
      expect:
        log: ["open ", "shut "]
        lines: ["1: 3"]
        calls: 1
        name: measure
    # Mais longo, para que a numeração, a triplicação e a contagem façam cada uma o seu papel.
    - args: ["long", 0, 6]
      expect:
        log: ["open long", "shut long"]
        lines: ["1: 3", "2: 6", "3: 9", "4: 12", "5: 15", "6: 18"]
        calls: 6
        name: measure

hints:
  - level: 1
    text: |
      Descubra a ordem das operações antes de escrever qualquer coisa. O que acontece primeiro -
      filtrar, pegar, triplicar ou numerar? Duas dessas quatro podem trocar de lugar sem mudar a
      resposta, e duas não podem.

      Depois confira a fonte: o que para o `current()` se nada no seu código parar?
  - level: 2
    text: |
      Quatro peças, e três delas são copiadas das missões 6 a 10 com outras palavras.

      Dentro do bloco: monte o gerador filtrado com parênteses, e depois um `while count > 0`
      puxando com `next` - ou um `for` com `break`. Chame `measure` em cada valor que puxar,
      mantenha o seu próprio contador de posição começando em 1, e dê append da string.

      `measure.calls` é lido depois do bloco, e já vai estar certo porque o envoltório esteve
      contando o tempo todo.
  - level: 3
    text: |
      Cada peça disto existe numa missão anterior desta ilha. Abra o painel da missão 8 para o
      decorador, o da missão 10 para o `@contextmanager`, e o da missão 7 para o filtro sobre
      uma fonte sem fim.

      A única pergunta de montagem é onde o `measure` é chamado, e a resposta é o mesmo lugar em
      que a string é montada:

          linha = f"{posicao}: {measure(valor)}"

      A sua precisa que a posição avance, e que o filtro tenha rodado antes de tudo isso.

solution: |
  from contextlib import contextmanager
  from functools import wraps


  def tallied(func):
      @wraps(func)
      def wrapper(*args, **kwargs):
          wrapper.calls = wrapper.calls + 1
          return func(*args, **kwargs)

      wrapper.calls = 0
      return wrapper


  @contextmanager
  def gate(log, name):
      log.append(f"open {name}")
      try:
          yield log
      finally:
          log.append(f"shut {name}")


  def current():
      value = 1
      while True:
          yield value
          value = value + 1


  @tallied
  def measure(value):
      return value * 3


  def survey(name, threshold, count):
      log = []
      lines = []

      with gate(log, name):
          strong = (value for value in current() if value > threshold)

          position = 1
          while count > 0:
              value = next(strong)
              lines.append(f"{position}: {measure(value)}")
              position = position + 1
              count = count - 1

      return {
          "log": log,
          "lines": lines,
          "calls": measure.calls,
          "name": measure.__name__,
      }
