    def negate(n):
        # your code here
        pass


    def run_drill(numbers, drill):
        # Build the book, look the drill up, then apply it to every number.
        # your code here
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: [[1, 2, 3], "double"]
      expect: [2, 4, 6]
    - args: [[1, 2, 3], "square"]
      expect: [1, 4, 9]
  hidden:
    - args: [[1, 2, 3], "negate"]
      expect: [-1, -2, -3]
    - args: [[1, 2, 3], "hoist"]
      expect: [1, 2, 3]
    - args: [[], "double"]
      expect: []
    - args: [[], "nonsense"]
      expect: []
    - args: [[0], "negate"]
      expect: [0]
    - args: [[-4], "square"]
      expect: [16]
    - args: [[5], "double"]
      expect: [10]

hints:
  - level: 1
    text: |
      If you wrote {"double": double(n)} in your dictionary, what would actually be
      stored in it - and could you still choose to run it later? What changes if you
      leave the parentheses off?
  - level: 2
    text: |
      Make a dictionary whose values are the three function names with no parentheses.
      Use .get to look up the drill; if it comes back None, return a copy of the numbers.
      Otherwise loop over the numbers, call the looked-up function on each, and collect
      the results.
  - level: 3
    text: |
      Looking up and applying, in a different book:

          handler = ACTIONS.get(command)
          if handler is None:
              return list(values)
          result = []
          for value in values:
              result.append(handler(value))
          return result

      Yours builds its book from three drills you wrote yourself just above it.

solution: |
  def double(n):
      return n * 2


  def square(n):
      return n * n


  def negate(n):
      return -n


  def run_drill(numbers, drill):
      book = {"double": double, "square": square, "negate": negate}

      handler = book.get(drill)
      if handler is None:
          return list(numbers)

      result = []
      for number in numbers:
          result.append(handler(number))
      return result
