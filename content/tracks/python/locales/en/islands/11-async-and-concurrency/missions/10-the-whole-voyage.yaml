tests:
  visible:
    - args: [[30, 10, 20], [100, 5], 500]
      expect:
        results: ["waited 30ms", "waited 10ms", "waited 20ms"]
        finished: [10, 20, 30]
        sums: [4950, 10]
        sequential_us: 60000
        concurrent_us: 31500
        choice: concurrent
    # One wait. There is nothing to overlap it with, so the branch loses by its own cost.
    - args: [[15], [10], 500]
      expect:
        results: ["waited 15ms"]
        finished: [15]
        sums: [45]
        sequential_us: 15000
        concurrent_us: 15500
        choice: sequential
  hidden:
    # Nothing at all. An empty gather returns an empty list and a tie goes to the loop.
    - args: [[], [], 500]
      expect:
        results: []
        finished: []
        sums: []
        sequential_us: 0
        concurrent_us: 0
        choice: sequential
    - args: [[40, 20], [], 1000]
      expect:
        results: ["waited 40ms", "waited 20ms"]
        finished: [20, 40]
        sums: []
        sequential_us: 60000
        concurrent_us: 42000
        choice: concurrent
    # Computing only. No waiting means nothing to overlap, and the verdict says so.
    - args: [[], [50], 500]
      expect:
        results: []
        finished: []
        sums: [1225]
        sequential_us: 0
        concurrent_us: 0
        choice: sequential
    # A compute of size 0 still gets a thread, and that thread still has to be joined.
    - args: [[10, 30, 50], [0], 200]
      expect:
        results: ["waited 10ms", "waited 30ms", "waited 50ms"]
        finished: [10, 30, 50]
        sums: [0]
        sequential_us: 90000
        concurrent_us: 50600
        choice: concurrent
    # An absurd overhead. The waiting is real and concurrency still loses, which is the
    # island's last word: the numbers decide, not the tool.
    - args: [[25], [], 30000]
      expect:
        results: ["waited 25ms"]
        finished: [25]
        sums: []
        sequential_us: 25000
        concurrent_us: 55000
        choice: sequential
    - args: [[50, 10], [1000, 2000, 3000], 100]
      expect:
        results: ["waited 50ms", "waited 10ms"]
        finished: [10, 50]
        sums: [499500, 1999000, 4498500]
        sequential_us: 60000
        concurrent_us: 50200
        choice: concurrent

hints:
  - level: 1
    text: |
      Three blocks, and each one is a mission you have already finished. Work out which
      mission each block is before you write anything.

      One trap in the arithmetic: `waits` is in milliseconds and the verdict is in
      microseconds. Where does the factor of a thousand go, and where does it not?
  - level: 2
    text: |
      Block one is mission 4, unchanged: `finished = []`, an inner `async def` that sleeps,
      appends and returns the string, then `await asyncio.gather(*[...])` wrapped in
      `list(...)`.

      Block two is mission 5, unchanged: `sums = [None] * len(computes)`, an inner function
      taking a slot and a size, `enumerate` to build and start the threads, a second loop
      to join them.

      Block three is mission 8, on the waits only. `sum(waits) * 1000` and
      `len(waits) * overhead_us + max(waits, default=0) * 1000`. The overhead is already in
      microseconds, so it is the one term that is not multiplied.
  - level: 3
    text: |
      The last piece, since the other two are in missions 4 and 5 — the verdict, written on
      its own:

          def verdict(delays_ms, per_branch_us):
              one_by_one = sum(delays_ms) * 1000
              together = len(delays_ms) * per_branch_us + max(delays_ms, default=0) * 1000

              return "together" if together < one_by_one else "one_by_one"


          print(verdict([30, 10, 20], 500))     # together
          print(verdict([15], 500))             # one_by_one

      Yours returns `"concurrent"` and `"sequential"` instead, and reports both totals
      alongside the word.

solution: |
  import asyncio
  import threading


  async def whole_voyage(waits, computes, overhead_us):
      finished = []

      async def run(ms):
          await asyncio.sleep(ms / 1000)
          finished.append(ms)
          return f"waited {ms}ms"

      results = list(await asyncio.gather(*[run(ms) for ms in waits]))

      sums = [None] * len(computes)

      def crunch(index, size):
          sums[index] = sum(range(size))

      threads = []
      for index, size in enumerate(computes):
          thread = threading.Thread(target=crunch, args=(index, size))
          threads.append(thread)
          thread.start()

      for thread in threads:
          thread.join()

      sequential_us = sum(waits) * 1000
      concurrent_us = len(waits) * overhead_us + max(waits, default=0) * 1000
      choice = "concurrent" if concurrent_us < sequential_us else "sequential"

      return {
          "results": results,
          "finished": finished,
          "sums": sums,
          "sequential_us": sequential_us,
          "concurrent_us": concurrent_us,
          "choice": choice,
      }
