# Async and Concurrency mission 10. Introduces nothing. Closing mission of the island,
# and of the Python track.
# Reinforces: all seven concepts of the island.
#
# Every piece is copied from an earlier mission with different names: the gather and the
# shared completion list are mission 4, the threads-with-slots are mission 5, the cost
# model is mission 8. Nothing here is new and nothing here is easy, which is what a
# closing mission is for.
#
# The one genuine decision is not stated: the computes go on threads and the brief does not
# say it is a good idea, because mission 7 already said it is not. The player runs them
# there anyway, because the mission asks for a demonstration rather than for the fastest
# possible program - and the `choice` field they compute at the end is the island's answer
# to what they just did.
#
# Sleep budget: the waits are gathered, so the wall clock is the longest one. 50ms here.
# Schema reference: docs/mission-schema.md

id: py-async-10
title: The whole voyage
track: python
island: async-and-concurrency
order: 10
difficulty: expert
tags: [async, closing, gather, threads]
