teaching:
  analogy: |
    The last morning at the harbour office.

    Three telegrams are sent off at once and nobody sits watching any of them. Three
    ledgers are handed to three clerks who all queue for the same pen. And before the
    skipper signs anything, someone works out on paper whether the whole arrangement was
    worth the trouble.

    Nothing in the room is new. Today the room runs.

  explanation: |
    This mission introduces nothing. It asks you to put four things in the right order
    without being told which goes where, which is the part no panel can teach.

    The short version of each decision, for the next time you meet it.

    **Is it waiting or is it working?** Everything on this island hangs off that one
    question, and it is answered by measuring, not by guessing. Waiting can be overlapped.
    Working cannot, and reaching for concurrency there is a rewrite that buys nothing.

    **`asyncio` or threads?** If the code already speaks the async dialect all the way
    down, `gather` is the cheapest branch there is. If it does not — a file, an old driver,
    something you are not rewriting — a thread runs it unchanged, which is exactly what you
    are paying for.

    **What order do results come back in?** `gather` gives you argument order and that
    guarantee is why it is usable. Threads give you nothing: you choose a slot in advance
    or you accept a coin flip. Completion order is a fact about the clock, and it is worth
    recording only when you want to see the overlap.

    **Was any of it worth it?** Count the branches, count the waiting, compare. A hundred
    branches at five hundred microseconds is fifty milliseconds spent before any work
    happens, and if the jobs were fifty microseconds each you have made a fast program
    slow and hard to read at the same time.

    None of the four has an answer that holds everywhere. They have an answer here, and
    being able to say why is what the island was for.

  worked_example: |
    # The same two engines side by side, on a shipment rather than on durations
    import asyncio
    import threading


    async def unload(holds, crates):
        landed = []

        async def open_hold(seconds):
            await asyncio.sleep(seconds)
            landed.append(seconds)
            return f"hold {seconds} clear"

        called = list(await asyncio.gather(*[open_hold(s) for s in holds]))

        weights = [None] * len(crates)

        def weigh(slot, size):
            weights[slot] = size * 2

        hands = []
        for slot, size in enumerate(crates):
            hand = threading.Thread(target=weigh, args=(slot, size))
            hands.append(hand)
            hand.start()
        for hand in hands:
            hand.join()

        return {"called": called, "landed": landed, "weights": weights}


    print(asyncio.run(unload([0.02, 0.01], [3, 4])))
    # {'called': ['hold 0.02 clear', 'hold 0.01 clear'], 'landed': [0.01, 0.02], 'weights': [6, 8]}
    # Argument order in `called`, clock order in `landed`, slot order in `weights`.

  key_points:
    - "Answer 'waiting or working' first. Everything else on this island is downstream of it, and only measuring answers it."
    - "`gather` for coroutines, threads for blocking code you are not rewriting. The second is heavier and asks nothing of the code."
    - "`gather` returns argument order. Threads return nothing — pick a slot in advance, or accept a coin flip."
    - "Completion order is evidence that the waits overlapped, and evidence is the only thing it is good for."
    - "Count the branches against the waiting before you build any of it. The right answer is sometimes a `for` loop."

brief: |
  Run the whole harbour office, one last time.

  Write a coroutine called whole_voyage that takes a list of `waits` in milliseconds, a
  list of `computes` in sizes, and a fixed `overhead_us`, and returns:

      {"results": ..., "finished": ..., "sums": ...,
       "sequential_us": ..., "concurrent_us": ..., "choice": ...}

  **The waits, concurrently.** Give each one a coroutine that awaits
  `asyncio.sleep(ms / 1000)`, appends its `ms` to a shared list, and returns
  `"waited {ms}ms"`. Start them with one `asyncio.gather`. `results` is what `gather`
  returned, as a list — argument order. `finished` is the shared list — completion order.
  All the durations in a case are different, so there is never a tie.

  **The computes, on threads.** Give each size its own `threading.Thread` writing
  `sum(range(size))` into its own slot of `sums`, so `sums` follows the input order. Start
  them all, then join them all. Mission 7 told you threads will not make this faster; you
  are running it there anyway so that the last field can tell you what it cost.

  **The verdict, on the waits only.** Using mission 8's model, in microseconds:

      sequential_us = sum(waits) * 1000
      concurrent_us = len(waits) * overhead_us + max(waits, default=0) * 1000

  `choice` is `"concurrent"` when `concurrent_us` is **strictly less than**
  `sequential_us`, and `"sequential"` otherwise.

  Two empty lists give two empty lists, an empty `sums`, 0, 0 and `"sequential"`.

  Import `asyncio` and `threading` yourself. The engine awaits your function — do not call
  `asyncio.run`.

signature:
  entrypoint: whole_voyage
  stub: |
    async def whole_voyage(waits, computes, overhead_us):
        # Gather the waits. Thread the computes. Then work out whether any of it was worth it.
        # your code here
        pass

