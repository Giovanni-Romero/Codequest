id: ai-rag-01
title: Stage the records
track: ai-engineering
island: rag
order: 1
difficulty: moderate
tags: [ai-engineering, rag, ingestion]
xp: 30

concepts: [ingestion-pipeline]

teaching:
  analogy: |
    A harbor clerk does not throw every crate straight onto a ship. Each crate is
    identified, inspected, split when needed, and either staged or rejected with a reason.
  explanation: |
    An ingestion pipeline turns source documents into records that later stages can trust.
    Each transformation is explicit, and every output keeps its source identity. Rejected
    input is data too: record the stage and reason instead of silently dropping it.
  worked_example: |
    parcels = [{"id": "P1", "weight": 4}, {"id": "P2", "weight": 0}]
    ready = []
    rejected = []
    for parcel in parcels:
        target = ready if parcel["weight"] > 0 else rejected
        target.append(parcel["id"])
    print(ready, rejected)
  key_points:
    - Validate identity before transforming content because provenance starts at ingestion.
    - Record rejected inputs because silent loss makes later failures impossible to trace.
    - Stable record IDs must not depend on an accidental list position.

brief: |
  Write `ingest_documents(documents, max_words)`. `documents` is a list whose items have a unique, non-empty
  `source_id` and string `text`. Normalize whitespace and split non-empty text into bounded
  word chunks. Return `records` with `record_id`, `source_id`, `text`, and `stage: ready`,
  plus `rejected` entries for empty documents. Reject invalid limits, fields, or duplicate IDs.

signature:
  entrypoint: ingest_documents
  stub: |
    def ingest_documents(documents, max_words):
        # Turn sources into traceable records and explicit rejections.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: [[{source_id: chart, text: "north wind rises"}], 2]
      expect: {records: [{record_id: "chart:0", source_id: chart, text: "north wind", stage: ready}, {record_id: "chart:1", source_id: chart, text: rises, stage: ready}], rejected: []}
    - args: [[{source_id: blank, text: "   "}], 3]
      expect: {records: [], rejected: [{source_id: blank, stage: normalize, reason: empty}]}
  hidden:
    - args: [null, 2]
      raises: ValueError
    - args: [[], 2]
      expect: {records: [], rejected: []}
    - args: [[{source_id: one, text: "a b"}, {source_id: two, text: c}], 2]
      expect: {records: [{record_id: "one:0", source_id: one, text: "a b", stage: ready}, {record_id: "two:0", source_id: two, text: c, stage: ready}], rejected: []}
    - args: [[{source_id: x, text: a}, {source_id: x, text: b}], 1]
      raises: ValueError
    - args: [[{text: a}], 1]
      raises: ValueError
    - args: [[{source_id: x, text: 3}], 1]
      raises: ValueError
    - args: [[], 0]
      raises: ValueError

hints:
  - {level: 1, text: "Which facts must survive every transformation so a later answer can trace its source?"}
  - {level: 2, text: "Validate source IDs first, then normalize, reject empties, and chunk in source order."}
  - level: 3
    text: |
      A parcel pipeline can append accepted items to one list and dictionaries containing
      `stage` and `reason` to another, while deriving stable IDs from the parcel ID.

solution: |
  def ingest_documents(documents, max_words):
      if not isinstance(max_words, int) or isinstance(max_words, bool) or max_words <= 0:
          raise ValueError("max_words must be positive")
      if not isinstance(documents, list):
          raise ValueError("documents must be a list")
      records = []
      rejected = []
      seen = set()
      for document in documents:
          if not isinstance(document, dict):
              raise ValueError("documents must be mappings")
          source_id = document.get("source_id")
          text = document.get("text")
          if not isinstance(source_id, str) or not source_id.strip():
              raise ValueError("source_id must be non-empty")
          if source_id in seen:
              raise ValueError("source IDs must be unique")
          if not isinstance(text, str):
              raise ValueError("text must be a string")
          seen.add(source_id)
          words = text.split()
          if not words:
              rejected.append({"source_id": source_id, "stage": "normalize", "reason": "empty"})
              continue
          for start in range(0, len(words), max_words):
              ordinal = start // max_words
              records.append({
                  "record_id": f"{source_id}:{ordinal}",
                  "source_id": source_id,
                  "text": " ".join(words[start:start + max_words]),
                  "stage": "ready",
              })
      return {"records": records, "rejected": rejected}
