id: ai-rag-07
title: Inspect the answer
track: ai-engineering
island: rag
order: 7
difficulty: moderate
tags: [ai-engineering, rag, diagnosis, citations, abstention]
xp: 30

concepts: [citation-provenance, abstention-policy]

teaching:
  analogy: |
    A safety inspector labels a report instead of rebuilding the machine. A precise label
    tells the right crew whether evidence is absent, uncited, invented, or sound.
  explanation: |
    A relief exercise can test grounding judgment without asking you to assemble another
    pipeline. Inspect the declared result against the retrieved IDs. Use a stable precedence
    so the same flawed answer always receives the same actionable classification.
  worked_example: |
    stock = {"P1"}
    order = {"status": "ship", "item_ids": ["P9"]}
    if order["status"] == "ship" and not stock:
        label = "no_stock"
    elif not set(order["item_ids"]) <= stock:
        label = "unknown_item"
    print(label)
  key_points:
    - An answer with no retrieved evidence should have abstained.
    - An empty citation and an invented citation are different failures.
    - Validate the result contract before classifying its content.

brief: |
  Write `inspect_rag_answer(answer, retrieved_ids)`. Answer status is `answer` or
  `abstain`; answered results contain claims with citation lists. Return one label:
  `abstained`, `should_abstain`, `uncited`, `invented_citation`, or `grounded`, in that
  precedence. Reject duplicate IDs or malformed answer data.

signature:
  entrypoint: inspect_rag_answer
  stub: |
    def inspect_rag_answer(answer, retrieved_ids):
        # Classify the grounding result without rebuilding it.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: [{status: abstain, reason: no_evidence}, []]
      expect: abstained
    - args: [{status: answer, claims: [{text: tide, citations: [A]}]}, [A]]
      expect: grounded
  hidden:
    - args: [{status: answer, claims: [{text: first, citations: []}, {text: 7, citations: [A]}]}, [A]]
      raises: ValueError
    - args: [{status: answer, claims: [{text: guess, citations: [A]}]}, []]
      expect: should_abstain
    - args: [{status: answer, claims: [{text: guess, citations: []}]}, [A]]
      expect: uncited
    - args: [{status: answer, claims: [{text: guess, citations: [X]}]}, [A]]
      expect: invented_citation
    - args: [{status: answer, claims: []}, [A]]
      expect: uncited
    - args: [{status: answer, claims: []}, [A, A]]
      raises: ValueError
    - args: [{status: maybe}, []]
      raises: ValueError

hints:
  - {level: 1, text: "Which failure should win when no evidence was retrieved at all?"}
  - {level: 2, text: "Handle abstention first, then no evidence, empty claims or citations, and unknown IDs."}
  - level: 3
    text: |
      An order inspector can return early for a declared cancellation, then missing stock,
      then empty item lists, then item IDs outside the available set.

solution: |
  def inspect_rag_answer(answer, retrieved_ids):
      if not isinstance(answer, dict) or answer.get("status") not in {"answer", "abstain"}:
          raise ValueError("invalid answer status")
      if not isinstance(retrieved_ids, list) or any(not isinstance(item, str) for item in retrieved_ids):
          raise ValueError("invalid retrieved IDs")
      available = set(retrieved_ids)
      if len(available) != len(retrieved_ids):
          raise ValueError("retrieved IDs must be unique")
      if answer["status"] == "abstain":
          return "abstained"
      claims = answer.get("claims")
      if not isinstance(claims, list):
          raise ValueError("answered results need claims")
      citation_lists = []
      for claim in claims:
          if not isinstance(claim, dict) or not isinstance(claim.get("text"), str):
              raise ValueError("invalid claim")
          citations = claim.get("citations")
          if not isinstance(citations, list) or any(not isinstance(item, str) for item in citations):
              raise ValueError("invalid citations")
          citation_lists.append(citations)
      if not available:
          return "should_abstain"
      if not claims:
          return "uncited"
      if any(not citations for citations in citation_lists):
          return "uncited"
      cited = [item for citations in citation_lists for item in citations]
      if not set(cited) <= available:
          return "invented_citation"
      return "grounded"
