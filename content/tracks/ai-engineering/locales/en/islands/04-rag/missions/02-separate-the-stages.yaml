id: ai-rag-02
title: Separate the stages
track: ai-engineering
island: rag
order: 2
difficulty: moderate
tags: [ai-engineering, rag, diagnosis]
xp: 30

concepts: [retrieval-generation-separation]

teaching:
  analogy: |
    If a cook receives the wrong ingredients, blaming the recipe hides the real failure.
    Delivery and cooking need separate tickets so you can repair the correct stage.
  explanation: |
    RAG has at least two distinct decisions: which evidence to retrieve and what answer to
    produce from it. A fluent answer cannot repair missing evidence. Keeping intermediate
    results makes failures attributable instead of turning the pipeline into one black box.
  worked_example: |
    delivery = {"status": "ok", "items": ["rice"]}
    cooking = {"status": "error", "reason": "burned"}
    if delivery["status"] != "ok":
        failed = "delivery"
    elif cooking["status"] != "ok":
        failed = "cooking"
    print(failed)
  key_points:
    - Inspect retrieval before generation because generation depends on retrieved evidence.
    - Preserve each stage result because a final error cannot identify its source.
    - Empty retrieval is a retrieval failure even when the stage reports success.

brief: |
  Write `locate_rag_failure(retrieval, generation)`. Each argument is a mapping with
  `status` equal to `ok` or `error`. Retrieval also has `records`; generation has `text`.
  Return the earliest failed stage and reason, or `{status: ok, stage: none}`. Empty
  retrieval fails before generation; empty generated text fails generation. Reject bad shapes.

signature:
  entrypoint: locate_rag_failure
  stub: |
    def locate_rag_failure(retrieval, generation):
        # Inspect the stages in dependency order.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: [{status: error, reason: no_match, records: []}, {status: ok, text: answer}]
      expect: {status: failed, stage: retrieval, reason: no_match}
    - args: [{status: ok, records: [{record_id: A}]}, {status: error, reason: timeout, text: ""}]
      expect: {status: failed, stage: generation, reason: timeout}
  hidden:
    - args: [{status: error, reason: no_match, records: []}, {status: ok, text: 7}]
      raises: ValueError
    - args: [{status: ok, records: [{record_id: A}]}, {status: ok, text: grounded}]
      expect: {status: ok, stage: none}
    - args: [{status: ok, records: []}, {status: error, reason: timeout, text: ""}]
      expect: {status: failed, stage: retrieval, reason: no_evidence}
    - args: [{status: ok, records: [{record_id: A}]}, {status: ok, text: "   "}]
      expect: {status: failed, stage: generation, reason: empty_answer}
    - args: [{status: ok, records: [{record_id: A}]}, {status: ok, text: 7}]
      raises: ValueError
    - args: [{records: []}, {status: ok, text: x}]
      raises: ValueError
    - args: [{status: maybe, records: []}, {status: ok, text: x}]
      raises: ValueError

hints:
  - {level: 1, text: "Which stage supplies the input that the other stage needs?"}
  - {level: 2, text: "Validate both contracts, then inspect retrieval before generation."}
  - level: 3
    text: |
      A delivery report can return immediately when its status fails; only a successful,
      non-empty delivery allows the kitchen report to be inspected.

solution: |
  def locate_rag_failure(retrieval, generation):
      for stage in (retrieval, generation):
          if not isinstance(stage, dict) or stage.get("status") not in {"ok", "error"}:
              raise ValueError("invalid stage result")
      if not isinstance(retrieval.get("records"), list):
          raise ValueError("retrieval records must be a list")
      text = generation.get("text")
      if not isinstance(text, str):
          raise ValueError("generation text must be a string")
      if retrieval["status"] == "error":
          return {"status": "failed", "stage": "retrieval", "reason": retrieval.get("reason", "error")}
      if not retrieval["records"]:
          return {"status": "failed", "stage": "retrieval", "reason": "no_evidence"}
      if generation["status"] == "error":
          return {"status": "failed", "stage": "generation", "reason": generation.get("reason", "error")}
      if not text.strip():
          return {"status": "failed", "stage": "generation", "reason": "empty_answer"}
      return {"status": "ok", "stage": "none"}
