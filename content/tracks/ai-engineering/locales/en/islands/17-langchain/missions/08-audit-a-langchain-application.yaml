id: ai-langchain-08
title: Audit a LangChain application
track: ai-engineering
island: langchain
order: 8
difficulty: expert
tags: [ai-engineering, langchain, capstone, agents, retrieval, prompts, runnables, requires-ai-orchestration]
xp: 60
concepts: [langchain-runnables, langchain-prompt-templates, langchain-retrievers, langchain-tools-agents]
teaching:
  analogy: The final harbor audit follows one shipment through access control, dispatch, archive retrieval, and report assembly without trusting any station's story alone.
  explanation: A framework application is reliable when its contracts remain visible. Authorization precedes agent construction, retrieval preserves source IDs, the prompt only formats earned evidence, and a trace distinguishes blocked, abstained, and answered paths.
  worked_example: |
    trace = ["authorize"]
    if not allowed:
        return {"status": "blocked", "trace": trace}
    trace.extend(["agent", "retrieve"])
  key_points:
    - Keep authorization outside the model-driven loop.
    - Abstain when the retriever returns no evidence.
    - Return provenance and stage trace as application evidence.
    - Use real framework APIs without network or provider calls.
brief: >
  Write `audit_langchain_app(question, records, template, allow_retrieval, max_steps) -> dict`.
  Validate exact unique id/text records, non-blank question, boolean authorization,
  max_steps 1 through 4, and an f-string template declaring exactly question and context.
  On denial return blocked after authorize. Otherwise build an overlap-ranked `@chain`
  retriever, expose it as one `@tool`, and run a bounded fake-model `create_agent` call.
  If no evidence, return abstained. If evidence exists, compose PromptTemplate with a
  RunnableLambda string boundary and render `[id] text` lines. Return status, sources,
  prompt or null, executed call count, and the exact stage trace shown by the tests.
signature:
  entrypoint: audit_langchain_app
  stub: |
    def audit_langchain_app(question, records, template, allow_retrieval, max_steps):
        # Audit authorization, agent, retrieval, and prompt stages end to end.
        pass
constraints: {max_runtime_ms: 5000, max_memory_mb: 256, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [red harbor, [{id: a, text: red harbor map}, {id: b, text: harbor gate}, {id: c, text: blue hill}], "Q: {question}\nC:\n{context}", true, 1]
      expect: {status: answered, sources: [a, b], prompt: "Q: red harbor\nC:\n[a] red harbor map\n[b] harbor gate", calls: 1, trace: [authorize, agent, retrieve, prompt]}
    - args: [missing, [{id: a, text: red harbor map}], '{question}|{context}', true, 2]
      expect: {status: abstained, sources: [], prompt: null, calls: 1, trace: [authorize, agent, retrieve]}
    - args: [red, [{id: a, text: red map}], '{question}|{context}', false, 1]
      expect: {status: blocked, sources: [], prompt: null, calls: 0, trace: [authorize]}
  hidden:
    - {args: ['', [{id: a, text: x}], '{question}{context}', true, 1], raises: ValueError}
    - {args: [x, [{id: a, text: x}, {id: a, text: y}], '{question}{context}', true, 1], raises: ValueError}
    - {args: [x, [{id: a, text: x}], '{question}', true, 1], raises: ValueError}
    - {args: [x, [{id: a, text: x}], '{question}{context}{extra}', true, 1], raises: ValueError}
    - {args: [x, [{id: a, text: x}], '{question}{context}', 'yes', 1], raises: ValueError}
    - {args: [x, [{id: a, text: x}], '{question}{context}', true, 0], raises: ValueError}
hints:
  - {level: 1, text: "Can every terminal status be explained by the returned stage trace?"}
  - {level: 2, text: "Authorize, run the retriever tool, abstain on no documents, then render through a prompt runnable."}
  - {level: 3, text: "A payment audit may trace `authorize`, `charge`, `receipt` and stop before later stages."}
solution: |
  def audit_langchain_app(question, records, template, allow_retrieval, max_steps):
      from langchain.agents import create_agent
      from langchain_core.documents import Document
      from langchain_core.language_models.fake_chat_models import FakeMessagesListChatModel
      from langchain_core.messages import AIMessage
      from langchain_core.prompts import PromptTemplate
      from langchain_core.runnables import RunnableLambda, chain
      from langchain_core.tools import tool
      if type(question) is not str or not question.strip() or type(records) is not list or not records or type(template) is not str or not template.strip() or type(allow_retrieval) is not bool:
          raise ValueError("invalid input")
      if type(max_steps) is not int or not 1 <= max_steps <= 4:
          raise ValueError("invalid step limit")
      seen = set()
      for record in records:
          if type(record) is not dict or set(record) != {"id", "text"} or any(type(record[key]) is not str or not record[key].strip() for key in ("id", "text")) or record["id"] in seen:
              raise ValueError("invalid record")
          seen.add(record["id"])
      try:
          prompt_template = PromptTemplate.from_template(template, template_format="f-string")
          if set(prompt_template.input_variables) != {"question", "context"}:
              raise ValueError("invalid variables")
      except (TypeError, ValueError) as exc:
          raise ValueError("invalid template") from exc
      trace = ["authorize"]
      if not allow_retrieval:
          return {"status": "blocked", "sources": [], "prompt": None, "calls": 0, "trace": trace}
      terms = set(question.lower().split())
      sources = []
      documents = []
      calls = 0
      @chain
      def retriever(_query):
          ranked = []
          for index, record in enumerate(records):
              score = len(terms & set(record["text"].lower().split()))
              if score:
                  ranked.append((-score, index, record))
          ranked.sort(key=lambda item: (item[0], item[1]))
          return [Document(page_content=record["text"], metadata={"id": record["id"]}) for _, _, record in ranked]
      @tool
      def retrieve(value: str) -> str:
          """Retrieve traceable local evidence for one question."""
          nonlocal calls, documents
          calls += 1
          documents = retriever.invoke(value)
          sources.extend(doc.metadata["id"] for doc in documents)
          return "\n".join(doc.page_content for doc in documents)
      class BoundFake(FakeMessagesListChatModel):
          def bind_tools(self, tools, *, tool_choice=None, **kwargs):
              return self
      model = BoundFake(responses=[AIMessage(content="", tool_calls=[{"name": "retrieve", "args": {"value": question}, "id": "call-1", "type": "tool_call"}]), AIMessage(content="done")])
      agent = create_agent(model, [retrieve])
      trace.append("agent")
      agent.invoke({"messages": [{"role": "user", "content": question}]}, config={"recursion_limit": max_steps * 2 + 2})
      trace.append("retrieve")
      if not documents:
          return {"status": "abstained", "sources": [], "prompt": None, "calls": calls, "trace": trace}
      context = "\n".join(f"[{doc.metadata['id']}] {doc.page_content}" for doc in documents)
      rendered = (prompt_template | RunnableLambda(lambda value: value.to_string())).invoke({"question": question, "context": context})
      trace.append("prompt")
      return {"status": "answered", "sources": sources, "prompt": rendered, "calls": calls, "trace": trace}
