id: ai-ml-02
title: Audit a dataset split
track: ai-engineering
island: machine-learning-foundations
order: 2
difficulty: challenging
tags: [ai-engineering, machine-learning, leakage, data-quality]
xp: 45
concepts: [dataset-splits]
teaching:
  analogy: Three exam envelopes can have different labels and still contain the same question sheet. You inspect the contents and dates, not just the envelope names.
  explanation: Reproducible partitions can still leak examples or future information. Identity overlap lets evaluation examples influence fitting. A later timestamp in training than in validation or test reverses the direction of time. Label coverage also matters because an aggregate score can hide a partition that never contains one class.
  worked_example: |
    crews = {"morning": ["Ana", "Beto"], "evening": ["Caio", "Dora"]}
    overlap = set(crews["morning"]) & set(crews["evening"])
    counts = {shift: len(names) for shift, names in crews.items()}
    print(sorted(overlap), counts)
  key_points:
    - Reproducibility does not detect identity overlap.
    - Time-aware data must preserve past-to-future order.
    - Label counts are evidence; one total balance score is not.
brief: >
  Write `audit_dataset_split(train, validation, test) -> dict`. Each argument is a
  nonempty list of records containing a unique integer `id` within that partition, a
  nonempty string `label`, and a finite numeric `timestamp`. Return sorted `overlap_ids`,
  `label_counts` for each partition and every observed label, `label_coverage_equal`, and
  `temporal_leakage`. Temporal leakage is true when the latest training timestamp is not
  earlier than the earliest validation timestamp, or the latest validation timestamp is
  not earlier than the earliest test timestamp. Raise `ValueError` for invalid input.
signature:
  entrypoint: audit_dataset_split
  stub: |
    def audit_dataset_split(train, validation, test):
        # Return identity, label, and time evidence for the three partitions.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args:
        - [{id: 1, label: A, timestamp: 1}, {id: 2, label: B, timestamp: 2}]
        - [{id: 3, label: A, timestamp: 3}, {id: 4, label: B, timestamp: 4}]
        - [{id: 5, label: A, timestamp: 5}, {id: 6, label: B, timestamp: 6}]
      expect:
        overlap_ids: []
        label_counts: {train: {A: 1, B: 1}, validation: {A: 1, B: 1}, test: {A: 1, B: 1}}
        label_coverage_equal: true
        temporal_leakage: false
    - args:
        - [{id: 1, label: A, timestamp: 1}, {id: 2, label: B, timestamp: 3}]
        - [{id: 2, label: B, timestamp: 2}, {id: 3, label: A, timestamp: 4}]
        - [{id: 4, label: A, timestamp: 5}, {id: 5, label: B, timestamp: 6}]
      expect:
        overlap_ids: [2]
        label_counts: {train: {A: 1, B: 1}, validation: {A: 1, B: 1}, test: {A: 1, B: 1}}
        label_coverage_equal: true
        temporal_leakage: true
  hidden:
    - args:
        - [{id: 1, label: A, timestamp: 1}, {id: 2, label: B, timestamp: 2}]
        - [{id: 3, label: A, timestamp: 3}]
        - [{id: 4, label: A, timestamp: 4}, {id: 5, label: B, timestamp: 5}]
      expect:
        overlap_ids: []
        label_counts: {train: {A: 1, B: 1}, validation: {A: 1, B: 0}, test: {A: 1, B: 1}}
        label_coverage_equal: false
        temporal_leakage: false
    - args: [[], [{id: 2, label: A, timestamp: 2}], [{id: 3, label: A, timestamp: 3}]]
      raises: ValueError
    - args: [[{id: 1, label: A, timestamp: 1}, {id: 1, label: A, timestamp: 2}], [{id: 2, label: A, timestamp: 3}], [{id: 3, label: A, timestamp: 4}]]
      raises: ValueError
    - args: [[{id: true, label: A, timestamp: 1}], [{id: 2, label: A, timestamp: 2}], [{id: 3, label: A, timestamp: 3}]]
      raises: ValueError
    - args: [[{id: 1, label: "", timestamp: 1}], [{id: 2, label: A, timestamp: 2}], [{id: 3, label: A, timestamp: 3}]]
      raises: ValueError
    - args: [[{id: 1, label: A, timestamp: .inf}], [{id: 2, label: A, timestamp: 2}], [{id: 3, label: A, timestamp: 3}]]
      raises: ValueError
hints:
  - level: 1
    text: "Which evidence can reveal that three named partitions are not actually independent?"
  - level: 2
    text: "Compare id sets, count every label per partition, and check both chronological boundaries."
  - level: 3
    text: "Pattern: `shared = sorted((a & b) | (a & c) | (b & c))`."
solution: |
  def audit_dataset_split(train, validation, test):
      import math
      partitions = {"train": train, "validation": validation, "test": test}
      ids = {}
      for name, records in partitions.items():
          if not isinstance(records, list) or not records:
              raise ValueError("invalid partition")
          current_ids = []
          for record in records:
              if not isinstance(record, dict) or type(record.get("id")) is not int or not isinstance(record.get("label"), str) or not record["label"]:
                  raise ValueError("invalid record")
              timestamp = record.get("timestamp")
              if type(timestamp) not in (int, float):
                  raise ValueError("invalid timestamp")
              try:
                  if not math.isfinite(timestamp):
                      raise ValueError("invalid timestamp")
              except OverflowError as error:
                  raise ValueError("invalid timestamp") from error
              current_ids.append(record["id"])
          if len(set(current_ids)) != len(current_ids):
              raise ValueError("duplicate id")
          ids[name] = set(current_ids)
      overlap_ids = sorted((ids["train"] & ids["validation"]) | (ids["train"] & ids["test"]) | (ids["validation"] & ids["test"]))
      labels = sorted({record["label"] for records in partitions.values() for record in records})
      label_counts = {name: {label: sum(record["label"] == label for record in records) for label in labels} for name, records in partitions.items()}
      coverage = [set(record["label"] for record in records) for records in partitions.values()]
      temporal_leakage = max(record["timestamp"] for record in train) >= min(record["timestamp"] for record in validation) or max(record["timestamp"] for record in validation) >= min(record["timestamp"] for record in test)
      return {"overlap_ids": overlap_ids, "label_counts": label_counts, "label_coverage_equal": coverage[0] == coverage[1] == coverage[2], "temporal_leakage": temporal_leakage}
