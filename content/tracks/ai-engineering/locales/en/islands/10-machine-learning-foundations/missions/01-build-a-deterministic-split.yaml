id: ai-ml-01
title: Build a deterministic split
track: ai-engineering
island: machine-learning-foundations
order: 1
difficulty: challenging
tags: [ai-engineering, machine-learning, datasets, reproducibility]
xp: 45
concepts: [dataset-splits]
teaching:
  analogy: A harbor master assigns numbered crates to fixed docks. Repeating the same rule sends every crate to the same dock, so an audit can reconstruct the assignment.
  explanation: A dataset split reserves different examples for fitting, tuning, and final evaluation. The three partitions must cover every record exactly once. A deterministic ordering makes the split reproducible, but it does not make it representative. Later you will audit label balance and time order instead of assuming a clean split is a fair split.
  worked_example: |
    ticket_numbers = [14, 11, 13, 12]
    ordered = sorted(ticket_numbers)
    front_desk = ordered[:2]
    back_office = ordered[2:3]
    archive = ordered[3:]
    print(front_desk, back_office, archive)
  key_points:
    - Train, validation, and test partitions have different jobs.
    - Every record belongs to exactly one partition because overlap leaks information.
    - Determinism makes a split repeatable, not automatically unbiased.
brief: >
  Write `build_dataset_split(records, train_count, validation_count) -> dict`.
  `records` is a list of dictionaries with a unique integer `id`, excluding `bool`.
  Require at least one record in each partition and positive integer counts. Sort the ids,
  place the first `train_count` in `train_ids`, the next `validation_count` in
  `validation_ids`, and the remainder in `test_ids`. Raise `ValueError` for invalid input.
signature:
  entrypoint: build_dataset_split
  stub: |
    def build_dataset_split(records, train_count, validation_count):
        # Return reproducible train, validation, and test id lists.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{id: 3}, {id: 1}, {id: 5}, {id: 2}, {id: 4}], 3, 1]
      expect: {train_ids: [1, 2, 3], validation_ids: [4], test_ids: [5]}
    - args: [[{id: 40}, {id: 10}, {id: 30}, {id: 20}], 2, 1]
      expect: {train_ids: [10, 20], validation_ids: [30], test_ids: [40]}
  hidden:
    - args: [[{id: -2}, {id: 0}, {id: 4}], 1, 1]
      expect: {train_ids: [-2], validation_ids: [0], test_ids: [4]}
    - args: [[{id: 1}, {id: 1}, {id: 2}], 1, 1]
      raises: ValueError
    - args: [[{id: true}, {id: 2}, {id: 3}], 1, 1]
      raises: ValueError
    - args: [[{name: missing}, {id: 2}, {id: 3}], 1, 1]
      raises: ValueError
    - args: [not-a-list, 1, 1]
      raises: ValueError
    - args: [[], 1, 1]
      raises: ValueError
    - args: [[{id: 1}, {id: 2}, {id: 3}], 0, 1]
      raises: ValueError
    - args: [[{id: 1}, {id: 2}, {id: 3}], 1, true]
      raises: ValueError
    - args: [[{id: 1}, {id: 2}, {id: 3}], 2, 1]
      raises: ValueError
hints:
  - level: 1
    text: "How can one fixed ordering guarantee that no id changes partitions between runs?"
  - level: 2
    text: "Validate unique ids and positive counts, then sort once and slice three non-overlapping ranges."
  - level: 3
    text: "Pattern: `left, middle, right = ordered[:a], ordered[a:b], ordered[b:]`."
solution: |
  def build_dataset_split(records, train_count, validation_count):
      if not isinstance(records, list) or not records:
          raise ValueError("invalid records")
      if type(train_count) is not int or type(validation_count) is not int:
          raise ValueError("invalid counts")
      if train_count <= 0 or validation_count <= 0 or train_count + validation_count >= len(records):
          raise ValueError("invalid counts")
      if any(not isinstance(record, dict) or type(record.get("id")) is not int for record in records):
          raise ValueError("invalid record")
      ids = [record["id"] for record in records]
      if len(set(ids)) != len(ids):
          raise ValueError("duplicate id")
      ordered = sorted(ids)
      boundary = train_count + validation_count
      return {"train_ids": ordered[:train_count], "validation_ids": ordered[train_count:boundary], "test_ids": ordered[boundary:]}
