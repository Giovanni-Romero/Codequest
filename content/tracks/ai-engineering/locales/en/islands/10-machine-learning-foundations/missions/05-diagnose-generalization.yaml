id: ai-ml-05
title: Diagnose generalization
track: ai-engineering
island: machine-learning-foundations
order: 5
difficulty: challenging
tags: [ai-engineering, machine-learning, generalization, diagnostics]
xp: 45
concepts: [supervised-learning-contract, baselines-and-generalization]
teaching:
  analogy: A navigator who memorizes yesterday's harbor may draw a perfect old route and fail at today's entrance. You compare practice, validation, and the old chart before trusting the skill.
  explanation: Underfitting means the learner cannot even beat a simple baseline. Overfitting appears when training loss is much lower than validation loss. Generalization means held-out performance beats the baseline without an excessive train-to-validation gap. Explicit thresholds turn those words into a reproducible diagnosis.
  worked_example: |
    rehearsal_errors = 2
    live_errors = 5
    allowed_gap = 1
    gap = live_errors - rehearsal_errors
    status = "fragile" if gap > allowed_gap else "stable"
    print(status, gap)
  key_points:
    - Training performance alone cannot establish usefulness.
    - A baseline separates learning from needless complexity.
    - The acceptable generalization gap must be declared before diagnosis.
brief: >
  Write `diagnose_generalization(train_loss, validation_loss, baseline_loss, max_gap) -> dict`.
  Accept finite nonnegative numbers, excluding `bool`, with a finite nonnegative `max_gap`.
  Return `diagnosis`, `generalization_gap` (`validation_loss - train_loss`), and
  `beats_baseline`. Diagnose `underfitting` when both losses are at least the baseline,
  otherwise `overfitting` when the gap exceeds `max_gap`, otherwise `generalizes` when
  validation beats the baseline, and `no_gain` otherwise. Raise `ValueError` for invalid input.
signature:
  entrypoint: diagnose_generalization
  stub: |
    def diagnose_generalization(train_loss, validation_loss, baseline_loss, max_gap):
        # Return one evidence-based fit diagnosis.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [0.4, 0.45, 0.7, 0.1]
      expect: {diagnosis: generalizes, generalization_gap: 0.05, beats_baseline: true}
    - args: [0.8, 0.9, 0.7, 0.2]
      expect: {diagnosis: underfitting, generalization_gap: 0.1, beats_baseline: false}
  hidden:
    - args: [0.1, 0.5, 0.6, 0.2]
      expect: {diagnosis: overfitting, generalization_gap: 0.4, beats_baseline: true}
    - args: [0.5, 0.7, 0.7, 0.3]
      expect: {diagnosis: no_gain, generalization_gap: 0.2, beats_baseline: false}
    - args: [0.2, 0.3, 0.5, 0.1]
      expect: {diagnosis: generalizes, generalization_gap: 0.1, beats_baseline: true}
    - args: [-0.1, 0.2, 0.3, 0.1]
      raises: ValueError
    - args: [true, 0.2, 0.3, 0.1]
      raises: ValueError
    - args: [0.1, .nan, 0.3, 0.1]
      raises: ValueError
    - args: [0.1, 0.2, 0.3, -0.1]
      raises: ValueError
    - args: [0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF, 0.2, 0.3, 0.1]
      raises: ValueError
hints:
  - level: 1
    text: "Which comparison separates a weak learner from one that memorized its training rows?"
  - level: 2
    text: "Check baseline failure first, then the train-validation gap, then held-out improvement."
  - level: 3
    text: "Pattern: `gap = later_error - practice_error`; compare it with a declared ceiling."
solution: |
  def diagnose_generalization(train_loss, validation_loss, baseline_loss, max_gap):
      import math
      values = (train_loss, validation_loss, baseline_loss, max_gap)
      for value in values:
          if type(value) not in (int, float) or value < 0:
              raise ValueError("invalid metric")
          try:
              if not math.isfinite(value):
                  raise ValueError("invalid metric")
          except OverflowError as error:
              raise ValueError("invalid metric") from error
      gap = round(validation_loss - train_loss, 12)
      if train_loss >= baseline_loss and validation_loss >= baseline_loss:
          diagnosis = "underfitting"
      elif gap > max_gap:
          diagnosis = "overfitting"
      elif validation_loss < baseline_loss:
          diagnosis = "generalizes"
      else:
          diagnosis = "no_gain"
      return {"diagnosis": diagnosis, "generalization_gap": gap, "beats_baseline": validation_loss < baseline_loss}
