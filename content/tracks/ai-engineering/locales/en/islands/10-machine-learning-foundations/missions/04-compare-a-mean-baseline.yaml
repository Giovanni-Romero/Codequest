id: ai-ml-04
title: Compare a mean baseline
track: ai-engineering
island: machine-learning-foundations
order: 4
difficulty: challenging
tags: [ai-engineering, machine-learning, baselines, evaluation]
xp: 45
concepts: [supervised-learning-contract, baselines-and-generalization]
teaching:
  analogy: A new tide forecast earns its place only if it beats the old rule of using the average tide. A complicated chart is not evidence by itself.
  explanation: A baseline is a simple reference that exposes whether model complexity buys useful performance. For numeric targets, the training-target mean is a deterministic baseline. Both model and baseline must be measured on the same held-out targets with the same metric. Mean absolute error keeps the comparison readable.
  worked_example: |
    usual_wait = 12
    actual_waits = [10, 14, 11]
    new_guesses = [11, 13, 12]
    old_error = sum(abs(usual_wait - value) for value in actual_waits) / len(actual_waits)
    new_error = sum(abs(guess - value) for guess, value in zip(new_guesses, actual_waits)) / len(actual_waits)
    print(old_error, new_error)
  key_points:
    - Build the baseline from training targets, never held-out targets.
    - Compare both predictors on identical examples and metrics.
    - Complexity is justified only by measurable improvement.
brief: >
  Write `compare_mean_baseline(train_targets, heldout_targets, model_predictions) -> dict`.
  Accept a nonempty finite numeric training list and equal nonempty finite numeric held-out
  target and prediction lists, excluding `bool`. Use the mean training target as the
  constant baseline. Return `baseline_value`, `baseline_mae`, `model_mae`, `improvement`
  (`baseline_mae - model_mae`), and `winner` as `model`, `baseline`, or `tie`. Raise
  `ValueError` for invalid input or non-finite arithmetic.
signature:
  entrypoint: compare_mean_baseline
  stub: |
    def compare_mean_baseline(train_targets, heldout_targets, model_predictions):
        # Compare one model with a training-only reference on held-out data.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[0, 2], [1, 3], [1, 2]]
      expect: {baseline_value: 1.0, baseline_mae: 1.0, model_mae: 0.5, improvement: 0.5, winner: model}
    - args: [[2, 2], [1, 3], [2, 2]]
      expect: {baseline_value: 2.0, baseline_mae: 1.0, model_mae: 1.0, improvement: 0.0, winner: tie}
  hidden:
    - args: [[0, 2], [1, 3], [0, 0]]
      expect: {baseline_value: 1.0, baseline_mae: 1.0, model_mae: 2.0, improvement: -1.0, winner: baseline}
    - args: [[-2, 2], [-1, 1], [-1, 1]]
      expect: {baseline_value: 0.0, baseline_mae: 1.0, model_mae: 0.0, improvement: 1.0, winner: model}
    - args: [[], [1], [1]]
      raises: ValueError
    - args: [[1], [], []]
      raises: ValueError
    - args: [[1], [1, 2], [1]]
      raises: ValueError
    - args: [[true], [1], [1]]
      raises: ValueError
    - args: [[1], [.inf], [1]]
      raises: ValueError
    - args: [not-a-list, [1], [1]]
      raises: ValueError
hints:
  - level: 1
    text: "What is the weakest honest predictor the new model must beat on exactly the same held-out rows?"
  - level: 2
    text: "Average only the training targets, create one constant prediction, then compute both held-out MAEs."
  - level: 3
    text: "Pattern: `mae = sum(abs(guess - actual) for guess, actual in pairs) / len(pairs)`."
solution: |
  def compare_mean_baseline(train_targets, heldout_targets, model_predictions):
      import math
      def valid(values):
          if not isinstance(values, list) or not values:
              return False
          for value in values:
              if type(value) not in (int, float):
                  return False
              try:
                  if not math.isfinite(value):
                      return False
              except OverflowError:
                  return False
          return True
      if not valid(train_targets) or not valid(heldout_targets) or not valid(model_predictions) or len(heldout_targets) != len(model_predictions):
          raise ValueError("invalid evaluation data")
      try:
          baseline_value = sum(train_targets) / len(train_targets)
          baseline_mae = sum(abs(baseline_value - target) for target in heldout_targets) / len(heldout_targets)
          model_mae = sum(abs(prediction - target) for prediction, target in zip(model_predictions, heldout_targets)) / len(heldout_targets)
          improvement = baseline_mae - model_mae
          if not all(math.isfinite(value) for value in (baseline_value, baseline_mae, model_mae, improvement)):
              raise ValueError("non-finite result")
      except OverflowError as error:
          raise ValueError("non-finite result") from error
      winner = "model" if model_mae < baseline_mae else "baseline" if model_mae > baseline_mae else "tie"
      return {"baseline_value": baseline_value, "baseline_mae": baseline_mae, "model_mae": model_mae, "improvement": improvement, "winner": winner}
