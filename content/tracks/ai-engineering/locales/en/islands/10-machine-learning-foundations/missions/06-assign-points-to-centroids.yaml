id: ai-ml-06
title: Assign points to centroids
track: ai-engineering
island: machine-learning-foundations
order: 6
difficulty: challenging
tags: [ai-engineering, machine-learning, unsupervised-learning, clustering]
xp: 45
concepts: [unsupervised-patterns]
teaching:
  analogy: Unlabeled boats gather around the nearest harbor beacon. The beacons create groups, but nobody claims those groups are the boats' true identities.
  explanation: Unsupervised learning looks for structure without target labels. One clustering assignment step measures every point against declared centroids and chooses the shortest squared Euclidean distance. Feature scale and initial centroids shape the result. A tie must have a deterministic rule so the same input gives the same groups.
  worked_example: |
    houses = [2, 8, 14]
    stations = [0, 10]
    assignments = [min(range(len(stations)), key=lambda i: (value - stations[i]) ** 2) for value in houses]
    print(assignments)
  key_points:
    - Clusters are groups under a distance rule, not discovered class labels.
    - Squared distance preserves nearest ordering without a square root.
    - Stable tie-breaking is part of deterministic behavior.
brief: >
  Write `assign_points_to_centroids(points, centroids) -> dict`. Accept nonempty lists of
  nonempty finite numeric vectors, excluding `bool`. Every point and centroid must have
  the same dimension. Assign each point to the centroid with the smallest squared Euclidean
  distance; ties choose the lower centroid index. Return `assignments`, `squared_distances`,
  and `cluster_sizes`. Raise `ValueError` for invalid input or non-finite arithmetic.
signature:
  entrypoint: assign_points_to_centroids
  stub: |
    def assign_points_to_centroids(points, centroids):
        # Return deterministic nearest-centroid assignments and evidence.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[[0, 0], [2, 2], [9, 9]], [[0, 0], [10, 10]]]
      expect: {assignments: [0, 0, 1], squared_distances: [0, 8, 2], cluster_sizes: [2, 1]}
    - args: [[[1], [4], [8]], [[0], [10]]]
      expect: {assignments: [0, 0, 1], squared_distances: [1, 16, 4], cluster_sizes: [2, 1]}
  hidden:
    - args: [[[1]], [[0], [2]]]
      expect: {assignments: [0], squared_distances: [1], cluster_sizes: [1, 0]}
    - args: [[[-2, -2], [2, 2]], [[-1, -1], [1, 1]]]
      expect: {assignments: [0, 1], squared_distances: [2, 2], cluster_sizes: [1, 1]}
    - args: [[], [[0]]]
      raises: ValueError
    - args: [[[0]], []]
      raises: ValueError
    - args: [[[0, 1]], [[0]]]
      raises: ValueError
    - args: [[[true]], [[0]]]
      raises: ValueError
    - args: [[[.inf]], [[0]]]
      raises: ValueError
    - args: [not-a-list, [[0]]]
      raises: ValueError
    - args: [[[0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF]], [[0]]]
      raises: ValueError
hints:
  - level: 1
    text: "What evidence lets each unlabeled point choose one group reproducibly?"
  - level: 2
    text: "Validate one shared dimension, compute every squared distance, and choose the first minimum."
  - level: 3
    text: "Pattern: `winner = min(range(len(options)), key=lambda i: scores[i])`."
solution: |
  def assign_points_to_centroids(points, centroids):
      import math
      def valid_number(value):
          if type(value) not in (int, float):
              return False
          try:
              return math.isfinite(value)
          except OverflowError:
              return False
      if not isinstance(points, list) or not points or not isinstance(centroids, list) or not centroids:
          raise ValueError("invalid vectors")
      vectors = points + centroids
      if any(not isinstance(vector, list) or not vector for vector in vectors):
          raise ValueError("invalid vector")
      dimension = len(vectors[0])
      if any(len(vector) != dimension or not all(valid_number(value) for value in vector) for vector in vectors):
          raise ValueError("invalid vector")
      assignments = []
      squared_distances = []
      try:
          for point in points:
              distances = [sum((value - center) ** 2 for value, center in zip(point, centroid)) for centroid in centroids]
              if not all(math.isfinite(distance) for distance in distances):
                  raise ValueError("non-finite distance")
              winner = min(range(len(distances)), key=lambda index: distances[index])
              assignments.append(winner)
              squared_distances.append(distances[winner])
      except OverflowError as error:
          raise ValueError("non-finite distance") from error
      return {"assignments": assignments, "squared_distances": squared_distances, "cluster_sizes": [assignments.count(index) for index in range(len(centroids))]}
