id: ai-structured-outputs-07
title: Diagnose the stop
track: ai-engineering
island: structured-outputs
order: 7
difficulty: moderate
tags: [ai-engineering, structured-outputs, retry, taxonomy]
xp: 30
concepts: [validation-retry, failure-taxonomy]
teaching:
  analogy: |
    A repair log says whether a train stopped because of a loose bolt, a safety alarm, or no
    remaining repair window. The final line should explain the stop.
  explanation: |
    A diagnostic result makes the stopping rule visible. Parse and schema failures can be retried;
    policy, provider, and timeout failures cannot. If every allowed attempt is repairable but none
    succeeds, the stable reason is exhaustion.
  worked_example: |
    events = ["loose", "loose"]
    reason = "retry_limit" if len(events) == 2 else events[-1]
    print(reason)
  key_points:
    - Report the earliest permanent failure.
    - Report exhaustion only after using the limit.
    - Keep failure classes distinct so operators can act on them.
brief: |
  Write `stop_reason(events, limit)`. `events` must be a list whose every element is a dictionary
  with string `kind` equal to parse, schema, policy, provider, timeout, or success. `limit` must
  be a non-negative integer and not bool. Validate the complete list before any terminal return,
  then inspect only the bounded prefix: return `"success"` for success, return the permanent kind
  for policy/provider/timeout, and return `"retry_limit"` otherwise. Raise `ValueError` for an
  invalid container, element, primitive type, kind, or limit.
signature:
  entrypoint: stop_reason
  stub: |
    def stop_reason(events, limit):
        # Explain the first terminal condition in a bounded attempt sequence.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{kind: parse}, {kind: success}], 2]
      expect: success
    - args: [[{kind: schema}], 1]
      expect: retry_limit
  hidden:
    - args: [[{kind: provider}, {kind: nope}], 1]
      raises: ValueError
    - args: [[{kind: provider}, {kind: [timeout]}], 2]
      raises: ValueError
    - args: [[{kind: provider}, {kind: {name: timeout}}], 2]
      raises: ValueError
    - args: [[{kind: [provider]}], 1]
      raises: ValueError
    - args: [[{kind: {name: provider}}], 1]
      raises: ValueError
    - args: [[], 0]
      expect: retry_limit
    - args: [[{kind: provider}, {kind: success}], 2]
      expect: provider
    - args: [[{kind: timeout}], 3]
      expect: timeout
    - args: [[{kind: schema}, {kind: success}], 1]
      expect: retry_limit
    - args: [[{kind: success}], 1]
      expect: success
    - args: [[{kind: policy}], 1]
      expect: policy
    - args: [[{kind: nope}], 1]
      raises: ValueError
    - args: [null, 1]
      raises: ValueError
    - args: [[], -1]
      raises: ValueError
    - args: [[], true]
      raises: ValueError
hints:
  - {level: 1, text: "Which event ends the process now, and which one merely spends another chance?"}
  - {level: 2, text: "Use a terminal-kind set and a separate success case before returning retry_limit."}
  - level: 3
    text: |
      A workshop can inspect `events[:limit]`, return immediately for `finished`, return the
      failure label for `cancelled` or `unsafe`, and use `window_closed` after the loop.
solution: |
  def stop_reason(events, limit):
      if not isinstance(events, list) or not isinstance(limit, int) or isinstance(limit, bool) or limit < 0:
          raise ValueError("invalid input")
      kinds = {"parse", "schema", "policy", "provider", "timeout", "success"}
      if any(not isinstance(event, dict) or not isinstance(event.get("kind"), str) or event.get("kind") not in kinds for event in events):
          raise ValueError("invalid event")
      for event in events[:limit]:
          kind = event["kind"]
          if kind == "success" or kind in {"policy", "provider", "timeout"}:
              return "success" if kind == "success" else kind
      return "retry_limit"
