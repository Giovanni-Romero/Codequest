id: ai-responsible-08
title: Audit a responsible decision
track: ai-engineering
island: responsible-ai
order: 8
difficulty: challenging
tags: [ai-engineering, responsible-ai, fairness, privacy, explainability, oversight, capstone]
xp: 45
concepts: [group-fairness-metrics, privacy-boundaries, explainability-records, human-oversight-governance]
teaching:
  analogy: A final harbor clearance binds dock-level outcomes, a minimized passenger manifest, the ship and receipt log, and a named inspection route. Missing any one section makes the clearance unsafe or impossible to audit.
  explanation: Responsible decisions need several enforceable boundaries at once. Group metrics expose disparities under a declared tolerance. Privacy policy minimizes and redacts subject data before review. Evidence references and model version preserve traceability, while impact and uncertainty determine accountable oversight. No single score replaces the combined audit.
  worked_example: |
    clearance = {
        "safety_check": "passed",
        "public_manifest": {"cargo": "tea"},
        "inspector": "harbor-team",
    }
    print(clearance)
  key_points:
    - Measure the declared fairness trade-off on the candidate and prior records together.
    - Apply privacy rules before assembling the audit artifact.
    - Bind evidence and model version to the decision.
    - Route impact or uncertainty to a named reviewer with a recorded outcome.
brief: >
  Write `audit_responsible_decision(records, candidate, policy, review_event) -> dict`.
  Prior `records` is a list of exact `id`, `group`, `selected`, `prediction`, and `actual`
  dictionaries with unique IDs. `candidate` has those fields plus `decision_id`,
  `model_version`, unique `evidence_refs` beginning with `evidence:`, finite numeric
  `factors`, scalar-valued `subject`, valid `impact`, and finite `confidence` from 0 through 1.
  Its ID must be new. `policy` has exactly `fairness_metric`, `fairness_tolerance`,
  `allowed_subject_fields`, `redact_subject_fields`, `retention_days`, `review_impacts`,
  `min_automatic_confidence`, and `reviewer`, following the earlier mission contracts.
  Audit fairness over prior records plus the candidate; minimize and redact subject data;
  build the explainability record; then route oversight by impact first and confidence second.
  Automatic routes require null `review_event`. Human routes require an exact `event`, `actor`,
  and UTC `occurred_at` mapping; event is `approve`, `reject`, or `timeout`, and actor must equal
  the policy reviewer. Return the four audit sections shown by the tests. Reject malformed,
  inconsistent, non-finite, or unrepresentable input and do not mutate any argument.
signature:
  entrypoint: audit_responsible_decision
  stub: |
    def audit_responsible_decision(records, candidate, policy, review_event):
        # Integrate fairness, privacy, traceability, and accountable oversight.
        pass
constraints: {max_runtime_ms: 1000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
