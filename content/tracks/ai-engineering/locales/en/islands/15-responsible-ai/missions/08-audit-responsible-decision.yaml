hints:
  - {level: 1, text: "Where do fairness evidence, protected subject data, decision lineage, and review responsibility meet?"}
  - {level: 2, text: "Validate each boundary first, then assemble four fresh result sections from one candidate."}
  - {level: 3, text: "After validating each stage, another workflow can assemble `packet = {'check': check, 'safe_view': dict(view), 'gate': gate}`."}
solution: |
  def audit_responsible_decision(records, candidate, policy, review_event):
      import math
      from datetime import datetime
      record_keys = {"id", "group", "selected", "prediction", "actual"}
      candidate_keys = record_keys | {"decision_id", "model_version", "evidence_refs", "factors", "subject", "impact", "confidence"}
      policy_keys = {"fairness_metric", "fairness_tolerance", "allowed_subject_fields", "redact_subject_fields", "retention_days", "review_impacts", "min_automatic_confidence", "reviewer"}
      impacts = {"low", "medium", "high"}
      def finite_number(value, lower=None, upper=None):
          if type(value) not in (int, float):
              return False
          try:
              if not math.isfinite(value):
                  return False
          except (OverflowError, TypeError):
              return False
          return (lower is None or value >= lower) and (upper is None or value <= upper)
      def valid_outcome(item, expected_keys):
          return type(item) is dict and set(item) == expected_keys and type(item["id"]) is str and bool(item["id"].strip()) and type(item["group"]) is str and bool(item["group"].strip()) and all(type(item[key]) is bool for key in ("selected", "prediction", "actual"))
      if type(records) is not list or any(not valid_outcome(item, record_keys) for item in records) or type(candidate) is not dict or set(candidate) != candidate_keys or not valid_outcome(candidate, candidate_keys):
          raise ValueError("invalid decision data")
      ids = [item["id"] for item in records]
      if len(set(ids)) != len(ids) or candidate["id"] in ids:
          raise ValueError("duplicate id")
      if type(candidate["decision_id"]) is not str or not candidate["decision_id"].strip() or type(candidate["model_version"]) is not str or not candidate["model_version"].strip():
          raise ValueError("invalid decision record")
      evidence = candidate["evidence_refs"]
      factors = candidate["factors"]
      subject = candidate["subject"]
      if type(evidence) is not list or not evidence or any(type(ref) is not str or not ref.startswith("evidence:") or len(ref) == 9 for ref in evidence) or len(set(evidence)) != len(evidence):
          raise ValueError("invalid evidence")
      if type(factors) is not dict or not factors or any(type(name) is not str or not name.strip() or not finite_number(value) for name, value in factors.items()):
          raise ValueError("invalid factors")
      if type(subject) is not dict or any(type(key) is not str or not key for key in subject):
          raise ValueError("invalid subject")
      for value in subject.values():
          if value is None or type(value) in (str, bool):
              continue
          if not finite_number(value):
              raise ValueError("invalid subject")
      if type(candidate["impact"]) is not str or candidate["impact"] not in impacts or not finite_number(candidate["confidence"], 0, 1):
          raise ValueError("invalid routing input")
      if type(policy) is not dict or set(policy) != policy_keys or policy["fairness_metric"] not in ("selection_rate", "error_rate"):
          raise ValueError("invalid policy")
      if not finite_number(policy["fairness_tolerance"], 0, 1) or not finite_number(policy["min_automatic_confidence"], 0, 1):
          raise ValueError("invalid policy")
      allowed = policy["allowed_subject_fields"]
      redact = policy["redact_subject_fields"]
      review_impacts = policy["review_impacts"]
      if type(allowed) is not list or type(redact) is not list or any(type(key) is not str or not key for key in allowed + redact) or len(set(allowed)) != len(allowed) or len(set(redact)) != len(redact) or not set(redact) <= set(allowed) <= set(subject):
          raise ValueError("invalid privacy policy")
      if type(review_impacts) is not list or any(type(item) is not str or item not in impacts for item in review_impacts) or len(set(review_impacts)) != len(review_impacts):
          raise ValueError("invalid oversight policy")
      if type(policy["retention_days"]) is not int or policy["retention_days"] < 0 or type(policy["reviewer"]) is not str or not policy["reviewer"].strip():
          raise ValueError("invalid policy")
      combined = records + [{key: candidate[key] for key in record_keys}]
      counts = {}
      for item in combined:
          total, selections, errors = counts.get(item["group"], (0, 0, 0))
          counts[item["group"]] = (total + 1, selections + item["selected"], errors + (item["prediction"] != item["actual"]))
      raw_rates = {}
      for group, (total, selections, errors) in counts.items():
          numerator = selections if policy["fairness_metric"] == "selection_rate" else errors
          raw_rates[group] = numerator / total
      gap = max(raw_rates.values()) - min(raw_rates.values())
      fairness = {"metric": policy["fairness_metric"], "rates": {group: round(raw_rates[group], 3) for group in sorted(raw_rates)}, "gap": round(gap, 3), "within_tolerance": gap <= policy["fairness_tolerance"]}
      safe_subject = {key: "[REDACTED]" if key in redact else subject[key] for key in allowed}
      privacy = {"subject": safe_subject, "retention_days": policy["retention_days"]}
      decision_record = {"decision_id": candidate["decision_id"], "model_version": candidate["model_version"], "evidence_refs": list(evidence), "factors": dict(factors)}
      if candidate["impact"] in review_impacts:
          route, reason = "human-review", "impact"
      elif candidate["confidence"] < policy["min_automatic_confidence"]:
          route, reason = "human-review", "confidence"
      else:
          route, reason = "automatic", "eligible"
      if route == "automatic":
          if review_event is not None:
              raise ValueError("automatic decisions cannot have a review event")
          oversight = {"route": route, "reason": reason, "reviewer": None, "status": "automatic", "event": None}
      else:
          if type(review_event) is not dict or set(review_event) != {"event", "actor", "occurred_at"} or review_event["event"] not in ("approve", "reject", "timeout") or review_event["actor"] != policy["reviewer"] or type(review_event["occurred_at"]) is not str or len(review_event["occurred_at"]) != 20:
              raise ValueError("invalid review event")
          try:
              parsed_event_time = datetime.strptime(review_event["occurred_at"], "%Y-%m-%dT%H:%M:%SZ")
          except ValueError as error:
              raise ValueError("invalid review event") from error
          if parsed_event_time.strftime("%Y-%m-%dT%H:%M:%SZ") != review_event["occurred_at"]:
              raise ValueError("invalid review event")
          statuses = {"approve": "approved", "reject": "rejected", "timeout": "timed_out"}
          oversight = {"route": route, "reason": reason, "reviewer": policy["reviewer"], "status": statuses[review_event["event"]], "event": dict(review_event)}
      return {"fairness": fairness, "privacy": privacy, "decision_record": decision_record, "oversight": oversight}
