id: ai-math-04
title: Measure a sample
track: ai-engineering
island: mathematical-statistical-foundations
order: 4
difficulty: challenging
tags: [ai-engineering, statistics, samples]
xp: 45
concepts: [descriptive-statistics]
teaching:
  analogy: A coach needs the average lap time and also how tightly the laps cluster around it.
  explanation: Descriptive statistics summarize a complete sample. Mean is the average; median is the middle sorted value. Quantiles locate a proportion through sorted values; use linear interpolation between neighbors when the position falls between them. Population variance averages squared distances from the mean, and standard deviation is its square root.
  worked_example: "scores = [2, 4, 6]\naverage = sum(scores) / len(scores)\nprint(average)"
  key_points: ["Sort a copy to preserve the input.", "Even-sized samples have two middle values.", "Q1 and Q3 use positions 0.25 and 0.75 through the sorted sample.", "Variance uses squared distances."]
brief: Write `describe_sample(values) -> dict`. For a nonempty list of finite int or float values, return `count`, `mean`, `median`, `q1`, `q3`, `variance`, and `standard_deviation`. Use population variance and linearly interpolate quantiles at positions `(n - 1) * 0.25` and `(n - 1) * 0.75`. Raise `ValueError` for invalid input.
signature:
  entrypoint: describe_sample
  stub: "def describe_sample(values):\n    # Return deterministic population statistics without mutating values.\n    pass\n"
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
  - args: [[1, 2, 3]]
    expect: {count: 3, mean: 2.0, median: 2, q1: 1.5, q3: 2.5, variance: 0.6666666666666666, standard_deviation: 0.816496580927726}
  - args: [[1, 3, 5, 7]]
    expect: {count: 4, mean: 4.0, median: 4.0, q1: 2.5, q3: 5.5, variance: 5.0, standard_deviation: 2.23606797749979}
  hidden:
  - args: [[4]]
    expect: {count: 1, mean: 4.0, median: 4, q1: 4, q3: 4, variance: 0.0, standard_deviation: 0.0}
  - args: [[]]
    raises: ValueError
  - args: [[1, true]]
    raises: ValueError
  - args: [[.nan]]
    raises: ValueError
  - args: ["123"]
    raises: ValueError
hints:
- {level: 1, text: "Which values require a sorted copy, and where can a quantile fall between two values?"}
- {level: 2, text: Compute the mean before distances and find each quantile's fractional sorted position.}
- {level: 3, text: "Pattern: `lower + fraction * (upper - lower)`."}
solution: "def describe_sample(values):\n    import math\n    if not isinstance(values, list) or not values or any(type(x) not in (int, float) or not math.isfinite(x) for x in values): raise ValueError('invalid values')\n    count = len(values); mean = sum(values) / count; ordered = sorted(values); middle = count // 2\n    def quantile(q):\n        position = (count - 1) * q; lower = int(position); upper = min(lower + 1, count - 1); fraction = position - lower\n        return ordered[lower] + fraction * (ordered[upper] - ordered[lower])\n    median = quantile(0.5)\n    variance = sum((x - mean) ** 2 for x in values) / count\n    return {'count': count, 'mean': mean, 'median': median, 'q1': quantile(0.25), 'q3': quantile(0.75), 'variance': variance, 'standard_deviation': math.sqrt(variance)}\n"
