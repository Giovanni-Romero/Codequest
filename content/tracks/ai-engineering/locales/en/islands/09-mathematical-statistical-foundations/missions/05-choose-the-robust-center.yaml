id: ai-math-05
title: Choose the robust center
track: ai-engineering
island: mathematical-statistical-foundations
order: 5
difficulty: challenging
tags: [ai-engineering, statistics, outliers]
xp: 45
concepts: [descriptive-statistics]
teaching:
  analogy: One broken thermometer should not decide the usual room temperature.
  explanation: 'The mean uses every value, so a far outlier can pull it strongly. The median resists a single extreme value. Use an explicit rule: choose the median when any value is farther than the limit from the mean.'
  worked_example: "temperatures = [20, 21, 80]\nmean = sum(temperatures) / len(temperatures)\nprint(mean)"
  key_points: ["Outlier rules must be explicit.", "Median needs a sorted copy.", "Do not mutate the supplied list."]
brief: 'Write `choose_center(values, outlier_limit) -> dict`. Validate a nonempty finite numeric list and a positive finite numeric limit. Return `{"method": "mean" or "median", "center": number, "has_outlier": bool}`. An outlier is any value whose absolute distance from the mean is greater than the limit.'
signature:
  entrypoint: choose_center
  stub: "def choose_center(values, outlier_limit):\n    # Choose a center with explicit outlier evidence.\n    pass\n"
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
  - args: [[10, 11, 12], 5]
    expect: {method: mean, center: 11.0, has_outlier: false}
  - args: [[10, 11, 100], 20]
    expect: {method: median, center: 11, has_outlier: true}
  hidden:
  - args: [[5], 1]
    expect: {method: mean, center: 5.0, has_outlier: false}
  - args: [[1, 3, 5, 7], 2]
    expect: {method: median, center: 4.0, has_outlier: true}
  - args: [[1], 0]
    raises: ValueError
  - args: [[1, false], 2]
    raises: ValueError
  - args: [[1], .inf]
    raises: ValueError
hints:
- {level: 1, text: "Which center changes least when one value is far away?"}
- {level: 2, text: Compare every value's distance from the mean to the limit.}
- {level: 3, text: "Pattern: `any(abs(x - mean) > limit for x in values)`."}
solution: "def choose_center(values, outlier_limit):\n    import math\n    if not isinstance(values, list) or not values or any(type(x) not in (int, float) or not math.isfinite(x) for x in values) or type(outlier_limit) not in (int, float) or not math.isfinite(outlier_limit) or outlier_limit <= 0: raise ValueError('invalid input')\n    mean = sum(values) / len(values); has_outlier = any(abs(x - mean) > outlier_limit for x in values)\n    if not has_outlier: return {'method': 'mean', 'center': mean, 'has_outlier': False}\n    ordered = sorted(values); middle = len(values) // 2; median = ordered[middle] if len(values) % 2 else (ordered[middle - 1] + ordered[middle]) / 2\n    return {'method': 'median', 'center': median, 'has_outlier': True}\n"
