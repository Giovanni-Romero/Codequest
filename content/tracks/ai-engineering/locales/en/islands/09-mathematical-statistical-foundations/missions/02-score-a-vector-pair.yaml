id: ai-math-02
title: Measure an aligned vector pair
track: ai-engineering
island: mathematical-statistical-foundations
order: 2
difficulty: challenging
tags: [ai-engineering, mathematics, vectors]
xp: 45
concepts: [vector-operations]
teaching:
  analogy: Multiply each price by its matching quantity, then total the receipt.
  explanation: The dot product multiplies aligned coordinates and adds those products. It produces one scalar score from two vectors. The L2 norm is the square root of a vector's dot product with itself, so it measures vector length. Alignment and finite numeric values still matter.
  worked_example: "prices = [2, 3]\nquantities = [4, 5]\ntotal = sum(prices[i] * quantities[i] for i in range(len(prices)))\nprint(total)"
  key_points: ["A dot product returns one scalar.", "The L2 norm measures length, not direction.", "Each product uses matching positions.", "Validation happens before every calculation."]
brief: 'Write `vector_metrics(left, right) -> dict`. Return `{"dot_product": number, "left_norm": number, "right_norm": number}` for equal, nonempty finite numeric lists. Each norm is the L2 norm. Raise `ValueError` for invalid vectors.'
signature:
  entrypoint: vector_metrics
  stub: "def vector_metrics(left, right):\n    # Return dot-product and L2-norm evidence for validated vectors.\n    pass\n"
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
  - args: [[1, 2, 3], [4, 5, 6]]
    expect: {dot_product: 32, left_norm: 3.7416573867739413, right_norm: 8.774964387392123}
  - args: [[1.5, -2], [2, 3]]
    expect: {dot_product: -3.0, left_norm: 2.5, right_norm: 3.605551275463989}
  hidden:
  - args: [[0], [9]]
    expect: {dot_product: 0, left_norm: 0.0, right_norm: 9.0}
  - args: [[1], [2, 3]]
    raises: ValueError
  - args: [[], []]
    raises: ValueError
  - args: [[1], [false]]
    raises: ValueError
  - args: [[1], [.inf]]
    raises: ValueError
hints:
- {level: 1, text: "What does each coordinate contribute to the scalar score and to vector length?"}
- {level: 2, text: Accumulate matching products for the dot product and squared coordinates for each norm.}
- {level: 3, text: "Pattern: `math.sqrt(sum(x * x for x in values))`."}
solution: "def vector_metrics(left, right):\n    import math\n    def valid(v):\n        return isinstance(v, list) and bool(v) and all(type(x) in (int, float) and math.isfinite(x) for x in v)\n    if not valid(left) or not valid(right) or len(left) != len(right): raise ValueError('invalid vectors')\n    return {'dot_product': sum(a * b for a, b in zip(left, right)), 'left_norm': math.sqrt(sum(x * x for x in left)), 'right_norm': math.sqrt(sum(x * x for x in right))}\n"
