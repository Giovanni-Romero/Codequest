id: ai-math-07
title: Classify two events
track: ai-engineering
island: mathematical-statistical-foundations
order: 7
difficulty: challenging
tags: [ai-engineering, probability, conditioning]
xp: 45
concepts: [probability-distributions]
teaching:
  analogy: Two doors can never open together, while two independent coin flips can both land heads. Those are different relationships.
  explanation: Conditional probability narrows the reference group to an event already known to happen. Independent events satisfy `P(A and B) = P(A) * P(B)`. Mutually exclusive events satisfy `P(A and B) = 0`; except for zero-probability events, they cannot be independent. The right-event probability must be positive to calculate `P(left | right)`.
  worked_example: "red_and_round = 2\nred = 5\nprint(red_and_round / red)"
  key_points: ["The denominator is the known right event.", "Independence compares the joint probability with a product.", "Mutual exclusion makes the joint probability zero.", "Zero cannot be a conditioning denominator."]
brief: 'Write `classify_events(joint, left, right) -> dict`. Inputs are finite numeric probabilities in `[0, 1]`, excluding bool. Require a feasible joint probability and a positive `right`. Return `{"conditional_on_right": number, "independent": bool, "mutually_exclusive": bool}`. Treat values within `1e-9` as equal; otherwise raise `ValueError`.'
signature:
  entrypoint: classify_events
  stub: "def classify_events(joint, left, right):\n    # Return validated conditional and event-relationship evidence.\n    pass\n"
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
  - args: [0.2, 0.5, 0.4]
    expect: {conditional_on_right: 0.5, independent: true, mutually_exclusive: false}
  - args: [0, 0.5, 0.3]
    expect: {conditional_on_right: 0.0, independent: false, mutually_exclusive: true}
  hidden:
  - args: [0.25, 0.5, 0.5]
    expect: {conditional_on_right: 0.5, independent: true, mutually_exclusive: false}
  - args: [0.4, 0.5, 0]
    raises: ValueError
  - args: [0.6, 0.5, 0.8]
    raises: ValueError
  - args: [-0.1, 0.5, 0.5]
    raises: ValueError
  - args: [true, 1, 1]
    raises: ValueError
  - args: [.nan, 0.5, 0.5]
    raises: ValueError
  - args: [0.2, 0.5, .inf]
    raises: ValueError
hints:
- {level: 1, text: "Can two events both happen, and does knowing one change the other?"}
- {level: 2, text: Compare the joint probability with zero and with `left * right` after validation.}
- {level: 3, text: "Pattern: `abs(joint - left * right) <= 1e-9`."}
solution: "def classify_events(joint, left, right):\n    import math\n    if any(type(x) not in (int, float) or not math.isfinite(x) or not 0 <= x <= 1 for x in (joint, left, right)) or right <= 0 or joint > left or joint > right or joint < left + right - 1: raise ValueError('invalid probability')\n    return {'conditional_on_right': joint / right, 'independent': abs(joint - left * right) <= 1e-9, 'mutually_exclusive': joint == 0}\n"
