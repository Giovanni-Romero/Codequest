id: ai-math-06
title: Validate a finite distribution
track: ai-engineering
island: mathematical-statistical-foundations
order: 6
difficulty: challenging
tags: [ai-engineering, probability, distributions]
xp: 45
concepts: [probability-distributions]
teaching:
  analogy: A pie chart is valid only when its slices make one whole pie.
  explanation: A finite distribution maps unique outcome labels to probabilities. Each probability is finite and between zero and one. Validate every row and the total before calculating expectation; this mission never normalizes or partly calculates invalid input. Expectation is the probability-weighted outcome value.
  worked_example: "weights = [0.25, 0.75]\nvalues = [0, 4]\nprint(sum(weights[i] * values[i] for i in range(2)))"
  key_points: ["Validation does not silently repair totals.", "Validate the whole list before any total or expectation calculation.", "Labels must be unique.", "Expectation is a weighted average."]
brief: 'Write `validate_distribution(outcomes) -> dict`. Accept a nonempty list of `[label, value, probability]` rows where labels are unique nonempty strings and value/probability are finite numbers (not bool). Require probabilities in `[0, 1]` and a total within `1e-9` of one. Return `{"total_probability": number, "expectation": number}` or raise `ValueError`.'
signature:
  entrypoint: validate_distribution
  stub: "def validate_distribution(outcomes):\n    # Validate a finite distribution; never normalize it.\n    pass\n"
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
  - args: [[[low, 0, 0.25], [high, 4, 0.75]]]
    expect: {total_probability: 1.0, expectation: 3.0}
  - args: [[[a, -1, 0.5], [b, 1, 0.5]]]
    expect: {total_probability: 1.0, expectation: 0.0}
  hidden:
  - args: [[[only, 8, 1.0]]]
    expect: {total_probability: 1.0, expectation: 8.0}
  - args: [[[a, 1, 0.4], [a, 2, 0.6]]]
    raises: ValueError
  - args: [[[a, 1, 0.9]]]
    raises: ValueError
  - args: [[[a, 1, -0.1], [b, 2, 1.1]]]
    raises: ValueError
  - args: [[[a, .nan, 0.5], [b, 2, 0.5]]]
    raises: ValueError
  - args: [[[a, 1, .inf], [b, 2, 0.5]]]
    raises: ValueError
  - args: [[]]
    raises: ValueError
hints:
- {level: 1, text: "What must the pie slices add up to before you calculate anything?"}
- {level: 2, text: First validate every row and label; only then calculate totals and weighted values.}
- {level: 3, text: "Pattern: `for value, probability in validated_rows: expected += value * probability`."}
solution: "def validate_distribution(outcomes):\n    import math\n    if not isinstance(outcomes, list) or not outcomes: raise ValueError('invalid outcomes')\n    labels = set()\n    for row in outcomes:\n        if not isinstance(row, list) or len(row) != 3: raise ValueError('invalid row')\n        label, value, probability = row\n        if type(label) is not str or not label or label in labels or type(value) not in (int, float) or type(probability) not in (int, float) or not math.isfinite(value) or not math.isfinite(probability) or not 0 <= probability <= 1: raise ValueError('invalid row')\n        labels.add(label)\n    total = sum(row[2] for row in outcomes)\n    if abs(total - 1) > 1e-9: raise ValueError('invalid total')\n    expectation = sum(row[1] * row[2] for row in outcomes)\n    return {'total_probability': total, 'expectation': expectation}\n"
