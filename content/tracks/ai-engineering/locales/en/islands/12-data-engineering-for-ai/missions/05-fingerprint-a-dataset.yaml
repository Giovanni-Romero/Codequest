id: ai-data-05
title: Fingerprint a dataset
track: ai-engineering
island: data-engineering-for-ai
order: 5
difficulty: challenging
tags: [ai-engineering, data, versioning, hashing]
xp: 45
concepts: [dataset-versioning]
teaching:
  analogy: A filename is a handwritten label; a content fingerprint is a seal derived from every declared byte. Changing the cargo changes the seal.
  explanation: An immutable dataset version starts with canonical serialization. Sorting mapping keys and fixing separators removes formatting differences, while SHA-256 identifies the resulting UTF-8 bytes. Row order remains part of dataset contents and therefore part of the version.
  worked_example: |
    import hashlib
    payload = b"[]"
    print(hashlib.sha256(payload).hexdigest())
  key_points:
    - Version contents, not filenames.
    - Canonical serialization removes irrelevant key-order differences.
    - Row order remains meaningful unless a transformation declares otherwise.
    - Reject values that cannot be serialized deterministically.
brief: >
  Write `fingerprint_dataset(records) -> str`. Require a list containing only dictionaries.
  Serialize with `json.dumps(records, sort_keys=True, separators=(",", ":"),
  ensure_ascii=False, allow_nan=False)`, encode as UTF-8, and return the lowercase SHA-256
  hexadecimal digest. Preserve row order. Raise `ValueError` for malformed containers,
  non-JSON values, NaN, or infinity. Do not mutate the dataset.
signature:
  entrypoint: fingerprint_dataset
  stub: |
    def fingerprint_dataset(records):
        # Derive an immutable version from canonical dataset contents.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[]]
      expect: 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
    - args: [[{id: 1, text: a}]]
      expect: 3d156891e14d20c2e390a896744e57d69751a209cc187e572afe2b187503d278
  hidden:
    - args: [[{text: a, id: 1}]]
      expect: 3d156891e14d20c2e390a896744e57d69751a209cc187e572afe2b187503d278
    - args: [[{id: 2, score: 4}, {id: 1, score: 3}]]
      expect: 086e29faa660a0587cf86cd42d040cbac60e4a07679625407cfc0a1010370ef8
    - args: [not-a-list]
      raises: ValueError
    - args: [[not-a-record]]
      raises: ValueError
    - args: [[{score: .inf}]]
      raises: ValueError
hints:
  - level: 1
    text: "Which serialization choices must be fixed before hashing can represent content rather than formatting?"
  - level: 2
    text: "Canonicalize with sorted keys, compact separators, UTF-8, and disallowed non-finite floats."
  - level: 3
    text: "Hash `payload.encode('utf-8')` with `hashlib.sha256(...).hexdigest()` and translate serialization errors to `ValueError`."
solution: |
  def fingerprint_dataset(records):
      import hashlib
      import json
      if not isinstance(records, list) or any(not isinstance(record, dict) for record in records):
          raise ValueError("invalid dataset")
      def json_value(value):
          if value is None or type(value) in (str, int, float, bool):
              return True
          if isinstance(value, list):
              return all(json_value(item) for item in value)
          if isinstance(value, dict):
              return all(type(key) is str and json_value(item) for key, item in value.items())
          return False
      if not json_value(records):
          raise ValueError("non-canonical dataset")
      try:
          payload = json.dumps(records, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)
          digest = hashlib.sha256(payload.encode("utf-8")).hexdigest()
      except (TypeError, ValueError, OverflowError, UnicodeError) as caught:
          raise ValueError("non-canonical dataset") from caught
      return digest
