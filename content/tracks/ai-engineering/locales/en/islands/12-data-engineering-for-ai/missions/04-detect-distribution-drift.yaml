id: ai-data-04
title: Detect distribution drift
track: ai-engineering
island: data-engineering-for-ai
order: 4
difficulty: challenging
tags: [ai-engineering, data, quality, drift]
xp: 45
concepts: [data-quality]
teaching:
  analogy: Two cargo fleets can have the same average weight while one varies far more. Comparing both center and spread catches a change that one headline number misses.
  explanation: Distribution monitoring compares a reference sample with a candidate sample using declared metrics and thresholds. Mean shift captures movement in center; variance shift captures changing spread. A deterministic report shows which signal crossed the limit.
  worked_example: |
    reference_mean = 2
    candidate_mean = 3
    mean_shift = abs(candidate_mean - reference_mean)
    print(mean_shift)
  key_points:
    - A stable mean does not imply a stable distribution.
    - Compare candidate data against an explicit reference.
    - Thresholds are policy, not statistical truth.
    - Derived overflow is an invalid measurement.
brief: >
  Write `detect_distribution_drift(reference, candidate, threshold) -> dict`. Samples must
  be nonempty lists of finite integers or floats excluding `bool`; threshold must be finite
  and nonnegative. Compute each population mean and variance, then absolute `mean_shift` and
  `variance_shift`. Set `drift_detected` when either shift is strictly greater than threshold.
  Return all six numeric values rounded to 6 decimals plus the flag. Raise `ValueError` for
  invalid input or non-finite derived arithmetic.
signature:
  entrypoint: detect_distribution_drift
  stub: |
    def detect_distribution_drift(reference, candidate, threshold):
        # Compare center and spread against one declared threshold.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[1, 2, 3], [2, 3, 4], 0.5]
      expect: {reference_mean: 2.0, candidate_mean: 3.0, mean_shift: 1.0, reference_variance: 0.666667, candidate_variance: 0.666667, variance_shift: 0.0, drift_detected: true}
    - args: [[1, 3], [0, 4], 2]
      expect: {reference_mean: 2.0, candidate_mean: 2.0, mean_shift: 0.0, reference_variance: 1.0, candidate_variance: 4.0, variance_shift: 3.0, drift_detected: true}
  hidden:
    - args: [[1, 2], [1, 2], 0]
      expect: {reference_mean: 1.5, candidate_mean: 1.5, mean_shift: 0.0, reference_variance: 0.25, candidate_variance: 0.25, variance_shift: 0.0, drift_detected: false}
    - args: [[], [1], 0]
      raises: ValueError
    - args: [[true], [1], 0]
      raises: ValueError
    - args: [[1], [.nan], 0]
      raises: ValueError
    - args: [[1], [1], -1]
      raises: ValueError
    - args: [[1.0e+308, -1.0e+308], [0], 1]
      raises: ValueError
    - args: [[], [0], 1]
      raises: ValueError
hints:
  - level: 1
    text: "Which change can a mean-only monitor never see?"
  - level: 2
    text: "Compute population variance as the average squared distance from each sample mean."
  - level: 3
    text: "Catch overflow and verify every mean, variance, and shift with `math.isfinite` before rounding."
solution: |
  def detect_distribution_drift(reference, candidate, threshold):
      import math
      def finite_number(value):
          if type(value) not in (int, float):
              return False
          try:
              return math.isfinite(value)
          except OverflowError:
              return False
      if not isinstance(reference, list) or not reference or not isinstance(candidate, list) or not candidate:
          raise ValueError("invalid samples")
      if not all(finite_number(value) for value in reference + candidate) or not finite_number(threshold) or threshold < 0:
          raise ValueError("invalid number")
      try:
          reference_mean = sum(reference) / len(reference)
          candidate_mean = sum(candidate) / len(candidate)
          reference_variance = sum((value - reference_mean) ** 2 for value in reference) / len(reference)
          candidate_variance = sum((value - candidate_mean) ** 2 for value in candidate) / len(candidate)
          mean_shift = abs(candidate_mean - reference_mean)
          variance_shift = abs(candidate_variance - reference_variance)
      except OverflowError as caught:
          raise ValueError("non-finite metric") from caught
      values = (reference_mean, candidate_mean, mean_shift, reference_variance, candidate_variance, variance_shift)
      if not all(math.isfinite(value) for value in values):
          raise ValueError("non-finite metric")
      return {
          "reference_mean": round(reference_mean, 6),
          "candidate_mean": round(candidate_mean, 6),
          "mean_shift": round(mean_shift, 6),
          "reference_variance": round(reference_variance, 6),
          "candidate_variance": round(candidate_variance, 6),
          "variance_shift": round(variance_shift, 6),
          "drift_detected": mean_shift > threshold or variance_shift > threshold,
      }
