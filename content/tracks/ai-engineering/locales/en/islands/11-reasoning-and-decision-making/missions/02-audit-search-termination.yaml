id: ai-reasoning-02
title: Audit search termination
track: ai-engineering
island: reasoning-and-decision-making
order: 2
difficulty: challenging
tags: [ai-engineering, reasoning, search, cycles]
xp: 45
concepts: [state-space-search]
teaching:
  analogy: A navigator who never marks visited buoys can circle the same reef forever. An audit log proves which locations were expanded and why the voyage stopped.
  explanation: A finite graph search terminates when each reachable state is expanded at most once. Recording expansion order distinguishes finding a route from proving that no reachable route exists. Exhausting the frontier after guarding revisits is the evidence of completeness for this finite graph.
  worked_example: |
    graph = {"a": ["b"], "b": ["a"]}
    expanded = ["a", "b"]
    print(len(expanded) <= len(graph))
  key_points:
    - Cycles are harmless only when repeated states are rejected.
    - Expansion order is observable evidence, not hidden reasoning.
    - An empty frontier proves no reachable state remains.
    - Termination and reaching the goal are different facts.
brief: >
  Write `audit_search(graph, start, goal) -> dict` using breadth-first search. Apply the
  same complete graph validation as the previous mission. Return `path`, the ordered list
  `expanded`, `reached_goal`, and `terminated: true`. Stop as soon as the goal is expanded;
  otherwise exhaust the reachable graph. Each state may appear in `expanded` at most once.
  Raise `ValueError` for invalid input.
signature:
  entrypoint: audit_search
  stub: |
    def audit_search(graph, start, goal):
        # Expose the evidence that a finite graph search terminates.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [{a: [b, c], b: [a, goal], c: [a], goal: []}, a, goal]
      expect: {path: [a, b, goal], expanded: [a, b, c, goal], reached_goal: true, terminated: true}
    - args: [{a: [b], b: [a], goal: []}, a, goal]
      expect: {path: [], expanded: [a, b], reached_goal: false, terminated: true}
  hidden:
    - args: [{a: []}, a, a]
      expect: {path: [a], expanded: [a], reached_goal: true, terminated: true}
    - args: [{a: [b, b], b: [a], goal: []}, a, goal]
      expect: {path: [], expanded: [a, b], reached_goal: false, terminated: true}
    - args: [{a: [missing]}, a, a]
      raises: ValueError
    - args: [{a: []}, true, a]
      raises: ValueError
hints:
  - level: 1
    text: "What two collections prove both progress and bounded work?"
  - level: 2
    text: "Append a state to `expanded` only when it leaves the queue."
  - level: 3
    text: "Use a visited set when enqueuing, then return an audit whether the goal is found or the queue empties."
solution: |
  def audit_search(graph, start, goal):
      from collections import deque
      if not isinstance(graph, dict) or not graph or not isinstance(start, str) or not isinstance(goal, str):
          raise ValueError("invalid graph")
      if any(not isinstance(state, str) or not isinstance(neighbors, list) or any(not isinstance(neighbor, str) for neighbor in neighbors) for state, neighbors in graph.items()):
          raise ValueError("invalid graph")
      if start not in graph or goal not in graph or any(neighbor not in graph for neighbors in graph.values() for neighbor in neighbors):
          raise ValueError("unknown state")
      queue = deque([(start, [start])])
      visited = {start}
      expanded = []
      while queue:
          state, path = queue.popleft()
          expanded.append(state)
          if state == goal:
              return {"path": path, "expanded": expanded, "reached_goal": True, "terminated": True}
          for neighbor in graph[state]:
              if neighbor not in visited:
                  visited.add(neighbor)
                  queue.append((neighbor, path + [neighbor]))
      return {"path": [], "expanded": expanded, "reached_goal": False, "terminated": True}
