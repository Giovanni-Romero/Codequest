id: ai-reasoning-07
title: Compute a temporal-difference update
track: ai-engineering
island: reasoning-and-decision-making
order: 7
difficulty: challenging
tags: [ai-engineering, reasoning, reinforcement-learning, td]
xp: 45
concepts: [reinforcement-updates]
teaching:
  analogy: A route estimate changes after one voyage by blending its old belief with the reward and the next harbor's outlook. One observation nudges the chart; it does not become absolute truth.
  explanation: A one-step temporal-difference target is reward plus discounted next-state value. Subtracting the current estimate gives the TD error. The learning rate controls how much of that error changes the estimate, while the discount controls how strongly future value contributes.
  worked_example: |
    target = 1 + 0.9 * 4
    error = target - 2
    updated = 2 + 0.5 * error
    print(target, error, updated)
  key_points:
    - Reward and next-state value play different roles.
    - Alpha controls update size; gamma discounts future value.
    - One update is evidence, not ground truth.
    - Validate derived arithmetic as well as raw inputs.
brief: >
  Write `td_update(value, reward, next_value, alpha, gamma) -> dict`. All inputs must be
  finite integers or floats excluding `bool`; reject unrepresentable huge integers.
  Require `0 < alpha <= 1` and `0 <= gamma <= 1`. Compute `target = reward + gamma *
  next_value`, `td_error = target - value`, and `updated_value = value + alpha * td_error`.
  Reject non-finite derived values. Return all three values rounded to 12 decimal places.
  Raise `ValueError` for invalid input or arithmetic.
signature:
  entrypoint: td_update
  stub: |
    def td_update(value, reward, next_value, alpha, gamma):
        # Return one explicit temporal-difference update.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [0, 1, 2, 0.5, 0.9]
      expect: {target: 2.8, td_error: 2.8, updated_value: 1.4}
    - args: [10, -2, 4, 0.25, 0.5]
      expect: {target: 0.0, td_error: -10.0, updated_value: 7.5}
  hidden:
    - args: [2, 1, 4, 1, 0]
      expect: {target: 1.0, td_error: -1.0, updated_value: 1.0}
    - args: [0, 1, 2, 0, 0.9]
      raises: ValueError
    - args: [0, 1, 2, 0.5, 1.1]
      raises: ValueError
    - args: [true, 1, 2, 0.5, 0.9]
      raises: ValueError
    - args: [0, .inf, 2, 0.5, 0.9]
      raises: ValueError
    - args: [0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF, 1, 2, 0.5, 0.9]
      raises: ValueError
    - args: [0, 1.0e+308, 1.0e+308, 0.5, 1]
      raises: ValueError
hints:
  - level: 1
    text: "Which quantity is the destination of the update, and which is the gap from the current estimate?"
  - level: 2
    text: "Compute target, then TD error, then the alpha-scaled new value."
  - level: 3
    text: "Wrap arithmetic for overflow, check every derived value with `math.isfinite`, then round the returned fields."
solution: |
  def td_update(value, reward, next_value, alpha, gamma):
      import math
      def finite_number(item):
          if type(item) not in (int, float):
              return False
          try:
              return math.isfinite(item)
          except OverflowError:
              return False
      if not all(finite_number(item) for item in (value, reward, next_value, alpha, gamma)):
          raise ValueError("invalid number")
      if not 0 < alpha <= 1 or not 0 <= gamma <= 1:
          raise ValueError("invalid rate")
      try:
          target = reward + gamma * next_value
          error = target - value
          updated = value + alpha * error
      except OverflowError as caught:
          raise ValueError("non-finite update") from caught
      if not all(math.isfinite(item) for item in (target, error, updated)):
          raise ValueError("non-finite update")
      return {"target": round(target, 12), "td_error": round(error, 12), "updated_value": round(updated, 12)}
