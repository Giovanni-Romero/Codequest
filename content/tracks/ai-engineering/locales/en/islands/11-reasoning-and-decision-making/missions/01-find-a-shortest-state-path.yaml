id: ai-reasoning-01
title: Find a shortest state path
track: ai-engineering
island: reasoning-and-decision-making
order: 1
difficulty: challenging
tags: [ai-engineering, reasoning, search, bfs]
xp: 45
concepts: [state-space-search]
teaching:
  analogy: A harbor chart is not a decision by itself. It lists where each channel leads; a search records which channels were tried until a route reaches the destination.
  explanation: Breadth-first search explores an unweighted state graph one distance layer at a time. A queue holds paths still to inspect, while a visited set prevents repeated states from creating endless work. The first goal path removed from the queue is therefore shortest in number of actions.
  worked_example: |
    from collections import deque
    queue = deque([("dock", ["dock"])])
    visited = {"dock"}
    print(queue, visited)
  key_points:
    - States and actions must be represented explicitly.
    - The queue preserves increasing path length.
    - Mark a state visited when it enters the queue.
    - An unreachable goal returns an empty path.
brief: >
  Write `find_shortest_path(graph, start, goal) -> list`. `graph` maps each string state
  to a list of neighboring string states; every neighbor must also be a graph key. Validate
  the complete graph and string endpoints, excluding malformed containers. Use breadth-first
  search in the declared neighbor order. Return the shortest state path including both
  endpoints, or `[]` when the goal is unreachable. Raise `ValueError` for invalid input.
signature:
  entrypoint: find_shortest_path
  stub: |
    def find_shortest_path(graph, start, goal):
        # Return the shortest path through an explicit state graph.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [{dock: [reef, bay], reef: [goal], bay: [island], island: [goal], goal: []}, dock, goal]
      expect: [dock, reef, goal]
    - args: [{a: [b], b: [], c: []}, a, c]
      expect: []
  hidden:
    - args: [{a: [b], b: [a, c], c: []}, a, c]
      expect: [a, b, c]
    - args: [{only: []}, only, only]
      expect: [only]
    - args: [not-a-graph, a, b]
      raises: ValueError
    - args: [{a: b, b: []}, a, b]
      raises: ValueError
    - args: [{a: [missing]}, a, missing]
      raises: ValueError
hints:
  - level: 1
    text: "Which frontier order guarantees that a two-action route is inspected before every three-action route?"
  - level: 2
    text: "Store `(state, path)` pairs in `collections.deque` and keep a visited set."
  - level: 3
    text: "Pattern: pop from the left, return on the goal, and append each unseen neighbor with `path + [neighbor]`."
solution: |
  def find_shortest_path(graph, start, goal):
      from collections import deque
      if not isinstance(graph, dict) or not graph or not isinstance(start, str) or not isinstance(goal, str):
          raise ValueError("invalid graph")
      if any(not isinstance(state, str) or not isinstance(neighbors, list) or any(not isinstance(neighbor, str) for neighbor in neighbors) for state, neighbors in graph.items()):
          raise ValueError("invalid graph")
      if start not in graph or goal not in graph or any(neighbor not in graph for neighbors in graph.values() for neighbor in neighbors):
          raise ValueError("unknown state")
      queue = deque([(start, [start])])
      visited = {start}
      while queue:
          state, path = queue.popleft()
          if state == goal:
              return path
          for neighbor in graph[state]:
              if neighbor not in visited:
                  visited.add(neighbor)
                  queue.append((neighbor, path + [neighbor]))
      return []
