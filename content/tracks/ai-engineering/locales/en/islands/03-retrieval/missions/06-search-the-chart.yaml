id: ai-retrieval-06
title: Search the chart
track: ai-engineering
island: retrieval
order: 6
difficulty: moderate
tags: [ai-engineering, retrieval, similarity, ranking]
xp: 30

concepts: [similarity-scoring, top-k-ranking]

teaching:
  analogy: |
    A navigator measures every route before choosing the closest few. Choosing while
    still measuring can make an early mediocre route survive by accident.
  explanation: |
    Search separates scoring from ranking. Every document receives a comparable score,
    then stable top-k selection chooses the leaders. This intermediate score list is
    what makes retrieval explainable instead of magical.
  worked_example: |
    routes = [{"id": "A", "miles": 9}, {"id": "B", "miles": 4}]
    measured = sorted(routes, key=lambda route: route["miles"])
    print([route["id"] for route in measured[:1]])
  key_points:
    - Score all candidates before truncating.
    - Higher cosine similarity ranks first.
    - Original order breaks ties deterministically.

brief: |
  Write `search_top_k(query, documents, k)`. Documents contain unique `id` and `text`.
  Use the tokenization and cosine rules from earlier missions, rank by descending score,
  preserve input order for ties, and return at most `k` IDs. Raise `ValueError` for a
  negative `k` or duplicate ID.

signature:
  entrypoint: search_top_k
  stub: |
    def search_top_k(query, documents, k):
        # Score the full corpus, then select a stable top-k.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: ["port map", [{id: tide, text: "tide table"}, {id: exact, text: "port map"}, {id: partial, text: port}], 2]
      expect: [exact, partial]
    - args: [anchor, [{id: first, text: anchor}, {id: second, text: anchor}], 2]
      expect: [first, second]
  hidden:
    - args: [x, [], 3]
      expect: []
    - args: [x, [{id: A, text: x}], 0]
      expect: []
    - args: [x, [{id: A, text: y}], 4]
      expect: [A]
    - args: [x, [], -1]
      raises: ValueError
    - args: [x, [{id: A, text: x}, {id: A, text: y}], 1]
      raises: ValueError

hints:
  - {level: 1, text: "What complete intermediate list must exist before top-k selection?"}
  - {level: 2, text: "Build `{id, score}` records in input order, stable-sort descending, then slice."}
  - level: 3
    text: |
      A race judge records every finish time first, sorts the complete sheet with a
      stable key, and only then publishes the requested number of names.

solution: |
  def search_top_k(query, documents, k):
      from math import sqrt

      if k < 0:
          raise ValueError("k must not be negative")

      def vector(text):
          counts = {}
          for raw in text.split():
              term = raw.casefold().strip(".,!?;:")
              if term:
                  counts[term] = counts.get(term, 0) + 1
          return counts

      query_vector = vector(query)
      query_size = sqrt(sum(value * value for value in query_vector.values()))
      scored = []
      seen = set()
      for document in documents:
          if document["id"] in seen:
              raise ValueError("duplicate document ID")
          seen.add(document["id"])
          item_vector = vector(document["text"])
          item_size = sqrt(sum(value * value for value in item_vector.values()))
          score = 0.0
          if query_size and item_size:
              dot = sum(
                  value * item_vector.get(term, 0)
                  for term, value in query_vector.items()
              )
              score = dot / (query_size * item_size)
          scored.append({"id": document["id"], "score": score})
      ranked = sorted(scored, key=lambda item: -item["score"])
      return [item["id"] for item in ranked[:k]]
