id: ai-retrieval-05
title: Score the fleet
track: ai-engineering
island: retrieval
order: 5
difficulty: moderate
tags: [ai-engineering, retrieval, sparse-representation, similarity]
xp: 30

concepts: [sparse-representation, similarity-scoring]

teaching:
  analogy: |
    A signal officer turns every incoming report into the same compact code before
    comparing it with the distress call. Raw prose is not compared by intuition.
  explanation: |
    Document scoring composes normalization, sparse term counts, and cosine similarity.
    It keeps the original document order because ranking is a later responsibility.
    Explicit IDs let every score remain traceable.
  worked_example: |
    wanted = {"water", "rope"}
    manifests = [{"id": "A", "items": {"rope"}}, {"id": "B", "items": {"fuel"}}]
    scores = [{"id": row["id"], "score": len(wanted & row["items"])} for row in manifests]
    print(scores)
  key_points:
    - Query and documents use identical normalization.
    - Scoring does not reorder candidates.
    - Duplicate IDs destroy provenance and are rejected.

brief: |
  Write `score_documents(query, documents)`. Each document has unique `id` and `text`.
  Build sparse term counts using mission 1's rules and return input-ordered dictionaries
  with `id` and cosine `score`. An empty vector scores `0.0`. Raise `ValueError` for a
  duplicate ID.

signature:
  entrypoint: score_documents
  stub: |
    def score_documents(query, documents):
        # Represent and score each document without ranking it yet.
        pass

constraints: {max_runtime_ms: 2000, max_memory_mb: 128}

tests:
  visible:
    - args: ["port map", [{id: A, text: "port map"}, {id: B, text: "tide table"}]]
      expect: [{id: A, score: 0.9999999999999998}, {id: B, score: 0.0}]
    - args: [anchor, [{id: A, text: anchor}, {id: B, text: "anchor anchor"}]]
      expect: [{id: A, score: 1.0}, {id: B, score: 1.0}]
  hidden:
    - args: [query, []]
      expect: []
    - args: ["", [{id: A, text: text}]]
      expect: [{id: A, score: 0.0}]
    - args: ["a b", [{id: A, text: a}]]
      expect: [{id: A, score: 0.7071067811865475}]
    - args: ["PORT!", [{id: A, text: "port,"}]]
      expect: [{id: A, score: 1.0}]
    - args: [x, [{id: A, text: x}, {id: A, text: y}]]
      raises: ValueError

hints:
  - {level: 1, text: "Can the query vector be built once before the document loop?"}
  - {level: 2, text: "Reuse the same tokenizer for both sides and the cosine formula from mission 2."}
  - level: 3
    text: |
      A catalogue search can encode the request once, encode each item in order, append
      `{id, score}` records, and reject an ID already seen.

solution: |
  def score_documents(query, documents):
      from math import sqrt

      def vector(text):
          counts = {}
          for raw in text.split():
              term = raw.casefold().strip(".,!?;:")
              if term:
                  counts[term] = counts.get(term, 0) + 1
          return counts

      query_vector = vector(query)
      query_size = sqrt(sum(weight * weight for weight in query_vector.values()))
      results = []
      seen = set()
      for document in documents:
          if document["id"] in seen:
              raise ValueError("document IDs must be unique")
          seen.add(document["id"])
          document_vector = vector(document["text"])
          document_size = sqrt(sum(weight * weight for weight in document_vector.values()))
          score = 0.0
          if query_size and document_size:
              dot = sum(
                  weight * document_vector.get(term, 0)
                  for term, weight in query_vector.items()
              )
              score = dot / (query_size * document_size)
          results.append({"id": document["id"], "score": score})
      return results
