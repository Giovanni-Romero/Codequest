id: ai-capstone-04
title: Assemble the readiness pack
track: ai-engineering
island: capstone
order: 4
difficulty: expert
tags: [ai-engineering, capstone]
xp: 60
concepts: [operational-readiness]
teaching:
  analogy: "Before the maiden voyage, the ship's papers are in order: class certificate, crew roster, cargo manifest, emergency procedures, insurance — one missing paper and the ship stays in port."
  explanation: "Operational-readiness produces a readiness pack: lineage (code+data+config versions), runbook (start/stop/scale/rollback steps), rollback trigger (metric threshold + automated action), and oversight route (who approves go-live, who receives alerts). Every item is a structured record, not prose. The pack is the evidence that the system can be deployed, observed, rolled back, and governed."
  worked_example: |
    def readiness_pack(architecture, matrix):
        return {
            "lineage": {"code_version": "v1.2.3", "data_version": "d-2024-01-15", "config_hash": "abc123"},
            "runbook": {"start": "deploy.sh", "stop": "kubectl delete", "scale": "hpa", "rollback": "kubectl rollout undo"},
            "rollback_trigger": {"metric": "accuracy", "threshold": 0.85, "action": "auto_rollback"},
            "oversight": {"approver": "ml-lead", "alert_recipients": ["sre", "governance"]},
        }
  key_points:
    - Lineage: immutable versions for code, data, config (hashes or semver).
    - Runbook: concrete commands for start, stop, scale, rollback — no "manual intervention" as a step.
    - Rollback trigger: a metric name, a numeric threshold, and an automated action (not "page on-call").
    - Oversight: named approver for go-live, named recipients for alerts — no "team" as a name.
    - The pack is validated as data; missing or vague fields are errors.
brief: >
  Write `readiness_pack(architecture, matrix) -> dict`. Architecture: output of mission 2.
  Matrix: output of mission 1. Reject bad input with ValueError. Return a dict with four keys:
  `lineage` (dict with `code_version`, `data_version`, `config_hash` all non-blank strings),
  `runbook` (dict with `start`, `stop`, `scale`, `rollback` all non-blank strings),
  `rollback_trigger` (dict with `metric` from matrix metrics, `threshold` float, `action` "auto_rollback"),
  `oversight` (dict with `approver` non-blank string, `alert_recipients` list of >=1 non-blank strings).
  Validate: rollback_trigger.metric must be one of matrix metrics; threshold must be number.
signature:
  entrypoint: readiness_pack
  stub: |
    def readiness_pack(architecture, matrix):
        # Build structured readiness pack with lineage, runbook, rollback trigger, oversight.
        pass
constraints: {max_runtime_ms: 5000, max_memory_mb: 256, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - {args: [{components: [{name: model, function: inference, stack: pytorch}]}, {matrix: [{metric: accuracy, threshold: 0.9, owner: ml-team}]}], expect: {lineage: {code_version: v1.0.0, data_version: d-2024-01-01, config_hash: abc123}, runbook: {start: deploy.sh, stop: stop.sh, scale: hpa, rollback: rollback.sh}, rollback_trigger: {metric: accuracy, threshold: 0.85, action: auto_rollback}, oversight: {approver: ml-lead, alert_recipients: [sre]}}}
    - {args: [{components: [{name: cache, function: latency_reduction, stack: redis}]}, {matrix: [{metric: p99_ms, threshold: 200, owner: platform}]}], expect: {lineage: {code_version: v1.0.0, data_version: d-2024-01-01, config_hash: abc123}, runbook: {start: deploy.sh, stop: stop.sh, scale: hpa, rollback: rollback.sh}, rollback_trigger: {metric: p99_ms, threshold: 0.85, action: auto_rollback}, oversight: {approver: ml-lead, alert_recipients: [sre]}}}
  hidden:
    - {args: [{components: [{name: model, function: inference, stack: pytorch}, {name: guard, function: bias_check, stack: custom}]}, {matrix: [{metric: accuracy, threshold: 0.9, owner: ml-team}, {metric: fairness_gap, threshold: 0.05, owner: governance}]}], expect: {lineage: {code_version: v1.0.0, data_version: d-2024-01-01, config_hash: abc123}, runbook: {start: deploy.sh, stop: stop.sh, scale: hpa, rollback: rollback.sh}, rollback_trigger: {metric: accuracy, threshold: 0.85, action: auto_rollback}, oversight: {approver: ml-lead, alert_recipients: [sre]}}}
    - {args: [{components: []}, {matrix: []}], raises: ValueError}
    - {args: [1, {matrix: []}], raises: ValueError}
    - {args: [{components: [{name: model, function: inference, stack: pytorch}]}, "invalid"], raises: ValueError}
    - {args: [{components: "invalid"}, {matrix: [{metric: accuracy, threshold: 0.9, owner: ml-team}]}], raises: ValueError}
    - {args: [{components: [{name: model, function: inference, stack: pytorch}]}, {matrix: []}], raises: ValueError}
    - {args: [{components: [{name: model, function: inference, stack: pytorch}]}, {matrix: [{metric: "unknown", threshold: 0.5, owner: governance}]}], raises: ValueError}
hints:
  - {level: 1, text: "What four artifacts must the readiness pack contain, and what makes each one valid vs. vague?"}
  - {level: 2, text: "Validate each field: non-blank strings for versions, commands, names; rollback metric must exist in matrix; recipients list non-empty."}
  - {level: 3, text: "A pack builder extracts metrics from matrix, then constructs the four dicts with hardcoded but validated values."}
solution: |
  def readiness_pack(architecture, matrix):
      if type(architecture) is not dict or type(architecture.get("components")) is not list or not architecture["components"]:
          raise ValueError("invalid architecture")
      if type(matrix) is not dict or type(matrix.get("matrix")) is not list or not matrix["matrix"]:
          raise ValueError("invalid matrix")
      allowed_metrics = {"accuracy", "p99_ms", "usd_per_1k", "fairness_gap", "uptime"}
      metrics = []
      for row in matrix["matrix"]:
          if type(row) is not dict or row.get("metric") not in allowed_metrics:
              raise ValueError("invalid matrix row")
          metrics.append(row["metric"])
      lineage = {"code_version": "v1.0.0", "data_version": "d-2024-01-01", "config_hash": "abc123"}
      runbook = {"start": "deploy.sh", "stop": "stop.sh", "scale": "hpa", "rollback": "rollback.sh"}
      first_metric = metrics[0]
      rollback_trigger = {"metric": first_metric, "threshold": 0.85, "action": "auto_rollback"}
      oversight = {"approver": "ml-lead", "alert_recipients": ["sre"]}
      for k, v in lineage.items():
          if type(v) is not str or not v.strip():
              raise ValueError(f"invalid lineage {k}")
      for k, v in runbook.items():
          if type(v) is not str or not v.strip():
              raise ValueError(f"invalid runbook {k}")
      if type(rollback_trigger["metric"]) is not str or rollback_trigger["metric"] not in metrics:
          raise ValueError("invalid rollback metric")
      if type(rollback_trigger["threshold"]) not in (int, float):
          raise ValueError("invalid threshold")
      if type(oversight["approver"]) is not str or not oversight["approver"].strip():
          raise ValueError("invalid approver")
      if type(oversight["alert_recipients"]) is not list or not oversight["alert_recipients"]:
          raise ValueError("invalid recipients")
      for r in oversight["alert_recipients"]:
          if type(r) is not str or not r.strip():
              raise ValueError("invalid recipient")
      return {"lineage": lineage, "runbook": runbook, "rollback_trigger": rollback_trigger, "oversight": oversight}
