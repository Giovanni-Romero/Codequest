id: ai-capstone-05
title: Defend a design tradeoff
track: ai-engineering
island: capstone
order: 5
difficulty: expert
tags: [ai-engineering, capstone]
xp: 60
concepts: [requirements-to-metrics, end-to-end-system-design]
teaching:
  analogy: Two shipyards bid for the same contract — Yard A proposes a faster hull but burns more fuel; Yard B is slower but fits the cost budget. The owner scores both against the acceptance matrix and picks the one that clears the most thresholds.
  explanation: "Defend-a-design-tradeoff takes two candidate architectures (each a component manifest) and scores both against the same acceptance matrix. Each component contributes to metrics; the architecture with more metrics within threshold wins. The output is data: per-metric scores for both designs, which thresholds each clears, and a final choice with reasons as structured fields."
  worked_example: |
    def defend_tradeoff(matrix, design_a, design_b):
        def score(design):
            hits = {}
            for comp in design["components"]:
                if comp["function"] == "inference":
                    hits["accuracy"] = 0.92
                elif comp["function"] == "latency_reduction":
                    hits["p99_ms"] = 180
            return hits
        sa = score(design_a)
        sb = score(design_b)
        metrics = {row["metric"]: row["threshold"] for row in matrix["matrix"]}
        a_clear = {m: sa.get(m, 0) >= thresh if m in ("accuracy", "uptime") else sa.get(m, 999) <= thresh for m, thresh in metrics.items()}
        b_clear = {m: sb.get(m, 0) >= thresh if m in ("accuracy", "uptime") else sb.get(m, 999) <= thresh for m, thresh in metrics.items()}
        a_count = sum(a_clear.values())
        b_count = sum(b_clear.values())
        winner = "A" if a_count >= b_count else "B"
        return {"design_a": sa, "design_b": sb, "a_clears": a_clear, "b_clears": b_clear, "winner": winner, "reason": f"Design {winner} clears {max(a_count, b_count)} thresholds"}
  key_points:
    - Both designs scored against the exact same matrix — no moving the goalposts.
    - Metrics where higher is better (accuracy, uptime) use >=; lower is better (latency, cost, fairness_gap) use <=.
    - Output includes per-metric scores, boolean clear/fail per metric per design, winner, and a structured reason.
    - The reason field is a string but its content is prescribed by the comparison logic.
brief: >
  Write `defend_tradeoff(matrix, design_a, design_b) -> dict`. Matrix: output of mission 1.
  Each design: component manifest from mission 2. Reject bad input. Score each design:
  inference->accuracy=0.92, latency_reduction->p99_ms=180, cost_control->usd_per_1k=0.4,
  bias_check->fairness_gap=0.03, uptime_tracking->uptime=0.9995. Metrics not covered by
  any component in a design score 0 (accuracy/uptime) or 999 (others). Compare each
  metric to matrix threshold (higher-better: accuracy, uptime; lower-better: rest).
  Return `{"design_a": {...}, "design_b": {...}, "a_clears": {...}, "b_clears": {...},
  "winner": "A"|"B", "reason": "Design X clears N thresholds"}`.
signature:
  entrypoint: defend_tradeoff
  stub: |
    def defend_tradeoff(matrix, design_a, design_b):
        # Score both designs against matrix, count cleared thresholds, pick winner.
        pass
constraints: {max_runtime_ms: 5000, max_memory_mb: 256, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - {args: [{matrix: [{metric: accuracy, threshold: 0.9, owner: ml-team}, {metric: p99_ms, threshold: 200, owner: platform}]}, {components: [{name: model, function: inference, stack: pytorch}, {name: cache, function: latency_reduction, stack: redis}]}, {components: [{name: model, function: inference, stack: pytorch}]}], expect: {design_a: {accuracy: 0.92, p99_ms: 180}, design_b: {accuracy: 0.92}, a_clears: {accuracy: true, p99_ms: true}, b_clears: {accuracy: true, p99_ms: false}, winner: A, reason: Design A clears 2 thresholds}}
    - {args: [{matrix: [{metric: accuracy, threshold: 0.9, owner: ml-team}]}, {components: []}, {components: [{name: model, function: inference, stack: pytorch}]}], expect: {design_a: {}, design_b: {accuracy: 0.92}, a_clears: {accuracy: false}, b_clears: {accuracy: true}, winner: B, reason: Design B clears 1 thresholds}}
  hidden:
    - {args: [{matrix: [{metric: accuracy, threshold: 0.9, owner: ml-team}, {metric: p99_ms, threshold: 200, owner: platform}, {metric: usd_per_1k, threshold: 0.5, owner: finance}, {metric: fairness_gap, threshold: 0.05, owner: governance}, {metric: uptime, threshold: 0.999, owner: sre}]}, {components: [{name: model, function: inference, stack: pytorch}, {name: cache, function: latency_reduction, stack: redis}, {name: optimizer, function: cost_control, stack: dspy}, {name: guard, function: bias_check, stack: custom}, {name: monitor, function: uptime_tracking, stack: pydantic-ai}]}, {components: [{name: model, function: inference, stack: pytorch}, {name: cache, function: latency_reduction, stack: redis}]}], expect: {design_a: {accuracy: 0.92, p99_ms: 180, usd_per_1k: 0.4, fairness_gap: 0.03, uptime: 0.9995}, design_b: {accuracy: 0.92, p99_ms: 180}, a_clears: {accuracy: true, p99_ms: true, usd_per_1k: true, fairness_gap: true, uptime: true}, b_clears: {accuracy: true, p99_ms: true, usd_per_1k: false, fairness_gap: false, uptime: false}, winner: A, reason: Design A clears 5 thresholds}}
    - {args: [{matrix: []}, {components: []}, {components: []}], raises: ValueError}
    - {args: [1, {components: []}, {components: []}], raises: ValueError}
    - {args: [{matrix: [{metric: accuracy, threshold: 0.9, owner: ml-team}]}, 1, {components: []}], raises: ValueError}
hints:
  - {level: 1, text: "Which metric directions are higher-better vs lower-better, and how does that change the threshold comparison?"}
  - {level: 2, text: "Build a function->metric score table; for each design, collect scores from its components; metrics not covered get default worst-case values."}
  - {level: 3, text: "A defender iterates matrix metrics, looks up each design's score, applies the right comparison operator, counts clears, and picks the higher count."}
solution: |
  def defend_tradeoff(matrix, design_a, design_b):
      if type(matrix) is not dict or type(matrix.get("matrix")) is not list or not matrix["matrix"]:
          raise ValueError("invalid matrix")
      if type(design_a) is not dict or "components" not in design_a:
          raise ValueError("invalid design_a")
      if type(design_b) is not dict or "components" not in design_b:
          raise ValueError("invalid design_b")
      score_map = {
          "inference": {"accuracy": 0.92},
          "latency_reduction": {"p99_ms": 180},
          "cost_control": {"usd_per_1k": 0.4},
          "bias_check": {"fairness_gap": 0.03},
          "uptime_tracking": {"uptime": 0.9995},
      }
      higher_better = {"accuracy", "uptime"}
      def score_design(design):
          scores = {}
          for comp in design["components"]:
              func = comp.get("function")
              for metric, val in score_map.get(func, {}).items():
                  scores[metric] = val
          return scores
      sa = score_design(design_a)
      sb = score_design(design_b)
      metrics = {row["metric"]: row["threshold"] for row in matrix["matrix"]}
      a_clears = {}
      b_clears = {}
      for metric, thresh in metrics.items():
          av = sa.get(metric, 0 if metric in higher_better else 999)
          bv = sb.get(metric, 0 if metric in higher_better else 999)
          if metric in higher_better:
              a_clears[metric] = av >= thresh
              b_clears[metric] = bv >= thresh
          else:
              a_clears[metric] = av <= thresh
              b_clears[metric] = bv <= thresh
      a_count = sum(a_clears.values())
      b_count = sum(b_clears.values())
      winner = "A" if a_count >= b_count else "B"
      return {"design_a": sa, "design_b": sb, "a_clears": a_clears, "b_clears": b_clears, "winner": winner, "reason": f"Design {winner} clears {max(a_count, b_count)} thresholds"}
