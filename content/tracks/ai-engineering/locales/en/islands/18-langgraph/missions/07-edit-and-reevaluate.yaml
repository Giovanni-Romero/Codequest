id: ai-langgraph-07
title: Edit and reevaluate
track: ai-engineering
island: langgraph
order: 7
difficulty: expert
tags: [ai-engineering, langgraph, requires-ai-orchestration]
xp: 60
concepts: [langgraph-checkpoints, langgraph-human-loop]
teaching: {analogy: "Changing a prescription sends it back to the pharmacist before it is filled.", explanation: "A human edit changes state and must re-enter the policy check. Approval never skips validation.", worked_example: "scope = edited; risk = assess(scope)", key_points: ["Edits change state", "Reevaluate edits", "Do not grant by silence"]}
brief: "Write `edit_and_reevaluate(decision, edited_risk) -> dict`. A risk-3 request awaits human review: `edit` must return to assessment carrying the edited risk as state, and only risk 1 can end granted. `reject` ends rejected. Represent review and assessment as graph nodes that read explicit state, never captured inputs."
signature: {entrypoint: edit_and_reevaluate, stub: "def edit_and_reevaluate(decision, edited_risk):\n    pass"}
constraints: {max_runtime_ms: 5000, max_memory_mb: 256, forbidden_builtins: [eval, exec]}
tests:
  visible: [{args: [edit, 1], expect: {risk: 1, status: granted, trace: [review, assess, grant]}}, {args: [reject, 1], expect: {risk: 3, status: rejected, trace: [review, reject]}}]
  hidden: [{args: [edit, 3], expect: {risk: 3, status: expired, trace: [review, assess, expire]}}, {args: [approve, 1], raises: ValueError}, {args: [edit, 0], raises: ValueError}, {args: [true, 1], raises: ValueError}]
hints: [{level: 1, text: "Does an edit need a new policy check?"}, {level: 2, text: "Represent review and assessment as graph nodes."}, {level: 3, text: "Route with `return 'grant' if risk == 1 else 'expire'`."}]
solution: |
  def edit_and_reevaluate(decision, edited_risk):
      from typing import TypedDict
      from langgraph.checkpoint.memory import InMemorySaver
      from langgraph.graph import END, START, StateGraph
      from langgraph.types import Command, interrupt
      if type(decision) is not str or decision not in ("edit", "reject") or type(edited_risk) is not int or not 1 <= edited_risk <= 3: raise ValueError("invalid input")
      class State(TypedDict, total=False):
          risk: int
          trace: list[str]
          status: str
      def review(s):
          answer = interrupt({"action": "access"})
          if answer == "edit": return Command(update={"risk": edited_risk, "trace": s.get("trace", []) + ["review"]}, goto="assess")
          return Command(update={"trace": s.get("trace", []) + ["review"]}, goto="reject")
      def reject(s): return {"status": "rejected", "trace": s["trace"] + ["reject"]}
      def assess(s): return {"status": "granted" if s.get("risk") == 1 else "expired", "trace": s["trace"] + ["assess", "grant" if s.get("risk") == 1 else "expire"]}
      b=StateGraph(State); b.add_node("review",review); b.add_node("reject",reject); b.add_node("assess",assess); b.add_edge(START,"review"); b.add_edge("reject",END); b.add_edge("assess",END)
      g=b.compile(checkpointer=InMemorySaver()); c={"configurable":{"thread_id":"edit"}}; g.invoke({"risk": 3, "trace":[]},c); return g.invoke(Command(resume=decision),c)
