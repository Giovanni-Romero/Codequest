id: ai-production-01
title: Enforce the layers
track: ai-engineering
island: production-ai
order: 1
difficulty: moderate
tags:
- ai-engineering
- production
- deterministic
xp: 30
concepts:
- layered-guardrails
- orchestration-gates
teaching:
  analogy: A venue has a welcome sign, a bag check, and an exit check. The sign helps, but the checks decide.
  explanation: Layered guardrails combine advice with enforceable controls. Input blocks happen before output blocks. Validate every form before accepting or rejecting one.
  worked_example: 'labels = ["public"]

    blocked = "secret"

    print(blocked in labels)'
  key_points:
  - Guidance is not authorization.
  - Input controls take precedence.
  - Policy order makes decisions explainable.
brief: 'Write `apply_guardrails(request, response, policy) -> dict`. Validate the exact request, response, and policy shapes before deciding. Return the first input-policy matches in policy order; otherwise return output matches; otherwise return prompt guidance. Prompt rules explain behavior but never override deterministic blocks. All data is supplied: no network, provider, files, clock, or mutation.'
signature:
  entrypoint: apply_guardrails
  stub: "def apply_guardrails(request, response, policy):\n    # Return deterministic production evidence; never call a provider.\n    pass\n"
constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128
  forbidden_builtins:
  - eval
  - exec
tests:
  visible:
  - args:
    - input_labels:
      - topic
    - output_labels:
      - answer
    - &id001
      prompt_rules:
      - be concise
      blocked_input_labels:
      - secret
      blocked_output_labels:
      - unsafe
    expect:
      status: allowed
      guidance:
      - be concise
  - args:
    - input_labels:
      - secret
    - output_labels:
      - unsafe
    - *id001
    expect:
      status: rejected
      layer: input
      matches:
      - secret
  - args:
    - input_labels:
      - topic
    - output_labels:
      - unsafe
    - *id001
    expect:
      status: rejected
      layer: output
      matches:
      - unsafe
  hidden:
  - args:
    - input_labels: []
    - output_labels: []
    - *id001
    expect:
      status: allowed
      guidance:
      - be concise
  - args:
    - input_labels:
      - []
    - output_labels: []
    - *id001
    raises: ValueError
  - args:
    - input_labels: []
    - output_labels: []
    - prompt_rules: []
      blocked_input_labels: []
      blocked_output_labels: []
    expect:
      status: allowed
      guidance: []
  - args:
    - {}
    - output_labels: []
    - *id001
    raises: ValueError
  - args:
    - input_labels: []
    - output_labels: []
    - prompt_rules:
      - x
      blocked_input_labels:
      - x
      - x
      blocked_output_labels: []
    raises: ValueError
  - args:
    - input_labels:
      - b
      - a
    - output_labels: []
    - prompt_rules:
      - x
      blocked_input_labels:
      - a
      - b
      blocked_output_labels: []
    expect:
      status: rejected
      layer: input
      matches:
      - a
      - b
hints:
- level: 1
  text: Which layer sees unsafe input first?
- level: 2
  text: Build a validated policy list before matching labels.
- level: 3
  text: 'For a different list: `hits = [x for x in rules if x in labels]`. '
solution: "def apply_guardrails(request, response, policy):\n    def labels(value, keys, name):\n        if not isinstance(value, dict) or set(value) != set(keys): raise ValueError(\"invalid \" + name)\n        result = []\n        for key in keys:\n            item = value[key]\n            if not isinstance(item, list) or any(type(x) is not str or not x for x in item) or len(set(item)) != len(item): raise ValueError(\"invalid \" + name)\n            result.append(item)\n        return result\n    inputs, = labels(request, (\"input_labels\",), \"request\")\n    outputs, = labels(response, (\"output_labels\",), \"response\")\n    rules, blocked_in, blocked_out = labels(policy, (\"prompt_rules\", \"blocked_input_labels\", \"blocked_output_labels\"), \"policy\")\n    matches = [x for x in blocked_in if x in inputs]\n    if matches: return {\"status\": \"rejected\", \"layer\": \"input\", \"matches\": matches}\n    matches = [x for x in blocked_out if x in outputs]\n    if matches: return {\"\
  status\": \"rejected\", \"layer\": \"output\", \"matches\": matches}\n    return {\"status\": \"allowed\", \"guidance\": list(rules)}\n"
