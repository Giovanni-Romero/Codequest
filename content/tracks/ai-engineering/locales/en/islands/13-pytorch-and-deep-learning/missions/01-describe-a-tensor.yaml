id: ai-pytorch-01
title: Describe a tensor
track: ai-engineering
island: pytorch-and-deep-learning
order: 1
difficulty: challenging
tags: [ai-engineering, pytorch, tensor, requires-ai-ml]
xp: 45
concepts: [tensors-and-shapes]
teaching:
  analogy: A cargo pallet has rows, columns, and a material label. Counting crates without recording the layout loses information needed by the next crane.
  explanation: A tensor stores values with a shape and one dtype. PyTorch infers both unless you declare the dtype. Shape describes every axis; dtype controls representation and valid operations. Convert tensors to plain data before crossing the game boundary.
  worked_example: |
    import torch
    flags = torch.tensor([[1, 0], [0, 1]], dtype=torch.int64)
    print(list(flags.shape))
    print(str(flags.dtype).removeprefix("torch."))
  key_points:
    - Shape records every axis, not only the number of values.
    - A tensor has one dtype for all elements.
    - Rectangular nested data is required.
brief: >
  Write `describe_tensor(values, dtype) -> dict`. Accept dtype `float32` or `int64`,
  build a CPU tensor, and return `shape`, `dtype`, and `values` as JSON-compatible data.
  Reject an unknown dtype, booleans, empty input, ragged input, or non-finite numbers with
  `ValueError`. Install the `ai-ml` extra before this island.
signature:
  entrypoint: describe_tensor
  stub: |
    def describe_tensor(values, dtype):
        # Build one tensor and report its boundary-safe description.
        pass
constraints: {max_runtime_ms: 5000, max_memory_mb: 2048, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[1, 2, 3], float32]
      expect: {shape: [3], dtype: float32, values: [1.0, 2.0, 3.0]}
    - args: [[[1, 2], [3, 4]], int64]
      expect: {shape: [2, 2], dtype: int64, values: [[1, 2], [3, 4]]}
  hidden:
    - args: [[], float32]
      raises: ValueError
    - args: [[[1], [2, 3]], float32]
      raises: ValueError
    - args: [[true, false], int64]
      raises: ValueError
    - args: [[.inf], float32]
      raises: ValueError
    - args: [[1], float16]
      raises: ValueError
hints:
  - {level: 1, text: "Which facts about a tensor must survive after the tensor itself cannot cross JSON?"}
  - {level: 2, text: "Validate recursively, map the dtype name, then use `torch.tensor`."}
  - {level: 3, text: "For another array, `list(item.shape)`, a cleaned dtype string, and `item.tolist()` form a portable record."}
solution: |
  def describe_tensor(values, dtype):
      import math
      import torch
      if dtype not in {"float32", "int64"} or not isinstance(values, list) or not values:
          raise ValueError("invalid tensor input")
      def validate(value):
          if isinstance(value, list):
              if not value:
                  raise ValueError("empty axis")
              for item in value:
                  validate(item)
          elif type(value) not in (int, float):
              raise ValueError("invalid tensor value")
      validate(values)
      try:
          tensor = torch.tensor(values, dtype=getattr(torch, dtype), device="cpu")
      except (TypeError, ValueError, RuntimeError, OverflowError) as exc:
          raise ValueError("invalid tensor shape") from exc
      if tensor.is_floating_point() and not torch.isfinite(tensor).all():
          raise ValueError("tensor value is outside dtype range")
      return {"shape": list(tensor.shape), "dtype": dtype, "values": tensor.tolist()}
