id: ai-evals-05
title: Validate before scoring
track: ai-engineering
island: evals
order: 5
difficulty: moderate
tags: [ai-engineering, evals, validation]
xp: 30
concepts: [eval-datasets, capability-metrics]
teaching:
  analogy: |
    A scale with a cracked display is repaired before its readings are averaged.
  explanation: |
    A score is evidence only when its dataset contract is valid. Validate every row before scoring, even rows after a useful result. Structured diagnostics distinguish bad evidence from poor behavior.
  worked_example: |
    readings = [2, 3, None]
    print([i for i, value in enumerate(readings) if not isinstance(value, int)])
  key_points:
    - Invalid evidence is not a zero score.
    - Validate every row before aggregation.
    - Keep diagnostics in input order.
brief: |
  Write `evaluate_dataset(cases, predictions, metrics)`. Cases use `case_id`, `capability`, and
  `expected`; IDs are unique non-empty strings. Metrics map every capability to `exact`, and
  predictions map every ID to a scalar. Return `{"status": "invalid_dataset", "invalid": [...]}`
  for invalid row IDs in order, including duplicate IDs after the first. Otherwise return ok with
  first-seen capability score records. Validate all inputs before returning.
signature:
  entrypoint: evaluate_dataset
  stub: |
    def evaluate_dataset(cases, predictions, metrics):
        # Refuse bad evidence before deriving a quality score.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{case_id: a, capability: search, expected: yes}, {case_id: b, capability: search, expected: no}], {a: yes, b: maybe}, {search: exact}]
      expect: {status: ok, scores: [{capability: search, passed: 1, total: 2, score: 0.5}]}
    - args: [[{case_id: a, capability: search, expected: yes}, {case_id: b, capability: search, expected: no, extra: x}], {a: yes, b: no}, {search: exact}]
      expect: {status: invalid_dataset, invalid: [b]}
  hidden:
    - args: [[], {}, {}]
      expect: {status: ok, scores: []}
    - args: [[{case_id: a, capability: search, expected: yes}, {case_id: a, capability: search, expected: no}], {a: yes}, {search: exact}]
      expect: {status: invalid_dataset, invalid: [a]}
    - args: [[{case_id: a, capability: search, expected: yes}, {case_id: z, capability: search, expected: no}], {a: yes}, {search: exact}]
      expect: {status: invalid_dataset, invalid: [z]}
    - args: [[{case_id: a, capability: search, expected: true}], {a: 1}, {search: exact}]
      expect: {status: ok, scores: [{capability: search, passed: 0, total: 1, score: 0.0}]}
    - args: [[{case_id: a, capability: search, expected: yes}, {case_id: b, capability: search, expected: no}, {case_id: z, capability: search, expected: no, extra: x}], {a: yes, b: no, z: no}, {search: exact}]
      expect: {status: invalid_dataset, invalid: [z]}
hints:
  - {level: 1, text: "Can a score explain whether its input was malformed?"}
  - {level: 2, text: "Make one validation pass over every row, then score only when diagnostics are empty."}
  - {level: 3, text: "For meter readings, collect bad row labels before calculating an average."}
solution: |
  def evaluate_dataset(cases, predictions, metrics):
      if not isinstance(cases, list) or not isinstance(predictions, dict) or not isinstance(metrics, dict):
          raise ValueError("invalid container")
      invalid, seen, order = [], set(), []
      for case in cases:
          case_id = case.get("case_id") if isinstance(case, dict) else None
          valid = isinstance(case, dict) and set(case) == {"case_id", "capability", "expected"} and isinstance(case_id, str) and case_id and isinstance(case["capability"], str) and case["capability"] and case_id not in seen and case_id in predictions and case["capability"] in metrics and metrics[case["capability"]] == "exact" and not isinstance(case["expected"], (list, dict, set)) and not isinstance(predictions[case_id], (list, dict, set))
          if not valid:
              invalid.append(case_id if isinstance(case_id, str) else "<invalid>")
          else:
              seen.add(case_id)
              if case["capability"] not in order:
                  order.append(case["capability"])
      if not invalid and (set(predictions) != seen or set(metrics) != set(order)):
          invalid.append("<mapping>")
      if invalid:
          return {"status": "invalid_dataset", "invalid": invalid}
      scores = []
      for capability in order:
          rows = [case for case in cases if case["capability"] == capability]
          passed = sum(type(predictions[row["case_id"]]) is type(row["expected"]) and predictions[row["case_id"]] == row["expected"] for row in rows)
          scores.append({"capability": capability, "passed": passed, "total": len(rows), "score": passed / len(rows)})
      return {"status": "ok", "scores": scores}
