id: ai-nlp-01
title: Tokenize with boundaries
track: ai-engineering
island: nlp-and-transformers
order: 1
difficulty: challenging
tags: [ai-engineering, transformers, tokenizer, requires-ai-ml]
xp: 45
concepts: [tokenizer-boundaries]
teaching:
  analogy: A harbor translator splits cargo labels into known stamps. Long labels may use several stamps, and the manifest reserves stamps for start, end, and empty slots.
  explanation: A model reads token IDs rather than words or characters. Special tokens frame the sequence, truncation enforces its limit, padding fixes its length, and the attention mask distinguishes content from padding. A pinned local vocabulary makes the boundary reproducible.
  worked_example: |
    tokens = ["[CLS]", "hello", "sea", "##s", "[SEP]", "[PAD]"]
    mask = [1, 1, 1, 1, 1, 0]
    print(tokens, mask)
  key_points:
    - One word may become several model tokens.
    - Special tokens consume sequence capacity.
    - Attention masks mark padding with zero.
brief: >
  Write `tokenize_local(text, max_length) -> dict`. Build a local `BertTokenizer` from
  this ordered vocabulary: `[PAD]`, `[UNK]`, `[CLS]`, `[SEP]`, `[MASK]`, `hello`, `world`,
  `sea`, `##s`, `model`. Lowercase, truncate, and pad to `max_length`. Return tokens,
  input IDs, attention mask, and decoded text without special tokens. Reject invalid input.
signature:
  entrypoint: tokenize_local
  stub: |
    def tokenize_local(text, max_length):
        # Expose every boundary between source text and model input.
        pass
constraints: {max_runtime_ms: 30000, max_memory_mb: 8192, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [Hello seas, 6]
      expect: {tokens: ['[CLS]', hello, sea, '##s', '[SEP]', '[PAD]'], input_ids: [2, 5, 7, 8, 3, 0], attention_mask: [1, 1, 1, 1, 1, 0], decoded: hello seas}
    - args: [hello world sea model, 5]
      expect: {tokens: ['[CLS]', hello, world, sea, '[SEP]'], input_ids: [2, 5, 6, 7, 3], attention_mask: [1, 1, 1, 1, 1], decoded: hello world sea}
  hidden:
    - {args: ['', 5], raises: ValueError}
    - {args: [hello, 1], raises: ValueError}
    - {args: [hello, true], raises: ValueError}
    - {args: [123, 5], raises: ValueError}
    - args: [unknown, 4]
      expect: {tokens: ['[CLS]', '[UNK]', '[SEP]', '[PAD]'], input_ids: [2, 1, 3, 0], attention_mask: [1, 1, 1, 0], decoded: ''}
hints:
  - {level: 1, text: "Which positions are real input and which exist only to fill the fixed window?"}
  - {level: 2, text: "Write the vocabulary to a temporary file, then construct `BertTokenizer(vocab=path)`."}
  - {level: 3, text: "Call the tokenizer with special tokens, truncation, and `padding='max_length'`; convert IDs back with `convert_ids_to_tokens`."}
solution: |
  def tokenize_local(text, max_length):
      from pathlib import Path
      from tempfile import TemporaryDirectory
      from transformers import BertTokenizer
      if not isinstance(text, str) or not text.strip() or type(max_length) is not int or max_length < 2:
          raise ValueError("invalid tokenizer input")
      vocabulary = ["[PAD]", "[UNK]", "[CLS]", "[SEP]", "[MASK]", "hello", "world", "sea", "##s", "model"]
      with TemporaryDirectory() as folder:
          path = Path(folder) / "vocab.txt"
          path.write_text("\n".join(vocabulary), encoding="utf-8")
          tokenizer = BertTokenizer(vocab=str(path), do_lower_case=True)
          encoded = tokenizer(text, max_length=max_length, truncation=True, padding="max_length")
      ids = encoded["input_ids"]
      return {"tokens": tokenizer.convert_ids_to_tokens(ids), "input_ids": ids, "attention_mask": encoded["attention_mask"], "decoded": tokenizer.decode(ids, skip_special_tokens=True)}
