id: ai-mlops-08
title: Audit a model lifecycle
track: ai-engineering
island: mlops-and-model-lifecycle
order: 8
difficulty: challenging
tags: [ai-engineering, mlops, experiments, model-versioning, deployment, drift, capstone]
xp: 45
concepts: [experiment-tracking, model-versioning, deployment-strategies, drift-monitoring]
teaching:
  analogy: A harbor authority closes a vessel file only after linking its voyage log, hull registry, traffic decision, and monitoring watch. The final stamp says active, returned to port, or retired.
  explanation: A lifecycle audit joins experiment evidence, immutable model identity, rollout state, and monitoring signals. Lineage must agree across run and model records before deployment evidence is trusted. Rollback decisions and harmful drift change the operational state, while distribution drift alone does not. Failed runs remain auditable but cannot support an approved active model.
  worked_example: |
    file = {"inspection": "passed", "route": "active", "weather": "changed"}
    checks = [file["inspection"], file["weather"]]
    failed = "failed" in checks
    status = "retired" if failed else "active"
    file["route"] = status
    print(status)
  key_points:
    - Reconcile run and model lineage before deciding lifecycle state.
    - Honor rollout rollback evidence before declaring a model active.
    - Keep distribution-only drift under observation instead of forcing rollback.
    - End every audit with one explicit active, rolled-back, or retired state.
brief: >
  Write `audit_model_lifecycle(run, model, rollout, monitoring) -> dict`. `run` is an
  exact mission-01 record. `model` is an exact mission-02 result whose run ID, code
  version, data version, config, metrics, and artifact digest agree with `run`. `rollout`
  is an exact mission-06 result: decisions are `continue` or `rollback`, all versions and
  observed metric names are non-empty, numeric values are finite and exclude booleans,
  rollback activates its rollback version, and continue activates this model. `monitoring`
  is an exact mission-04 signal with positive comparable windows and valid finite changes.
  A non-completed run or non-approved model ends `retired`. A rollout rollback or critical
  performance drift ends `rolled-back`. Critical concept drift ends `retired`. Other
  monitoring, including critical input or prediction drift alone, leaves the model
  `active`. Return identity, rollout decision, a copied monitoring summary, final status,
  and active version; retired uses null. Reject malformed or inconsistent input and do
  not mutate any argument.
signature:
  entrypoint: audit_model_lifecycle
  stub: |
    def audit_model_lifecycle(run, model, rollout, monitoring):
        # Reconcile experiment, registry, rollout, and monitoring evidence.
        pass
constraints: {max_runtime_ms: 1000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
