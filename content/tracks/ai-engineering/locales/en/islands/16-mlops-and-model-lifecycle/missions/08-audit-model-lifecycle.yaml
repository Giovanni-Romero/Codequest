hints:
  - {level: 1, text: "Do run, model, rollout, and monitoring records describe one consistent operational history?"}
  - {level: 2, text: "Validate each boundary, reconcile lineage, then apply terminal-state rules in priority order."}
  - {level: 3, text: "A review can prioritize terminal states: `status = 'retired' if failed else 'active'`."}
solution: |
  def audit_model_lifecycle(run, model, rollout, monitoring):
      import math
      def finite(value):
          if type(value) not in (int, float):
              return False
          try:
              return math.isfinite(value)
          except (OverflowError, TypeError):
              return False
      def json_ok(value):
          if value is None or type(value) in (str, bool):
              return True
          if type(value) in (int, float):
              return finite(value)
          if type(value) is list:
              return all(json_ok(item) for item in value)
          return type(value) is dict and all(type(key) is str and json_ok(item) for key, item in value.items())
      def same_json(left, right):
          if type(left) is not type(right):
              return False
          if type(left) is dict:
              return set(left) == set(right) and all(same_json(left[key], right[key]) for key in left)
          if type(left) is list:
              return len(left) == len(right) and all(same_json(a, b) for a, b in zip(left, right))
          return left == right
      run_keys = {"run_id", "code_version", "data_version", "config", "metrics", "artifacts", "status"}
      if type(run) is not dict or set(run) != run_keys or any(type(run[key]) is not str or not run[key].strip() for key in ("run_id", "code_version", "data_version")):
          raise ValueError("invalid run")
      if type(run["config"]) is not dict or not run["config"] or not json_ok(run["config"]):
          raise ValueError("invalid run")
      if type(run["metrics"]) is not dict or any(type(key) is not str or not key.strip() or not finite(value) for key, value in run["metrics"].items()):
          raise ValueError("invalid run")
      if type(run["artifacts"]) is not dict or any(type(key) is not str or not key.strip() or type(value) is not str or not value.strip() for key, value in run["artifacts"].items()):
          raise ValueError("invalid run")
      if run["status"] not in ("running", "completed", "failed") or run["status"] == "completed" and (not run["metrics"] or not run["artifacts"]):
          raise ValueError("invalid run")
      model_keys = {"model_id", "artifact_digest", "run_id", "code_version", "data_version", "config", "metrics", "state", "reviewer"}
      if type(model) is not dict or set(model) != model_keys or any(type(model[key]) is not str or not model[key].strip() for key in ("model_id", "artifact_digest", "run_id", "code_version", "data_version")):
          raise ValueError("invalid model")
      if model["state"] not in ("pending", "approved", "rejected") or model["state"] == "pending" and model["reviewer"] is not None or model["state"] != "pending" and (type(model["reviewer"]) is not str or not model["reviewer"].strip()):
          raise ValueError("invalid model")
      if type(model["config"]) is not dict or not model["config"] or any(type(key) is not str or not key.strip() for key in model["config"]) or not json_ok(model["config"]):
          raise ValueError("invalid model")
      if type(model["metrics"]) is not dict or any(type(key) is not str or not key.strip() or not finite(value) for key, value in model["metrics"].items()):
          raise ValueError("invalid model")
      lineage = (model["run_id"], model["code_version"], model["data_version"], model["config"], model["metrics"])
      expected = (run["run_id"], run["code_version"], run["data_version"], run["config"], run["metrics"])
      if lineage[:3] != expected[:3] or not same_json(lineage[3], expected[3]) or not same_json(lineage[4], expected[4]) or model["artifact_digest"] not in run["artifacts"].values() or model["state"] == "approved" and run["status"] != "completed":
          raise ValueError("inconsistent lineage")
      rollout_keys = {"decision", "active_version", "observed", "limit", "rollback_version"}
      if type(rollout) is not dict or set(rollout) != rollout_keys or rollout["decision"] not in ("continue", "rollback"):
          raise ValueError("invalid rollout")
      if any(type(rollout[key]) is not str or not rollout[key].strip() for key in ("active_version", "rollback_version")) or rollout["rollback_version"] == model["model_id"]:
          raise ValueError("invalid rollout")
      if type(rollout["observed"]) is not dict or set(rollout["observed"]) != {"metric", "value"} or type(rollout["observed"]["metric"]) is not str or not rollout["observed"]["metric"].strip() or not finite(rollout["observed"]["value"]) or not finite(rollout["limit"]):
          raise ValueError("invalid rollout")
      if (rollout["decision"] == "rollback") != (rollout["observed"]["value"] > rollout["limit"]):
          raise ValueError("inconsistent rollout decision")
      if rollout["decision"] == "rollback" and rollout["active_version"] != rollout["rollback_version"] or rollout["decision"] == "continue" and rollout["active_version"] != model["model_id"]:
          raise ValueError("inconsistent rollout")
      signal_keys = {"window", "changes", "type", "severity"}
      names = {"input", "prediction", "performance", "concept"}
      if type(monitoring) is not dict or set(monitoring) != signal_keys or type(monitoring["window"]) is not dict or set(monitoring["window"]) != {"baseline", "current"}:
          raise ValueError("invalid monitoring")
      window = monitoring["window"]
      if any(type(window[key]) is not int or window[key] <= 0 for key in window) or window["baseline"] != window["current"]:
          raise ValueError("invalid monitoring")
      changes = monitoring["changes"]
      if type(changes) is not dict or set(changes) != names or any(not finite(value) or value < 0 for value in changes.values()):
          raise ValueError("invalid monitoring")
      if any(round(value, 3) != value for value in changes.values()):
          raise ValueError("invalid monitoring")
      drift_type = monitoring["type"]
      severity = monitoring["severity"]
      if drift_type == "none":
          if severity != "none":
              raise ValueError("invalid monitoring")
      elif type(drift_type) is not str or drift_type not in names or severity not in ("warning", "critical"):
          raise ValueError("invalid monitoring")
      elif any(value > changes[drift_type] for value in changes.values()):
          raise ValueError("inconsistent monitoring")
      if run["status"] != "completed" or model["state"] != "approved":
          status, active = "retired", None
      elif rollout["decision"] == "rollback" or drift_type == "performance" and severity == "critical":
          status, active = "rolled-back", rollout["rollback_version"]
      elif drift_type == "concept" and severity == "critical":
          status, active = "retired", None
      else:
          status, active = "active", model["model_id"]
      summary = {"type": drift_type, "severity": severity, "window": dict(window)}
      return {"run_id": run["run_id"], "model_id": model["model_id"], "artifact_digest": model["artifact_digest"], "rollout_decision": rollout["decision"], "monitoring": summary, "status": status, "active_version": active}
