id: ai-ml-01
title: Construa uma divisão determinística
track: ai-engineering
island: machine-learning-foundations
order: 1
difficulty: challenging
tags: [ai-engineering, machine-learning, datasets, reproducibility]
xp: 45
concepts: [dataset-splits]
teaching:
  analogy: Um responsável pelo porto distribui caixas numeradas em docas fixas. Repetir a mesma regra envia cada caixa para a mesma doca, então uma auditoria consegue reconstruir a distribuição.
  explanation: Uma divisão de dataset reserva exemplos diferentes para ajuste, validação e avaliação final. As três partições precisam cobrir cada registro exatamente uma vez. Uma ordenação determinística torna a divisão reproduzível, mas não necessariamente representativa. Depois você auditará o equilíbrio dos rótulos e a ordem temporal em vez de presumir que uma divisão limpa também é justa.
  worked_example: |
    numeros_senhas = [14, 11, 13, 12]
    ordenados = sorted(numeros_senhas)
    recepcao = ordenados[:2]
    escritorio = ordenados[2:3]
    arquivo = ordenados[3:]
    print(recepcao, escritorio, arquivo)
  key_points:
    - As partições de treino, validação e teste têm funções diferentes.
    - Cada registro pertence a uma única partição porque sobreposição vaza informação.
    - Determinismo torna uma divisão repetível, não automaticamente imparcial.
brief: >
  Escreva `build_dataset_split(records, train_count, validation_count) -> dict`.
  `records` é uma lista de dicionários com `id` inteiro único, excluindo `bool`.
  Exija pelo menos um registro em cada partição e contagens inteiras positivas. Ordene os ids,
  coloque os primeiros `train_count` em `train_ids`, os próximos `validation_count` em
  `validation_ids` e o restante em `test_ids`. Lance `ValueError` para entrada inválida.
signature:
  entrypoint: build_dataset_split
  stub: |
    def build_dataset_split(records, train_count, validation_count):
        # Retorne listas reproduzíveis de ids de treino, validação e teste.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{id: 3}, {id: 1}, {id: 5}, {id: 2}, {id: 4}], 3, 1]
      expect: {train_ids: [1, 2, 3], validation_ids: [4], test_ids: [5]}
    - args: [[{id: 40}, {id: 10}, {id: 30}, {id: 20}], 2, 1]
      expect: {train_ids: [10, 20], validation_ids: [30], test_ids: [40]}
  hidden:
    - args: [[{id: -2}, {id: 0}, {id: 4}], 1, 1]
      expect: {train_ids: [-2], validation_ids: [0], test_ids: [4]}
    - args: [[{id: 1}, {id: 1}, {id: 2}], 1, 1]
      raises: ValueError
    - args: [[{id: true}, {id: 2}, {id: 3}], 1, 1]
      raises: ValueError
    - args: [[{name: missing}, {id: 2}, {id: 3}], 1, 1]
      raises: ValueError
    - args: [not-a-list, 1, 1]
      raises: ValueError
    - args: [[], 1, 1]
      raises: ValueError
    - args: [[{id: 1}, {id: 2}, {id: 3}], 0, 1]
      raises: ValueError
    - args: [[{id: 1}, {id: 2}, {id: 3}], 1, true]
      raises: ValueError
    - args: [[{id: 1}, {id: 2}, {id: 3}], 2, 1]
      raises: ValueError
hints:
  - level: 1
    text: "Como uma ordenação fixa garante que nenhum id mude de partição entre execuções?"
  - level: 2
    text: "Valide ids únicos e contagens positivas, depois ordene uma vez e recorte três intervalos sem sobreposição."
  - level: 3
    text: "Padrão: `esquerda, meio, direita = ordenados[:a], ordenados[a:b], ordenados[b:]`."
solution: |
  def build_dataset_split(records, train_count, validation_count):
      if not isinstance(records, list) or not records:
          raise ValueError("invalid records")
      if type(train_count) is not int or type(validation_count) is not int:
          raise ValueError("invalid counts")
      if train_count <= 0 or validation_count <= 0 or train_count + validation_count >= len(records):
          raise ValueError("invalid counts")
      if any(not isinstance(record, dict) or type(record.get("id")) is not int for record in records):
          raise ValueError("invalid record")
      ids = [record["id"] for record in records]
      if len(set(ids)) != len(ids):
          raise ValueError("duplicate id")
      ordered = sorted(ids)
      boundary = train_count + validation_count
      return {"train_ids": ordered[:train_count], "validation_ids": ordered[train_count:boundary], "test_ids": ordered[boundary:]}
