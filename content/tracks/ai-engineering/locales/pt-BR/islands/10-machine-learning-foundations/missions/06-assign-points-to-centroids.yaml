id: ai-ml-06
title: Atribua pontos a centroides
track: ai-engineering
island: machine-learning-foundations
order: 6
difficulty: challenging
tags: [ai-engineering, machine-learning, unsupervised-learning, clustering]
xp: 45
concepts: [unsupervised-patterns]
teaching:
  analogy: Barcos sem rótulo se reúnem ao redor do farol mais próximo. Os faróis criam grupos, mas ninguém afirma que esses grupos são a identidade verdadeira dos barcos.
  explanation: O aprendizado não supervisionado procura estrutura sem rótulos de target. Uma etapa de atribuição de clustering mede cada ponto contra centroides declarados e escolhe a menor distância euclidiana quadrada. A escala das features e os centroides iniciais moldam o resultado. Um empate precisa de uma regra determinística para que a mesma entrada produza os mesmos grupos.
  worked_example: |
    casas = [2, 8, 14]
    estacoes = [0, 10]
    atribuicoes = [min(range(len(estacoes)), key=lambda i: (valor - estacoes[i]) ** 2) for valor in casas]
    print(atribuicoes)
  key_points:
    - Clusters são grupos sob uma regra de distância, não rótulos de classe descobertos.
    - A distância quadrada preserva a ordem de proximidade sem raiz quadrada.
    - Desempate estável faz parte do comportamento determinístico.
brief: >
  Escreva `assign_points_to_centroids(points, centroids) -> dict`. Aceite listas não vazias
  de vetores numéricos finitos e não vazios, excluindo `bool`. Todo ponto e centroide precisa
  ter a mesma dimensão. Atribua cada ponto ao centroide com a menor distância euclidiana
  quadrada; empates escolhem o menor índice. Retorne `assignments`, `squared_distances` e
  `cluster_sizes`. Lance `ValueError` para entrada inválida ou aritmética não finita.
signature:
  entrypoint: assign_points_to_centroids
  stub: |
    def assign_points_to_centroids(points, centroids):
        # Retorne atribuições determinísticas ao centroide mais próximo e suas evidências.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[[0, 0], [2, 2], [9, 9]], [[0, 0], [10, 10]]]
      expect: {assignments: [0, 0, 1], squared_distances: [0, 8, 2], cluster_sizes: [2, 1]}
    - args: [[[1], [4], [8]], [[0], [10]]]
      expect: {assignments: [0, 0, 1], squared_distances: [1, 16, 4], cluster_sizes: [2, 1]}
  hidden:
    - args: [[[1]], [[0], [2]]]
      expect: {assignments: [0], squared_distances: [1], cluster_sizes: [1, 0]}
    - args: [[[-2, -2], [2, 2]], [[-1, -1], [1, 1]]]
      expect: {assignments: [0, 1], squared_distances: [2, 2], cluster_sizes: [1, 1]}
    - args: [[], [[0]]]
      raises: ValueError
    - args: [[[0]], []]
      raises: ValueError
    - args: [[[0, 1]], [[0]]]
      raises: ValueError
    - args: [[[true]], [[0]]]
      raises: ValueError
    - args: [[[.inf]], [[0]]]
      raises: ValueError
    - args: [not-a-list, [[0]]]
      raises: ValueError
    - args: [[[0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF]], [[0]]]
      raises: ValueError
hints:
  - level: 1
    text: "Qual evidência permite que cada ponto sem rótulo escolha um grupo de forma reproduzível?"
  - level: 2
    text: "Valide uma dimensão compartilhada, calcule todas as distâncias quadradas e escolha o primeiro mínimo."
  - level: 3
    text: "Padrão: `vencedor = min(range(len(opcoes)), key=lambda i: pontuacoes[i])`."
solution: |
  def assign_points_to_centroids(points, centroids):
      import math
      def valid_number(value):
          if type(value) not in (int, float):
              return False
          try:
              return math.isfinite(value)
          except OverflowError:
              return False
      if not isinstance(points, list) or not points or not isinstance(centroids, list) or not centroids:
          raise ValueError("invalid vectors")
      vectors = points + centroids
      if any(not isinstance(vector, list) or not vector for vector in vectors):
          raise ValueError("invalid vector")
      dimension = len(vectors[0])
      if any(len(vector) != dimension or not all(valid_number(value) for value in vector) for vector in vectors):
          raise ValueError("invalid vector")
      assignments = []
      squared_distances = []
      try:
          for point in points:
              distances = [sum((value - center) ** 2 for value, center in zip(point, centroid)) for centroid in centroids]
              if not all(math.isfinite(distance) for distance in distances):
                  raise ValueError("non-finite distance")
              winner = min(range(len(distances)), key=lambda index: distances[index])
              assignments.append(winner)
              squared_distances.append(distances[winner])
      except OverflowError as error:
          raise ValueError("non-finite distance") from error
      return {"assignments": assignments, "squared_distances": squared_distances, "cluster_sizes": [assignments.count(index) for index in range(len(centroids))]}
