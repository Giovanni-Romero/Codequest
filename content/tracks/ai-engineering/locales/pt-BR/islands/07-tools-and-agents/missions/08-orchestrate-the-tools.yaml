id: ai-tools-08
title: Orquestre as ferramentas
track: ai-engineering
island: tools-and-agents
order: 8
difficulty: moderate
tags: [ai-engineering, tools, orchestration]
xp: 30
concepts: [tool-contracts, tool-routing, orchestration-gates, idempotent-effects]
teaching:
  analogy: |
    Um armazém valida pedidos, envia cada um à estação autorizada e arquiva um recibo por chave.
  explanation: |
    Orquestração une contratos, rota, política, execução e persistência. A mesma chave com mesma carga reproduz; carga diferente conflita.
  worked_example: |
    policy = {"allowed_effects": ["read"]}
    effect = "read"
    print(effect in policy["allowed_effects"])
  key_points:
    - Todas as declarações são validadas antes da primeira tarefa.
    - Cada tarefa cruza validation, policy, execution e persistence nessa ordem.
    - Registros concluídos preservam efeitos e replays como dados ordenados.
brief: |
  Escreva `orchestrate_tools(tasks, tools, contracts, policy, execution_results, applied) -> dict`.
  Tasks estendem a tarefa da Missão 2 com `operation_id` e `idempotency_key` exatos. Tools e
  contracts reutilizam as Missões 1–2. `policy` possui exatamente `allowed_effects: list[str]`;
  `execution_results` mapeia operation IDs para `{status: "ok"|"error", output: object,
  error: str|None}`; `applied` usa registros da Missão 4. Valide cada argumento e item aninhado
  antes de processar. Para cada tarefa em ordem: roteie, valide chamada, aplique policy, aceite só
  output do tipo declarado e aplique idempotência/persistência. Pare na primeira falha semântica e
  devolva `stopped` com operation_id, gate, reason e records já concluídos. No sucesso, devolva
  `completed` com records; cada record é replay com result ou effect com effect e output. Efeitos
  permanecem apenas dados.
signature:
  entrypoint: orchestrate_tools
  stub: |
    def orchestrate_tools(tasks, tools, contracts, policy, execution_results, applied):
        # Coordinate deterministic tool plans without executing their effects.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: birds}, allowed_tools: [lookup]}, {operation_id: b, idempotency_key: two, capability: search, arguments: {query: fish}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: ok, output: found, error: null}, b: {status: ok, output: old, error: null}}, [{operation_id: b, idempotency_key: two, action: read, payload: {query: fish}, result: cached}]]
      expect: {status: completed, records: [{operation_id: a, status: effect, effect: {operation_id: a, idempotency_key: one, action: read, payload: {query: birds}}, output: found}, {operation_id: b, status: replayed, result: cached}]}
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: birds}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [write]}, {a: {status: ok, output: found, error: null}}, []]
      expect: {status: stopped, operation_id: a, gate: policy, reason: unauthorized_effect, records: []}
  hidden:
    - args: [[], [], {}, {allowed_effects: []}, {}, []]
      expect: {status: completed, records: []}
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: ok, output: x, error: null}}, []]
      expect: {status: stopped, operation_id: a, gate: validation, reason: invalid_call, records: []}
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: x}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: error, output: null, error: down}}, []]
      expect: {status: stopped, operation_id: a, gate: execution, reason: execution_error, records: []}
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: x}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: ok, output: 1, error: null}}, []]
      expect: {status: stopped, operation_id: a, gate: execution, reason: invalid_output, records: []}
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: x}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: ok, output: x, error: null}}, [{operation_id: a, idempotency_key: one, action: read, payload: {query: y}, result: old}]]
      expect: {status: stopped, operation_id: a, gate: persistence, reason: idempotency_conflict, records: []}
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: x}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: ok, output: x, error: null}, late: {status: ok, output: x, error: null}}, []]
      raises: ValueError
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: x}, allowed_tools: [lookup]}, {operation_id: b, idempotency_key: one, capability: search, arguments: {query: x}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: ok, output: fresh, error: null}, b: {status: ok, output: ignored, error: null}}, []]
      expect: {status: completed, records: [{operation_id: a, status: effect, effect: {operation_id: a, idempotency_key: one, action: read, payload: {query: x}}, output: fresh}, {operation_id: b, status: replayed, result: fresh}]}
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: x}, allowed_tools: [lookup]}, {operation_id: b, idempotency_key: one, capability: search, arguments: {query: y}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: ok, output: fresh, error: null}, b: {status: ok, output: other, error: null}}, []]
      expect: {status: stopped, operation_id: b, gate: persistence, reason: idempotency_conflict, records: [{operation_id: a, status: effect, effect: {operation_id: a, idempotency_key: one, action: read, payload: {query: x}}, output: fresh}]}
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: x}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: [], output: x, error: null}}, []]
      raises: ValueError
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: {items: [true]}}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: dict}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: ok, output: x, error: null}}, [{operation_id: a, idempotency_key: one, action: read, payload: {query: {items: [1]}}, result: old}]]
      expect: {status: stopped, operation_id: a, gate: persistence, reason: idempotency_conflict, records: []}
    - args: [[{operation_id: a, idempotency_key: one, capability: search, arguments: {query: x}, allowed_tools: [lookup]}], [{name: lookup, capabilities: [search], required_arguments: [query], effect: read}], {lookup: {name: lookup, inputs: {query: str}, output: str, errors: [], effect: read}}, {allowed_effects: [read]}, {a: {status: ok, output: x, error: null}}, [{operation_id: z, idempotency_key: old, action: read, payload: {query: z}, result: old}, {operation_id: z, idempotency_key: other, action: read, payload: {query: z}, result: old}]]
      raises: ValueError
hints:
  - {level: 1, text: "Quais catálogos precisam estar corretos primeiro?"}
  - {level: 2, text: "Aplique validação, política, execução e persistência em ordem."}
  - {level: 3, text: "Guarde recibos por chave e compare a carga."}
solution: |
  def orchestrate_tools(tasks, tools, contracts, policy, execution_results, applied):
      if not all(isinstance(x, expected) for x, expected in [(tasks, list), (tools, list), (contracts, dict), (policy, dict), (execution_results, dict), (applied, list)]): raise ValueError("invalid input")
      if set(policy) != {"allowed_effects"} or not isinstance(policy["allowed_effects"], list) or any(not isinstance(x, str) or not x for x in policy["allowed_effects"]) or len(set(policy["allowed_effects"])) != len(policy["allowed_effects"]): raise ValueError("invalid policy")
      names = set(); tool_map = {}
      for tool in tools:
          if not isinstance(tool, dict) or set(tool) != {"name", "capabilities", "required_arguments", "effect"} or not isinstance(tool["name"], str) or not tool["name"] or tool["name"] in names or not isinstance(tool["effect"], str) or not tool["effect"]: raise ValueError("invalid tool")
          if any(not isinstance(tool[k], list) or any(not isinstance(v, str) or not v for v in tool[k]) or len(set(tool[k])) != len(tool[k]) for k in ("capabilities", "required_arguments")): raise ValueError("invalid tool")
          names.add(tool["name"]); tool_map[tool["name"]] = tool
      if set(contracts) != names: raise ValueError("invalid contracts")
      types = {"str": str, "int": int, "float": float, "bool": bool, "list": list, "dict": dict}
      for name, contract in contracts.items():
          if not isinstance(contract, dict) or set(contract) != {"name", "inputs", "output", "errors", "effect"} or contract.get("name") != name or not isinstance(contract.get("inputs"), dict) or not isinstance(contract.get("output"), str) or contract["output"] not in set(types) | {"none"} or not isinstance(contract.get("errors"), list) or not isinstance(contract.get("effect"), str) or not contract["effect"]: raise ValueError("invalid contract")
          if any(not isinstance(k, str) or not k or not isinstance(v, str) or v not in set(types) | {"none"} for k, v in contract["inputs"].items()) or any(not isinstance(x, str) or not x for x in contract["errors"]) or len(set(contract["errors"])) != len(contract["errors"]): raise ValueError("invalid contract")
      task_ids = set()
      for task in tasks:
          if not isinstance(task, dict) or set(task) != {"operation_id", "idempotency_key", "capability", "arguments", "allowed_tools"} or any(not isinstance(task[k], str) or not task[k] for k in ("operation_id", "idempotency_key", "capability")) or task["operation_id"] in task_ids or not isinstance(task["arguments"], dict) or not isinstance(task["allowed_tools"], list) or any(not isinstance(x, str) or not x for x in task["allowed_tools"]) or len(set(task["allowed_tools"])) != len(task["allowed_tools"]): raise ValueError("invalid task")
          task_ids.add(task["operation_id"])
      if set(execution_results) != task_ids: raise ValueError("invalid execution results")
      for result in execution_results.values():
          if not isinstance(result, dict) or set(result) != {"status", "output", "error"} or not isinstance(result["status"], str) or result["status"] not in {"ok", "error"} or not isinstance(result["error"], (str, type(None))) or (result["status"] == "ok") != (result["error"] is None): raise ValueError("invalid execution result")
      applied_ids, applied_keys = set(), set()
      for row in applied:
          if not isinstance(row, dict) or set(row) != {"operation_id", "idempotency_key", "action", "payload", "result"} or any(not isinstance(row[k], str) or not row[k] for k in ("operation_id", "idempotency_key", "action")): raise ValueError("invalid applied")
          if row["operation_id"] in applied_ids or row["idempotency_key"] in applied_keys: raise ValueError("duplicate applied")
          applied_ids.add(row["operation_id"]); applied_keys.add(row["idempotency_key"])
      def equal(left, right):
          if type(left) is not type(right): return False
          if isinstance(left, list): return len(left) == len(right) and all(equal(a, b) for a, b in zip(left, right))
          if isinstance(left, dict): return set(left) == set(right) and all(equal(left[key], right[key]) for key in left)
          return left == right
      records, persisted = [], list(applied)
      for task in tasks:
          capable = [tool for tool in tools if task["capability"] in tool["capabilities"]]; eligible = [tool for tool in capable if tool["name"] in task["allowed_tools"] and all(k in task["arguments"] for k in tool["required_arguments"])]
          if len(eligible) != 1: return {"status": "stopped", "operation_id": task["operation_id"], "gate": "validation", "reason": "ambiguous" if len(eligible) > 1 else ("unauthorized" if capable and not any(t["name"] in task["allowed_tools"] for t in capable) else "no_match"), "records": records}
          tool = eligible[0]; contract = contracts[tool["name"]]; bad = any(not (task["arguments"].get(k, object()) is None if kind == "none" else type(task["arguments"].get(k, object())) is types[kind]) for k, kind in contract["inputs"].items()) or any(k not in contract["inputs"] for k in task["arguments"])
          if bad: return {"status": "stopped", "operation_id": task["operation_id"], "gate": "validation", "reason": "invalid_call", "records": records}
          if tool["effect"] not in policy["allowed_effects"]: return {"status": "stopped", "operation_id": task["operation_id"], "gate": "policy", "reason": "unauthorized_effect", "records": records}
          result = execution_results[task["operation_id"]]
          if result["status"] == "error": return {"status": "stopped", "operation_id": task["operation_id"], "gate": "execution", "reason": "execution_error", "records": records}
          kind = contract["output"]
          if not (result["output"] is None if kind == "none" else type(result["output"]) is types[kind]): return {"status": "stopped", "operation_id": task["operation_id"], "gate": "execution", "reason": "invalid_output", "records": records}
          effect = {"operation_id": task["operation_id"], "idempotency_key": task["idempotency_key"], "action": tool["effect"], "payload": dict(task["arguments"])}; prior = next((row for row in persisted if row["operation_id"] == effect["operation_id"] or row["idempotency_key"] == effect["idempotency_key"]), None)
          if prior:
              if not equal(prior["action"], effect["action"]) or not equal(prior["payload"], effect["payload"]): return {"status": "stopped", "operation_id": task["operation_id"], "gate": "persistence", "reason": "idempotency_conflict", "records": records}
              records.append({"operation_id": task["operation_id"], "status": "replayed", "result": prior["result"]})
          else:
              records.append({"operation_id": task["operation_id"], "status": "effect", "effect": effect, "output": result["output"]})
              persisted.append(dict(effect, result=result["output"]))
      return {"status": "completed", "records": records}
