id: ai-evals-04
title: Proteja o conjunto isolado
track: ai-engineering
island: evals
order: 4
difficulty: moderate
tags: [ai-engineering, evals, leakage]
xp: 30
concepts: [evaluation-leakage]
teaching:
  analogy: |
    Um examinador nÃ£o pode mostrar as respostas do trajeto antes da prova e chamar a nota de independente.
  explanation: |
    Vazamento de avaliaÃ§Ã£o ocorre quando casos isolados chegam ao sistema antes da mediÃ§Ã£o. ExposiÃ§Ã£o direta invalida o resultado de imediato. ExposiÃ§Ã£o indireta por uma fonte nomeada ainda exige investigaÃ§Ã£o. Preserve a ordem das fontes para auditoria.
  worked_example: |
    held_out = ["final-1"]
    seen = {"guide": ["practice-1"], "cache": ["final-1"]}
    print([source for source, ids in seen.items() if any(case in held_out for case in ids)])
  key_points:
    - Isolado significa indisponível antes da avaliação, não apenas escondido na interface.
    - Exposição direta tem prioridade sobre evidência indireta.
    - Um resultado limpo significa que nenhuma exposição declarada coincide com um ID isolado.
brief: |
  Escreva `classify_leakage(exposure, held_out_ids)`. `held_out_ids` é uma lista única de strings não
  vazias. Cada registro de exposição tem exatamente `source`, `kind` e `case_ids`; `source` é uma string
  não vazia, `kind` é `direct` ou `indirect`, e IDs de caso são strings únicas. Devolva `{"status":
  "direct"}` se algum registro direto contiver um ID isolado. Caso contrário, devolva indireto com fontes
  correspondentes únicas na ordem, ou limpo. Valide a entrada inteira antes de qualquer retorno terminal.
signature:
  entrypoint: classify_leakage
  stub: |
    def classify_leakage(exposure, held_out_ids):
        # Classifique se evidência isolada alcançou o sistema avaliado.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{source: prompt, kind: indirect, case_ids: [h1]}], [h1]]
      expect: {status: indirect, sources: [prompt]}
    - args: [[{source: cache, kind: direct, case_ids: [h1]}, {source: prompt, kind: indirect, case_ids: [h1]}], [h1]]
      expect: {status: direct}
  hidden:
    - args: [[], [h1]]
      expect: {status: clean}
    - args: [[{source: cache, kind: direct, case_ids: [h1]}, {source: bad, kind: other, case_ids: [h1]}], [h1]]
      raises: ValueError
    - args: [[{source: prompt, kind: indirect, case_ids: [h1, h1]}], [h1]]
      raises: ValueError
    - args: [[{source: prompt, kind: indirect, case_ids: [h1]}], [h1, h1]]
      raises: ValueError
    - args: [[{source: prompt, kind: [indirect], case_ids: [h1]}], [h1]]
      raises: ValueError
hints:
  - {level: 1, text: "Qual contato com um ID isolado torna a medição inválida de imediato?"}
  - {level: 2, text: "Valide todos os registros primeiro; depois examine os diretos antes de montar a lista ordenada de fontes indiretas."}
  - {level: 3, text: "Para cartões de prova selados, primeiro rejeite qualquer cartão presente no gabarito; depois liste as pastas nomeadas que apenas o citam."}
solution: |
  def classify_leakage(exposure, held_out_ids):
      if not isinstance(exposure, list) or not isinstance(held_out_ids, list) or any(not isinstance(case_id, str) or not case_id for case_id in held_out_ids) or len(set(held_out_ids)) != len(held_out_ids):
          raise ValueError("invalid held out ids")
      for record in exposure:
          if not isinstance(record, dict) or set(record) != {"source", "kind", "case_ids"} or not isinstance(record["source"], str) or not record["source"] or not isinstance(record["kind"], str) or record["kind"] not in {"direct", "indirect"} or not isinstance(record["case_ids"], list) or any(not isinstance(case_id, str) or not case_id for case_id in record["case_ids"]) or len(set(record["case_ids"])) != len(record["case_ids"]):
              raise ValueError("invalid exposure")
      held = set(held_out_ids)
      if any(record["kind"] == "direct" and any(case_id in held for case_id in record["case_ids"]) for record in exposure):
          return {"status": "direct"}
      sources = []
      for record in exposure:
          if record["kind"] == "indirect" and any(case_id in held for case_id in record["case_ids"]) and record["source"] not in sources:
              sources.append(record["source"])
      return {"status": "indirect", "sources": sources} if sources else {"status": "clean"}
