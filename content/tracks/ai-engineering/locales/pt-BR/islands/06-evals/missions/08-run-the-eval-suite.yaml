brief: |
  Escreva `run_eval_suite(cases, predictions, required_capabilities, metrics, exposure, limit, min_score)`.
  Casos têm exatamente `case_id`, `capability`, `kind` e `expected`; `kind` é benigno ou adversarial.
  Valide cada caso, previsão, capacidade, métrica (`exact`), ID de exposição, limite e nota antes de
  devolver. Audite o conjunto válido inteiro como `dataset`, com `counts` e `missing` na ordem exigida.
  Devolva invalid_dataset com IDs inválidos, blocked com vazamento e essa auditoria, ou ok com essa
  auditoria, capability_scores e contagens benignas/adversariais de aprovados somente para o prefixo
  limitado por `limit`. Valores esperados e previstos de `exact` devem ser escalares.
