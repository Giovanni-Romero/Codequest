  - {level: 1, text: "Qual descoberta torna toda nota posterior não confiável?"}
  - {level: 2, text: "Valide primeiro; depois use a ordem de prioridade declarada para vazamento e tipos de caso."}
  - {level: 3, text: "Para cartões de prova, rejeite uma resposta vazada antes de verificar se a prova tem perguntas fáceis e difíceis."}
solution: |
  def inspect_eval_suite(cases, exposure):
      if not isinstance(cases, list) or not isinstance(exposure, list):
          raise ValueError("invalid container")
      ids = set()
      for case in cases:
          if not isinstance(case, dict) or set(case) != {"case_id", "kind"} or not isinstance(case["case_id"], str) or not case["case_id"] or not isinstance(case["kind"], str) or case["kind"] not in {"benign", "adversarial"} or case["case_id"] in ids:
              raise ValueError("invalid case")
          ids.add(case["case_id"])
      for record in exposure:
          if not isinstance(record, dict) or set(record) != {"source", "case_id"} or not isinstance(record["source"], str) or not record["source"] or not isinstance(record["case_id"], str) or not record["case_id"] or record["case_id"] not in ids:
              raise ValueError("invalid exposure")
      if any(record["source"] == "direct" for record in exposure):
          return {"status": "direct_leakage"}
      if exposure:
          return {"status": "indirect_leakage"}
      if not cases:
          return {"status": "empty_suite"}
      if not any(case["kind"] == "benign" for case in cases):
          return {"status": "missing_control"}
      if not any(case["kind"] == "adversarial" for case in cases):
          return {"status": "missing_adversarial"}
      return {"status": "sound"}
