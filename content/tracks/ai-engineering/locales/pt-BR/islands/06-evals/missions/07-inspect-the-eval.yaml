brief: |
  Escreva `inspect_eval_suite(cases, exposure)`. Casos têm exatamente `case_id` e `kind`, em que `kind`
  é benigno ou adversarial e IDs são strings únicas. Exposição é uma lista de registros com as chaves
  exatas `source` e `case_id`. Devolva um status: direct_leakage quando source é `direct`,
  indirect_leakage para outra fonte correspondente, empty_suite, missing_control, missing_adversarial ou
  sound. Verifique toda a entrada antes de escolher o status e gere `ValueError` para dados malformados
  ou duplicados.
