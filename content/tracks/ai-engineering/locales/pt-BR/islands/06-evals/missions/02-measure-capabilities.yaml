brief: |
  Escreva `score_capabilities(cases, predictions, metrics)`. Casos têm as chaves exatas `case_id`,
  `capability` e `expected`; IDs são strings não vazias e únicos. `predictions` mapeia cada ID de caso
  para um valor. `metrics` mapeia cada capacidade para `exact` ou `contains_all`. `exact` aceita apenas
  valores escalares e compara tipo e valor. `contains_all` aceita listas únicas de strings e passa quando
  cada string esperada está na lista prevista, que também contém strings únicas. Devolva uma lista em ordem
  de primeira ocorrência com `capability`, `metric`, `passed`, `total` e `score`; rejeite dados ruins.
