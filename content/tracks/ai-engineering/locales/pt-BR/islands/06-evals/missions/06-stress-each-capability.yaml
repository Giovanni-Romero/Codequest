brief: |
  Escreva `score_adversarial_capabilities(results, required_capabilities, min_score)`. Cada resultado
  tem exatamente `capability`, `kind` e `passed`; `kind` é benigno ou adversarial e `passed` é bool.
  Devolva registros na ordem exigida com benign, adversarial, missing_kinds e meets_target. Notas ausentes
  são nulas e não podem passar. Rejeite valores inválidos e pares capacidade/tipo duplicados.
