id: ai-production-06
title: Resolva o lote limitado
track: ai-engineering
island: production-ai
order: 6
difficulty: moderate
tags:
- ai-engineering
- production
- deterministic
xp: 30
concepts:
- latency-cost-budget
- graceful-degradation
teaching:
  analogy: Uma central confere capacidade dos veículos antes de atribuir passageiros.
  explanation: Um lote limitado planeja toda a fila antes de consumir resultado do provedor. Rejeição de orçamento não é trabalho parcial. Registros ficam na ordem declarada mesmo se resultados chegarem embaralhados.
  worked_example: 'tarefas = ["a", "b"]

    print(len(tarefas))'
  key_points:
  - Valide associações antes de executar.
  - Orçamento vem antes do provedor.
  - Ordem de chamadas é ordem de saída.
brief: Escreva `resolve_bounded_batch(calls, budget, provider_results, fallbacks) -> dict`. Valide chamadas, resultados do provedor em associação exata um a um e fallbacks antes de qualquer decisão de orçamento. Rejeite um plano acima do orçamento sem consumir resultados. Caso contrário, preserve a ordem das chamadas e substitua cada falha do provedor pelo fallback explícito.
signature:
  entrypoint: resolve_bounded_batch
  stub: "def resolve_bounded_batch(calls, budget, provider_results, fallbacks):\n    # Return deterministic production evidence; never call a provider.\n    pass\n"
constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128
  forbidden_builtins:
  - eval
  - exec
