hints:
- level: 1
  text: O que precisa existir para cada chamada antes do primeiro resultado?
- level: 2
  text: Monte mapa de IDs após validar IDs únicos.
- level: 3
  text: 'Para bilhetes: `by_id = {row["id"]: row for row in rows}`. '
solution: |
  def check_call_budget(calls, budget):
      keys = {"max_requests", "max_tokens", "max_cost_units", "max_concurrency", "max_wall_ms"}
      call_keys = {"call_id", "input_tokens", "max_output_tokens", "cost_units", "start_ms", "duration_ms"}
      if not isinstance(calls, list) or not isinstance(budget, dict) or set(budget) != keys or any(type(budget[key]) is not int or budget[key] <= 0 for key in keys):
          raise ValueError("invalid budget")
      ids, intervals = set(), []
      for call in calls:
          if not isinstance(call, dict) or set(call) != call_keys or type(call["call_id"]) is not str or not call["call_id"] or call["call_id"] in ids or any(type(call[key]) is not int or call[key] < 0 for key in call_keys - {"call_id"}):
              raise ValueError("invalid call")
          ids.add(call["call_id"])
          intervals.append((call["start_ms"], call["start_ms"] + call["duration_ms"]))
      usage = {"requests": len(calls), "tokens": sum(call["input_tokens"] + call["max_output_tokens"] for call in calls), "cost_units": sum(call["cost_units"] for call in calls), "peak_concurrency": max([sum(start <= point < end for start, end in intervals) for pair in intervals for point in pair] or [0]), "wall_ms": max((end for _, end in intervals), default=0)}
      pairs = [("max_requests", "requests"), ("max_tokens", "tokens"), ("max_cost_units", "cost_units"), ("max_concurrency", "peak_concurrency"), ("max_wall_ms", "wall_ms")]
      exceeded = [limit for limit, key in pairs if usage[key] > budget[limit]]
      return {"status": "over_budget" if exceeded else "within_budget", "usage": usage, "exceeded": exceeded}
  
  def resolve_bounded_batch(calls, budget, provider_results, fallbacks):
      states = ["offline", "timeout", "rejected"]
      if not isinstance(fallbacks, list) or len(fallbacks) != 3:
          raise ValueError("invalid fallbacks")
      values = {}
      for state, fallback in zip(states, fallbacks):
          if not isinstance(fallback, dict) or set(fallback) != {"status", "value"} or fallback["status"] != state:
              raise ValueError("invalid fallback")
          values[state] = fallback["value"]
      if not isinstance(provider_results, list) or len(provider_results) != len(calls):
          raise ValueError("invalid results")
      call_ids = {call["call_id"] for call in calls}
      results = {}
      for row in provider_results:
          if not isinstance(row, dict) or set(row) != {"call_id", "status", "value", "reason"} or type(row["call_id"]) is not str or row["call_id"] not in call_ids or row["call_id"] in results or type(row["status"]) is not str or row["status"] not in {"ok", *states}:
              raise ValueError("invalid result")
          if row["status"] == "ok":
              if row["reason"] is not None:
                  raise ValueError("invalid result")
          elif row["value"] is not None or type(row["reason"]) is not str or not row["reason"]:
              raise ValueError("invalid result")
          results[row["call_id"]] = row
      if len(results) != len(calls):
          raise ValueError("invalid results")
      report = check_call_budget(calls, budget)
      if report["status"] == "over_budget":
          return {"status": "budget_rejected", "usage": report["usage"], "exceeded": report["exceeded"]}
      records = []
      for call in calls:
          row = results[call["call_id"]]
          if row["status"] == "ok":
              records.append({"call_id": call["call_id"], "status": "ok", "result": row["value"]})
          else:
              records.append({"call_id": call["call_id"], "status": row["status"], "result": values[row["status"]], "degraded": True, "reason": row["reason"]})
      return {"status": "degraded" if any(row["status"] != "ok" for row in records) else "completed", "usage": report["usage"], "records": records}
