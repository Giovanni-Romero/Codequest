id: ai-pydanticai-02
title: Injete dependências no agente
track: ai-engineering
island: pydanticai
order: 2
difficulty: expert
tags: [ai-engineering, pydanticai, requires-ai-orchestration]
xp: 60
concepts: [pydanticai-dependencies]
teaching:
  analogy: A impressora de etiquetas da farmácia puxa a dosagem da receita arquivada, não do que o cliente grita do outro lado do balcão.
  explanation: "Dependências levam serviços e estado para dentro da execução sem variáveis globais. Tools leem esses dados via ctx.deps em vez de confiar nos argumentos gerados pelo modelo. TestModel continua dirigindo o loop offline, chamando cada tool antes de responder. Trocar o valor de Deps muda o resultado sem tocar em nenhuma lógica do agente."
  worked_example: |
    from pydantic_ai import Agent, RunContext
    from pydantic_ai.models.test import TestModel
    agent = Agent(TestModel(), deps_type=dict)
    @agent.tool
    def shelve(ctx: RunContext) -> str:
        return "oats:" + ctx.deps["shelf"]
    print(agent.run_sync("shelve it", deps={"shelf": "top"}).output)
  key_points:
    - Coloque serviços e estado em deps, porque globais escondem o que o agente precisa e quebram execuções paralelas.
    - Leia os fatos da tool a partir de ctx.deps, porque argumentos gerados pelo modelo são entrada não confiável.
    - Devolva o resultado da tool na resposta, porque tool chamada mas não usada é decoração, não fiação.
    - Troque doubles via deps=, porque lógica inalterada com dados novos prova que a injeção funciona.
brief: >
  Escreva `pydanticai_dependency(topic, suffix) -> dict`. Rejeite argumentos que não
  sejam string ou que estejam em branco com ValueError. Defina um `@dataclass Deps`
  com `topic: str` e `suffix: str`. Construa um `Agent` real com `TestModel` e
  `deps_type=Deps`; registre uma tool `label(ctx: RunContext[Deps])` que devolva
  `ctx.deps.topic + ctx.deps.suffix` sem ler mais nada. Execute `run_sync` com
  `deps=Deps(...)`, parseie a saída JSON e devolva
  `{"status": "dependency", "label": <resultado da tool>}` usando as entradas sem
  espaços. Trocar o double deve mudar o rótulo sem mudar a lógica. Sem rede ou provedor.
signature:
  entrypoint: pydanticai_dependency
  stub: |
    def pydanticai_dependency(topic, suffix):
        # Injete Deps, deixe a tool ler ctx.deps, devolva o resultado dela.
        pass
constraints: {max_runtime_ms: 5000, max_memory_mb: 256, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - {args: [access, '!'], expect: {status: dependency, label: 'access!'}}
    - {args: [ledger, '#'], expect: {status: dependency, label: 'ledger#'}}
  hidden:
    - {args: [quarry, '?'], expect: {status: dependency, label: 'quarry?'}}
    - {args: ['  access  ', '!'], expect: {status: dependency, label: 'access!'}}
    - {args: ['', '!'], raises: ValueError}
    - {args: [access, '   '], raises: ValueError}
    - {args: [1, '!'], raises: ValueError}
    - {args: [access, null], raises: ValueError}
    - {args: [true, '!'], raises: ValueError}
hints:
  - {level: 1, text: "De onde a tool tira os fatos — dos argumentos do modelo, ou das dependências que você injetou?"}
  - {level: 2, text: "Declare Deps, registre uma tool que leia só ctx.deps, e passe o double via run_sync(deps=...)."}
  - {level: 3, text: "Uma tool de despensa lê `return \"oats:\" + ctx.deps[\"shelf\"]` e a execução imprime o campo parseado de `output` para aquele nome de tool."}
solution: |
  def pydanticai_dependency(topic, suffix):
      import json
      from dataclasses import dataclass
      from pydantic_ai import Agent, RunContext
      from pydantic_ai.models.test import TestModel
      if type(topic) is not str or not topic.strip():
          raise ValueError("invalid topic")
      if type(suffix) is not str or not suffix.strip():
          raise ValueError("invalid suffix")
      cleaned_topic = topic.strip()
      cleaned_suffix = suffix.strip()
      @dataclass
      class Deps:
          topic: str
          suffix: str
      agent = Agent(TestModel(), deps_type=Deps)
      @agent.tool
      def label(ctx: RunContext[Deps]) -> str:
          return ctx.deps.topic + ctx.deps.suffix
      result = agent.run_sync("make the label", deps=Deps(topic=cleaned_topic, suffix=cleaned_suffix))
      payload = json.loads(result.output)
      return {"status": "dependency", "label": payload["label"]}
