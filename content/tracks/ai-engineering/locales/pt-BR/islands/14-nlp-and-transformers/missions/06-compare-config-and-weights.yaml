id: ai-nlp-06
title: Compare configuração e pesos
track: ai-engineering
island: nlp-and-transformers
order: 6
difficulty: challenging
tags: [ai-engineering, transformers, config, weights, requires-ai-ml]
xp: 45
concepts: [model-config-and-weights]
teaching:
  analogy: Dois navios podem compartilhar uma planta e ter motores calibrados de maneiras diferentes. Dimensões iguais não provam estados iguais.
  explanation: Reutilizar uma configuração reproduz a arquitetura, não os parâmetros. A inicialização aleatória depende da semente. A reprodutibilidade registra a configuração completa e os pesos exatos ou a identidade do checkpoint.
  worked_example: |
    same_blueprint = True
    same_parts = False
    print(same_blueprint, same_parts)
  key_points:
    - Configurações iguais podem conter pesos diferentes.
    - Uma semente controla a inicialização nova, não a identidade pré-treinada.
    - Compare tensores quando a igualdade dos pesos importa.
brief: >
  Escreva `compare_model_states(first_seed, second_seed) -> dict`. Construa duas vezes o mesmo
  classificador BERT local minúsculo, definindo `torch.manual_seed` imediatamente antes de cada
  construção. Retorne se configurações e todos os tensores de estado coincidem, a contagem de
  tensores e o formato do classificador. Rejeite sementes inválidas.
signature:
  entrypoint: compare_model_states
  stub: |
    def compare_model_states(first_seed, second_seed):
        # Prove que igualdade de arquitetura e de pesos são afirmações separadas.
        pass
constraints: {max_runtime_ms: 10000, max_memory_mb: 8192, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [7, 7]
      expect: {config_equal: true, weights_equal: true, tensor_count: 25, classifier_shape: [2, 8]}
    - args: [7, 8]
      expect: {config_equal: true, weights_equal: false, tensor_count: 25, classifier_shape: [2, 8]}
  hidden:
    - {args: [true, 1], raises: ValueError}
    - {args: [1, false], raises: ValueError}
    - {args: [-1, 1], raises: ValueError}
    - {args: [1, -1], raises: ValueError}
    - {args: [1.5, 1], raises: ValueError}
hints:
  - {level: 1, text: "Plantas iguais provam que todo tensor armazenado é igual?"}
  - {level: 2, text: "Redefina a semente antes de cada modelo e compare os dois dicionários de estado."}
  - {level: 3, text: "Exija chaves idênticas e use `torch.equal` para cada par de tensores de estado."}
solution: |
  def compare_model_states(first_seed, second_seed):
      import torch
      from transformers import BertConfig, BertForSequenceClassification
      if type(first_seed) is not int or first_seed < 0 or type(second_seed) is not int or second_seed < 0:
          raise ValueError("invalid seed")
      config = BertConfig(vocab_size=10, hidden_size=8, num_hidden_layers=1, num_attention_heads=2, intermediate_size=16, num_labels=2, max_position_embeddings=16)
      torch.manual_seed(first_seed)
      first = BertForSequenceClassification(config)
      torch.manual_seed(second_seed)
      second = BertForSequenceClassification(config)
      first_state = first.state_dict(); second_state = second.state_dict()
      return {"config_equal": first.config.to_dict() == second.config.to_dict(), "weights_equal": all(torch.equal(first_state[name], second_state[name]) for name in first_state), "tensor_count": len(first_state), "classifier_shape": list(first.classifier.weight.shape)}
