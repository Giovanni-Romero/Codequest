    - {args: [{input: 0, prediction: 0, performance: 0}, {input: 0, prediction: 0, performance: 0, concept: 0}, {baseline: 10, current: 10}, 0], raises: ValueError}
    - {args: [{input: 0, prediction: 0, performance: 0, concept: 0}, {input: 0, prediction: 0, performance: 0, concept: 0}, {baseline: true, current: true}, 0], raises: ValueError}
