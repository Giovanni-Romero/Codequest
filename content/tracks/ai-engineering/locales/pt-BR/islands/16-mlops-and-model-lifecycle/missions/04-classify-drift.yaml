id: ai-mlops-04
title: Classifique o drift
track: ai-engineering
island: mlops-and-model-lifecycle
order: 4
difficulty: challenging
tags: [ai-engineering, mlops, drift, monitoring]
xp: 45
concepts: [drift-monitoring]
teaching:
  analogy: Um porto compara turnos iguais de observação para vento, tráfego, atrasos e precisão das rotas. Uma mudança no vento não é automaticamente uma falha de navegação, mas o registro ainda nomeia o que mudou e com qual intensidade.
  explanation: O monitoramento de drift compara janelas declaradas de referência e atuais. Drift de entrada muda os dados recebidos, drift de previsão muda as saídas, drift de desempenho muda a qualidade medida e drift de conceito muda a relação entre entradas e resultados. Tipo e severidade são evidências; sozinhos, não decidem a resposta.
  worked_example: |
    antigo = {"temperatura": 18.0, "pressao": 1.0}
    novo = {"temperatura": 18.4, "pressao": 1.0}
    nomes = ["temperatura", "pressao"]
    mudancas = {nome: abs(novo[nome] - antigo[nome]) for nome in nomes}
    vencedor = max(nomes, key=mudancas.__getitem__)
    print(mudancas)
    print("maior:", vencedor)
  key_points:
    - Compare janelas positivas e iguais para dar uma base significativa às mudanças.
    - Nomeie o tipo de drift em vez de tratar todo alerta como a mesma falha.
    - Separe severidade de ação porque uma mudança de distribuição pode ser inofensiva.
brief: >
  Escreva `classify_drift(baseline, current, window, tolerance) -> dict`. Baseline e
  current são mapeamentos exatos com `input`, `prediction`, `performance` e `concept`,
  cada um contendo um número finito sem booleanos. `window` tem exatamente contagens
  inteiras positivas `baseline` e `current`; elas devem ser iguais e booleanos são
  inválidos. Tolerância é um número finito de 0 a 1. Calcule mudanças absolutas
  arredondadas para três casas. Se nenhuma mudança bruta superar a tolerância, tipo e
  severidade são `none`. Caso contrário, escolha a maior mudança, desempatando na ordem
  input, prediction, performance e concept. A severidade é `warning` até duas vezes a
  tolerância e `critical` acima disso; qualquer mudança positiva é crítica quando a
  tolerância é zero. Retorne janela, mudanças, tipo e severidade. Rejeite dados
  malformados ou não finitos e não altere mapeamentos.
signature:
  entrypoint: classify_drift
  stub: |
    def classify_drift(baseline, current, window, tolerance):
        # Compare explicit windows before naming drift type and severity.
        pass
constraints: {max_runtime_ms: 1000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
