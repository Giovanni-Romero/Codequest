id: ai-mlops-07
title: Selecione uma resposta ao drift
track: ai-engineering
island: mlops-and-model-lifecycle
order: 7
difficulty: challenging
tags: [ai-engineering, mlops, deployment, drift, response]
xp: 45
concepts: [deployment-strategies, drift-monitoring]
teaching:
  analogy: Vento forte pode exigir apenas observação, um canal alterado pode exigir novas cartas e navios encalhados podem exigir retorno à rota antiga. A resposta segue o tipo de evidência, não o volume de um único medidor.
  explanation: Sinais de drift apoiam decisões de observar, retreinar ou reverter. Mudanças nas distribuições de entrada e previsão não provam piora nos resultados, então permanecem em observação. Drift de conceito pede retreinamento, enquanto drift crítico de desempenho medido pode justificar rollback para uma alternativa aprovada. Sem alternativa aprovada, retreinar é mais seguro do que ativar uma versão desconhecida.
  worked_example: |
    sinal = {"tipo": "clima", "severidade": "alta"}
    acao = "observar" if sinal["tipo"] == "clima" else "mudar-rota"
    rota = "atual"
    if acao == "mudar-rota":
        rota = "reserva"
    print(acao)
    print(rota)
  key_points:
    - Não transforme apenas mudança de distribuição em rollback.
    - Retreine quando a relação entre entrada e resultado mudar.
    - Reverta desempenho crítico apenas para uma alternativa aprovada.
brief: >
  Escreva `select_drift_response(signal, deployed_version, fallback_version) -> dict`.
  `signal` é uma saída exata da missão 04 com janela positiva comparável, mudanças
  finitas não negativas, tipo válido e severidade correspondente. Cada versão é um
  mapeamento exato com `version` não vazia e `state` entre `pending`, `approved`,
  `rejected` ou `retired`; IDs são diferentes e a versão implantada está aprovada.
  Ausência de drift retorna `observe/stable`. Drift de entrada ou previsão retorna
  `observe/distribution-only`. Drift de conceito retorna `retrain/concept-drift`.
  Alerta de desempenho retorna `retrain/performance-warning`. Drift crítico de
  desempenho retorna `rollback/performance-critical` apenas quando a alternativa está
  aprovada; caso contrário, retorne `retrain/no-approved-fallback`. Retorne ação, motivo,
  versão ativa, versão implantada e alternativa. Rejeite dados malformados e não altere
  argumentos.
signature:
  entrypoint: select_drift_response
  stub: |
    def select_drift_response(signal, deployed_version, fallback_version):
        # Choose evidence-matched observation, retraining, or rollback.
        pass
constraints: {max_runtime_ms: 1000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
