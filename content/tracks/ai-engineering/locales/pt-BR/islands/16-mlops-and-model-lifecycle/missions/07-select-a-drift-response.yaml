      expect: {action: observe, reason: stable, active_version: v2, deployed_version: v2, fallback_version: v1}
    - args: [{window: {baseline: 10, current: 10}, changes: {input: 0.001, prediction: 0, performance: 0, concept: 0}, type: input, severity: critical}, {version: v2, state: approved}, {version: v1, state: approved}]
      expect: {action: observe, reason: distribution-only, active_version: v2, deployed_version: v2, fallback_version: v1}
    - args: [{window: {baseline: 10, current: 10}, changes: {input: 0.0, prediction: 0, performance: 0, concept: 0}, type: input, severity: critical}, {version: v2, state: approved}, {version: v1, state: approved}]
      expect: {action: observe, reason: distribution-only, active_version: v2, deployed_version: v2, fallback_version: v1}
hints:
  - {level: 1, text: "O sinal mostra mudança de distribuição, de relação ou dano medido ao desempenho?"}
  - {level: 2, text: "Trate ausência de drift e drift de distribuição antes dos ramos de conceito e desempenho."}
  - {level: 3, text: "Uma política pode ramificar diante de um alerta sem alterar sua entrada: `ação = reserva if alarme else atual`."}
solution: |
  def select_drift_response(signal, deployed_version, fallback_version):
      import math
      names = {"input", "prediction", "performance", "concept"}
      if type(signal) is not dict or set(signal) != {"window", "changes", "type", "severity"}:
          raise ValueError("invalid signal")
      window = signal["window"]
      changes = signal["changes"]
      if type(window) is not dict or set(window) != {"baseline", "current"} or any(type(window[key]) is not int or window[key] <= 0 for key in window) or window["baseline"] != window["current"]:
          raise ValueError("invalid window")
      if type(changes) is not dict or set(changes) != names:
          raise ValueError("invalid changes")
      for value in changes.values():
          if type(value) not in (int, float):
              raise ValueError("invalid change")
          try:
              finite = math.isfinite(value)
          except (OverflowError, TypeError):
              finite = False
          if not finite or value < 0:
              raise ValueError("invalid change")
      if any(round(value, 3) != value for value in changes.values()):
          raise ValueError("invalid change precision")
      drift_type = signal["type"]
      severity = signal["severity"]
      if drift_type == "none":
          if severity != "none":
              raise ValueError("invalid signal state")
      elif type(drift_type) is not str or drift_type not in names or severity not in ("warning", "critical"):
          raise ValueError("invalid signal state")
      elif any(value > changes[drift_type] for value in changes.values()):
          raise ValueError("inconsistent drift type")
      states = {"pending", "approved", "rejected", "retired"}
      for version in (deployed_version, fallback_version):
          if type(version) is not dict or set(version) != {"version", "state"} or type(version["version"]) is not str or not version["version"].strip() or type(version["state"]) is not str or version["state"] not in states:
              raise ValueError("invalid version")
      if deployed_version["state"] != "approved" or deployed_version["version"] == fallback_version["version"]:
          raise ValueError("invalid deployed version")
      if drift_type == "none":
          action, reason = "observe", "stable"
      elif drift_type in ("input", "prediction"):
          action, reason = "observe", "distribution-only"
      elif drift_type == "concept":
          action, reason = "retrain", "concept-drift"
      elif severity == "warning":
          action, reason = "retrain", "performance-warning"
      elif fallback_version["state"] == "approved":
          action, reason = "rollback", "performance-critical"
      else:
          action, reason = "retrain", "no-approved-fallback"
      active = fallback_version["version"] if action == "rollback" else deployed_version["version"]
      return {"action": action, "reason": reason, "active_version": active, "deployed_version": deployed_version["version"], "fallback_version": fallback_version["version"]}
