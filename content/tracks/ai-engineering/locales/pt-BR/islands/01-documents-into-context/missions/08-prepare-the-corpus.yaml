id: ai-documents-08
title: Prepare o corpus
track: ai-engineering
island: documents-into-context
order: 8
difficulty: moderate
tags: [ai-engineering, ingestion, chunking, context-budget, provenance]
xp: 30

concepts:
  - fixed-window-chunking
  - chunk-invariants
  - chunk-overlap
  - chunk-metadata
  - semantic-boundaries
  - context-budget
  - chunk-quality

teaching:
  analogy: |
    Uma transportadora não joga carga solta direto no navio. Ela agrupa itens relacionados,
    divide cargas grandes demais, etiqueta cada pacote, rejeita duplicações e então carrega
    o que cabe na capacidade do navio.

    Preparar um corpus é o mesmo pipeline. Cada etapa protege uma propriedade que uma
    etapa posterior de retrieval ou geração precisa.

  explanation: |
    Um pipeline de ingestão transforma documentos de origem em registros limitados e
    rastreáveis por etapas explícitas. Aqui, cada etapa já foi construída: fronteiras de
    parágrafos, janelas fixas, overlap controlado, metadados estáveis, remoção de duplicatas
    e orçamento rígido. A ordem importa porque limitar chunks inválidos só torna dados
    ruins mais baratos, não úteis.

  worked_example: |
    # Prepare encomendas etiquetadas antes de carregar o caminhão.
    orders = [{"shop": "A", "items": ["tea", "rice"]}]
    parcels = []
    for order in orders:
        for position, item in enumerate(order["items"]):
            parcels.append({"id": f"{order['shop']}:{position}", "item": item})
    loaded = parcels[:1]
    print(loaded)

  key_points:
    - A ordem do pipeline torna falhas atribuíveis em vez de escondê-las numa operação.
    - Fronteiras semânticas são preferidas; limites rígidos de tamanho ainda vencem.
    - Texto exatamente duplicado mantém sua primeira proveniência e não entra duas vezes.
    - O orçamento vem depois da validação, pois somente contexto útil merece espaço.

brief: |
  Escreva `prepare_corpus`. Ela recebe dicionários com `source_id` e `text`, além de
  `max_words`, `overlap` e `context_budget`.

  Processe documentos na ordem. Separe parágrafos em linhas vazias. Mantenha parágrafos
  que couberem e divida os grandes em janelas sobrepostas. Anexe `chunk_id`, `source_id`,
  `position` e `text`, com posições começando em zero por origem. Remova texto normalizado
  exatamente duplicado, mantendo a primeira ocorrência. Por fim, percorra os chunks e
  retorne os que couberem no orçamento total, pulando um chunk que não caiba e continuando.

  Ignore documentos vazios. Levante `ValueError` para origens vazias ou duplicadas,
  `max_words` não positivo, overlap fora de `0 <= overlap < max_words` ou orçamento negativo.

signature:
  entrypoint: prepare_corpus
  stub: |
    def prepare_corpus(documents, max_words, overlap, context_budget):
        # Construa chunks válidos primeiro e selecione depois os que cabem no orçamento.
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args:
        - [{source_id: guide, text: "one two\n\nthree four five six"}]
        - 3
        - 1
        - 7
      expect:
        - {chunk_id: "guide:0", source_id: guide, position: 0, text: "one two"}
        - {chunk_id: "guide:1", source_id: guide, position: 1, text: "three four five"}
        - {chunk_id: "guide:2", source_id: guide, position: 2, text: "five six"}
    - args:
        - [{source_id: A, text: "a b"}, {source_id: B, text: "c d\n\ne"}]
        - 2
        - 0
        - 3
      expect:
        - {chunk_id: "A:0", source_id: A, position: 0, text: "a b"}
        - {chunk_id: "B:1", source_id: B, position: 1, text: e}
  hidden:
    - args: [[], 3, 1, 10]
      expect: []
    - args:
        - [{source_id: empty, text: " \n\t "}]
        - 3
        - 0
        - 10
      expect: []
    - args:
        - [{source_id: first, text: "same text"}, {source_id: second, text: "same   text\n\nnew"}]
        - 3
        - 0
        - 10
      expect:
        - {chunk_id: "first:0", source_id: first, position: 0, text: "same text"}
        - {chunk_id: "second:1", source_id: second, position: 1, text: new}
    - args:
        - [{source_id: doc, text: "a b c d e"}]
        - 4
        - 3
        - 8
      expect:
        - {chunk_id: "doc:0", source_id: doc, position: 0, text: "a b c d"}
        - {chunk_id: "doc:1", source_id: doc, position: 1, text: "b c d e"}
    - args:
        - [{source_id: doc, text: anchor}]
        - 0
        - 0
        - 4
      raises: ValueError
    - args:
        - [{source_id: doc, text: anchor}]
        - 2
        - 2
        - 4
      raises: ValueError
    - args:
        - [{source_id: doc, text: anchor}]
        - 2
        - -1
        - 4
      raises: ValueError
    - args:
        - [{source_id: doc, text: anchor}]
        - 2
        - 0
        - -1
      raises: ValueError
    - args:
        - [{source_id: same, text: one}, {source_id: same, text: two}]
        - 2
        - 0
        - 4
      raises: ValueError
    - args:
        - [{source_id: " ", text: anchor}]
        - 2
        - 0
        - 4
      raises: ValueError

hints:
  - level: 1
    text: |
      Quais propriedades precisam ser verdadeiras antes de um chunk merecer parte do
      orçamento final? Construa o pipeline na ordem das missões anteriores.
  - level: 2
    text: |
      Primeiro colete parágrafos. Divida somente os grandes com stride positivo. Etiquete
      candidatos, filtre texto normalizado repetido e aplique o orçamento por último.
  - level: 3
    text: |
      Um padrão compacto em outro domínio se parece com isto:

          prepared = label(split(raw_items))
          unique = []
          seen = set()
          for item in prepared:
              if item["value"] not in seen:
                  unique.append(item)
                  seen.add(item["value"])
          return pack_within_limit(unique)

      Sua etapa de divisão preserva parágrafos, overlap e posições por origem.

solution: |
  def prepare_corpus(documents, max_words, overlap, context_budget):
      if max_words <= 0:
          raise ValueError("max_words must be positive")
      if overlap < 0 or overlap >= max_words:
          raise ValueError("overlap must be between zero and max_words")
      if context_budget < 0:
          raise ValueError("context_budget must not be negative")

      chunks = []
      seen_sources = set()
      seen_text = set()
      stride = max_words - overlap

      for document in documents:
          source_id = document["source_id"]
          if not source_id.strip() or source_id in seen_sources:
              raise ValueError("source IDs must be non-empty and unique")
          seen_sources.add(source_id)

          paragraphs = []
          current = []
          for line in document["text"].splitlines():
              if line.strip():
                  current.extend(line.split())
              elif current:
                  paragraphs.append(current)
                  current = []
          if current:
              paragraphs.append(current)

          position = 0
          for words in paragraphs:
              for start in range(0, len(words), stride):
                  candidate = " ".join(words[start : start + max_words])
                  candidate_position = position
                  position += 1
                  if candidate not in seen_text:
                      chunks.append(
                          {
                              "chunk_id": f"{source_id}:{candidate_position}",
                              "source_id": source_id,
                              "position": candidate_position,
                              "text": candidate,
                          }
                      )
                      seen_text.add(candidate)
                  if start + max_words >= len(words):
                      break

      selected = []
      used = 0
      for chunk in chunks:
          cost = len(chunk["text"].split())
          if used + cost <= context_budget:
              selected.append(chunk)
              used += cost
      return selected
