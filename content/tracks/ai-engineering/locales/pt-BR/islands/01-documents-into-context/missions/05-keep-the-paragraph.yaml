id: ai-documents-05
title: Preserve o parágrafo
track: ai-engineering
island: documents-into-context
order: 5
difficulty: moderate
tags: [ai-engineering, chunking, semantic-boundaries, provenance]
xp: 30

concepts:
  - semantic-boundaries

teaching:
  analogy: |
    Empacotar uma mudança apenas pelo peso pode separar um conjunto entre duas caixas.
    Quem empacota com cuidado mantém cada conjunto junto quando ele cabe, mas divide um
    conjunto pesado demais em vez de quebrar o limite de peso.

    Parágrafos são conjuntos naturais de frases relacionadas. Mantenha cada um junto
    quando possível, mas deixe o limite rígido de contexto vencer quando ele for grande.

  explanation: |
    Uma fronteira semântica marca onde uma unidade de significado termina e outra começa.
    Linhas vazias oferecem uma fronteira de parágrafo determinística, sem pedir que um
    modelo adivinhe. Um parágrafo que cabe vira um chunk. Um parágrafo grande demais usa
    janelas fixas como fallback, pois uma preferência nunca deve derrotar um limite rígido.

  worked_example: |
    # Mantenha cada lista de compras junta, salvo se uma sacola comportar só três itens.
    lists = [["bread", "milk"], ["rice", "beans", "tea", "salt"]]
    bags = []
    for items in lists:
        for start in range(0, len(items), 3):
            bags.append(items[start : start + 3])
    print(bags)

  key_points:
    - Fronteiras naturais melhoram a coerência, mas não removem limites de tamanho.
    - Linhas sem uma linha vazia entre elas pertencem ao mesmo parágrafo.
    - Parágrafos grandes demais precisam de um fallback determinístico por palavras.
    - Os metadados acompanham todo chunk, inclusive os criados pelo fallback.

brief: |
  Escreva `chunk_by_paragraph`. Ela recebe um `source_id` não vazio, texto e um
  `max_words` positivo. Parágrafos são blocos de linhas não vazias separados por uma ou
  mais linhas vazias. Normalize o whitespace dentro de cada parágrafo.

  Retorne dicionários com `chunk_id`, `source_id`, `position` e `text`. Mantenha um
  parágrafo como um chunk quando ele couber. Divida um parágrafo grande demais em janelas
  fixas. As posições começam em zero em toda a origem.

  Retorne uma lista vazia para texto vazio. Levante `ValueError` para `source_id` vazio
  ou `max_words` não positivo.

signature:
  entrypoint: chunk_by_paragraph
  stub: |
    def chunk_by_paragraph(source_id, text, max_words):
        # Prefira parágrafos e use janelas de palavras limitadas como fallback.
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["guide", "First short paragraph.\n\nSecond one here.", 4]
      expect:
        - {chunk_id: "guide:0", source_id: guide, position: 0, text: "First short paragraph."}
        - {chunk_id: "guide:1", source_id: guide, position: 1, text: "Second one here."}
    - args: ["long", "one two three four five", 3]
      expect:
        - {chunk_id: "long:0", source_id: long, position: 0, text: "one two three"}
        - {chunk_id: "long:1", source_id: long, position: 1, text: "four five"}
  hidden:
    - args: ["empty", "", 3]
      expect: []
    - args: ["empty", " \n\t\n ", 3]
      expect: []
    - args: ["wrapped", "one two\nthree four", 5]
      expect:
        - {chunk_id: "wrapped:0", source_id: wrapped, position: 0, text: "one two three four"}
    - args: ["spaces", " one   two \n\n\n three\tfour ", 2]
      expect:
        - {chunk_id: "spaces:0", source_id: spaces, position: 0, text: "one two"}
        - {chunk_id: "spaces:1", source_id: spaces, position: 1, text: "three four"}
    - args: ["solo", "anchor", 1]
      expect:
        - {chunk_id: "solo:0", source_id: solo, position: 0, text: anchor}
    - args: ["", "text", 2]
      raises: ValueError
    - args: ["doc", "text", 0]
      raises: ValueError
    - args: ["doc", "text", -2]
      raises: ValueError

hints:
  - level: 1
    text: |
      Qual evento informa que o parágrafo atual terminou e está pronto para ser guardado?
  - level: 2
    text: |
      Construa o parágrafo atual com linhas não vazias. Numa linha vazia, guarde-o e
      comece outro. Depois, aplique fatias de palavras apenas aos que passam do limite.
  - level: 3
    text: |
      Este é um coletor de blocos separados por linhas vazias:

          groups = []
          current = []
          for row in rows:
              if row.strip():
                  current.extend(row.split())
              elif current:
                  groups.append(current)
                  current = []

      Lembre de guardar o último grupo depois do loop.

solution: |
  def chunk_by_paragraph(source_id, text, max_words):
      if not source_id.strip():
          raise ValueError("source_id must not be empty")
      if max_words <= 0:
          raise ValueError("max_words must be positive")

      paragraphs = []
      current = []
      for line in text.splitlines():
          if line.strip():
              current.extend(line.split())
          elif current:
              paragraphs.append(current)
              current = []
      if current:
          paragraphs.append(current)

      chunks = []
      for words in paragraphs:
          for start in range(0, len(words), max_words):
              position = len(chunks)
              chunks.append(
                  {
                      "chunk_id": f"{source_id}:{position}",
                      "source_id": source_id,
                      "position": position,
                      "text": " ".join(words[start : start + max_words]),
                  }
              )
      return chunks
