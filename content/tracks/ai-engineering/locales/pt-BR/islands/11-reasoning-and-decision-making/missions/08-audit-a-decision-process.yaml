hints:
  - level: 1
    text: "Qual evidência independente cada um dos quatro conceitos deve fornecer ao relatório final?"
  - level: 2
    text: "Valide os contratos compartilhados uma vez; depois execute busca em largura, busca gulosa, validação sequencial do plano e cálculo TD."
  - level: 3
    text: "Construa três relatórios aninhados chamados `search`, `plan` e `learning`; normalize cada float TD retornado."
solution: |
  def audit_decision_process(graph, heuristics, start, goal, actions, plan, resources, transition):
      from collections import deque
      import heapq
      import math
      def finite_number(value):
          if type(value) not in (int, float):
              return False
          try:
              return math.isfinite(value)
          except OverflowError:
              return False
      if not isinstance(graph, dict) or not graph or not isinstance(heuristics, dict) or not isinstance(start, str) or not isinstance(goal, str):
          raise ValueError("invalid search input")
      if any(not isinstance(state, str) or not isinstance(neighbors, list) or any(not isinstance(neighbor, str) for neighbor in neighbors) for state, neighbors in graph.items()):
          raise ValueError("invalid graph")
      if start not in graph or goal not in graph or any(neighbor not in graph for neighbors in graph.values() for neighbor in neighbors):
          raise ValueError("unknown state")
      if set(heuristics) != set(graph) or not all(finite_number(value) for value in heuristics.values()):
          raise ValueError("invalid heuristics")
      required_fields = {"requires", "costs", "produces", "excludes"}
      if not isinstance(actions, dict) or not actions or not isinstance(plan, list) or not isinstance(resources, dict):
          raise ValueError("invalid plan input")
      def valid_amounts(values):
          return isinstance(values, dict) and all(isinstance(name, str) and type(amount) is int and amount >= 0 for name, amount in values.items())
      if not valid_amounts(resources):
          raise ValueError("invalid resources")
      for name, spec in actions.items():
          if not isinstance(name, str) or not isinstance(spec, dict) or set(spec) != required_fields:
              raise ValueError("invalid action")
          if not isinstance(spec["requires"], list) or not isinstance(spec["excludes"], list) or not all(isinstance(item, str) for item in spec["requires"] + spec["excludes"]):
              raise ValueError("invalid action")
          if not valid_amounts(spec["costs"]) or not valid_amounts(spec["produces"]):
              raise ValueError("invalid action")
      if any(reference not in actions for spec in actions.values() for reference in spec["requires"] + spec["excludes"]):
          raise ValueError("unknown action reference")
      if not all(isinstance(name, str) for name in plan):
          raise ValueError("invalid plan")
      if not isinstance(transition, dict) or set(transition) != {"value", "reward", "next_value", "alpha", "gamma"} or not all(finite_number(value) for value in transition.values()):
          raise ValueError("invalid transition")
      if not 0 < transition["alpha"] <= 1 or not 0 <= transition["gamma"] <= 1:
          raise ValueError("invalid rate")
      queue = deque([(start, [start])])
      visited = {start}
      shortest_path = []
      shortest_expanded = 0
      while queue:
          state, path = queue.popleft()
          shortest_expanded += 1
          if state == goal:
              shortest_path = path
              break
          for neighbor in graph[state]:
              if neighbor not in visited:
                  visited.add(neighbor)
                  queue.append((neighbor, path + [neighbor]))
      frontier = [(heuristics[start], 0, start, [start])]
      visited = set()
      guided_path = []
      guided_expanded = 0
      counter = 0
      while frontier:
          _, _, state, path = heapq.heappop(frontier)
          if state in visited:
              continue
          visited.add(state)
          guided_expanded += 1
          if state == goal:
              guided_path = path
              break
          for neighbor in graph[state]:
              if neighbor not in visited:
                  counter += 1
                  heapq.heappush(frontier, (heuristics[neighbor], counter, neighbor, path + [neighbor]))
      remaining = dict(resources)
      completed = []
      plan_report = None
      for index, name in enumerate(plan):
          if name not in actions:
              reason = "unknown-action"
          elif name in completed:
              reason = "repeated-action"
          elif any(requirement not in completed for requirement in actions[name]["requires"]):
              reason = "missing-prerequisite"
          elif any(item in completed for item in actions[name]["excludes"]) or any(name in actions[item]["excludes"] for item in completed):
              reason = "excluded-action"
          elif any(remaining.get(resource, 0) < amount for resource, amount in actions[name]["costs"].items()):
              reason = "insufficient-resource"
          else:
              reason = None
          if reason:
              plan_report = {"valid": False, "failed_index": index, "action": name, "reason": reason, "resources": remaining}
              break
          for resource, amount in actions[name]["costs"].items():
              remaining[resource] = remaining.get(resource, 0) - amount
          for resource, amount in actions[name]["produces"].items():
              remaining[resource] = remaining.get(resource, 0) + amount
          completed.append(name)
      if plan_report is None:
          plan_report = {"valid": True, "failed_index": None, "action": None, "reason": None, "resources": remaining}
      try:
          target = transition["reward"] + transition["gamma"] * transition["next_value"]
          error = target - transition["value"]
          updated = transition["value"] + transition["alpha"] * error
      except OverflowError as caught:
          raise ValueError("non-finite update") from caught
      if not all(math.isfinite(value) for value in (target, error, updated)):
          raise ValueError("non-finite update")
      return {
          "search": {"shortest_path": shortest_path, "guided_path": guided_path, "shortest_expanded": shortest_expanded, "guided_expanded": guided_expanded},
          "plan": plan_report,
          "learning": {"target": round(target, 12), "td_error": round(error, 12), "updated_value": round(updated, 12)},
      }
