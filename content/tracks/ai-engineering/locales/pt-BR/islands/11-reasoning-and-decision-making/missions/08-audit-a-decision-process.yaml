id: ai-reasoning-08
title: Audite um processo de decisão
track: ai-engineering
island: reasoning-and-decision-making
order: 8
difficulty: challenging
tags: [ai-engineering, reasoning, decision-making, capstone]
xp: 45
concepts: [state-space-search, heuristic-search, constraint-planning, reinforcement-updates]
teaching:
  analogy: "Uma auditoria de viagem mantém quatro registros juntos: a rota alcançável, a rota guiada por estimativa, se as manobras escolhidas eram permitidas e como um resultado alterou a estimativa futura."
  explanation: Um sistema de decisão é auditável quando busca, orientação, restrições e aprendizado permanecem explícitos. A busca em largura fornece a referência de caminho mais curto, a busca gulosa revela o comportamento da heurística, a simulação sequencial identifica a primeira ação inválida e uma atualização por diferença temporal registra como a evidência altera uma estimativa de valor.
  worked_example: |
    report = {
        "shortest_path": ["start", "goal"],
        "plan_valid": True,
        "updated_value": 1.4,
    }
    print(report)
  key_points:
    - Mantenha lado a lado as evidências do caminho mais curto e da heurística.
    - Um plano inválido para antes de aplicar os efeitos da ação que falhou.
    - Taxas de aprendizado moldam uma atualização em vez de certificar uma recompensa.
    - Valide cada limite bruto e derivado do relatório combinado.
brief: >
  Escreva `audit_decision_process(graph, heuristics, start, goal, actions, plan, resources,
  transition) -> dict`. Use os contratos de grafo, heurística e ações desta ilha. `transition`
  contém exatamente `value`, `reward`, `next_value`, `alpha` e `gamma`. Retorne um relatório
  `search` com caminhos mais curto e guiado e suas contagens de expansões, o relatório completo
  de validação de `plan` e um relatório TD `learning`. A busca permanece válida quando o objetivo
  é inalcançável, e violações do plano são relatadas em vez de lançadas. Lance `ValueError` para
  contratos malformados, valores não finitos ou aritmética derivada não finita.
signature:
  entrypoint: audit_decision_process
  stub: |
    def audit_decision_process(graph, heuristics, start, goal, actions, plan, resources, transition):
        # Una busca, planejamento e uma atualização de valor em um relatório auditável.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
