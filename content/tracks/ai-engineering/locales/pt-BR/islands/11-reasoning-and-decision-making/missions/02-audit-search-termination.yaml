id: ai-reasoning-02
title: Audite o término da busca
track: ai-engineering
island: reasoning-and-decision-making
order: 2
difficulty: challenging
tags: [ai-engineering, reasoning, search, cycles]
xp: 45
concepts: [state-space-search]
teaching:
  analogy: Um navegador que nunca marca as boias visitadas pode contornar o mesmo recife para sempre. Um registro de auditoria prova quais locais foram expandidos e por que a viagem terminou.
  explanation: Uma busca em grafo finito termina quando cada estado alcançável é expandido no máximo uma vez. Registrar a ordem de expansão distingue encontrar uma rota de provar que nenhuma rota alcançável existe. Esgotar a fronteira depois de impedir revisitas é a evidência de completude para esse grafo finito.
  worked_example: |
    graph = {"a": ["b"], "b": ["a"]}
    expanded = ["a", "b"]
    print(len(expanded) <= len(graph))
  key_points:
    - Ciclos só são inofensivos quando estados repetidos são rejeitados.
    - A ordem de expansão é evidência observável, não raciocínio oculto.
    - Uma fronteira vazia prova que nenhum estado alcançável resta.
    - Terminar e alcançar o objetivo são fatos diferentes.
brief: >
  Escreva `audit_search(graph, start, goal) -> dict` usando busca em largura. Aplique a mesma
  validação completa de grafo da missão anterior. Retorne `path`, a lista ordenada `expanded`,
  `reached_goal` e `terminated: true`. Pare assim que o objetivo for expandido; caso contrário,
  esgote o grafo alcançável. Cada estado pode aparecer em `expanded` no máximo uma vez.
  Lance `ValueError` para entrada inválida.
signature:
  entrypoint: audit_search
  stub: |
    def audit_search(graph, start, goal):
        # Exponha a evidência de que uma busca em grafo finito termina.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [{a: [b, c], b: [a, goal], c: [a], goal: []}, a, goal]
      expect: {path: [a, b, goal], expanded: [a, b, c, goal], reached_goal: true, terminated: true}
    - args: [{a: [b], b: [a], goal: []}, a, goal]
      expect: {path: [], expanded: [a, b], reached_goal: false, terminated: true}
  hidden:
    - args: [{a: []}, a, a]
      expect: {path: [a], expanded: [a], reached_goal: true, terminated: true}
    - args: [{a: [b, b], b: [a], goal: []}, a, goal]
      expect: {path: [], expanded: [a, b], reached_goal: false, terminated: true}
    - args: [{a: [missing]}, a, a]
      raises: ValueError
    - args: [{a: []}, true, a]
      raises: ValueError
hints:
  - level: 1
    text: "Quais duas coleções provam tanto o progresso quanto o trabalho limitado?"
  - level: 2
    text: "Adicione um estado a `expanded` somente quando ele sair da fila."
  - level: 3
    text: "Use um conjunto de visitados ao enfileirar e retorne uma auditoria tanto ao encontrar o objetivo quanto ao esvaziar a fila."
solution: |
  def audit_search(graph, start, goal):
      from collections import deque
      if not isinstance(graph, dict) or not graph or not isinstance(start, str) or not isinstance(goal, str):
          raise ValueError("invalid graph")
      if any(not isinstance(state, str) or not isinstance(neighbors, list) or any(not isinstance(neighbor, str) for neighbor in neighbors) for state, neighbors in graph.items()):
          raise ValueError("invalid graph")
      if start not in graph or goal not in graph or any(neighbor not in graph for neighbors in graph.values() for neighbor in neighbors):
          raise ValueError("unknown state")
      queue = deque([(start, [start])])
      visited = {start}
      expanded = []
      while queue:
          state, path = queue.popleft()
          expanded.append(state)
          if state == goal:
              return {"path": path, "expanded": expanded, "reached_goal": True, "terminated": True}
          for neighbor in graph[state]:
              if neighbor not in visited:
                  visited.add(neighbor)
                  queue.append((neighbor, path + [neighbor]))
      return {"path": [], "expanded": expanded, "reached_goal": False, "terminated": True}
