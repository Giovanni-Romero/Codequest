id: ai-reasoning-04
title: Compare busca não informada e busca guiada
track: ai-engineering
island: reasoning-and-decision-making
order: 4
difficulty: challenging
tags: [ai-engineering, reasoning, search, comparison]
xp: 45
concepts: [state-space-search, heuristic-search]
teaching:
  analogy: Dois capitães navegam pela mesma carta. Um verifica os canais pela distância da partida; o outro segue a estimativa mais promissora. Somente a rota e o registro revelam a diferença entre as estratégias.
  explanation: A busca em largura fornece uma referência ótima de número de passos em um grafo sem pesos. A busca gulosa pode expandir menos estados, mas seu primeiro objetivo pode estar em uma rota mais longa. Comparar ambas no mesmo grafo ordenado separa evidência de velocidade de afirmações de otimalidade.
  worked_example: |
    bfs_steps = 2
    guided_steps = 3
    print(guided_steps == bfs_steps)
  key_points:
    - Use o mesmo grafo e os mesmos extremos para uma comparação justa.
    - A busca em largura fornece a referência de menos passos.
    - Menos expansões não provam uma rota ótima.
    - Relate fatos em vez de declarar que toda heurística é útil.
brief: >
  Escreva `compare_searches(graph, heuristics, start, goal) -> dict`. Valide as entradas como
  nas missões anteriores. Execute busca em largura e busca gulosa no mesmo grafo. Retorne
  relatórios `uninformed` e `heuristic` contendo `path`, `steps` (`null` quando inalcançável)
  e `expanded` inteiro; retorne também `heuristic_is_optimal` e `fewer_expansions`. As duas
  flags são falsas a menos que ambas as buscas alcancem o objetivo.
signature:
  entrypoint: compare_searches
  stub: |
    def compare_searches(graph, heuristics, start, goal):
        # Compare evidências de otimalidade e expansão em um grafo.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args:
        - {start: [short, tempting], short: [goal], tempting: [detour], detour: [goal], goal: []}
        - {start: 3, short: 5, tempting: 1, detour: 1, goal: 0}
        - start
        - goal
      expect:
        uninformed: {path: [start, short, goal], steps: 2, expanded: 4}
        heuristic: {path: [start, tempting, detour, goal], steps: 3, expanded: 4}
        heuristic_is_optimal: false
        fewer_expansions: false
    - args:
        - {start: [a, b], a: [dead], dead: [], b: [goal], goal: []}
        - {start: 2, a: 5, dead: 6, b: 1, goal: 0}
        - start
        - goal
      expect:
        uninformed: {path: [start, b, goal], steps: 2, expanded: 5}
        heuristic: {path: [start, b, goal], steps: 2, expanded: 3}
        heuristic_is_optimal: true
        fewer_expansions: true
  hidden:
    - args: [{a: [b], b: [], goal: []}, {a: 2, b: 1, goal: 0}, a, goal]
      expect:
        uninformed: {path: [], steps: null, expanded: 2}
        heuristic: {path: [], steps: null, expanded: 2}
        heuristic_is_optimal: false
        fewer_expansions: false
    - args: [{a: []}, {a: true}, a, a]
      raises: ValueError
    - args: [{a: [missing]}, {a: 1}, a, a]
      raises: ValueError
hints:
  - level: 1
    text: "Qual algoritmo fornece a baseline ótima de número de passos em um grafo sem pesos?"
  - level: 2
    text: "Faça cada busca retornar tanto seu caminho quanto o número de estados removidos da fronteira."
  - level: 3
    text: "Defina `heuristic_is_optimal` somente quando os dois caminhos existirem e seus números de passos forem iguais."
solution: |
  def compare_searches(graph, heuristics, start, goal):
      from collections import deque
      import heapq
      import math
      def finite_number(value):
          if type(value) not in (int, float):
              return False
          try:
              return math.isfinite(value)
          except OverflowError:
              return False
      if not isinstance(graph, dict) or not graph or not isinstance(heuristics, dict) or not isinstance(start, str) or not isinstance(goal, str):
          raise ValueError("invalid input")
      if any(not isinstance(state, str) or not isinstance(neighbors, list) or any(not isinstance(neighbor, str) for neighbor in neighbors) for state, neighbors in graph.items()):
          raise ValueError("invalid graph")
      if start not in graph or goal not in graph or any(neighbor not in graph for neighbors in graph.values() for neighbor in neighbors):
          raise ValueError("unknown state")
      if set(heuristics) != set(graph) or not all(finite_number(value) for value in heuristics.values()):
          raise ValueError("invalid heuristics")
      def breadth_first():
          queue = deque([(start, [start])])
          visited = {start}
          expanded = 0
          while queue:
              state, path = queue.popleft()
              expanded += 1
              if state == goal:
                  return path, expanded
              for neighbor in graph[state]:
                  if neighbor not in visited:
                      visited.add(neighbor)
                      queue.append((neighbor, path + [neighbor]))
          return [], expanded
      def greedy():
          frontier = [(heuristics[start], 0, start, [start])]
          visited = set()
          counter = 0
          expanded = 0
          while frontier:
              _, _, state, path = heapq.heappop(frontier)
              if state in visited:
                  continue
              visited.add(state)
              expanded += 1
              if state == goal:
                  return path, expanded
              for neighbor in graph[state]:
                  if neighbor not in visited:
                      counter += 1
                      heapq.heappush(frontier, (heuristics[neighbor], counter, neighbor, path + [neighbor]))
          return [], expanded
      uninformed_path, uninformed_expanded = breadth_first()
      heuristic_path, heuristic_expanded = greedy()
      uninformed_steps = len(uninformed_path) - 1 if uninformed_path else None
      heuristic_steps = len(heuristic_path) - 1 if heuristic_path else None
      both_reached = bool(uninformed_path and heuristic_path)
      return {
          "uninformed": {"path": uninformed_path, "steps": uninformed_steps, "expanded": uninformed_expanded},
          "heuristic": {"path": heuristic_path, "steps": heuristic_steps, "expanded": heuristic_expanded},
          "heuristic_is_optimal": both_reached and heuristic_steps == uninformed_steps,
          "fewer_expansions": both_reached and heuristic_expanded < uninformed_expanded,
      }
