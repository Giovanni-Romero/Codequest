id: ai-math-01
title: Some vetores alinhados
track: ai-engineering
island: mathematical-statistical-foundations
order: 1
difficulty: challenging
tags: [ai-engineering, mathematics, vectors]
xp: 45
concepts: [vector-operations]
teaching:
  analogy: Dois recibos de compras só podem ser somados linha a linha quando trazem a mesma quantidade de itens na mesma ordem.
  explanation: Um vetor é uma lista ordenada de coordenadas numéricas. A soma vetorial junta coordenadas nas mesmas posições. Os vetores precisam ter o mesmo tamanho não nulo. Valide toda a entrada antes de somar qualquer coisa.
  worked_example: "nomes = [\"Ada\", \"Lin\"]\ncargos = [\"pilota\", \"engenheira\"]\npares = [nomes[i] + \": \" + cargos[i] for i in range(len(nomes))]\nprint(pares)"
  key_points: ["A posição dá significado a cada coordenada.", "Tamanhos iguais são necessários antes de parear.", "bool não é uma coordenada numérica aqui."]
brief: Escreva `add_vectors(left, right) -> list`. Retorne as somas por posição de duas listas iguais, não vazias, com valores int ou float finitos. Lance `ValueError` para tipos, valores, tamanhos inválidos ou listas vazias.
signature:
  entrypoint: add_vectors
  stub: "def add_vectors(left, right):\n    # Retorne somas por posição para vetores alinhados validados.\n    pass\n"
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
  - args: [[1, 2], [3, 4]]
    expect: [4, 6]
  - args: [[1.5, -2], [0.5, 2]]
    expect: [2.0, 0]
  hidden:
  - args: [[0], [0]]
    expect: [0]
  - args: [[1], [1, 2]]
    raises: ValueError
  - args: [[], []]
    raises: ValueError
  - args: [[true], [1]]
    raises: ValueError
  - args: [[.nan], [1]]
    raises: ValueError
hints:
- {level: 1, text: "O que deve ser verdade sobre as posições antes de duas coordenadas se somarem?"}
- {level: 2, text: Valide as duas listas antes de usar índices correspondentes.}
- {level: 3, text: "Padrão: `result = [a[i] + b[i] for i in range(len(a))]`."}
solution: "def add_vectors(left, right):\n    import math\n    def valid(v):\n        return isinstance(v, list) and bool(v) and all(type(x) in (int, float) and math.isfinite(x) for x in v)\n    if not valid(left) or not valid(right) or len(left) != len(right): raise ValueError('invalid vectors')\n    return [a + b for a, b in zip(left, right)]\n"
