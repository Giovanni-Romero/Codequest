id: ai-math-08
title: Audite um passo de gradiente ponderado
track: ai-engineering
island: mathematical-statistical-foundations
order: 8
difficulty: challenging
tags: [ai-engineering, mathematics, statistics, probability, optimization]
xp: 45
concepts: [vector-operations, descriptive-statistics, probability-distributions, optimization-steps]
teaching:
  analogy: Uma tripulação alinha cada vela com sua própria correção, resume as correções, pondera os cenários do tempo e mantém o ajuste somente quando o erro esperado diminui.
  explanation: Um vetor de parâmetros e um vetor de gradientes precisam ter posições correspondentes. A média e a variância populacional dos gradientes resumem a direção e a dispersão das correções propostas. As probabilidades ponderam quanto cada coordenada contribui para o gradiente esperado e para a perda quadrada, e precisam formar uma distribuição finita válida. A descida do gradiente subtrai learning_rate vezes cada coordenada do gradiente. A atualização só é aceita quando a perda ponderada pelas probabilidades diminui estritamente.
  worked_example: "precos = [10, 20]\nvariacoes = [-1, -2]\nparticipacoes = [0.4, 0.6]\nnovos_precos = [preco + variacao for preco, variacao in zip(precos, variacoes)]\nvariacao_media = sum(variacoes) / len(variacoes)\nvariacao_ponderada = sum(participacao * variacao for participacao, variacao in zip(participacoes, variacoes))\nprint(novos_precos, variacao_media, variacao_ponderada)"
  key_points: ["Vetores alinhados dão a cada correção um parâmetro correspondente.", "Média e variância populacional descrevem o gradiente antes da atualização.", "As probabilidades precisam ser finitas, limitadas e somar um.", "Um passo de otimização válido precisa reduzir a perda declarada e ponderada."]
brief: 'Escreva `audited_gradient_step(weights, gradients, probabilities, learning_rate) -> dict`. Aceite listas de mesmo tamanho e não vazias de números finitos para pesos, gradientes e probabilidades, excluindo bool. Exija cada probabilidade em `[0, 1]`, total a até `1e-9` de um e uma taxa de aprendizado finita positiva. Atualize cada peso com `weight - learning_rate * gradient`. Retorne `new_weights`, `gradient_mean`, a `gradient_variance` populacional, `expected_gradient`, `old_loss` e `new_loss`, com ponderação probabilística no gradiente esperado e em ambas as perdas quadradas. Lance `ValueError` para entrada inválida ou um passo que não reduza estritamente a perda.'
signature:
  entrypoint: audited_gradient_step
  stub: "def audited_gradient_step(weights, gradients, probabilities, learning_rate):\n    # Retorne uma atualização vetorial auditada com evidências estatísticas e probabilísticas.\n    pass\n"
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
  - args: [[2, -1], [1, -0.5], [0.75, 0.25], 0.5]
    expect: {new_weights: [1.5, -0.75], gradient_mean: 0.25, gradient_variance: 0.5625, expected_gradient: 0.625, old_loss: 3.25, new_loss: 1.828125}
  - args: [[1, 3], [1, 1], [0.5, 0.5], 0.25]
    expect: {new_weights: [0.75, 2.75], gradient_mean: 1.0, gradient_variance: 0.0, expected_gradient: 1.0, old_loss: 5.0, new_loss: 4.0625}
  hidden:
  - args: [[1], [1], [1.0], 0.1]
    expect: {new_weights: [0.9], gradient_mean: 1.0, gradient_variance: 0.0, expected_gradient: 1.0, old_loss: 1.0, new_loss: 0.81}
  - args: [[1, 2], [1], [0.5, 0.5], 0.1]
    raises: ValueError
  - args: [[1, 2], [1, 1], [0.4, 0.4], 0.1]
    raises: ValueError
  - args: [[1, 2], [1, 1], [-0.1, 1.1], 0.1]
    raises: ValueError
  - args: [[1], [true], [1.0], 0.1]
    raises: ValueError
  - args: [[.nan], [1], [1.0], 0.1]
    raises: ValueError
  - args: [[1], [1], [1.0], .inf]
    raises: ValueError
  - args: ["not-a-list", [1], [1.0], 0.1]
    raises: ValueError
  - args: [[1], [1], [1.0], 0]
    raises: ValueError
  - args: [[1], [-1], [1.0], -0.1]
    raises: ValueError
  - args: [[0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF], [1], [1.0], 0.1]
    raises: ValueError
  - args: [[], [], [], 0.1]
    raises: ValueError
  - args: [[1], [-1], [1.0], 0.1]
    raises: ValueError
hints:
- {level: 1, text: "Que evidência prova que a atualização alinhada foi descrita estatisticamente, é válida probabilisticamente e realmente melhora a perda?"}
- {level: 2, text: "Valide os três vetores, resuma os gradientes, calcule as evidências ponderadas e então compare as perdas."}
- {level: 3, text: "Padrão: `adjusted = [value - step * direction for value, direction in zip(values, directions)]`."}
solution: "def audited_gradient_step(weights, gradients, probabilities, learning_rate):\n    import math\n    def finite_number(value):\n        if type(value) not in (int, float):\n            return False\n        try:\n            return math.isfinite(value)\n        except OverflowError:\n            return False\n    def valid_vector(values):\n        return isinstance(values, list) and bool(values) and all(finite_number(value) for value in values)\n    if not valid_vector(weights) or not valid_vector(gradients) or not valid_vector(probabilities) or len(weights) != len(gradients) or len(weights) != len(probabilities) or not finite_number(learning_rate) or learning_rate <= 0:\n        raise ValueError('invalid input')\n    if any(probability < 0 or probability > 1 for probability in probabilities) or abs(sum(probabilities) - 1) > 1e-9:\n        raise ValueError('invalid probabilities')\n    gradient_mean = sum(gradients) / len(gradients)\n    gradient_variance = sum((gradient - gradient_mean) ** 2 for gradient in gradients) / len(gradients)\n    expected_gradient = sum(probability * gradient for probability, gradient in zip(probabilities, gradients))\n    old_loss = sum(probability * weight ** 2 for probability, weight in zip(probabilities, weights))\n    new_weights = [weight - learning_rate * gradient for weight, gradient in zip(weights, gradients)]\n    new_loss = sum(probability * weight ** 2 for probability, weight in zip(probabilities, new_weights))\n    if not new_loss < old_loss:\n        raise ValueError('step does not reduce loss')\n    return {'new_weights': new_weights, 'gradient_mean': gradient_mean, 'gradient_variance': gradient_variance, 'expected_gradient': expected_gradient, 'old_loss': old_loss, 'new_loss': new_loss}\n"
