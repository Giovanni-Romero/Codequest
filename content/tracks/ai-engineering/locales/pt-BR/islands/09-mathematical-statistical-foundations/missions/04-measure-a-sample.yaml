id: ai-math-04
title: Meça uma amostra
track: ai-engineering
island: mathematical-statistical-foundations
order: 4
difficulty: challenging
tags: [ai-engineering, statistics, samples]
xp: 45
concepts: [descriptive-statistics]
teaching:
  analogy: Um treinador precisa do tempo médio das voltas e também de quão próximas elas ficam desse valor.
  explanation: Estatísticas descritivas resumem uma amostra completa. A média é o valor médio; a mediana é o valor central ordenado. Quantis localizam uma proporção nos valores ordenados; use interpolação linear entre vizinhos quando a posição cair entre eles. A variância populacional calcula a média das distâncias quadradas até a média, e o desvio-padrão é sua raiz quadrada.
  worked_example: "pontuacoes = [2, 4, 6]\nmedia = sum(pontuacoes) / len(pontuacoes)\nprint(media)"
  key_points: ["Ordene uma cópia para preservar a entrada.", "Amostras de tamanho par têm dois valores centrais.", "Q1 e Q3 usam as posições 0.25 e 0.75 na amostra ordenada.", "A variância usa distâncias quadradas."]
brief: Escreva `describe_sample(values) -> dict`. Para uma lista não vazia de valores int ou float finitos, retorne `count`, `mean`, `median`, `q1`, `q3`, `variance` e `standard_deviation`. Use variância populacional e interpole linearmente os quantis nas posições `(n - 1) * 0.25` e `(n - 1) * 0.75`. Lance `ValueError` para entrada inválida.
signature:
  entrypoint: describe_sample
  stub: "def describe_sample(values):\n    # Retorne estatísticas populacionais determinísticas sem alterar values.\n    pass\n"
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
  - args: [[1, 2, 3]]
    expect: {count: 3, mean: 2.0, median: 2, q1: 1.5, q3: 2.5, variance: 0.6666666666666666, standard_deviation: 0.816496580927726}
  - args: [[1, 3, 5, 7]]
    expect: {count: 4, mean: 4.0, median: 4.0, q1: 2.5, q3: 5.5, variance: 5.0, standard_deviation: 2.23606797749979}
  hidden:
  - args: [[4]]
    expect: {count: 1, mean: 4.0, median: 4, q1: 4, q3: 4, variance: 0.0, standard_deviation: 0.0}
  - args: [[]]
    raises: ValueError
  - args: [[1, true]]
    raises: ValueError
  - args: [[.nan]]
    raises: ValueError
  - args: ["123"]
    raises: ValueError
hints:
- {level: 1, text: "Quais valores exigem uma cópia ordenada e onde um quantil pode cair entre dois valores?"}
- {level: 2, text: Calcule a média antes das distâncias e encontre a posição fracionária ordenada de cada quantil.}
- {level: 3, text: "Padrão: `lower + fraction * (upper - lower)`."}
solution: "def describe_sample(values):\n    import math\n    if not isinstance(values, list) or not values or any(type(x) not in (int, float) or not math.isfinite(x) for x in values): raise ValueError('invalid values')\n    count = len(values); mean = sum(values) / count; ordered = sorted(values); middle = count // 2\n    def quantile(q):\n        position = (count - 1) * q; lower = int(position); upper = min(lower + 1, count - 1); fraction = position - lower\n        return ordered[lower] + fraction * (ordered[upper] - ordered[lower])\n    median = quantile(0.5)\n    variance = sum((x - mean) ** 2 for x in values) / count\n    return {'count': count, 'mean': mean, 'median': median, 'q1': quantile(0.25), 'q3': quantile(0.75), 'variance': variance, 'standard_deviation': math.sqrt(variance)}\n"
