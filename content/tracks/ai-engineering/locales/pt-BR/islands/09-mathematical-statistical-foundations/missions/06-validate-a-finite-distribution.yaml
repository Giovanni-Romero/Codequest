id: ai-math-06
title: Valide uma distribuição finita
track: ai-engineering
island: mathematical-statistical-foundations
order: 6
difficulty: challenging
tags: [ai-engineering, probability, distributions]
xp: 45
concepts: [probability-distributions]
teaching:
  analogy: Um gráfico de pizza só é válido quando suas fatias formam uma pizza inteira.
  explanation: Uma distribuição finita associa rótulos únicos de resultado a probabilidades. Cada probabilidade é finita e fica entre zero e um. Valide cada linha e o total antes de calcular a esperança; esta missão nunca normaliza nem calcula parcialmente uma entrada inválida. A esperança é o valor do resultado ponderado pela probabilidade.
  worked_example: "pesos = [0.25, 0.75]\nvalores = [0, 4]\nprint(sum(pesos[i] * valores[i] for i in range(2)))"
  key_points: ["A validação não corrige totais silenciosamente.", "Valide toda a lista antes de calcular total ou esperança.", "Rótulos precisam ser únicos.", "Esperança é uma média ponderada."]
brief: 'Escreva `validate_distribution(outcomes) -> dict`. Aceite uma lista não vazia de linhas `[label, value, probability]`, com rótulos únicos que sejam strings não vazias e `value`/`probability` numéricos finitos, excluindo `bool`. Exija probabilidades em `[0, 1]` e total a até `1e-9` de um. Retorne `{"total_probability": number, "expectation": number}` ou lance `ValueError`.'
signature:
  entrypoint: validate_distribution
  stub: "def validate_distribution(outcomes):\n    # Valide uma distribuição finita; nunca a normalize.\n    pass\n"
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
  - args: [[[low, 0, 0.25], [high, 4, 0.75]]]
    expect: {total_probability: 1.0, expectation: 3.0}
  - args: [[[a, -1, 0.5], [b, 1, 0.5]]]
    expect: {total_probability: 1.0, expectation: 0.0}
  hidden:
  - args: [[[only, 8, 1.0]]]
    expect: {total_probability: 1.0, expectation: 8.0}
  - args: [[[a, 1, 0.4], [a, 2, 0.6]]]
    raises: ValueError
  - args: [[[a, 1, 0.9]]]
    raises: ValueError
  - args: [[[a, 1, -0.1], [b, 2, 1.1]]]
    raises: ValueError
  - args: [[[a, .nan, 0.5], [b, 2, 0.5]]]
    raises: ValueError
  - args: [[[a, 1, .inf], [b, 2, 0.5]]]
    raises: ValueError
  - args: [[]]
    raises: ValueError
hints:
- {level: 1, text: "Quanto as fatias precisam somar antes de qualquer cálculo?"}
- {level: 2, text: Primeiro valide cada linha e rótulo; só então calcule totais e valores ponderados.}
- {level: 3, text: "Padrão: `for value, probability in validated_rows: expected += value * probability`."}
solution: "def validate_distribution(outcomes):\n    import math\n    if not isinstance(outcomes, list) or not outcomes: raise ValueError('invalid outcomes')\n    labels = set()\n    for row in outcomes:\n        if not isinstance(row, list) or len(row) != 3: raise ValueError('invalid row')\n        label, value, probability = row\n        if type(label) is not str or not label or label in labels or type(value) not in (int, float) or type(probability) not in (int, float) or not math.isfinite(value) or not math.isfinite(probability) or not 0 <= probability <= 1: raise ValueError('invalid row')\n        labels.add(label)\n    total = sum(row[2] for row in outcomes)\n    if abs(total - 1) > 1e-9: raise ValueError('invalid total')\n    expectation = sum(row[1] * row[2] for row in outcomes)\n    return {'total_probability': total, 'expectation': expectation}\n"
