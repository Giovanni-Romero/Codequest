constraints: {max_runtime_ms: 5000, max_memory_mb: 256, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - {args: [[{log: "vessel at Rotterdam", answer: Rotterdam}, {log: "vessel at Singapore", answer: Singapore}], [{log: "vessel at Hamburg", answer: Hamburg}]], expect: {train_score: 1.0, heldout_score: 1.0, num_demos: 2, demo_ports: [Rotterdam, Singapore]}}
    - {args: [[{log: "ship at Antwerp", answer: Antwerp}, {log: "ship at Busan", answer: Busan}, {log: "ship at Jebel Ali", answer: "Jebel Ali"}], [{log: "ship at Los Angeles", answer: "Los Angeles"}]], expect: {train_score: 1.0, heldout_score: 1.0, num_demos: 2, demo_ports: [Antwerp, Busan]}}
  hidden:
    - {args: [[{log: "v at A", answer: A}, {log: "v at B", answer: B}], [{log: "v at A", answer: A}]], raises: ValueError}
    - {args: [[{log: "x", answer: "y"}], [{log: "z", answer: "w"}, {log: "u", answer: "v"}]], expect: {train_score: 1.0, heldout_score: 1.0, num_demos: 1, demo_ports: ["y"]}}
    - {args: [[], [{log: "x", answer: "y"}]], raises: ValueError}
    - {args: [[{log: "x", answer: "y"}], []], raises: ValueError}
    - {args: [[{log: "x"}], [{log: "y", answer: "z"}]], raises: ValueError}
    - {args: [[{log: 1, answer: "y"}], [{log: "z", answer: "w"}]], raises: ValueError}
    - {args: [[{log: "x", answer: "y"}], [{log: "z", answer: 1}]], raises: ValueError}
hints:
  - {level: 1, text: "Quais quatro peças devem conectar — assinatura, módulo, métrica, otimizador?"}
  - {level: 2, text: "Construa PortExtractor com Predict interno; compile o módulo com LabeledFewShot e sample=False; demos ficam no Predict interno."}
  - {level: 3, text: "Rode Evaluate em trainset e heldout, leia .score e extraia os valores de port de compiled.predict.demos."}
solution: |
  def dspy_compile(trainset, heldout):
      import dspy
      from dspy.utils.dummies import DummyLM
      from dspy.teleprompt import LabeledFewShot
      if type(trainset) is not list or not trainset:
          raise ValueError("invalid trainset")
      if type(heldout) is not list or not heldout:
          raise ValueError("invalid heldout")
      train_logs = set()
      for item in trainset:
          if type(item) is not dict or type(item.get("log")) is not str or type(item.get("answer")) is not str:
              raise ValueError("invalid trainset item")
          train_logs.add(item["log"])
      for item in heldout:
          if type(item) is not dict or type(item.get("log")) is not str or type(item.get("answer")) is not str:
              raise ValueError("invalid heldout item")
          if item["log"] in train_logs:
              raise ValueError("leakage detected")
      class ExtractPort(dspy.Signature):
          """Extract the port from a log entry."""
          log: str = dspy.InputField()
          port: str = dspy.OutputField()
      class PortExtractor(dspy.Module):
          def __init__(self):
              self.predict = dspy.Predict(ExtractPort)
          def forward(self, log):
              return self.predict(log=log)
      def exact(ex, pred):
          return pred.port == ex.port
      train_examples = [dspy.Example(log=i["log"], port=i["answer"]).with_inputs("log") for i in trainset]
      heldout_examples = [dspy.Example(log=i["log"], port=i["answer"]).with_inputs("log") for i in heldout]
      optimizer = LabeledFewShot(k=2)
      compiled = optimizer.compile(PortExtractor(), trainset=train_examples, sample=False)
      train_answers = {i["log"]: {"port": i["answer"]} for i in trainset}
      heldout_answers = {i["log"]: {"port": i["answer"]} for i in heldout}
      with dspy.context(lm=DummyLM(train_answers)):
          train_result = dspy.Evaluate(devset=train_examples, metric=exact)(compiled)
      with dspy.context(lm=DummyLM(heldout_answers)):
          heldout_result = dspy.Evaluate(devset=heldout_examples, metric=exact)(compiled)
      demo_ports = [demo.port for demo in compiled.predict.demos]
      return {"train_score": train_result.score / 100, "heldout_score": heldout_result.score / 100, "num_demos": len(compiled.predict.demos), "demo_ports": demo_ports}
