id: ai-dspy-08
title: Compilar um programa medido
track: ai-engineering
island: dspy
order: 8
difficulty: expert
tags: [ai-engineering, dspy, requires-ai-orchestration]
xp: 60
concepts: [dspy-signatures, dspy-modules, dspy-metrics, dspy-optimization]
teaching:
  analogy: "O diário do navio mostra a viagem completa: manifesto declarado (assinatura), prático seguiu a lista (módulo), alfândega pontuou cada porto (métrica), e o capitão escolheu a melhor rota após treinar em viagens passadas (otimização)."
  explanation: "A missão final encadeia os quatro conceitos: declare uma assinatura, construa um módulo que a use, defina uma métrica, otimize num conjunto de treino com LabeledFewShot, avalie no held-out, e retorne o relatório completo. O programa compilado carrega suas demos; o score do held-out prova generalização. Cada etapa é explícita e auditável."
  worked_example: |
    import dspy
    from dspy.utils.dummies import DummyLM
    from dspy.teleprompt import LabeledFewShot
    class RouteQA(dspy.Signature):
        """Responda perguntas de roteamento a partir de logs."""
        log: str = dspy.InputField()
        resposta: str = dspy.OutputField()
    class Roteador(dspy.Module):
        def __init__(self):
            self.predict = dspy.Predict(RouteQA)
        def forward(self, log):
            return self.predict(log=log)
    def exato(ex, pred):
        return pred.resposta == ex.resposta
    trainset = [
        dspy.Example(log="navio em Roterdã", resposta="Roterdã").with_inputs("log"),
        dspy.Example(log="navio em Singapura", resposta="Singapura").with_inputs("log"),
    ]
    heldout = [
        dspy.Example(log="navio em Hamburgo", resposta="Hamburgo").with_inputs("log"),
    ]
    all_answers = ["Roterdã", "Singapura", "Hamburgo"]
    lm = DummyLM([{"resposta": a} for a in all_answers])
    with dspy.context(lm=lm):
        optimizer = LabeledFewShot(k=2)
        compiled = optimizer.compile(Roteador(), trainset=trainset, sample=False)
        train_score = dspy.Evaluate(devset=trainset, metric=exato, num_threads=1)(compiled)
        heldout_score = dspy.Evaluate(devset=heldout, metric=exato, num_threads=1)(compiled)
        print({"treino": train_score.score / 100, "heldout": heldout_score.score / 100,
               "demos": len(compiled.predict.demos)})
  key_points:
    - Assinatura declara o contrato; Módulo encadeia Predict; Métrica define sucesso; Otimizador seleciona demos só do treino.
    - LabeledFewShot(k) num Módulo compila anexando demos a cada Predict dentro do módulo.
    - Avalie em ambos os conjuntos; heldout_score é a evidência de generalização.
    - Retorne o rastro de auditoria completo: scores, contagem de demos, e a estrutura do programa compilado.
brief: >
  Escreva `dspy_compile(trainset, heldout) -> dict`. Cada um é lista de dicts com `log` (str)
  e `answer` (str). Rejeite entrada ruim, listas vazias ou logs sobrepostos com ValueError.
  Defina assinatura `ExtractPort(log -> port)`. O módulo `PortExtractor` encapsula
  `Predict(ExtractPort)`. Métrica: correspondência exata em `port`. Compile o módulo com
  `LabeledFewShot(k=2)` e `sample=False` no trainset. Use `DummyLM` com respostas
  `{"port": ...}` na ordem trainset e depois heldout. Avalie ambos os conjuntos e leia
  `.score` de cada EvaluationResult. Retorne `{"train_score": <fração>,
  "heldout_score": <fração>, "num_demos": <int>, "demo_ports": [...]}`; demo_ports
  contém os valores de port em `compiled.predict.demos`.
signature:
  entrypoint: dspy_compile
  stub: |
