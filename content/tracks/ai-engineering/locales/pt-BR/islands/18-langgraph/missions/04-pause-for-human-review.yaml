id: ai-langgraph-04
title: Pause para revisao humana
track: ai-engineering
island: langgraph
order: 4
difficulty: expert
tags: [ai-engineering, langgraph, requires-ai-orchestration]
xp: 60
concepts: [langgraph-human-loop]
teaching:
  analogy: Um armario trancado continua trancado ate que a pessoa responsavel use a chave.
  explanation: interrupt pausa um no e expoe uma pergunta serializavel. Command retoma a mesma thread com a resposta humana. Aprovacao e dado, nao mensagem de chat.
  worked_example: |
    answer = "yes"
    status = "open" if answer == "yes" else "closed"
  key_points: [Interrupt pausa o trabalho, Retomar usa a mesma thread, Entrada humana e validada]
brief: Escreva `pause_for_review(decision) -> dict`. Aceite `approve` ou `reject`. Use interrupt(), InMemorySaver e Command(resume=...) para retornar concedido ou rejeitado apos uma revisao.
signature:
  entrypoint: pause_for_review
  stub: |
    def pause_for_review(decision):
        pass
constraints: {max_runtime_ms: 5000, max_memory_mb: 256, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - {args: [approve], expect: {status: granted, trace: [review, grant]}}
    - {args: [reject], expect: {status: rejected, trace: [review, reject]}}
  hidden:
    - {args: [edit], raises: ValueError}
    - {args: [''], raises: ValueError}
    - {args: [true], raises: ValueError}
    - {args: [APPROVE], raises: ValueError}
hints:
  - {level: 1, text: "Qual valor precisa sobreviver a pausa?"}
  - {level: 2, text: "Chame interrupt dentro de um no e retome com Command."}
  - {level: 3, text: "Um ramo pode retornar `{'status': 'ok' if answer else 'no'}`."}
solution: |
  def pause_for_review(decision):
      from langgraph.checkpoint.memory import InMemorySaver
      from langgraph.graph import END, START, StateGraph
      from langgraph.types import Command, interrupt
      if decision not in ("approve", "reject") or type(decision) is not str: raise ValueError("invalid decision")
      def review(state):
          answer = interrupt({"request": "access"})
          return {"status": "granted" if answer == "approve" else "rejected", "trace": ["review", "grant" if answer == "approve" else "reject"]}
      builder = StateGraph(dict); builder.add_node("review", review); builder.add_edge(START, "review"); builder.add_edge("review", END)
      graph = builder.compile(checkpointer=InMemorySaver()); config = {"configurable": {"thread_id": "review"}}
      graph.invoke({}, config); return graph.invoke(Command(resume=decision), config)
