id: ai-structured-outputs-03
title: Repita falhas reparáveis
track: ai-engineering
island: structured-outputs
order: 3
difficulty: moderate
tags: [ai-engineering, structured-outputs, retry]
xp: 30
concepts: [validation-retry]
teaching:
  analogy: |
    Uma impressora tenta de novo após um atolamento, mas não continua apertando imprimir quando
    a máquina está desligada.
  explanation: |
    Uma política de repetição precisa de um limite fixo e de classes reparáveis declaradas.
    Erros de sintaxe e schema podem ser reparáveis; falhas de policy e provider são permanentes
    nesta missão. Pare assim que uma tentativa tiver sucesso ou surgir uma falha permanente.
  worked_example: |
    attempts = ["jam", "jam", "ok"]
    for attempt in attempts[:3]:
        if attempt == "ok":
            print("printed")
            break
  key_points:
    - Um limite impede um ciclo infinito de tentativas.
    - Repita somente as razões declaradas como reparáveis.
    - Retorne o primeiro sucesso, não a última tentativa.
brief: |
  Escreva `first_success(attempts, limit)`. `attempts` deve ser uma lista em que cada elemento é
  um dicionário com `status` textual igual a `ok`, `parse`, `schema`, `policy` ou `provider`, além
  de `value` opcional. `limit` deve ser inteiro não negativo e não pode ser bool. Valide a lista
  inteira antes de qualquer retorno terminal e então inspecione somente o prefixo limitado.
  Retorne o primeiro `value` de `ok`, `{"status": "failed", "reason": status}` para falha
  permanente ou `{"status": "exhausted", "reason": "retry_limit"}` nos demais casos.
signature: {entrypoint: first_success, stub: "def first_success(attempts, limit):\n    # Limite tentativas de reparo.\n    pass"}
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[{status: parse}, {status: ok, value: 7}], 3]
      expect: 7
    - args: [[{status: policy}, {status: ok, value: 8}], 3]
      expect: {status: failed, reason: policy}
  hidden:
    - args: [[{status: policy}, {status: nope}], 1]
      raises: ValueError
    - args: [[{status: [policy]}], 1]
      raises: ValueError
    - args: [[{status: {kind: policy}}], 1]
      raises: ValueError
    - args: [[], true]
      raises: ValueError
    - args: [[], 0]
      expect: {status: exhausted, reason: retry_limit}
    - args: [[{status: parse}], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [[{status: parse}, {status: ok, value: 9}], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [[{status: provider}], 4]
      expect: {status: failed, reason: provider}
    - args: [[{status: schema}, {status: ok, value: 2}], 2]
      expect: 2
    - args: [null, 1]
      raises: ValueError
    - args: [[], -1]
      raises: ValueError
    - args: [[{status: nope}], 1]
      raises: ValueError
hints:
  - {level: 1, text: "Quais falhas outra tentativa pode reparar, e quais encerram o processo?"}
  - {level: 2, text: "Aceite `ok`, continue somente para parse/schema e pare para policy/provider dentro do limite."}
  - level: 3
    text: |
      Uma central de entregas pode percorrer `pedidos[:limite]`, retornar em `entregue`, devolver
      uma falha em `cancelado` e continuar apenas para `erro_etiqueta` ou `erro_endereco`.
solution: |
  def first_success(attempts, limit):
      if not isinstance(attempts, list) or not isinstance(limit, int) or isinstance(limit, bool) or limit < 0:
          raise ValueError("invalid input")
      allowed = {"ok", "parse", "schema", "policy", "provider"}
      if any(not isinstance(attempt, dict) or not isinstance(attempt.get("status"), str) or attempt.get("status") not in allowed for attempt in attempts):
          raise ValueError("invalid attempt")
      for attempt in attempts[:limit]:
          status = attempt["status"]
          if status == "ok":
              return attempt.get("value")
          if status not in {"parse", "schema"}:
              return {"status": "failed", "reason": status}
      return {"status": "exhausted", "reason": "retry_limit"}
