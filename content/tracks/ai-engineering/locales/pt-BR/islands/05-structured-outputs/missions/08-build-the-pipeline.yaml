id: ai-structured-outputs-08
title: Construa o pipeline
track: ai-engineering
island: structured-outputs
order: 8
difficulty: moderate
tags: [ai-engineering, structured-outputs, pipeline]
xp: 30
concepts: [output-schema, safe-output-parsing, validation-retry, failure-taxonomy]
teaching:
  analogy: |
    Uma clínica registra um formulário, confere seus campos, permite uma pequena janela de
    correção e anota se o atendimento terminou bem ou parou por uma razão conhecida.
  explanation: |
    Um pipeline de saída estruturada expõe fronteiras de parse, schema, repetição e taxonomia.
    Ele só retorna dados da aplicação depois da validação. Seu orçamento de tentativas é fixo.
    Falhas permanentes não ficam escondidas atrás de novas tentativas.
  worked_example: |
    records = [{"valid": False}, {"valid": True, "value": "ok"}]
    result = None
    for record in records:
        if record["valid"]:
            result = record["value"]
            break
    print(result)
  key_points:
    - Trate texto vindo do provider como dado não confiável.
    - Separe resultados de parse, schema e policy.
    - Um pipeline limitado deve devolver resultado estável quando as tentativas acabam.
brief: |
  Escreva `structured_result(texts, limit)`. `texts` deve ser uma lista em que cada elemento é
  string; valide a lista completa antes de qualquer retorno terminal. `limit` deve ser inteiro
  não negativo e não pode ser bool. No prefixo limitado, o objeto exato `{"value": string}`
  retorna `{"status": "ok", "value": value}`; o objeto exato `{"policy": true}`, com o booleano
  JSON true e não um número, retorna `{"status": "failed", "reason": "policy"}`. JSON malformado,
  outro container ou primitivo, policy false/numérica e qualquer schema errado são reparáveis.
  Retorne `{"status": "exhausted", "reason": "retry_limit"}` quando o prefixo terminar.
signature: {entrypoint: structured_result, stub: "def structured_result(texts, limit):\n    # Retorne dado validado ou falha tipada.\n    pass"}
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [['{"value": "ready"}'], 1]
      expect: {status: ok, value: ready}
    - args: [['{"policy": true}', '{"value": "late"}'], 2]
      expect: {status: failed, reason: policy}
  hidden:
    - args: [['{"policy": true}', 7], 1]
      raises: ValueError
    - args: [['{"policy": 1}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['{"policy": 1.0}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['{"policy": false}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [[], 0]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['bad', '{"value": "fixed"}'], 2]
      expect: {status: ok, value: fixed}
    - args: [['{"value": 3}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['{"value": "x", "extra": 1}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [['{"policy": true}', '{"value": "x"}'], 2]
      expect: {status: failed, reason: policy}
    - args: [null, 1]
      raises: ValueError
    - args: [['{"value": "x"}'], -1]
      raises: ValueError
    - args: [['{"value": "different"}'], 1]
      expect: {status: ok, value: different}
    - args: [['bad', '{"value": "late"}'], 1]
      expect: {status: exhausted, reason: retry_limit}
    - args: [[], true]
      raises: ValueError
hints:
  - {level: 1, text: "Qual artefato estável o chamador recebe em sucesso, falha permanente e esgotamento?"}
  - {level: 2, text: "Analise JSON, aceite schemas exatos, pare em policy e respeite o limite."}
  - level: 3
    text: |
      Um processador de formulários pode usar `json.loads`, aceitar somente
      `set(valor) == {"answer"}` com string, retornar sucesso tipado e esgotar após o laço.
solution: |
  import json

  def structured_result(texts, limit):
      if not isinstance(texts, list) or not isinstance(limit, int) or isinstance(limit, bool) or limit < 0:
          raise ValueError("invalid input")
      if any(not isinstance(text, str) for text in texts):
          raise ValueError("texts must be strings")
      for text in texts[:limit]:
          try:
              value = json.loads(text)
          except (TypeError, json.JSONDecodeError):
              continue
          if isinstance(value, dict) and set(value) == {"policy"} and type(value["policy"]) is bool and value["policy"] is True:
              return {"status": "failed", "reason": "policy"}
          if isinstance(value, dict) and set(value) == {"value"} and isinstance(value["value"], str):
              return {"status": "ok", "value": value["value"]}
      return {"status": "exhausted", "reason": "retry_limit"}
