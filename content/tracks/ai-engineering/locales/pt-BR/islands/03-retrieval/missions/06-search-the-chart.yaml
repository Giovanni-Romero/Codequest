id: ai-retrieval-06
title: Pesquise a carta
track: ai-engineering
island: retrieval
order: 6
difficulty: moderate
tags: [ai-engineering, retrieval, similarity, ranking]
xp: 30
concepts: [similarity-scoring, top-k-ranking]
teaching:
  analogy: |
    Um navegador mede todas as rotas antes de escolher as mais próximas. Escolher ainda
    durante a medição pode preservar uma rota mediana apenas por ter aparecido cedo.
  explanation: |
    A busca separa pontuação de ranking. Todo documento recebe um score comparável e só
    então o top-k estável escolhe os líderes. A lista intermediária torna tudo explicável.
  worked_example: |
    routes = [{"id": "A", "miles": 9}, {"id": "B", "miles": 4}]
    measured = sorted(routes, key=lambda route: route["miles"])
    print([route["id"] for route in measured[:1]])
  key_points:
    - Pontue todos os candidatos antes de cortar.
    - Maior similaridade de cosseno vem primeiro.
    - A ordem original resolve empates.
brief: |
  Escreva `search_top_k(query, documents, k)`. Os documentos contêm `id` único e `text`.
  Use tokenização e cosseno das missões anteriores, ordene por score decrescente,
  preserve empates e retorne no máximo `k` IDs. Valide `k` e IDs repetidos.
signature:
  entrypoint: search_top_k
  stub: |
    def search_top_k(query, documents, k):
        # Pontue o corpus inteiro e depois selecione um top-k estável.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: ["port map", [{id: tide, text: "tide table"}, {id: exact, text: "port map"}, {id: partial, text: port}], 2]
      expect: [exact, partial]
    - args: [anchor, [{id: first, text: anchor}, {id: second, text: anchor}], 2]
      expect: [first, second]
  hidden:
    - args: [x, [], 3]
      expect: []
    - args: [x, [{id: A, text: x}], 0]
      expect: []
    - args: [x, [{id: A, text: y}], 4]
      expect: [A]
    - args: [x, [], -1]
      raises: ValueError
    - args: [x, [{id: A, text: x}, {id: A, text: y}], 1]
      raises: ValueError
hints:
  - {level: 1, text: "Qual lista intermediária completa deve existir antes do top-k?"}
  - {level: 2, text: "Crie registros `{id, score}`, ordene de forma estável e corte."}
  - level: 3
    text: |
      Um juiz registra todos os tempos, ordena a folha completa e só então publica a
      quantidade solicitada de nomes.
solution: |
  def search_top_k(query, documents, k):
      from math import sqrt

      if k < 0:
          raise ValueError("k must not be negative")

      def vector(text):
          counts = {}
          for raw in text.split():
              term = raw.casefold().strip(".,!?;:")
              if term:
                  counts[term] = counts.get(term, 0) + 1
          return counts

      query_vector = vector(query)
      query_size = sqrt(sum(value * value for value in query_vector.values()))
      scored = []
      seen = set()
      for document in documents:
          if document["id"] in seen:
              raise ValueError("duplicate document ID")
          seen.add(document["id"])
          item_vector = vector(document["text"])
          item_size = sqrt(sum(value * value for value in item_vector.values()))
          score = 0.0
          if query_size and item_size:
              dot = sum(
                  value * item_vector.get(term, 0)
                  for term, value in query_vector.items()
              )
              score = dot / (query_size * item_size)
          scored.append({"id": document["id"], "score": score})
      ranked = sorted(scored, key=lambda item: -item["score"])
      return [item["id"] for item in ranked[:k]]
