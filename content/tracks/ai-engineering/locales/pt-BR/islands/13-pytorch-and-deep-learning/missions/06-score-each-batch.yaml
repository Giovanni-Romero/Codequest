id: ai-pytorch-06
title: Calcule o escore de cada lote
track: ai-engineering
island: pytorch-and-deep-learning
order: 6
difficulty: challenging
tags: [ai-engineering, pytorch, dataset, module, requires-ai-ml]
xp: 45
concepts: [datasets-and-batches, modules-and-forward]
teaching:
  analogy: Uma balança calibrada pesa cada carga da balsa. Reconstruir a balança para cada viagem alteraria a medição silenciosamente.
  explanation: Um módulo registrado é reutilizado entre os lotes do DataLoader. A avaliação aplica um conjunto estável de parâmetros a cada exemplo. A fronteira do lote muda o agendamento, não a função matemática.
  worked_example: |
    import torch
    from torch import nn
    model = nn.Linear(1, 1, bias=False)
    with torch.no_grad():
        model.weight.fill_(2)
    print(model(torch.tensor([[3.0]])).item())
  key_points:
    - Crie o módulo uma vez, fora do laço de lotes.
    - Cada lote usa os mesmos parâmetros registrados.
    - Concatene as saídas na ordem original.
brief: >
  Escreva `score_batches(rows, batch_size) -> dict`. Use um DataLoader e um único módulo
  registrado `nn.Linear(2, 1)` com peso `[1, -1]` e viés zero. Retorne os tamanhos dos lotes,
  nomes dos parâmetros e escores na ordem de origem. Rejeite entradas inválidas.
signature:
  entrypoint: score_batches
  stub: |
    def score_batches(rows, batch_size):
        # Reutilize um módulo registrado em todos os lotes.
        pass
constraints: {max_runtime_ms: 5000, max_memory_mb: 8192, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[[3, 1], [2, 5], [4, 4]], 2]
      expect: {batch_sizes: [2, 1], parameters: [linear.bias, linear.weight], scores: [2.0, -3.0, 0.0]}
    - args: [[[1, 0]], 4]
      expect: {batch_sizes: [1], parameters: [linear.bias, linear.weight], scores: [1.0]}
  hidden:
    - {args: [[], 1], raises: ValueError}
    - {args: [[[1]], 1], raises: ValueError}
    - {args: [[[1, 2, 3]], 1], raises: ValueError}
    - {args: [[[false, 1]], 1], raises: ValueError}
    - {args: [[[1, 2]], -1], raises: ValueError}
hints:
  - {level: 1, text: "O que mudaria por acidente se o modelo fosse criado dentro do laço de lotes?"}
  - {level: 2, text: "Crie um único `nn.Module` e chame-o para cada lote do DataLoader."}
  - {level: 3, text: "Para outro calculador, acrescente `model(part).flatten().tolist()` ao percorrer lotes estáveis."}
solution: |
  def score_batches(rows, batch_size):
      import math
      import torch
      from torch import nn
      from torch.utils.data import DataLoader
      if not isinstance(rows, list) or not rows or type(batch_size) is not int or batch_size <= 0 or any(not isinstance(row, list) or len(row) != 2 for row in rows):
          raise ValueError("invalid input")
      limit = torch.finfo(torch.float32).max
      if any(type(value) not in (int, float) or not -limit <= value <= limit for row in rows for value in row):
          raise ValueError("invalid rows")
      class Scorer(nn.Module):
          def __init__(self):
              super().__init__()
              self.linear = nn.Linear(2, 1)
          def forward(self, values):
              return self.linear(values)
      model = Scorer()
      with torch.no_grad():
          model.linear.weight.copy_(torch.tensor([[1.0, -1.0]]))
          model.linear.bias.zero_()
      batches = list(DataLoader(torch.tensor(rows, dtype=torch.float32), batch_size=batch_size, shuffle=False))
      scores = [value for batch in batches for value in model(batch).flatten().tolist()]
      if any(not math.isfinite(value) for value in scores):
          raise ValueError("non-finite model output")
      return {"batch_sizes": [len(batch) for batch in batches], "parameters": sorted(name for name, _ in model.named_parameters()), "scores": scores}
