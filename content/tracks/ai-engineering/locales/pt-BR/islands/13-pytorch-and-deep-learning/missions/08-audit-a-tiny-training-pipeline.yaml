id: ai-pytorch-08
title: Audite um pequeno pipeline de treinamento
track: ai-engineering
island: pytorch-and-deep-learning
order: 8
difficulty: challenging
tags: [ai-engineering, pytorch, capstone, requires-ai-ml]
xp: 45
concepts: [tensors-and-shapes, datasets-and-batches, modules-and-forward, autograd-training-loop]
teaching:
  analogy: Um teste no mar registra a disposição da carga, os grupos de embarque, o registro do motor e as correções de rumo em um só diário. Uma chegada sem esse rastro não prova que a viagem foi controlada.
  explanation: Um pipeline de treinamento conecta validação de tensores, lotes determinísticos, um módulo registrado e otimização ordenada. Cada fronteira deixa evidências. Trabalho pequeno e fixo na CPU mantém o resultado reproduzível. A auditoria relata estrutura e mudança de estado juntas.
  worked_example: |
    records = {
        "shape": [4, 2],
        "batches": [2, 2],
        "parameters": ["linear.weight"],
    }
    print(records)
  key_points:
    - Valide antes de criar o estado do framework.
    - Mantenha lotes determinísticos para um exercício auditável.
    - Parâmetros registrados e rastros de perda provam que houve treinamento.
brief: >
  Escreva `audit_training_pipeline(rows, labels, batch_size, learning_rate) -> dict`.
  Valide linhas de dois atributos e rótulos numéricos. Crie tensores float32, um
  `TensorDataset`/`DataLoader` determinístico e um `nn.Linear(2, 1)` registrado e inicializado
  com zeros. Treine uma época com SGD e MSE. Retorne formato da entrada, tamanhos dos lotes,
  nomes ordenados dos parâmetros, perdas arredondadas e pesos e viés finais. Rejeite entradas inválidas.
signature:
  entrypoint: audit_training_pipeline
  stub: |
    def audit_training_pipeline(rows, labels, batch_size, learning_rate):
