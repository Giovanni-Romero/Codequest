id: ai-responsible-04
title: Encaminhe para supervisão humana
track: ai-engineering
island: responsible-ai
order: 4
difficulty: challenging
tags: [ai-engineering, responsible-ai, oversight, governance]
xp: 45
concepts: [human-oversight-governance]
teaching:
  analogy: Cargas comuns podem passar por um portão automático, mas uma carga perigosa ou uma leitura incerta vai para um inspetor identificado. Um botão sem inspetor responsável não é supervisão.
  explanation: A supervisão humana encaminha decisões conforme impacto e incerteza declarados. Apenas impactos listados pela política exigem revisão independentemente da confiança. Os demais casos só seguem automaticamente quando a confiança é igual ou superior ao limite da política. A rota precisa identificar quem é responsável e por que o portão abriu.
  worked_example: |
    fragile = True
    scanner_confidence = 0.72
    automatic_threshold = 0.8
    needs_review = fragile or scanner_confidence < automatic_threshold
    lane = "inspector" if needs_review else "automatic"
    print(lane)
  key_points:
    - Apenas impactos listados pela política exigem revisão independentemente da confiança.
    - Um revisor identificado cria responsabilidade.
    - Confiança é um sinal de encaminhamento, não prova de que a decisão está correta.
brief: >
  Escreva `route_human_oversight(impact, confidence, policy) -> dict`. `impact` é `low`,
  `medium` ou `high`. `confidence` é um número finito entre 0 e 1; booleanos não são
  confiança numérica. `policy` contém exatamente `review_impacts` (uma lista única de
  strings de impacto válidas), `min_automatic_confidence` (um número finito entre 0 e 1)
  e `reviewer` (uma string não vazia). Encaminhe para `human-review` quando o impacto estiver
  listado; caso contrário, quando a confiança estiver abaixo do limite. Use os motivos
  `impact` e `confidence` nessa prioridade. Nos demais casos, encaminhe para `automatic`
  com motivo `eligible`. Retorne o revisor para revisão humana e nulo para rota automática.
  Rejeite entradas malformadas e não altere a política.
signature:
  entrypoint: route_human_oversight
  stub: |
    def route_human_oversight(impact, confidence, policy):
        # Encaminhe o risco a um revisor responsável identificado por regras explícitas.
        pass
constraints: {max_runtime_ms: 1000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [high, 0.99, {review_impacts: [high], min_automatic_confidence: 0.8, reviewer: risk-team}]
      expect: {route: human-review, reason: impact, reviewer: risk-team}
    - args: [low, 0.9, {review_impacts: [high], min_automatic_confidence: 0.8, reviewer: risk-team}]
      expect: {route: automatic, reason: eligible, reviewer: null}
    - args: [medium, 0.6, {review_impacts: [high], min_automatic_confidence: 0.8, reviewer: risk-team}]
      expect: {route: human-review, reason: confidence, reviewer: risk-team}
  hidden:
    - {args: [critical, 0.9, {review_impacts: [high], min_automatic_confidence: 0.8, reviewer: risk-team}], raises: ValueError}
    - {args: [low, true, {review_impacts: [high], min_automatic_confidence: 0.8, reviewer: risk-team}], raises: ValueError}
    - {args: [low, .nan, {review_impacts: [high], min_automatic_confidence: 0.8, reviewer: risk-team}], raises: ValueError}
    - {args: [low, 0.9, {review_impacts: [high, high], min_automatic_confidence: 0.8, reviewer: risk-team}], raises: ValueError}
    - {args: [low, 0.9, {review_impacts: [high], min_automatic_confidence: .inf, reviewer: risk-team}], raises: ValueError}
    - {args: [low, 0.9, {review_impacts: [high], min_automatic_confidence: 0.8, reviewer: ''}], raises: ValueError}
hints:
  - {level: 1, text: "Qual condição cria a obrigação de revisão mais forte: impacto ou incerteza?"}
  - {level: 2, text: "Valide toda a política e verifique o impacto listado antes do limite de confiança."}
  - {level: 3, text: "Um portão diferente poderia usar `reason = 'category' if category in blocked else 'score' if score < floor else 'clear'`."}
solution: |
  def route_human_oversight(impact, confidence, policy):
      import math
      impacts = {"low", "medium", "high"}
      if type(impact) is not str or impact not in impacts or type(confidence) not in (int, float):
          raise ValueError("invalid decision")
      try:
          confidence_ok = math.isfinite(confidence) and 0 <= confidence <= 1
      except (OverflowError, TypeError):
          confidence_ok = False
      required = {"review_impacts", "min_automatic_confidence", "reviewer"}
      if not confidence_ok or type(policy) is not dict or set(policy) != required:
          raise ValueError("invalid policy")
      review_impacts = policy["review_impacts"]
      threshold = policy["min_automatic_confidence"]
      if type(review_impacts) is not list or any(type(item) is not str or item not in impacts for item in review_impacts) or len(set(review_impacts)) != len(review_impacts):
          raise ValueError("invalid policy")
      if type(threshold) not in (int, float) or type(policy["reviewer"]) is not str or not policy["reviewer"].strip():
          raise ValueError("invalid policy")
      try:
          threshold_ok = math.isfinite(threshold) and 0 <= threshold <= 1
      except (OverflowError, TypeError):
          threshold_ok = False
      if not threshold_ok:
          raise ValueError("invalid policy")
      if impact in review_impacts:
          return {"route": "human-review", "reason": "impact", "reviewer": policy["reviewer"]}
      if confidence < threshold:
          return {"route": "human-review", "reason": "confidence", "reviewer": policy["reviewer"]}
      return {"route": "automatic", "reason": "eligible", "reviewer": None}
