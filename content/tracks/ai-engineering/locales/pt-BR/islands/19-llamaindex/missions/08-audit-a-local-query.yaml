id: ai-llamaindex-08
title: Audite uma consulta local
track: ai-engineering
island: llamaindex
order: 8
difficulty: expert
tags: [ai-engineering, llamaindex, requires-ai-rag]
xp: 60
concepts: [llamaindex-documents-nodes, llamaindex-indexes, llamaindex-query-engines, llamaindex-workflows]
teaching:
  analogy: Uma auditoria confere nota, catálogo, citação e diário de entrega juntos.
  explanation: "A auditoria exercita os quatro conceitos da ilha num pipeline só. Nós carregam ids de fonte, o índice os guarda com determinismo, hits do retriever limitam a evidência, e eventos do workflow expõem a ordem das etapas. Grounded exige ao menos um hit com a palavra; senão a auditoria se abstém. O relatório devolve ids de nó, status, fontes e eventos juntos."
  worked_example: |
    from llama_index.core import VectorStoreIndex
    from llama_index.core.embeddings.mock_embed_model import MockEmbedding
    from llama_index.core.schema import TextNode
    from llama_index.core.workflow import Event
    seeds = [TextNode(text="rye loves cold", id_="s1", metadata={"source_id": "s1"})]
    index = VectorStoreIndex(seeds, embed_model=MockEmbedding(embed_dim=2))
    hits = index.as_retriever(similarity_top_k=1).retrieve("cold")
    print([hit.node.node_id for hit in hits], [Event(stage=name)["stage"] for name in ("ingest", "retrieve")])
  key_points:
    - Rastreie cada nó ao seu id de fonte, porque auditoria sem procedência nada pode citar.
    - Leia evidência dos hits do retriever, porque resultado de recuperação sem uso vira decoração.
    - Abstenha-se com fontes vazias sem correspondência, porque adivinhar transforma auditoria em ficção.
    - Emita os eventos das etapas em ordem, porque o diário é o que torna o pipeline repetível.
brief: Escreva `audit_local_query(documents, query) -> dict`. Construa objetos `TextNode` reais com metadado `source_id`, um `VectorStoreIndex` com `MockEmbedding`, e objetos `Event` para as três etapas do workflow. Chame `as_retriever(...).retrieve(query)` e derive os ids de fonte correspondentes dos hits devolvidos; devolva ids de nó em ordem, status grounded ou abstain, ids de fonte, e as três etapas.
signature: {entrypoint: audit_local_query, stub: "def audit_local_query(documents, query):\n    pass"}
constraints: {max_runtime_ms: 5000, max_memory_mb: 256, forbidden_builtins: [eval, exec]}
tests:
  visible: [{args: [[{id: a, text: blue boat}, {id: b, text: red boat}], blue], expect: {nodes: [a, b], status: grounded, sources: [a], events: [ingest, retrieve, respond]}}, {args: [[{id: a, text: blue boat}, {id: b, text: blue sky}], blue], expect: {nodes: [a, b], status: grounded, sources: [a, b], events: [ingest, retrieve, respond]}}]
  hidden: [{args: [[{id: a, text: blue}], green], expect: {nodes: [a], status: abstain, sources: [], events: [ingest, retrieve, respond]}}, {args: [[], blue], raises: ValueError}, {args: [[{id: '', text: x}], x], raises: ValueError}, {args: [[{id: a, text: x}], ''], raises: ValueError}]
hints: [{level: 1, text: "Quais quatro registros provam que o pipeline é auditável?"}, {level: 2, text: "Use TextNode, VectorStoreIndex, uma correspondência limitada, e Event."}, {level: 3, text: "Monte o relatório de ids de nó, fontes, status, e `['ingest', 'retrieve', 'respond']`."}]
solution: |
  def audit_local_query(documents, query):
      from llama_index.core import VectorStoreIndex
      from llama_index.core.embeddings.mock_embed_model import MockEmbedding
      from llama_index.core.schema import TextNode
      from llama_index.core.workflow import Event
      if type(documents) is not list or not documents or type(query) is not str or not query.strip():
          raise ValueError("invalid input")
      nodes = []
      for document in documents:
          if type(document) is not dict or type(document.get("id")) is not str or not document["id"].strip() or type(document.get("text")) is not str:
              raise ValueError("invalid document")
          nodes.append(TextNode(text=document["text"], id_=document["id"], metadata={"source_id": document["id"]}))
      index = VectorStoreIndex(nodes, embed_model=MockEmbedding(embed_dim=2))
      node_ids = sorted(index.docstore.docs)
      hits = index.as_retriever(similarity_top_k=len(nodes)).retrieve(query)
      sources = [hit.node.metadata["source_id"] for hit in hits if query.lower() in hit.node.text.lower()]
      events = [Event(stage=stage)["stage"] for stage in ("ingest", "retrieve", "respond")]
      return {"nodes": node_ids, "status": "grounded" if sources else "abstain", "sources": sources, "events": events}
