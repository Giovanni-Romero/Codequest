id: ai-llamaindex-02
title: Construa um índice local
track: ai-engineering
island: llamaindex
order: 2
difficulty: expert
tags: [ai-engineering, llamaindex, requires-ai-rag]
xp: 60
concepts: [llamaindex-indexes]
teaching:
  analogy: Um catálogo de fichas é reconstruído a partir dos livros; ele não é os livros.
  explanation: "Um VectorStoreIndex é dado derivado: ele guarda nós mais embeddings para busca por similaridade. MockEmbedding produz vetores determinísticos, então a construção fica offline e repetível. O docstore guarda cada nó pelo id. Esta missão devolve esses ids guardados em ordem, que é a impressão digital auditável da construção."
  worked_example: |
    from llama_index.core import VectorStoreIndex
    from llama_index.core.embeddings.mock_embed_model import MockEmbedding
    from llama_index.core.schema import TextNode
    seeds = [TextNode(text="rye", id_="s1"), TextNode(text="oats", id_="s2")]
    index = VectorStoreIndex(seeds, embed_model=MockEmbedding(embed_dim=2))
    print(sorted(index.docstore.docs))
  key_points:
    - Indexe nós, não strings cruas, porque só nós carregam os metadados que a recuperação deve devolver.
    - Use MockEmbedding offline, porque embeddings reais exigem rede e quebram o determinismo.
    - Devolva os ids guardados em ordem, porque impressão digital estável é o que uma reconstrução pode verificar.
brief: Escreva `build_local_index(documents) -> list[str]`. Construa objetos `TextNode` e um `VectorStoreIndex` real em memória com `MockEmbedding`, depois devolva seus ids de nó guardados em ordem.
signature:
  entrypoint: build_local_index
  stub: |
    def build_local_index(documents):
        pass
constraints: {max_runtime_ms: 5000, max_memory_mb: 256, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - {args: [[{id: b, text: blue}, {id: a, text: amber}]], expect: [a, b]}
    - {args: [[{id: one, text: one}]], expect: [one]}
  hidden:
    - {args: [[]], raises: ValueError}
    - {args: [[{id: '', text: x}]], raises: ValueError}
    - {args: [[{id: a, text: 3}]], raises: ValueError}
    - {args: [false], raises: ValueError}
hints:
  - {level: 1, text: "Qual objeto recebe nós e os guarda em memória?"}
  - {level: 2, text: "Use VectorStoreIndex com MockEmbedding."}
  - {level: 3, text: "O padrão é `VectorStoreIndex(nodes, embed_model=MockEmbedding(embed_dim=2))`."}
solution: |
  def build_local_index(documents):
      from llama_index.core import VectorStoreIndex
      from llama_index.core.embeddings.mock_embed_model import MockEmbedding
      from llama_index.core.schema import TextNode
      if type(documents) is not list or not documents:
          raise ValueError("documents must be a non-empty list")
      nodes = []
      for document in documents:
          if type(document) is not dict or type(document.get("id")) is not str or not document["id"].strip() or type(document.get("text")) is not str:
              raise ValueError("invalid document")
          nodes.append(TextNode(text=document["text"], id_=document["id"], metadata={"source_id": document["id"]}))
      index = VectorStoreIndex(nodes, embed_model=MockEmbedding(embed_dim=2))
      return sorted(index.docstore.docs)
