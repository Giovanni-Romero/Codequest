id: ai-data-05
title: Gere o fingerprint de um dataset
track: ai-engineering
island: data-engineering-for-ai
order: 5
difficulty: challenging
tags: [ai-engineering, data, versioning, hashing]
xp: 45
concepts: [dataset-versioning]
teaching:
  analogy: Um nome de arquivo é um rótulo escrito à mão; um fingerprint de conteúdo é um selo derivado de cada byte declarado. Alterar a carga altera o selo.
  explanation: Uma versão imutável começa com serialização canônica. Ordenar chaves e fixar separadores remove diferenças de formatação, enquanto SHA-256 identifica os bytes UTF-8 resultantes. A ordem das linhas continua fazendo parte do conteúdo e da versão.
  worked_example: |
    import hashlib
    payload = b"[]"
    print(hashlib.sha256(payload).hexdigest())
  key_points:
    - Versione o conteúdo, não nomes de arquivo.
    - Serialização canônica remove diferenças irrelevantes na ordem das chaves.
    - A ordem das linhas permanece significativa salvo declaração contrária.
    - Rejeite valores que não possam ser serializados deterministicamente.
brief: >
  Escreva `fingerprint_dataset(records) -> str`. Exija uma lista contendo somente dicionários.
  Serialize com `json.dumps(records, sort_keys=True, separators=(",", ":"),
  ensure_ascii=False, allow_nan=False)`, codifique em UTF-8 e retorne o digest hexadecimal
  SHA-256 em minúsculas. Preserve a ordem das linhas. Lance `ValueError` para containers
  malformados, valores não JSON, NaN ou infinito. Não altere o dataset.
signature:
  entrypoint: fingerprint_dataset
  stub: |
    def fingerprint_dataset(records):
        # Derive uma versão imutável do conteúdo canônico do dataset.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args: [[]]
      expect: 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
    - args: [[{id: 1, text: a}]]
      expect: 3d156891e14d20c2e390a896744e57d69751a209cc187e572afe2b187503d278
  hidden:
    - args: [[{text: a, id: 1}]]
      expect: 3d156891e14d20c2e390a896744e57d69751a209cc187e572afe2b187503d278
    - args: [[{id: 2, score: 4}, {id: 1, score: 3}]]
      expect: 086e29faa660a0587cf86cd42d040cbac60e4a07679625407cfc0a1010370ef8
    - args: [not-a-list]
      raises: ValueError
    - args: [[not-a-record]]
      raises: ValueError
    - args: [[{score: .inf}]]
      raises: ValueError
hints:
  - level: 1
    text: "Quais escolhas de serialização devem ser fixadas para o hash representar conteúdo em vez de formatação?"
  - level: 2
    text: "Canonicalize com chaves ordenadas, separadores compactos, UTF-8 e floats não finitos proibidos."
  - level: 3
    text: "Calcule o hash de `payload.encode('utf-8')` com `hashlib.sha256(...).hexdigest()` e converta erros de serialização em `ValueError`."
solution: |
  def fingerprint_dataset(records):
      import hashlib
      import json
      if not isinstance(records, list) or any(not isinstance(record, dict) for record in records):
          raise ValueError("invalid dataset")
      def json_value(value):
          if value is None or type(value) in (str, int, float, bool):
              return True
          if isinstance(value, list):
              return all(json_value(item) for item in value)
          if isinstance(value, dict):
              return all(type(key) is str and json_value(item) for key, item in value.items())
          return False
      if not json_value(records):
          raise ValueError("non-canonical dataset")
      try:
          payload = json.dumps(records, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)
          digest = hashlib.sha256(payload.encode("utf-8")).hexdigest()
      except (TypeError, ValueError, OverflowError, UnicodeError) as caught:
          raise ValueError("non-canonical dataset") from caught
      return digest
