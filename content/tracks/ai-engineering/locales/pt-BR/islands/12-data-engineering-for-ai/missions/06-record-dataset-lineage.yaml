id: ai-data-06
title: Registre a linhagem do dataset
track: ai-engineering
island: data-engineering-for-ai
order: 6
difficulty: challenging
tags: [ai-engineering, data, versioning, lineage]
xp: 45
concepts: [dataset-versioning]
teaching:
  analogy: Uma carta derivada deve nomear tanto as cartas de origem quanto a regra de navegação que a produziu. Seu próprio selo não explica sozinho de onde ela veio.
  explanation: A linhagem conecta a versão do conteúdo de saída a versões imutáveis das entradas e a uma versão da transformação. Ordenar nomes das fontes estabiliza o relatório, enquanto validar o formato do digest impede que nomes de arquivo ou rótulos informais finjam ser identidades de conteúdo.
  worked_example: |
    lineage = {"inputs": {"raw": "a" * 64}, "transformation_version": "clean-v1"}
    print(lineage["transformation_version"])
  key_points:
    - Identidade da saída e proveniência são campos diferentes.
    - Cada entrada deve usar um digest imutável de conteúdo.
    - A lógica de transformação precisa de versão própria.
    - A ordem estável das fontes mantém relatórios reproduzíveis.
brief: >
  Escreva `record_lineage(dataset, input_versions, transformation_version) -> dict`. Gere o
  fingerprint de `dataset` com o contrato SHA-256 canônico da missão 5. Exija um mapeamento
  não vazio de nomes string não vazios para digests hexadecimais minúsculos de 64 caracteres,
  além de uma versão string não vazia da transformação. Retorne `output_version`, `inputs`
  ordenadas alfabeticamente e `transformation_version`. Lance `ValueError` para dados ou
  linhagem malformados.
signature:
  entrypoint: record_lineage
  stub: |
    def record_lineage(dataset, input_versions, transformation_version):
        # Conecte uma versão de saída a entradas imutáveis e à lógica de transformação.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128, forbidden_builtins: [eval, exec]}
tests:
  visible:
    - args:
        - [{id: 1, text: a}]
        - raw: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        - clean-v1
      expect:
        output_version: 3d156891e14d20c2e390a896744e57d69751a209cc187e572afe2b187503d278
        inputs: {raw: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
        transformation_version: clean-v1
    - args:
        - []
        - zeta: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          alpha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        - merge-v2
      expect:
        output_version: 4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
        inputs: {alpha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, zeta: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}
        transformation_version: merge-v2
  hidden:
    - args: [[{id: 1}], {}, clean-v1]
      raises: ValueError
    - args: [[{id: 1}], {raw: filename.csv}, clean-v1]
      raises: ValueError
    - args: [[{id: 1}], {raw: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}, clean-v1]
      raises: ValueError
    - args: [[{id: 1}], {raw: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}, ""]
      raises: ValueError
    - args: [[{score: .nan}], {raw: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}, clean-v1]
      raises: ValueError
hints:
  - level: 1
    text: "Quais três versões são necessárias para explicar um dataset derivado?"
  - level: 2
    text: "Valide nomes de fontes e o formato minúsculo dos digests antes de calcular o hash da saída."
  - level: 3
    text: "Compare cada caractere com `0123456789abcdef` e retorne `dict(sorted(input_versions.items()))`."
solution: |
  def record_lineage(dataset, input_versions, transformation_version):
      import hashlib
      import json
      if not isinstance(dataset, list) or any(not isinstance(record, dict) for record in dataset):
          raise ValueError("invalid dataset")
      if not isinstance(input_versions, dict) or not input_versions or not isinstance(transformation_version, str) or not transformation_version:
          raise ValueError("invalid lineage")
      hexadecimal = set("0123456789abcdef")
      if any(not isinstance(name, str) or not name or not isinstance(version, str) or len(version) != 64 or any(character not in hexadecimal for character in version) for name, version in input_versions.items()):
          raise ValueError("invalid input version")
      def json_value(value):
          if value is None or type(value) in (str, int, float, bool):
              return True
          if isinstance(value, list):
              return all(json_value(item) for item in value)
          if isinstance(value, dict):
              return all(type(key) is str and json_value(item) for key, item in value.items())
          return False
      if not json_value(dataset):
          raise ValueError("non-canonical dataset")
      try:
          payload = json.dumps(dataset, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)
          output_version = hashlib.sha256(payload.encode("utf-8")).hexdigest()
      except (TypeError, ValueError, OverflowError, UnicodeError) as caught:
          raise ValueError("non-canonical dataset") from caught
      return {
          "output_version": output_version,
          "inputs": dict(sorted(input_versions.items())),
          "transformation_version": transformation_version,
      }
