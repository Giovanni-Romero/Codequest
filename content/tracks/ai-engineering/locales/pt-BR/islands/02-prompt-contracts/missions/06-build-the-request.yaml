id: ai-prompts-06
title: Construa a requisição
track: ai-engineering
island: prompt-contracts
order: 6
difficulty: moderate
tags: [ai-engineering, prompts, templates, context]
xp: 30
concepts: [prompt-templates, context-assembly]
teaching:
  analogy: |
    Um despacho combina uma ordem preenchida somente com as notas de carga que cabem
    no envelope. Formulário e evidências ficam separados para poderem ser inspecionados.
  explanation: |
    A construção combina uma tarefa renderizada com contexto limitado. O resultado é
    dado estruturado, não uma string opaca. Isso facilita rotular confiança depois.
  worked_example: |
    order = "Deliver {item}".format_map({"item": "tea"})
    notes = ["dry cargo", "dock seven"]
    message = {"order": order, "notes": notes[:1]}
    print(message)
  key_points:
    - Renderização e seleção de contexto continuam etapas distintas.
    - O contexto mantém a ordem das fontes.
    - Um chunk ignorado não bloqueia evidências menores.
brief: |
  Escreva `build_context_request(template, variables, chunks, max_words)`. Renderize
  campos nomeados e lance `ValueError` se um estiver ausente ou o orçamento for negativo.
  Selecione contexto relevante e não vazio sob o limite, continuando após chunks caros.
  Retorne `{"task": rendered_text, "context": selected_texts}`.
signature:
  entrypoint: build_context_request
  stub: |
    def build_context_request(template, variables, chunks, max_words):
        # Combine uma tarefa renderizada com evidências limitadas.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: ["Answer {question}", {question: "Where?"}, [{text: "port map", relevant: true}, {text: noise, relevant: false}], 2]
      expect: {task: "Answer Where?", context: ["port map"]}
    - args: ["Summarize {topic}", {topic: tides}, [{text: "three long words", relevant: true}, {text: short, relevant: true}], 1]
      expect: {task: "Summarize tides", context: [short]}
  hidden:
    - args: [plain, {}, [], 0]
      expect: {task: plain, context: []}
    - args: ["Keep {data}", {data: "{literal}"}, [], 0]
      expect: {task: "Keep {literal}", context: []}
    - args: ["Need {x}", {}, [], 0]
      raises: ValueError
    - args: [plain, {}, [], -1]
      raises: ValueError
    - args: [plain, {}, [{text: " ", relevant: true}], 3]
      expect: {task: plain, context: []}
hints:
  - {level: 1, text: "Você consegue concluir e validar a tarefa antes de percorrer as evidências?"}
  - {level: 2, text: "Formate uma vez e reutilize a varredura com orçamento acumulado."}
  - level: 3
    text: |
      Um relatório pode preencher o título primeiro e anexar apenas notas selecionadas
      cujo tamanho combinado fique no limite.
solution: |
  def build_context_request(template, variables, chunks, max_words):
      if max_words < 0:
          raise ValueError("max_words must not be negative")
      try:
          task = template.format_map(variables)
      except (KeyError, ValueError) as exc:
          raise ValueError("cannot render template") from exc

      context = []
      used = 0
      for chunk in chunks:
          text = " ".join(chunk["text"].split())
          cost = len(text.split())
          if chunk["relevant"] and text and used + cost <= max_words:
              context.append(text)
              used += cost
      return {"task": task, "context": context}
