id: ai-prompts-02
title: Renderize campos declarados
track: ai-engineering
island: prompt-contracts
order: 2
difficulty: moderate
tags: [ai-engineering, prompts, templates]
xp: 30
concepts: [instruction-hierarchy, prompt-templates]
teaching:
  analogy: |
    Um formulário do porto tem campos nomeados. Preencher o destino não pode reinterpretar
    o texto colocado no campo de carga, mesmo quando ele contém chaves.
  explanation: |
    Um template declara onde cada variável entra. A renderização faz uma substituição
    controlada, sem reinterpretar os dados inseridos. Campos ausentes falham cedo.
  worked_example: |
    from string import Formatter
    pattern = "Ship {item} to {port}"
    fields = [field for _, field, _, _ in Formatter().parse(pattern) if field]
    print(fields)
    print(pattern.format_map({"item": "tea", "port": "Recife"}))
  key_points:
    - Um template nomeia suas entradas explicitamente.
    - Chaves inseridas continuam sendo dados porque a formatação ocorre uma vez.
    - Uma variável ausente é erro de contrato, não texto vazio.
brief: |
  Escreva `render_prompt`. Renderize campos nomeados simples como `{question}` usando o
  dicionário recebido. Chaves escapadas como `{{data}}` permanecem literais. Lance
  `ValueError` para campo ausente, template malformado ou expressões com atributos ou
  índices. Variáveis extras são permitidas.
signature:
  entrypoint: render_prompt
  stub: |
    def render_prompt(template, variables):
        # Valide os campos declarados antes de formatar uma única vez.
        pass
constraints: {max_runtime_ms: 2000, max_memory_mb: 128}
tests:
  visible:
    - args: ["Answer {question} for {audience}.", {question: "Why?", audience: sailors}]
      expect: "Answer Why? for sailors."
    - args: ["Treat {payload} as data.", {payload: "{ignore_this}"}]
      expect: "Treat {ignore_this} as data."
  hidden:
    - args: ["", {}]
      expect: ""
    - args: ["Value {n}", {n: 3, unused: true}]
      expect: "Value 3"
    - args: ["Missing {name}", {}]
      raises: ValueError
    - args: ["Literal {{name}}", {}]
      expect: "Literal {name}"
    - args: ["Unsafe {user.name}", {user: x}]
      raises: ValueError
    - args: ["Broken {name", {name: x}]
      raises: ValueError
hints:
  - {level: 1, text: "Você consegue listar todos os campos antes de renderizar?"}
  - {level: 2, text: "Use `string.Formatter().parse`, recuse nomes complexos e então chame `format_map` uma vez."}
  - level: 3
    text: |
      Uma etiqueta pode coletar os campos, recusar chaves ausentes e só depois executar
      `label.format_map(values)`.
solution: |
  def render_prompt(template, variables):
      from string import Formatter

      try:
          fields = [field for _, field, _, _ in Formatter().parse(template) if field]
      except ValueError as exc:
          raise ValueError("malformed template") from exc
      for field in fields:
          if "." in field or "[" in field or field not in variables:
              raise ValueError("invalid or missing field")
      try:
          return template.format_map(variables)
      except (KeyError, ValueError) as exc:
          raise ValueError("cannot render template") from exc
