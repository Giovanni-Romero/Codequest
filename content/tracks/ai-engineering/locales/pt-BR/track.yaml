id: ai-engineering
name: Engenharia de IA
language: python
version: "0.1"
description: |
  Construa sistemas de IA confiáveis, de fundamentos determinísticos a frameworks de produção.
  Vinte e duas ilhas cobrem fundamentos, cinco especializações de frameworks e um capstone ponta a ponta.

runner: python
file_extension: .py

islands:
