id: ai-engineering
name: Engenharia de IA
language: python
version: "0.1"
description: |
  Construa sistemas de IA confiáveis, de fundamentos determinísticos a frameworks de produção.
  As dezesseis primeiras ilhas cobrem sistemas de IA confiáveis e fundamentos matemáticos, estatísticos, de machine learning, de tomada de decisão, de dados, de deep learning, de NLP, de IA responsável e de MLOps.

runner: python
file_extension: .py

islands:
  - 01-documents-into-context
  - 02-prompt-contracts
  - 03-retrieval
  - 04-rag
  - 05-structured-outputs
  - 06-evals
  - 07-tools-and-agents
  - 08-production-ai
  - 09-mathematical-statistical-foundations
  - 10-machine-learning-foundations
  - 11-reasoning-and-decision-making
  - 12-data-engineering-for-ai
  - 13-pytorch-and-deep-learning
  - 14-nlp-and-transformers
  - 15-responsible-ai
  - 16-mlops-and-model-lifecycle
