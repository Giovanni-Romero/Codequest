  - 03-retrieval
  - 04-rag
  - 05-structured-outputs
  - 06-evals
  - 07-tools-and-agents
  - 08-production-ai
  - 09-mathematical-statistical-foundations
  - 10-machine-learning-foundations
  - 11-reasoning-and-decision-making
  - 12-data-engineering-for-ai
  - 13-pytorch-and-deep-learning
  - 14-nlp-and-transformers
  - 15-responsible-ai
  - 16-mlops-and-model-lifecycle
  - 17-langchain
  - 18-langgraph
  - 19-llamaindex
  - 20-pydanticai
  - 21-dspy
  - 22-capstone
