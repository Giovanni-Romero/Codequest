# Missão 8 de Algoritmos. Introduz: recursion.
# Reforça: functions, conditionals, big-o.
#
# Listas aninhadas em vez de fatorial ou fibonacci, de propósito. Um fatorial tem um laço
# óbvio e o jogador escreve o laço; uma árvore de formato desconhecido não tem, então a
# recursão é a ferramenta honesta e não a ferramenta imposta.
#
# Duas respostas de uma caminhada - um total e uma profundidade - porque exigem formatos
# diferentes de recursão. O total combina as respostas dos filhos; a profundidade pega a
# maior e soma um. Quem escreve as duas conheceu os dois padrões que cobrem quase todo
# trabalho com árvores.
#
# RecursionError já é um desfecho de primeira classe (engine/harness.py:135), então um caso
# base ausente dá uma falha legível e não um estouro do sandbox.
# Referência do schema: docs/mission-schema.md

id: py-algorithms-08
title: O espelho e o espelho
track: python
island: algorithms
order: 8
difficulty: challenging
tags: [algorithms, recursion, trees]
