# Missão 10 de Objetos. Não introduz nada.
# Reforça: dataclasses, properties, composition-over-inheritance.
#
# Missão de alívio. Três das ideias mais duras da ilha no formato mais amigável possível:
# nenhum setter, nenhuma exceção, nenhuma armadilha de ordem no __init__ porque o @dataclass
# escreve o __init__.
#
# O que está sendo dito baixinho é que as três se combinam. Uma dataclass pode carregar uma
# property, uma property pode percorrer uma lista de outras dataclasses, e nenhuma das três
# precisou saber das outras.
# Referência do schema: docs/mission-schema.md

id: py-objects-10
title: A frota gerada
track: python
island: objects
order: 10
difficulty: simple
tags: [objects, dataclasses, properties, relief]
xp: 20

concepts:
  - dataclasses
  - properties
  - composition-over-inheritance

teaching:
  analogy: |
    Um estaleiro guarda uma ficha por embarcação. A ficha lista as peças, e não lista o peso
    total - isso é calculado somando as peças toda vez que alguém pergunta.

    Ninguém se importa de fazer a soma. O que incomodaria seria um total anotado que
    discordasse das peças depois de uma reforma, e uma ficha sem total anotado não tem como
    discordar de nada.

  explanation: |
    Nada de novo aqui. Três coisas que você já tem, usadas juntas.

    Uma dataclass pode guardar uma lista de outras dataclasses:

        @dataclass
        class Vessel:
            name: str
            parts: list = field(default_factory=list)

    Uma dataclass pode carregar uma property no corpo, embaixo dos campos:

        @property
        def weight(self):
            total = 0
            for part in self.parts:
                total = total + part.weight
            return total

    Uma property pode ter o nome de algo que não é um campo, e muitas vezes deve ter. Não
    existe campo `weight` na embarcação - existe um `weight` que você lê, calculado a partir
    das peças toda vez. Acrescente uma peça e o número anda sozinho.

    Isso é composição e cálculo trabalhando juntos. A embarcação não sabe como uma peça
    decide o peso dela, e não lembra o que as peças disseram da última vez.

  worked_example: |
    # Uma refeição, que não é o que esta missão pede
    from dataclasses import dataclass, field


    @dataclass
    class Ingredient:
        name: str
        calories: int


    @dataclass
    class Meal:
        name: str
        items: list = field(default_factory=list)

        @property
        def calories(self):
            total = 0
            for item in self.items:
                total = total + item.calories
            return total


    almoco = Meal("almoço", [Ingredient("pão", 200)])
    print(almoco.calories)     # 200

    almoco.items.append(Ingredient("queijo", 150))
    print(almoco.calories)     # 350 - nada foi recalculado à mão

  key_points:
    - "Um campo de dataclass que guarda uma lista precisa de `field(default_factory=list)`. A regra não muda porque a lista guarda os seus próprios objetos."
    - "Uma property pode não compartilhar o nome com nada. O `weight` aqui é calculado a partir de `parts`, e nenhum campo chamado `weight` existe."
    - "Acrescentar à lista muda a resposta da property na hora, porque a resposta nunca foi guardada."
    - "Seus métodos e properties vão embaixo dos campos, no corpo da classe. O `@dataclass` lê as linhas anotadas e não encosta no resto."

brief: |
  O estaleiro quer um peso para cada embarcação do pátio, calculado a partir das peças dela.

  Usando `@dataclass`, defina uma classe chamada Part com dois campos: `name`, um str, e
  `weight`, um int.

  Usando `@dataclass`, defina uma classe chamada Vessel com dois campos: `name`, um str, e
  `parts`, uma lista com padrão vazio. Dê a ela uma property chamada `weight`, somando o peso
  de cada peça que ela guarda. Não existe campo de peso - só a property.

  Depois escreva uma função chamada yard que recebe uma lista de entradas. Cada entrada é um
  par:

      ["Aurora", [["hull", 800], ["engine", 400]]]

  Para cada entrada, construa as Parts, e depois uma Vessel que as guarda. Devolva um
  dicionário no formato:

      {"vessels": [{"name": ..., "weight": ...}, ...], "total": ...}

  `vessels` mantém a ordem em que as entradas chegaram. `total` é o peso de todas as
  embarcações somado.

  Uma embarcação sem peças pesa 0 e continua aparecendo na lista.

  Você não pode usar sum.

