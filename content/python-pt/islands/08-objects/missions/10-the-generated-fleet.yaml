constraints:
  forbidden_builtins: [sum]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: [[["Aurora", [["hull", 800], ["engine", 400]]]]]
      expect:
        vessels: [{name: Aurora, weight: 1200}]
        total: 1200
    - args: [[["Aurora", [["hull", 800]]], ["Petrel", [["hull", 300]]]]]
      expect:
        vessels: [{name: Aurora, weight: 800}, {name: Petrel, weight: 300}]
        total: 1100
  hidden:
    # Um pátio vazio. As duas metades da resposta sobrevivem a isso.
    - args: [[]]
      expect: {vessels: [], total: 0}
    # Uma embarcação sem peças. Ela ainda aparece, pesando nada.
    - args: [[["Skiff", []]]]
      expect:
        vessels: [{name: Skiff, weight: 0}]
        total: 0
    # Uma vazia e uma carregada. Uma solução que pula as vazias falha aqui.
    - args: [[["Skiff", []], ["Aurora", [["hull", 500]]]]]
      expect:
        vessels: [{name: Skiff, weight: 0}, {name: Aurora, weight: 500}]
        total: 500
    # Peças de peso zero. Continuam sendo peças, continuam sendo somadas.
    - args: [[["Aurora", [["flag", 0], ["flag", 0]]]]]
      expect:
        vessels: [{name: Aurora, weight: 0}]
        total: 0
    # Duas embarcações com o mesmo nome. Nada aqui as funde.
    - args: [[["Aurora", [["hull", 100]]], ["Aurora", [["hull", 200]]]]]
      expect:
        vessels: [{name: Aurora, weight: 100}, {name: Aurora, weight: 200}]
        total: 300
    # Muitas peças numa embarcação só, então uma solução que lê apenas a primeira é pega.
    - args: [[["Leviathan", [["a", 1], ["b", 2], ["c", 3], ["d", 4]]]]]
      expect:
        vessels: [{name: Leviathan, weight: 10}]
        total: 10
    # Um nome vazio é um nome, e a ordem é a de chegada, não alfabética.
    - args: [[["Zephyr", [["hull", 1]]], ["", [["hull", 2]]]]]
      expect:
        vessels: [{name: Zephyr, weight: 1}, {name: "", weight: 2}]
        total: 3

hints:
  - level: 1
    text: |
      A Vessel não tem campo de peso. Então quando você monta o dicionário de uma embarcação,
      de onde vem o número - e aquela expressão tem parênteses no fim?
  - level: 2
    text: |
      Dois laços, ou um laço com uma compreensão dentro. Para cada entrada, desempacote como
      `for name, part_entries in entries`, construa as peças a partir de `part_entries`, e
      depois `Vessel(name, parts)`.

      A property é o mesmo acumulador que você escreveu a ilha inteira: um total começando em
      0, uma passada sobre `self.parts`, um `return`.

      O total geral é uma segunda passada sobre as embarcações que você construiu, lendo
      `vessel.weight` sem parênteses.
  - level: 3
    text: |
      O mesmo aninhamento, para shows:

          @dataclass
          class Act:
              name: str
              minutes: int


          @dataclass
          class Concert:
              venue: str
              acts: list = field(default_factory=list)

              @property
              def minutes(self):
                  total = 0
                  for act in self.acts:
                      total = total + act.minutes
                  return total


          def season(entries):
              shows = []
              for venue, act_entries in entries:
                  acts = [Act(name, minutes) for name, minutes in act_entries]
                  shows.append(Concert(venue, acts))
              return [{"venue": c.venue, "minutes": c.minutes} for c in shows]

      A sua pesa peças em vez de cronometrar atrações, e a resposta leva um total geral ao
      lado da lista.

solution: |
  from dataclasses import dataclass, field


  @dataclass
  class Part:
      name: str
      weight: int


  @dataclass
  class Vessel:
      name: str
      parts: list = field(default_factory=list)

      @property
      def weight(self):
          total = 0
          for part in self.parts:
              total = total + part.weight
          return total


  def yard(entries):
      vessels = []
      for name, part_entries in entries:
          parts = [Part(part_name, weight) for part_name, weight in part_entries]
          vessels.append(Vessel(name, parts))

      total = 0
      for vessel in vessels:
          total = total + vessel.weight

      return {
          "vessels": [{"name": vessel.name, "weight": vessel.weight} for vessel in vessels],
          "total": total,
      }
