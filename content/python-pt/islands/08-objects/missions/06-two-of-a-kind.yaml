constraints:
  forbidden_imports: [dataclasses]
  forbidden_builtins: [set, frozenset]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: [[["rope", 12], ["sail", 30], ["rope", 12]]]
      expect: ["Crate('rope', 12)", "Crate('sail', 30)"]
    - args: [[["rope", 12], ["rope", 30]]]
      expect: ["Crate('rope', 12)", "Crate('rope', 30)"]
  hidden:
    # Nada chegou. Uma lista vazia é uma resposta de verdade.
    - args: [[]]
      expect: []
    # Um caixote só, sem nada com que comparar.
    - args: [[["rope", 12]]]
      expect: ["Crate('rope', 12)"]
    # Todos os caixotes idênticos. Só o primeiro sobrevive.
    - args: [[["rope", 12], ["rope", 12], ["rope", 12]]]
      expect: ["Crate('rope', 12)"]
    # Mesmo peso, nomes diferentes. A regra compara os dois, então os dois ficam.
    - args: [[["rope", 12], ["chain", 12]]]
      expect: ["Crate('rope', 12)", "Crate('chain', 12)"]
    # A duplicata não é vizinha. Uma solução que compara só com o caixote anterior falha
    # aqui e em nenhum outro lugar.
    - args: [[["rope", 12], ["sail", 30], ["rope", 12], ["chain", 5]]]
      expect: ["Crate('rope', 12)", "Crate('sail', 30)", "Crate('chain', 5)"]
    # O primeiro de cada, não o último. Se a ordem sair invertida, este é o caso que avisa.
    - args: [[["sail", 30], ["rope", 12], ["sail", 30]]]
      expect: ["Crate('sail', 30)", "Crate('rope', 12)"]
    # Zero e um nome vazio, os dois ainda são valores.
    - args: [[["", 0], ["", 0], ["rope", 0]]]
      expect: ["Crate('', 0)", "Crate('rope', 0)"]

hints:
  - level: 1
    text: |
      O que `caixote in vistos` faz de verdade, um item por vez? Se você souber isso, você
      sabe por que este laço não precisa de nenhuma comparação de nomes ou pesos dentro dele.
  - level: 2
    text: |
      Uma lista chamada `vistos`, começando vazia. Um laço sobre `entries`, construindo um
      Crate a partir de cada par. Um `if ... not in vistos` protegendo um único `append`.

      Depois uma segunda passada - ou uma compreensão - transformando `vistos` numa lista de
      strings de `repr`. A lista que você monta no laço guarda caixotes, não texto.
  - level: 3
    text: |
      O mesmo laço, com selos:

          class Stamp:
              def __init__(self, country, value):
                  self.country = country
                  self.value = value

              def __repr__(self):
                  return f"Stamp({self.country!r}, {self.value})"

              def __eq__(self, other):
                  return self.country == other.country and self.value == other.value


          def album(entries):
              guardados = []
              for country, value in entries:
                  selo = Stamp(country, value)
                  if selo not in guardados:
                      guardados.append(selo)
              return [repr(selo) for selo in guardados]

      A sua guarda caixotes, e as palavras dentro do repr são outras.

solution: |
  class Crate:
      def __init__(self, name, weight):
          self.name = name
          self.weight = weight

      def __repr__(self):
          return f"Crate({self.name!r}, {self.weight})"

      def __eq__(self, other):
          return self.name == other.name and self.weight == other.weight


  def distinct(entries):
      seen = []

      for name, weight in entries:
          crate = Crate(name, weight)
          if crate not in seen:
              seen.append(crate)

      return [repr(crate) for crate in seen]
