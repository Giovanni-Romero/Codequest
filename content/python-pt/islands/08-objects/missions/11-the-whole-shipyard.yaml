constraints:
  forbidden_builtins: [sum]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["A1", 5000, [["Aurora", 800], ["Petrel", 400]], 5000]
      expect:
        berth: "Berth('A1', 1200/5000)"
        used: 1200
        same: true
    - args: ["A1", 5000, [["Aurora", 800]], 4000]
      expect:
        berth: "Berth('A1', 800/4000)"
        used: 800
        same: true
  hidden:
    # Nada atracado em lugar nenhum. Toda property ainda responde.
    - args: ["B2", 100, [], 100]
      expect:
        berth: "Berth('B2', 0/100)"
        used: 0
        same: true
    # O limite novo cai exatamente no que está atracado. Permitido, e não sobra espaço.
    - args: ["A1", 5000, [["Aurora", 800]], 800]
      expect:
        berth: "Berth('A1', 800/800)"
        used: 800
        same: true
    # Uma tonelada abaixo do que já está atracado.
    - args: ["A1", 5000, [["Aurora", 800]], 799]
      raises: BerthFullError
    # Um limite negativo é ValueError, não BerthFullError. Duas falhas, dois nomes.
    - args: ["A1", 5000, [], -1]
      raises: ValueError
    # O limite inicial passa pelo mesmo setter, então isto falha antes de qualquer
    # embarcação existir.
    - args: ["A1", -5, [], 10]
      raises: ValueError
    # Uma embarcação que não cabe. O `moor` recusa e o harbour não captura.
    - args: ["A1", 500, [["Leviathan", 900]], 500]
      raises: BerthFullError
    # Atracadas uma por vez, cada uma checada contra o total corrente. A terceira passa em um.
    - args: ["A1", 1000, [["a", 400], ["b", 400], ["c", 400]], 1000]
      raises: BerthFullError
    # Uma embarcação de tonelagem zero continua sendo uma embarcação, e não move nada.
    - args: ["A1", 10, [["Raft", 0]], 10]
      expect:
        berth: "Berth('A1', 0/10)"
        used: 0
        same: true
    # Um código vazio continua ganhando as aspas.
    - args: ["", 50, [["Skiff", 10]], 50]
      expect:
        berth: "Berth('', 10/50)"
        used: 10
        same: true

hints:
  - level: 1
    text: |
      Passe pelo enunciado uma linha por vez e rotule cada item antes de escrever qualquer
      coisa: isto é um fato que você lê, uma ação que você toma, ou uma pergunta que a
      linguagem faz?

      Três rótulos, e cada um te diz se aquilo é uma property, um método ou um dunder.
  - level: 2
    text: |
      `used` e `limit` são properties, `moor` é um método, `__repr__` e `__eq__` são dunders.
      O setter guarda em `self._limit`, e o `__init__` faz `self.vessels = []` antes de
      encostar em `self.limit`.

      `__eq__` compara `self.code == other.code and self.limit == other.limit` - dois
      atributos, não três, porque o enunciado diz que as embarcações não contam.

      É por isso que `same` é True mesmo com o primeiro atracadouro carregado: o segundo é
      construído com o limite *novo*, que é o que o primeiro tem agora.
  - level: 3
    text: |
      Você escreveu cada uma dessas peças nas missões 4, 5, 7, 8, 9 e 10. Abra o painel de
      ensino da missão 9 para o formato da property com setter, e o da missão 4 para os dois
      dunders.

      A única linha realmente nova é o repr, e é uma f-string só:

          def __repr__(self):
              return f"Locker({self.code!r}, {self.taken}/{self.slots})"

      A sua diz Berth, e os dois números dela vêm de uma property e de uma property.

solution: |
  from dataclasses import dataclass


  class BerthFullError(Exception):
      pass


  @dataclass
  class Vessel:
      name: str
      tonnage: int


  class Berth:
      def __init__(self, code, limit):
          self.vessels = []
          self.code = code
          self.limit = limit

      @property
      def used(self):
          total = 0
          for vessel in self.vessels:
              total = total + vessel.tonnage
          return total

      @property
      def limit(self):
          return self._limit

      @limit.setter
      def limit(self, value):
          if value < 0:
              raise ValueError(f"{value} is not a limit")
          if value < self.used:
              raise BerthFullError(f"{self.used} is already moored")
          self._limit = value

      def moor(self, vessel):
          if self.used + vessel.tonnage > self.limit:
              raise BerthFullError(f"{vessel.tonnage} would take the berth past {self.limit}")
          self.vessels.append(vessel)

      def __repr__(self):
          return f"Berth({self.code!r}, {self.used}/{self.limit})"

      def __eq__(self, other):
          return self.code == other.code and self.limit == other.limit


  def harbour(code, limit, entries, new_limit):
      berth = Berth(code, limit)

      for name, tonnage in entries:
          berth.moor(Vessel(name, tonnage))

      berth.limit = new_limit

      other = Berth(code, new_limit)

      return {
          "berth": repr(berth),
          "used": berth.used,
          "same": berth == other,
      }
