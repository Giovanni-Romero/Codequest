# Missão 11 de Objetos. Não introduz nada. Missão de fechamento.
# Reforça: os oito conceitos da ilha.
#
# Combine, não aprenda. Cada peça aqui foi ensinada numa missão anterior e nada é
# introduzido: uma dataclass de peça, uma embarcação composta, uma property calculada, um
# setter protegido, uma exceção própria, um __repr__ e um __eq__.
#
# A única coisa que esta missão pede e nenhuma anterior pediu é escolher a ferramenta certa
# sem que digam qual é. O enunciado descreve comportamento e deixa a escolha entre método,
# property e dunder para o jogador, que é o que `moderate` significa nesta ilha.
# Referência do schema: docs/mission-schema.md

id: py-objects-11
title: O estaleiro inteiro
track: python
island: objects
order: 11
difficulty: moderate
tags: [objects, closing, composition, dataclasses]
xp: 30

concepts:
  - classes
  - instances
  - methods
  - dunder-methods
  - custom-exceptions
  - composition-over-inheritance
  - dataclasses
  - properties

teaching:
  analogy: |
    O estaleiro está pronto. Os formulários estão impressos, o escriturário conhece as
    regras, o capitão do porto recusa o que tem de ser recusado, e toda folha diz na cara o
    que é.

    Nada de novo está sendo construído hoje. Hoje o estaleiro funciona.

  explanation: |
    Esta missão não introduz nada. Ela pede que você escolha, que é a parte que ninguém
    consegue ensinar num painel.

    Três das decisões aparecem sempre, e aqui está a versão curta de cada uma.

    **Método ou property?** Se ler aquilo deveria parecer ler um fato - `porao.load` - faça
    uma property. Se aquilo muda alguma coisa, ou recebe um argumento, ou é caro o bastante
    para quem chama merecer ver os parênteses e pensar duas vezes, faça um método.

    **Dataclass ou classe comum?** Se a classe é quase só campos e você quer os três métodos
    gerados, `@dataclass`. Se a maior parte do corpo dela é comportamento, ou se você precisa
    de um `__repr__` num formato que o decorador não escreve, uma classe comum te custa
    quatro linhas e te dá o formato que você queria.

    **Exceção embutida ou sua?** Se quem chama poderia razoavelmente querer capturar essa
    falha e não as outras, ela precisa de nome. Se é só um valor ruim, o `ValueError` já tem
    um.

    Nenhuma dessas tem resposta certa que sobreviva a toda situação. Elas têm resposta certa
    para *esta* situação, e conseguir dizer por quê é a habilidade inteira.

  worked_example: |
    # Um sistema pequeno do mesmo formato, para um teatro
    from dataclasses import dataclass


    class SoldOutError(Exception):
        pass


    @dataclass
    class Seat:
        row: str
        price: int


    class Show:
        def __init__(self, title, capacity):
            self.title = title
            self.capacity = capacity
            self.seats = []

        @property
        def takings(self):                        # um fato: property
            total = 0
            for seat in self.seats:
                total = total + seat.price
            return total

        def sell(self, seat):                     # muda as coisas: método
            if len(self.seats) + 1 > self.capacity:
                raise SoldOutError(self.title)
            self.seats.append(seat)

        def __repr__(self):
            return f"Show({self.title!r}, {self.takings})"

  key_points:
    - "Uma property se lê como um fato e um método se lê como uma ação. Escolha pelo jeito que a chamada deveria se ler, não pelo que é mais fácil de escrever."
    - "`@dataclass` quando a classe é quase só campos, classe comum quando ela é quase só comportamento ou precisa de um `__repr__` no seu próprio formato."
    - "Dê nome próprio a uma falha quando quem chama fosse querer capturar só ela. Fora isso, a embutida já está certa."
    - "Composição primeiro. Dois atributos ganham de dois pais, e você não vai ter de explicar qual pai venceu."
    - "Tudo nesta ilha existe para que quem chama não consiga colocar o seu objeto num estado que você disse ser impossível. É esse o ponto, e a sintaxe sempre foi só o meio."

brief: |
  Faça o estaleiro inteiro funcionar.

  Defina uma exceção chamada BerthFullError, herdando de Exception.

  Usando `@dataclass`, defina uma classe chamada Vessel com dois campos: `name`, um str, e
  `tonnage`, um int.

  Defina uma classe comum chamada Berth:

    - `__init__` recebe um código de atracadouro e um limite de tonelagem. Ele coloca
      `self.vessels` como lista vazia primeiro, depois atribui o limite através de um setter
      de property.
    - `code` é um atributo comum.
    - `used` é uma **property**, somando a tonelagem de cada embarcação atracada ali.
    - `limit` é uma **property** com setter. O setter levanta ValueError quando o valor novo
      é negativo, levanta BerthFullError quando ele fica abaixo de `used`, e caso contrário
      guarda como `self._limit`.
    - `moor` é um **método** recebendo uma Vessel. Ele levanta BerthFullError quando a
      embarcação levaria `used` acima de `limit`, e caso contrário dá append nela.
    - `__repr__` devolve exatamente `Berth('A1', 1200/5000)` - o código entre aspas, depois
      used, uma barra, depois limit.
    - `__eq__` devolve True quando o outro atracadouro tem o mesmo código e o mesmo limite.
      As embarcações não contam.

  Depois escreva uma função chamada harbour que recebe um código, um limite, uma lista de
  pares [nome, tonelagem], e um limite novo:

    - construa o atracadouro
    - construa uma Vessel para cada par e atraque, na ordem
    - atribua o limite novo
    - construa um segundo atracadouro com o mesmo código e o limite **novo**, sem nada
      atracado
    - devolva um dicionário no formato {"berth": ..., "used": ..., "same": ...}

  `berth` é o `repr` do primeiro atracadouro. `used` é o `used` dele. `same` é se os dois
  atracadouros são iguais.

  Não capture nada. Você não pode usar sum.

