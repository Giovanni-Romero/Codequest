constraints:
  forbidden_imports: [dataclasses]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["Aurora", 800, 400, 900]
      expect:
        ship: "Ship('Aurora', 1200)"
        engine: "Engine(400, 900)"
        total: 1200
        powered: true
    - args: ["Petrel", 800, 400, 100]
      expect:
        ship: "Ship('Petrel', 1200)"
        engine: "Engine(400, 100)"
        total: 1200
        powered: false
  hidden:
    # Potência exatamente na metade do total. "Pelo menos" quer dizer que este tem força.
    - args: ["Aurora", 800, 400, 600]
      expect:
        ship: "Ship('Aurora', 1200)"
        engine: "Engine(400, 600)"
        total: 1200
        powered: true
    # Uma unidade abaixo da metade. A fronteira, vista do outro lado.
    - args: ["Aurora", 800, 400, 599]
      expect:
        ship: "Ship('Aurora', 1200)"
        engine: "Engine(400, 599)"
        total: 1200
        powered: false
    # Um casco sem peso. O total é só o motor, então um total_weight que esqueceu de somar
    # o motor devolve 0 aqui e é pego.
    - args: ["Skiff", 0, 50, 25]
      expect:
        ship: "Ship('Skiff', 50)"
        engine: "Engine(50, 25)"
        total: 50
        powered: true
    # Um motor sem peso. O caso espelhado: um total_weight que esqueceu o casco falha.
    - args: ["Barge", 900, 0, 450]
      expect:
        ship: "Ship('Barge', 900)"
        engine: "Engine(0, 450)"
        total: 900
        powered: true
    # Sem potência nenhuma, e nada para mover.
    - args: ["Hulk", 0, 0, 0]
      expect:
        ship: "Ship('Hulk', 0)"
        engine: "Engine(0, 0)"
        total: 0
        powered: true
    # Um nome vazio continua ganhando as aspas no repr.
    - args: ["", 100, 100, 500]
      expect:
        ship: "Ship('', 200)"
        engine: "Engine(100, 500)"
        total: 200
        powered: true
    # Grande e desequilibrado, então uma resposta chumbada não tem onde se esconder.
    - args: ["Leviathan", 9000, 1000, 4000]
      expect:
        ship: "Ship('Leviathan', 10000)"
        engine: "Engine(1000, 4000)"
        total: 10000
        powered: false

hints:
  - level: 1
    text: |
      O `Ship.__init__` recebe um Engine já construído. O que ele guarda - o motor, ou os
      números tirados de dentro dele? Uma dessas duas respostas te deixa trocar o motor
      depois, e a outra não.
  - level: 2
    text: |
      `self.engine = engine`, sem desempacotar nada. O peso do motor passa a ser
      `self.engine.weight` em todo lugar onde você precisar dele.

      `total_weight` é um `return` só com uma soma. `is_powered` compara a potência do motor
      com metade do que `total_weight()` devolve - e sim, um método pode chamar outro método
      da mesma instância através do `self`.

      O `Ship.__repr__` também chama `total_weight()`, então a etiqueta nunca fica velha.
  - level: 3
    text: |
      O mesmo formato de duas classes, para uma bicicleta:

          class Wheel:
              def __init__(self, weight, size):
                  self.weight = weight
                  self.size = size

              def __repr__(self):
                  return f"Wheel({self.weight}, {self.size})"


          class Bicycle:
              def __init__(self, owner, frame_weight, wheel):
                  self.owner = owner
                  self.frame_weight = frame_weight
                  self.wheel = wheel

              def total_weight(self):
                  return self.frame_weight + self.wheel.weight * 2

              def __repr__(self):
                  return f"Bicycle({self.owner!r}, {self.total_weight()})"

      A sua guarda um motor em vez de duas rodas, e tem um segundo método que responde uma
      pergunta de sim ou não.

solution: |
  class Engine:
      def __init__(self, weight, power):
          self.weight = weight
          self.power = power

      def __repr__(self):
          return f"Engine({self.weight}, {self.power})"


  class Ship:
      def __init__(self, name, hull_weight, engine):
          self.name = name
          self.hull_weight = hull_weight
          self.engine = engine

      def total_weight(self):
          return self.hull_weight + self.engine.weight

      def is_powered(self):
          return self.engine.power >= self.total_weight() / 2

      def __repr__(self):
          return f"Ship({self.name!r}, {self.total_weight()})"


  def assemble(name, hull_weight, engine_weight, engine_power):
      engine = Engine(engine_weight, engine_power)
      ship = Ship(name, hull_weight, engine)

      return {
          "ship": repr(ship),
          "engine": repr(engine),
          "total": ship.total_weight(),
          "powered": ship.is_powered(),
      }
