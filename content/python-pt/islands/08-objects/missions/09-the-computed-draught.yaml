constraints:
  forbidden_builtins: [sum]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: [100, [["rope", 12], ["sail", 30]], 80]
      expect: {load: 42, free: 38, capacity: 80}
    - args: [100, [], 50]
      expect: {load: 0, free: 50, capacity: 50}
  hidden:
    # Relicenciar abaixo do que já está a bordo. A regra do próprio setter.
    - args: [100, [["rope", 60]], 50]
      raises: OverloadError
    # Exatamente na carga é permitido, e não deixa espaço nenhum.
    - args: [100, [["rope", 60]], 60]
      expect: {load: 60, free: 0, capacity: 60}
    # Uma capacidade negativa é ValueError, não OverloadError. Duas regras, dois nomes.
    - args: [100, [], -1]
      raises: ValueError
    # A capacidade inicial passa pelo mesmo setter, então isto falha antes de qualquer
    # caixote existir. É o que prova que o __init__ atribuiu em vez de guardar direto.
    - args: [-5, [], 10]
      raises: ValueError
    # Um caixote que não cabe. O `add` recusa, e o retrim não captura.
    - args: [10, [["rope", 12]], 10]
      raises: OverloadError
    # Aumentando a licença. `free` acompanha sem nada ser recalculado à mão.
    - args: [100, [["rope", 12]], 500]
      expect: {load: 12, free: 488, capacity: 500}
    # Um caixote de peso zero continua sendo um caixote, e não move nada.
    - args: [10, [["letters", 0]], 10]
      expect: {load: 0, free: 10, capacity: 10}
    # Nada em lugar nenhum. Toda property ainda tem de responder.
    - args: [0, [], 0]
      expect: {load: 0, free: 0, capacity: 0}
    # Vários caixotes, adicionados um por vez, cada um checado contra a carga corrente.
    - args: [50, [["a", 10], ["b", 10], ["c", 10]], 30]
      expect: {load: 30, free: 0, capacity: 30}

hints:
  - level: 1
    text: |
      `load` não está guardada em lugar nenhum. Então quando o `add` pergunta "esse caixote
      caberia?", de onde vem o número com que ele compara?

      E no `__init__`: o setter de capacidade precisa saber a carga atual. O que a carga
      precisa que exista antes de conseguir ser calculada?
  - level: 2
    text: |
      `load` é um laço sobre `self.crates` com um total corrente, devolvido. `free` é uma
      subtração usando `self.load` - sem parênteses, porque é uma property.

      O getter de `capacity` devolve `self._capacity`. O setter checa `value < 0` primeiro,
      depois `value < self.load`, depois atribui `self._capacity = value`. Nunca
      `self.capacity = value` lá dentro.

      O `__init__` tem duas linhas e a lista vazia vem primeiro.
  - level: 3
    text: |
      Os mesmos dois tipos de property, num estacionamento:

          class FullError(Exception):
              pass


          class CarPark:
              def __init__(self, spaces):
                  self.cars = []
                  self.spaces = spaces

              @property
              def taken(self):
                  total = 0
                  for car in self.cars:
                      total = total + 1
                  return total

              @property
              def spaces(self):
                  return self._spaces

              @spaces.setter
              def spaces(self, value):
                  if value < 0:
                      raise ValueError("um estacionamento não tem vagas negativas")
                  if value < self.taken:
                      raise FullError(f"{self.taken} carros já estão estacionados")
                  self._spaces = value

      A sua soma pesos em vez de contar carros, e tem uma terceira property que subtrai.

solution: |
  from dataclasses import dataclass


  class OverloadError(Exception):
      pass


  @dataclass
  class Crate:
      name: str
      weight: int


  class Hold:
      def __init__(self, capacity):
          self.crates = []
          self.capacity = capacity

      @property
      def load(self):
          total = 0
          for crate in self.crates:
              total = total + crate.weight
          return total

      @property
      def free(self):
          return self.capacity - self.load

      @property
      def capacity(self):
          return self._capacity

      @capacity.setter
      def capacity(self, value):
          if value < 0:
              raise ValueError(f"{value} is not a capacity")
          if value < self.load:
              raise OverloadError(f"{self.load} is already aboard")
          self._capacity = value

      def add(self, crate):
          if self.load + crate.weight > self.capacity:
              raise OverloadError(f"{crate.weight} would take the load past {self.capacity}")
          self.crates.append(crate)


  def retrim(start_capacity, entries, new_capacity):
      hold = Hold(start_capacity)

      for name, weight in entries:
          hold.add(Crate(name, weight))

      hold.capacity = new_capacity

      return {"load": hold.load, "free": hold.free, "capacity": hold.capacity}
