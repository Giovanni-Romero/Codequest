# Missão 9 de Objetos. Introduz: properties.
# Reforça: methods, dataclasses, custom-exceptions, composition-over-inheritance.
#
# Duas properties fazendo trabalhos diferentes: `load` é calculada e só de leitura,
# `capacity` é guardada e protegida. Ensinar só a calculada deixa o jogador achando que
# @property é um jeito de evitar parênteses; ensinar só a protegida deixa ele achando que é
# um validador.
#
# A armadilha de ordem no __init__ é proposital e é a aresta mais afiada da missão: atribuir
# self.capacity executa um setter que lê self.crates, então a lista precisa existir antes.
# Falha com AttributeError, que é uma mensagem genuinamente confusa na primeira vez.
# Referência do schema: docs/mission-schema.md

id: py-objects-09
title: O calado calculado
track: python
island: objects
order: 9
difficulty: moderate
tags: [objects, properties, validation]
xp: 30

concepts:
  - properties

teaching:
  analogy: |
    O quadro da capitania mostra o calado de um navio - o quanto ele afunda na água. Ninguém
    escreve aquele número no quadro. Alguém lê no casco a cada vez, porque um número anotado
    de manhã é mentira à tarde.

    Do lado dele está a capacidade licenciada, que **é** anotada. Essa pode ser mudada, mas
    não por qualquer um com uma caneta: você leva ao capitão do porto, que se recusa a
    licenciar um porão para menos do que já está dentro dele.

    Um número é sempre recalculado. O outro é guardado atrás de alguém que sabe dizer não.

  explanation: |
    Uma property é um método que você lê como se fosse um atributo. Sem parênteses na
    chamada:

        class Hold:
            @property
            def free(self):
                return self.capacity - self.load

        porao.free      # executa o método, dá um número

    Isso compra duas coisas diferentes, e vale separá-las.

    **Calculada.** `free` não está guardada em lugar nenhum, então não tem como envelhecer.
    Guarde-a e você passa a ter dois fatos que precisam andar juntos, e um dia não vão andar.
    O custo é que ela roda toda vez que você lê - tudo bem para uma subtração, um problema se
    você esconder uma consulta ao banco atrás de uma.

    **Protegida.** Uma property também pode ter um setter, que roda na atribuição:

        @property
        def capacity(self):
            return self._capacity

        @capacity.setter
        def capacity(self, value):
            if value < 0:
                raise ValueError("uma capacidade não pode ser negativa")
            self._capacity = value

    O valor guardado se muda para `self._capacity` - um nome diferente, por convenção com um
    sublinhado na frente - porque `self.capacity = value` dentro do setter chamaria o setter
    de novo, para sempre.

    Para o que isso serve de verdade: `porao.capacity = 50` já estava escrito por todo o
    código, e acrescentar a property muda o que aquela linha faz sem mudar uma única chamada.

    Uma aresta afiada. Se o `__init__` atribui `self.capacity = capacity`, essa atribuição
    executa o setter, e o que quer que o setter leia já tem de existir. Ordene as linhas do
    `__init__` de acordo, ou você vai encontrar um `AttributeError` sobre um atributo que
    está bem ali na sua frente.

  worked_example: |
    # Um termostato, que não é o que esta missão pede
    class Thermostat:
        def __init__(self, readings, target):
            self.readings = readings      # primeiro: o setter abaixo lê isto
            self.target = target

        @property
        def average(self):                # calculada, só leitura, nunca velha
            return sum(self.readings) / len(self.readings)

        @property
        def target(self):
            return self._target

        @target.setter
        def target(self, value):
            if value < min(self.readings):
                raise ValueError("alvo abaixo de qualquer coisa que a sala já foi")
            self._target = value


    t = Thermostat([18, 20, 22], 21)
    print(t.average)      # 20.0 - sem parênteses
    t.target = 19         # executa o setter, que permite
    t.readings.append(30)
    print(t.average)      # 22.5 - recalculada, porque nunca foi guardada

  key_points:
    - "Uma property é lida sem parênteses. `porao.free` executa o método; `porao.free()` tenta chamar o que quer que ele tenha devolvido."
    - "Uma property calculada não tem como envelhecer, porque não há nada guardado para ficar desatualizado. Isso vale mais do que os microssegundos que ela custa."
    - "O setter tem de guardar sob outro nome - `self._capacity`. Atribuir a `self.capacity` dentro do setter de `capacity` chama o setter de novo, para sempre."
    - "Acrescentar uma property é invisível para quem chama. `porao.capacity = 50` continua funcionando e passa a ser checado, por isso você pode acrescentar a proteção depois sem tocar em nada."
    - "Se o `__init__` atribui através de um setter, tudo que aquele setter lê tem de estar montado na linha anterior. O erro é um `AttributeError` longe da causa."

brief: |
  Um porão reporta o que está carregando e se recusa a ser licenciado para menos do que isso.

  Defina uma exceção chamada OverloadError, herdando de Exception.

  Usando `@dataclass`, defina uma classe chamada Crate com dois campos: `name`, um str, e
  `weight`, um int. Não escreva método nenhum nela.

  Defina uma classe comum chamada Hold:

    - `__init__` recebe uma capacidade. Ele coloca `self.crates` como lista vazia
      **primeiro**, e depois atribui `self.capacity` - e essa atribuição passa pelo setter
      abaixo, então a ordem não é opcional.
    - `load` é uma **property**, calculada somando o peso de cada caixote. Nada é guardado.
    - `free` é uma **property**, devolvendo capacidade menos carga.
    - `capacity` é uma **property** com setter. O setter levanta ValueError quando o valor
      novo é negativo, levanta OverloadError quando ele é menor que a carga atual, e caso
      contrário guarda como `self._capacity`.
    - um método chamado `add` recebe um Crate. Ele levanta OverloadError quando o caixote
      levaria a carga acima da capacidade, e caso contrário dá append em `self.crates`.

  Uma capacidade igual à carga atual é permitida. Só ficar abaixo dela não é.

  Depois escreva uma função chamada retrim que recebe uma capacidade inicial, uma lista de
  pares [nome, peso], e uma capacidade nova:

    - construa o porão
    - construa um Crate para cada par e adicione, na ordem
    - atribua a capacidade nova a `hold.capacity`
    - devolva um dicionário no formato {"load": ..., "free": ..., "capacity": ...}

  Não capture nada. Toda recusa sai do retrim.

  Você não pode usar sum - o `load` soma os pesos ele mesmo.

