constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: [[["rope"]]]
      expect: [["rope"]]
    # Dois lotes e onde um caixote compartilhado se revela.
    - args: [[["rope"], ["salt", "nails"]]]
      expect: [["rope"], ["salt", "nails"]]
  hidden:
    - args: [[]]
      expect: []
    - args: [[[], []]]
      expect: [[], []]
    - args: [[["a"], ["b"], ["c"]]]
      expect: [["a"], ["b"], ["c"]]
    - args: [[["a", "b"], [], ["c"]]]
      expect: [["a", "b"], [], ["c"]]
    - args: [[["x"], ["x"], ["x"]]]
      expect: [["x"], ["x"], ["x"]]

hints:
  - level: 1
    text: |
      Calcule no papel o que pack(["a"]) e depois pack(["b"]) retornam se o parâmetro
      crate tiver como padrão uma lista vazia escrita direto na linha do def. Quando
      exatamente aquela lista foi criada?
  - level: 2
    text: |
      Dê a crate o padrão None. Primeira coisa no corpo, verifique se ele é None e, se
      for, atribua uma lista vazia nova a ele. Depois adicione cada item e retorne o
      caixote. pack_batches só percorre os lotes, chama pack em cada um, e adiciona o
      resultado na lista dela.
  - level: 3
    text: |
      A forma da sentinela, coletando pontuações em vez de carga:

          def registrar(pontos, ficha=None):
              if ficha is None:
                  ficha = []
              ficha.append(pontos)
              return ficha

      A sua adiciona vários itens em vez de um, e outra coisa a chama uma vez por lote.

solution: |
  def pack(items, crate=None):
      if crate is None:
          crate = []
      for item in items:
          crate.append(item)
      return crate


  def pack_batches(batches):
      crates = []
      for batch in batches:
          crates.append(pack(batch))
      return crates
