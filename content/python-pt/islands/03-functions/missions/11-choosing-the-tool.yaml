tests:
  visible:
    - args: [[3, 9, 1]]
      expect: 3
    - args: [[3, 9, 1], "biggest"]
      expect: 9
  hidden:
    - args: [[3, 9, 1], "smallest"]
      expect: 1
    - args: [[-5, 2, 7], "smallest"]
      expect: -5
    - args: [[-5, 2, 7], "smallest"]
      kwargs: { ignore_negatives: true }
      expect: 2
    - args: [[-5, -2], "count"]
      kwargs: { ignore_negatives: true }
      expect: 0
    - args: [[], "biggest"]
      expect: 0
    - args: [[1, 2], "hoist"]
      expect: 0
    - args: [[4]]
      expect: 1
    - args: [[-1, -2, 5], "count"]
      expect: 3

hints:
  - level: 1
    text: |
      Três coisas acontecem em ordem aqui, e acertar a ordem é a maior parte do trabalho.
      Qual precisa acontecer antes da vistoria rodar, e qual decide se ela roda?
  - level: 2
    text: |
      Primeiro, se options.get("ignore_negatives") for verdadeiro, reconstrua numbers
      como uma cópia filtrada. Depois, se a lista está vazia, retorne 0. Depois procure
      how no seu dicionário de vistorias com .get, retorne 0 quando estiver ausente, e
      caso contrário chame-a na lista.
  - level: 3
    text: |
      O filtro e a busca, numa vistoria diferente:

          if opcoes.get("so_pagos"):
              linhas = [l for l in linhas if l > 0]
          ferramenta = FERRAMENTAS.get(tipo)
          if ferramenta is None:
              return 0
          return ferramenta(linhas)

      A sua também precisa decidir o que uma lista vazia significa antes de chegar na
      ferramenta.

solution: |
  def count(values):
      return len(values)


  def biggest(values):
      return max(values)


  def smallest(values):
      return min(values)


  def survey(numbers, how="count", **options):
      if options.get("ignore_negatives"):
          numbers = [number for number in numbers if number >= 0]

      if not numbers:
          return 0

      tool = {"count": count, "biggest": biggest, "smallest": smallest}.get(how)
      if tool is None:
          return 0
      return tool(numbers)
