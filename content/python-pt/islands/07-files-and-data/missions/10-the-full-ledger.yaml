tests:
  visible:
    - args: ["cargo.csv", "manifest.json", "report.txt"]
      expect:
        ship: Aurora
        declared: 42
        actual: 42
        matches: true
        report: [Aurora, "rope, tarred: 12", "sailcloth: 30", "total: 42", "source: cargo"]
    - args: ["short.csv", "short.json", "report.txt"]
      expect:
        ship: Petrel
        declared: 10
        actual: 7
        matches: false
        report: [Petrel, "salt: 7", "total: 7", "source: short"]
  hidden:
    # Nenhuma carga. O relatorio ainda tem titulo, total e linha de origem.
    - args: ["bare.csv", "bare.json", "report.txt"]
      expect:
        ship: Wren
        declared: 0
        actual: 0
        matches: true
        report: [Wren, "total: 0", "source: bare"]
    # Par trocado de proposito: a carga do Aurora contra a declaracao do Petrel. O nome do
    # navio vem do manifesto e a linha de origem vem do CSV, entao uma solucao que tira
    # qualquer um dos dois do arquivo errado se revela aqui.
    - args: ["cargo.csv", "short.json", "report.txt"]
      expect:
        ship: Petrel
        declared: 10
        actual: 42
        matches: false
        report: [Petrel, "rope, tarred: 12", "sailcloth: 30", "total: 42", "source: cargo"]
    # O primeiro caso visivel de novo. As fixtures sao restauradas entre casos e o modo
    # "w" esvazia o relatorio, entao isso nao pode ter crescido.
    - args: ["cargo.csv", "manifest.json", "report.txt"]
      expect:
        ship: Aurora
        declared: 42
        actual: 42
        matches: true
        report: [Aurora, "rope, tarred: 12", "sailcloth: 30", "total: 42", "source: cargo"]
    # Outro destino de relatorio. Nada no conteudo depende de onde ele e escrito.
    - args: ["short.csv", "short.json", "audit.log"]
      expect:
        ship: Petrel
        declared: 10
        actual: 7
        matches: false
        report: [Petrel, "salt: 7", "total: 7", "source: short"]
    - args: ["cargo.csv", "nowhere.json", "report.txt"]
      raises: FileNotFoundError

hints:
  - level: 1
    text: |
      Três arquivos, e um deles precisa ser lido antes que você consiga escrever a primeira
      linha do relatório. Qual, e por quê?
  - level: 2
    text: |
      Abra o manifesto com json.load e comece sua lista de linhas com o nome do navio.
      Depois percorra as linhas do DictReader uma vez, somando int(row["weight"]) num total
      e acrescentando "item: weight" nas linhas.

      Depois do laço, acrescente a linha do total e a linha de origem montada com
      Path(cargo_path).stem. Aí escreva com "\n".join(linhas) + "\n" e leia de volta.
  - level: 3
    text: |
      Os dois leitores lado a lado, em outro par de arquivos:

          with open(caminho_config, encoding="utf-8") as handle:
              config = json.load(handle)

          linhas = []
          with open(caminho_dados, newline="", encoding="utf-8") as handle:
              for linha in csv.DictReader(handle):
                  linhas.append(linha["label"])

          resumo = {"title": config["title"], "labels": linhas}

      A sua também totaliza uma coluna, escreve um relatório e o lê de volta.

solution: |
  import csv
  import json
  from pathlib import Path


  def close_the_books(cargo_path, manifest_path, report_path):
      with open(manifest_path, encoding="utf-8") as handle:
          manifest = json.load(handle)

      lines = [manifest["ship"]]
      actual = 0

      with open(cargo_path, newline="", encoding="utf-8") as handle:
          for row in csv.DictReader(handle):
              weight = int(row["weight"])
              actual = actual + weight
              lines.append(row["item"] + ": " + str(weight))

      lines.append("total: " + str(actual))
      lines.append("source: " + Path(cargo_path).stem)

      with open(report_path, "w", encoding="utf-8") as handle:
          handle.write("\n".join(lines) + "\n")

      with open(report_path, encoding="utf-8") as handle:
          written = handle.read().splitlines()

      return {
          "ship": manifest["ship"],
          "declared": manifest["declared_total"],
          "actual": actual,
          "matches": actual == manifest["declared_total"],
          "report": written,
      }
