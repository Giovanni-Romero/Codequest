teaching:
  analogy: |
    Uma auditoria são dois documentos e uma pergunta. A declaração do capitão diz que o
    porão carrega quarenta e duas toneladas. A conferência do cais diz o que de fato subiu a
    bordo. Ninguém está sendo acusado de nada; o trabalho é colocar os dois números na mesma
    página e dizer se eles batem.

    O que faz disso uma auditoria e não uma opinião é que a página é escrita e guardada,
    tenha a resposta dado para que lado tiver.

  explanation: |
    Nada de novo é introduzido aqui. As seis peças da ilha, numa função:

    - `json.load` para a declaração, que é aninhada e tem nomes
    - `csv.DictReader` para a conferência, que é tabular e toda em strings
    - `Path(...).stem` para nomear a origem sem digitar separador
    - um bloco `with` em modo `"w"` para escrever o relatório, e outro para ler de volta

    A única coisa a planejar é a ordem. Você precisa do nome do navio, que está no JSON,
    antes de começar o relatório, e precisa de todas as linhas do CSV antes de escrever o
    total. Então: carregue o manifesto, percorra as linhas montando as linhas e a soma,
    termine o relatório, escreva.

    Comparar os dois totais dá um booleano, e esse booleano é uma resposta de verdade.
    `False` aqui não significa que a função falhou - significa que a auditoria achou uma
    divergência, que é o motivo inteiro de alguém rodá-la.

  worked_example: |
    # Conferindo um estoque, que nao e o que esta missao pede
    import csv
    import json

    def conferir(caminho_esperado, caminho_contado):
        with open(caminho_esperado, encoding="utf-8") as handle:
            esperado = json.load(handle)["count"]

        contado = 0
        with open(caminho_contado, newline="", encoding="utf-8") as handle:
            for linha in csv.DictReader(handle):
                contado = contado + int(linha["qty"])

        return {"expected": esperado, "counted": contado, "matches": esperado == contado}

  key_points:
    - Carregue o manifesto antes do laço. A primeira linha do relatório precisa do nome do navio, que só o JSON tem.
    - "Monte as linhas e o total na mesma passagem. Ler o CSV duas vezes funciona e custa um segundo open à toa."
    - "Todo campo de CSV é string e todo número de JSON já é número. As chamadas de int() são de um lado só."
    - "Um resultado False é uma resposta, não uma falha. O relatório é escrito de qualquer jeito - é isso que faz dele uma auditoria."
    - "Devolva o que você leu de volta do arquivo de relatório, não a lista que montou. Deveriam ser iguais, e se não forem você quer saber."

brief: |
  Dois arquivos descrevem a mesma viagem e podem discordar.

  O manifesto é JSON:

      {"ship": "Aurora", "declared_total": 42}

  A carga é CSV com três colunas - port, item e weight. Alguns nomes de item estão entre
  aspas porque contêm vírgula.

  Escreva uma função chamada close_the_books que recebe o nome do arquivo de carga, o nome
  do manifesto e o nome do relatório.

  Monte o relatório, uma linha cada:

    - o nome do navio
    - uma linha por linha de carga, no formato "item: weight"
    - "total: N", os pesos somados
    - "source: S", onde S é o nome do arquivo de carga sem a extensão

  Escreva no arquivo de relatório, com toda linha terminando em quebra de linha, e depois
  leia de volta.

  Devolva um dict com cinco chaves:

    - "ship" - o nome do navio
    - "declared" - declared_total do manifesto
    - "actual" - o total que você somou
    - "matches" - True quando os dois totais são iguais, False quando não são
    - "report" - as linhas do relatório, lidas de volta, como lista de strings

  Você não pode usar split nem eval.

  Estes arquivos já existem no seu diretório de trabalho: cargo.csv, manifest.json,
  short.csv, short.json, bare.csv e bare.json.

files:
  cargo.csv: |
