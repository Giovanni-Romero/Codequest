# Missao 10 de Arquivos e Dados. Nao introduz nada. Missao de encerramento.
# Reforca: open-and-read, context-managers, writing-files, json, csv, paths - os seis
# conceitos da ilha, numa chamada so.
#
# De volta a faixa moderate da ilha. Nada aqui e mais dificil que a missao 7 ou a 9
# sozinhas; o que e novo e segurar tres arquivos de tres formatos ao mesmo tempo, que e a
# cara do trabalho real com dados.
# Schema reference: docs/mission-schema.md

