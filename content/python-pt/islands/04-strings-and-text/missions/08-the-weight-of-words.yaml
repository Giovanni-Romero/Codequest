tests:
  visible:
    - args: ["cafe"]
      expect: [4, 4, 0]
    - args: ["café"]
      expect: [4, 5, 1]
  hidden:
    - args: [""]
      expect: [0, 0, 0]
    - args: ["abc"]
      expect: [3, 3, 0]
    - args: ["ãé"]
      expect: [2, 4, 2]
    - args: ["a b"]
      expect: [3, 3, 0]
    - args: ["Ação"]
      expect: [4, 6, 2]
    - args: ["ç"]
      expect: [1, 2, 1]

hints:
  - level: 1
    text: |
      Os dois primeiros números são uma medida cada no texto inteiro. O terceiro não pode
      ser - ele precisa que você olhe os caracteres um por vez. O que dá para medir num
      caractere sozinho?
  - level: 2
    text: |
      len(text) dá o primeiro. len(text.encode("utf-8")) dá o segundo. Para o terceiro,
      percorra os caracteres e conte aqueles em que len(caractere.encode("utf-8")) é
      maior que 1.
  - level: 3
    text: |
      A metade por caractere, contando outra coisa:

          largos = 0
          for ch in texto:
              if len(ch.encode("utf-8")) > 2:
                  largos = largos + 1

      A sua usa um limite diferente e junta a contagem com duas medidas do texto inteiro.

solution: |
  def text_weight(text):
      characters = len(text)
      byte_count = len(text.encode("utf-8"))

      multibyte = 0
      for character in text:
          if len(character.encode("utf-8")) > 1:
              multibyte = multibyte + 1

      return [characters, byte_count, multibyte]
