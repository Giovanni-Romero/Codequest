# Missão 3 de Async e Concorrência. Não introduz nada.
# Reforça: async-await, return-values, accumulator-pattern, dictionaries.
#
# Missão de alívio, e o ponto que ela faz por ser sem graça: uma corrotina devolve um valor
# como qualquer função. Tudo o que o jogador já sabe sobre escrever funções continua valendo
# dentro de um `async def` - o caso vazio, a guarda contra divisão por zero, o dict no fim.
# `async` mudou quando a função roda, não o que ela é.
#
# Um await, no topo, e depois código comum. Esse formato é o caso comum em programação
# async de verdade e vale encontrá-lo enquanto nada mais está acontecendo.
# Referência do schema: docs/mission-schema.md

id: py-async-03
title: O sinal paciente
track: python
island: async-and-concurrency
order: 3
difficulty: challenging
tags: [async, await, relief]
xp: 45

concepts:
  - async-await

teaching:
  analogy: |
    O faroleiro espera a régua de maré se assentar antes de lê-la. Essa espera é a única
    coisa incomum no serviço.

    Assim que a agulha para de se mexer, tudo o que vem depois é o trabalho que qualquer
    escriturário faz: ler os números, somar, dividir pela quantidade, anotar no formulário.
    Ninguém preenche o formulário de outro jeito por ter tido que esperar por ele.

  explanation: |
    Uma corrotina é uma função. Recebe argumentos, tem um corpo, devolve um valor, e quem
    chama recebe esse valor.

    Isso soa óbvio demais para ser dito, e é a coisa que as pessoas erram primeiro. A
    palavra-chave `async` muda **quando** a função roda — ela agora pode pausar num `await` e
    deixar o loop usar a brecha. Não muda nada sobre o que a função *é*:

    - Ela retorna com `return`, e o valor devolvido pode ser qualquer coisa: um número, um
      dict, `None`.
    - Os argumentos funcionam exatamente como sempre funcionaram, defaults inclusive.
    - `if`, `for`, `try` e todo outro comando se comportam de forma idêntica lá dentro.
    - Uma entrada vazia ainda precisa de tratamento. Uma divisão ainda precisa de checagem
      de zero.

    A única regra nova é que o valor volta através de um `await`. Quem chamar
    `patient_signal()` recebe uma corrotina; quem escrever `await patient_signal()` recebe o
    dict. Neste jogo o motor é quem chama, então basta você fazer `return` e ele chega.

    O formato comum em código async de verdade é exatamente esta missão: **aguarde uma vez,
    perto do topo, depois código comum**. Os awaits são onde o mundo externo está — um banco
    de dados, uma chamada HTTP, uma fila — e tudo entre eles é o mesmo Python que você
    escreve desde a Ilha 1.

  worked_example: |
    # Uma corrotina que espera uma vez e depois faz trabalho completamente banal
    import asyncio


    async def stock_check(names):
        await asyncio.sleep(0.01)

        longest = ""
        for name in names:
            if len(name) > len(longest):
                longest = name

        return {"items": len(names), "longest": longest or None}


    print(asyncio.run(stock_check(["rope", "lantern"])))     # {'items': 2, 'longest': 'lantern'}
    print(asyncio.run(stock_check([])))                      # {'items': 0, 'longest': None}
    # Um await. Depois dele, um laço e uma guarda de caso vazio, e nada nos dois é async.

  key_points:
    - "Uma corrotina devolve um valor com `return`, como qualquer função. `async` mudou quando ela roda, não o que ela é."
    - "Tudo o que você sabe sobre escrever funções continua valendo dentro de um `async def`: defaults, laços, guardas, o caso vazio."
    - "O formato usual é aguardar uma vez perto do topo, e depois código comum. Os awaits são onde o mundo externo está."
    - "Devolver `None` de uma corrotina é uma resposta normal, não um erro — e é a resposta certa para uma média sem nada a mediar."
    - "Quem chama é que tem de dar `await`. Aqui o motor é quem chama, então um `return` simples basta."

brief: |
  Espere o medidor assentar, depois leia.

  Escreva uma corrotina chamada patient_signal que recebe uma lista de leituras e um número
  de milissegundos, e devolve:

      {"count": ..., "total": ..., "mean": ..., "waited_ms": ...}

  Primeiro `await asyncio.sleep(ms / 1000)`. Tudo depois disso é trabalho comum.

  `count` é quantas leituras havia. `total` é a soma delas. `mean` é a média **arredondada a
  duas casas decimais** com `round(total / count, 2)`, ou `None` quando não há leitura
  nenhuma. `waited_ms` é o `ms` que você recebeu, sem alteração.

  Uma lista vazia dá count 0, total 0, e mean `None`.

  Importe `asyncio` você mesmo. O motor aguarda a sua função por você — não chame
  `asyncio.run`.

signature:
  entrypoint: patient_signal
  stub: |
    async def patient_signal(readings, ms):
        # Aguarde uma vez, no topo. Depois disso é o mesmo trabalho de qualquer outra missão.
        # seu código aqui
        pass

constraints:
  max_runtime_ms: 5000
  max_memory_mb: 128

tests:
  visible:
    - args: [[4, 8, 6], 20]
      expect:
        count: 3
        total: 18
        mean: 6.0
        waited_ms: 20
    - args: [[10], 10]
      expect:
        count: 1
        total: 10
        mean: 10.0
        waited_ms: 10
  hidden:
    # Nada a mediar. A guarda é a missão inteira neste caso.
    - args: [[], 10]
      expect:
        count: 0
        total: 0
        mean: null
        waited_ms: 10
    # Vazio e sem espera nenhuma. As duas bordas ao mesmo tempo.
    - args: [[], 0]
      expect:
        count: 0
        total: 0
        mean: null
        waited_ms: 0
    # Uma espera zero ainda cede ao loop, e o resto do trabalho não muda.
    - args: [[1, 2], 0]
      expect:
        count: 2
        total: 3
        mean: 1.5
        waited_ms: 0
    # Negativos se cancelam. Total 0 não é a mesma coisa que nenhuma leitura, e a média prova.
    - args: [[-5, 5], 15]
      expect:
        count: 2
        total: 0
        mean: 0.0
        waited_ms: 15
    - args: [[1, 1, 1], 5]
      expect:
        count: 3
        total: 3
        mean: 1.0
        waited_ms: 5
    - args: [[7, 8], 30]
      expect:
        count: 2
        total: 15
        mean: 7.5
        waited_ms: 30

hints:
  - level: 1
    text: |
      A espera é uma linha no topo e depois sai do caminho. O que sobra é uma contagem, uma
      soma, e uma divisão que não pode acontecer quando a contagem é zero.

      O que a média deveria ser quando não há nada a mediar? O enunciado diz, e não é 0.
  - level: 2
    text: |
      `import asyncio`, depois `async def patient_signal(readings, ms):`.

      Primeira linha do corpo: `await asyncio.sleep(ms / 1000)`.

      Depois `count = len(readings)` e `total = sum(readings)`. A média precisa de um ramo:
      `None` quando `count` é 0, senão `round(total / count, 2)`.

      Devolva as quatro chaves, e passe `ms` direto para `waited_ms`.
  - level: 3
    text: |
      O mesmo formato, sobre chuva em vez de leituras de medidor:

          import asyncio


          async def rainfall(days, ms):
              await asyncio.sleep(ms / 1000)

              days_seen = len(days)
              wettest = None
              if days_seen > 0:
                  wettest = max(days)

              return {"days": days_seen, "wettest": wettest, "slept_ms": ms}


          print(asyncio.run(rainfall([3, 9], 5)))     # {'days': 2, 'wettest': 9, 'slept_ms': 5}

      Note a guarda em volta de `max`, que levantaria erro numa lista vazia. A sua guarda
      uma divisão pelo mesmo motivo, e tem uma chave a mais.

solution: |
  import asyncio


  async def patient_signal(readings, ms):
      await asyncio.sleep(ms / 1000)

      count = len(readings)
      total = sum(readings)

      mean = None
      if count > 0:
          mean = round(total / count, 2)

      return {"count": count, "total": total, "mean": mean, "waited_ms": ms}
