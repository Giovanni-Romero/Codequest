        pass

constraints:
  max_runtime_ms: 5000
  max_memory_mb: 128

tests:
  visible:
    - args: [[{name: download, kind: wait, size: 20}, {name: checksum, kind: compute, size: 1000}]]
      expect:
        threaded: [download]
        sequential: [checksum]
        results: {download: "waited 20ms", checksum: 499500}
    - args: [[{name: only, kind: compute, size: 10}]]
      expect:
        threaded: []
        sequential: [only]
        results: {only: 45}
  hidden:
    # Nenhum trabalho de nenhum dos dois tipos.
    - args: [[]]
      expect:
        threaded: []
        sequential: []
        results: {}
    # Só espera. Em sequência isso são 40ms; em threads são 30.
    - args: [[{name: a, kind: wait, size: 30}, {name: b, kind: wait, size: 10}]]
      expect:
        threaded: [a, b]
        sequential: []
        results: {a: "waited 30ms", b: "waited 10ms"}
    # `sum(range(0))` é 0. O trabalho rodou e pertence à pilha sequencial do mesmo jeito.
    - args: [[{name: x, kind: compute, size: 0}]]
      expect:
        threaded: []
        sequential: [x]
        results: {x: 0}
    # Intercalado. As duas listas têm de manter a ordem da entrada, não a ordem em que você rodou.
    - args:
        [
          [
            {name: n1, kind: wait, size: 10},
            {name: c1, kind: compute, size: 5},
            {name: n2, kind: wait, size: 25},
            {name: c2, kind: compute, size: 100},
          ],
        ]
      expect:
        threaded: [n1, n2]
        sequential: [c1, c2]
        results: {n1: "waited 10ms", c1: 10, n2: "waited 25ms", c2: 4950}
    # Uma espera de zero ainda é espera. O tipo decide a pilha, nunca o tamanho.
    - args: [[{name: solo, kind: wait, size: 0}]]
      expect:
        threaded: [solo]
        sequential: []
        results: {solo: "waited 0ms"}

hints:
  - level: 1
    text: |
      Qual dos dois tipos fica mais rápido com threads, e qual só fica mais complicado? O
      painel de ensino responde isso numa frase.

      Depois: as duas listas de nomes têm de estar na ordem da entrada. A ordem em que você
      *roda* as coisas precisa bater com a ordem em que você as *lista*?
  - level: 2
    text: |
      Construa as duas listas de nomes primeiro, direto da entrada, com duas compreensões
      filtrando por `job["kind"]`. Isso resolve a ordenação antes de existir thread alguma.

      Depois um `results = {}` compartilhado.

      A pilha de espera: uma `threading.Thread` por trabalho de espera, todas iniciadas,
      depois todas juntadas. O trabalhador dorme `job["size"] / 1000` e define
      `results[job["name"]]`.

      A pilha de cálculo: um laço `for` comum sobre `jobs`, pulando o que não for
      `"compute"`, definindo `results[job["name"]] = sum(range(job["size"]))`.
  - level: 3
    text: |
      O mesmo formato de duas pilhas, com cartas e encomendas:

          import threading
          import time


          def post(items):
              posted = {}

              def mail(item):
                  time.sleep(item["ms"] / 1000)
                  posted[item["ref"]] = "sent"

              hands = [threading.Thread(target=mail, args=(i,))
                       for i in items if i["kind"] == "letter"]
              for hand in hands:
                  hand.start()
              for hand in hands:
                  hand.join()

              for item in items:
                  if item["kind"] != "letter":
                      posted[item["ref"]] = item["ms"] * 2

              return posted

      A sua também informa que nomes foram para cada pilha, e as duas listas seguem a
      entrada em vez da execução.

solution: |
  import threading
  import time


  def dispatch(jobs):
      threaded = [job["name"] for job in jobs if job["kind"] == "wait"]
      sequential = [job["name"] for job in jobs if job["kind"] == "compute"]
      results = {}

      def run_wait(job):
          time.sleep(job["size"] / 1000)
          results[job["name"]] = f"waited {job['size']}ms"

      threads = [
          threading.Thread(target=run_wait, args=(job,))
          for job in jobs
          if job["kind"] == "wait"
      ]

      for thread in threads:
          thread.start()

      for thread in threads:
          thread.join()

      for job in jobs:
          if job["kind"] == "compute":
              results[job["name"]] = sum(range(job["size"]))

      return {"threaded": threaded, "sequential": sequential, "results": results}
