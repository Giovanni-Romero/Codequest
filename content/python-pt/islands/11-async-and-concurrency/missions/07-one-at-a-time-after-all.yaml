# Missão 7 de Async e Concorrência. Introduz: gil.
# Reforça: threads, event-loop, big-o, blocking-vs-nonblocking.
#
# `gil` é o terceiro conceito de painel do currículo, depois de print-debugging e
# interactive-debugger na Ilha 6. Provar que a GIL existe significa cronometrar threads
# presas na CPU, que é o que esta ilha proibiu; provar por condição de corrida é pior,
# porque o resultado é não determinístico por definição e o teste seria intermitente
# exatamente do jeito que ensina o jogador a desconfiar do jogo.
#
# Então o painel ensina e o teste avalia a **consequência**: o jogador separa os trabalhos
# pelo que de fato ajudaria cada um, e depois tem de rodar as duas metades do jeito que
# separou. A classificação não é tabela de consulta porque os dois ramos produzem tipos
# diferentes de resultado - string para os que vão a threads, inteiro para os calculados -
# então uma atribuição errada produz um `results` errado além de uma lista errada.
#
# Orçamento de sono: as esperas rodam concorrentes, então o relógio é a maior delas. 30ms aqui.
# Referência do schema: docs/mission-schema.md

id: py-async-07
title: Um de cada vez, afinal
track: python
island: async-and-concurrency
order: 7
difficulty: expert
tags: [async, gil, threads]
xp: 60

concepts:
  - gil

teaching:
  analogy: |
    A capitania contrata quatro escriturários e compra uma caneta.

    Para o serviço que é sobretudo espera — ficar na linha, olhar a régua de maré — quatro
    escriturários são quatro vezes melhores, porque nenhum deles precisa da caneta enquanto
    espera. Três podem estar esperando enquanto o quarto escreve.

    Para o serviço que é sobretudo escrita, quatro escriturários não são melhores que um, e
    são ligeiramente piores. Existe uma caneta. Eles fazem fila por ela, e perdem um tempo
    passando-a de mão em mão.

    A caneta não é uma falha de projeto. É por causa dela que ninguém precisa verificar se
    outra pessoa está no meio de uma frase na mesma linha, e é por causa dela que o
    escriturário sozinho sempre foi rápido.

  explanation: |
    O CPython tem uma **Global Interpreter Lock** — a GIL. É um lock que uma thread precisa
    segurar para executar bytecode Python, então **só uma thread roda Python por vez**, não
    importa quantos núcleos você tenha.

    A consequência se parte limpa em duas, e essa partição é o conceito inteiro:

    - **Esperar libera a GIL.** `time.sleep`, uma leitura de socket, uma leitura de disco,
      uma chamada de banco: o interpretador passa o lock adiante antes de bloquear. Então
      quatro threads esperando em quatro chamadas de rede realmente se sobrepõem, e threads
      realmente deixam trabalho preso em I/O quatro vezes mais rápido.
    - **Calcular segura a GIL.** Quatro threads somando quatro ranges grandes se revezam num
      núcleo. Você tem o mesmo tempo total de uma thread, mais o custo de alternar entre
      elas. Threads deixam Python preso na CPU *ligeiramente mais lento*, nunca mais rápido.

    O que usar no lugar, quando o trabalho é computação de verdade: **mais processos**.
    `multiprocessing` e `ProcessPoolExecutor` dão a cada trabalhador o próprio interpretador
    e a própria GIL, ao custo de copiar dados entre eles — então compensa para trabalho
    graúdo e perde feio em trabalho miúdo. Ou faça menos trabalho, que é a Ilha 10 e
    normalmente a resposta melhor.

    Duas coisas que as pessoas erram sobre ela:

    - **A GIL não torna estado compartilhado seguro.** A corrida da missão 6 continua sendo
      uma corrida. O lock é segurado por trecho de bytecode, não por comando seu.
    - **É uma troca, não um bug.** Removê-la torna Python de thread única mais lento, que é
      o caso de quase todo programa. Outras linguagens fizeram a outra escolha e pagam por
      isso em outro lugar. (O Python 3.13 traz um build opcional sem ela; não é o padrão, e a
      troca continua sendo uma troca.)

    Esta missão não cronometra nada, porque cronometrar threads é exatamente a medição que
    esta ilha se recusa a confiar. Ela avalia o que você faz com o conhecimento: ponha a
    espera em threads, e deixe o cálculo em paz.

  worked_example: |
    # Separando tarefas pelo que ajudaria cada uma, e fazendo cada pilha do seu jeito
    import threading
    import time


    def morning(chores):
        done = {}

        def wait_out(chore):
            time.sleep(chore["ms"] / 1000)
            done[chore["id"]] = "waited"

        hands = [threading.Thread(target=wait_out, args=(c,))
                 for c in chores if c["kind"] == "soak"]
        for hand in hands:
            hand.start()
        for hand in hands:
            hand.join()

        for chore in chores:
            if chore["kind"] != "soak":
                done[chore["id"]] = len(chore["id"])

        return done


    print(morning([{"id": "beans", "kind": "soak", "ms": 10},
                   {"id": "flour", "kind": "sift", "ms": 0}]))
    # {'beans': 'waited', 'flour': 5}
    # O molho se sobrepôs. A peneira não, e mandá-la para uma thread não ganharia nada.

  key_points:
    - "Um lock, uma thread rodando Python por vez. Mais núcleos não mudam isso no CPython."
    - "Esperar libera a GIL, então threads realmente sobrepõem I/O. Calcular a segura, então threads nunca aceleram aritmética."
    - "Para computação de verdade, use processos — cada um ganha o próprio interpretador — ou faça menos trabalho, que costuma ser melhor."
    - "A GIL não torna estado compartilhado seguro. A corrida da missão 6 continua sendo uma corrida, e continua precisando do lock."
    - "É uma troca que torna Python de thread única rápido, não um defeito. Quase todo programa é de thread única."

brief: |
  Separe os trabalhos da manhã pelo que de fato ajudaria cada um, e rode cada pilha do jeito
  dela.

  Escreva uma função chamada dispatch que recebe uma lista de trabalhos e devolve:

      {"threaded": ..., "sequential": ..., "results": ...}

  Cada trabalho é um dict com `"name"`, `"kind"` e `"size"`. O tipo é `"wait"` ou
  `"compute"`.

  Um trabalho `"wait"` é I/O: ele libera a GIL, então **rode cada um deles na própria
  `threading.Thread`**, todos ao mesmo tempo. A thread bloqueia com
  `time.sleep(size / 1000)` e registra a string `"waited {size}ms"` para o nome daquele
  trabalho.

  Um trabalho `"compute"` é aritmética: threads não ajudariam, então **rode um depois do
  outro**, na ordem dada, na thread principal. Cada um registra o inteiro
  `sum(range(size))` para o nome dele.

  `threaded` é a lista dos nomes que você mandou para threads, na ordem da entrada.
  `sequential` é a lista dos que você não mandou, na ordem da entrada. `results` é um dict
  mapeando o nome de todo trabalho para o que ele registrou.

  Uma lista vazia dá duas listas vazias e um dict vazio.

  Inicie todas as threads antes de juntar qualquer uma. Importe `threading` e `time` você
  mesmo. Nomes são únicos dentro de um caso.

