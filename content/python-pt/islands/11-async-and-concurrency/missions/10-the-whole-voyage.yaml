# Missão 10 de Async e Concorrência. Não introduz nada. Missão de fechamento da ilha,
# e da trilha Python.
# Reforça: todos os sete conceitos da ilha.
#
# Cada peça é copiada de uma missão anterior com outros nomes: o gather e a lista
# compartilhada de conclusão são a missão 4, as threads com posições são a missão 5, o
# modelo de custo é a missão 8. Nada aqui é novo e nada aqui é fácil, que é para isso que
# serve uma missão de fechamento.
#
# A única decisão genuína não é dita: os cálculos vão para threads e o enunciado não diz que
# isso é boa ideia, porque a missão 7 já disse que não é. O jogador roda ali mesmo assim,
# porque a missão pede uma demonstração e não o programa mais rápido possível - e o campo
# `choice` que ele calcula no fim é a resposta da ilha ao que ele acabou de fazer.
#
# Orçamento de sono: as esperas são reunidas, então o relógio é a maior delas. 50ms aqui.
# Referência do schema: docs/mission-schema.md

id: py-async-10
title: A viagem inteira
track: python
island: async-and-concurrency
order: 10
difficulty: expert
tags: [async, closing, gather, threads]
xp: 60

