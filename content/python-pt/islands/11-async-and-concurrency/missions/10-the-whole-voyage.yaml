tests:
  visible:
    - args: [[30, 10, 20], [100, 5], 500]
      expect:
        results: ["waited 30ms", "waited 10ms", "waited 20ms"]
        finished: [10, 20, 30]
        sums: [4950, 10]
        sequential_us: 60000
        concurrent_us: 31500
        choice: concurrent
    # Uma espera. Não há nada com que sobrepô-la, então o ramo perde pelo próprio custo.
    - args: [[15], [10], 500]
      expect:
        results: ["waited 15ms"]
        finished: [15]
        sums: [45]
        sequential_us: 15000
        concurrent_us: 15500
        choice: sequential
  hidden:
    # Absolutamente nada. Um gather vazio devolve lista vazia e empate fica com o laço.
    - args: [[], [], 500]
      expect:
        results: []
        finished: []
        sums: []
        sequential_us: 0
        concurrent_us: 0
        choice: sequential
    - args: [[40, 20], [], 1000]
      expect:
        results: ["waited 40ms", "waited 20ms"]
        finished: [20, 40]
        sums: []
        sequential_us: 60000
        concurrent_us: 42000
        choice: concurrent
    # Só cálculo. Nenhuma espera significa nada a sobrepor, e o veredito diz isso.
    - args: [[], [50], 500]
      expect:
        results: []
        finished: []
        sums: [1225]
        sequential_us: 0
        concurrent_us: 0
        choice: sequential
    # Um cálculo de tamanho 0 ainda ganha uma thread, e essa thread ainda tem de ser juntada.
    - args: [[10, 30, 50], [0], 200]
      expect:
        results: ["waited 10ms", "waited 30ms", "waited 50ms"]
        finished: [10, 30, 50]
        sums: [0]
        sequential_us: 90000
        concurrent_us: 50600
        choice: concurrent
    # Um custo absurdo. A espera é real e a concorrência perde do mesmo jeito, que é a última
    # palavra da ilha: os números decidem, não a ferramenta.
    - args: [[25], [], 30000]
      expect:
        results: ["waited 25ms"]
        finished: [25]
        sums: []
        sequential_us: 25000
        concurrent_us: 55000
        choice: sequential
    - args: [[50, 10], [1000, 2000, 3000], 100]
      expect:
        results: ["waited 50ms", "waited 10ms"]
        finished: [10, 50]
        sums: [499500, 1999000, 4498500]
        sequential_us: 60000
        concurrent_us: 50200
        choice: concurrent

hints:
  - level: 1
    text: |
      Três blocos, e cada um é uma missão que você já terminou. Descubra qual missão é cada
      bloco antes de escrever qualquer coisa.

      Uma armadilha na aritmética: `waits` está em milissegundos e o veredito está em
      microssegundos. Onde entra o fator de mil, e onde não entra?
  - level: 2
    text: |
      O bloco um é a missão 4, sem mudança: `finished = []`, um `async def` interno que
      dorme, acrescenta e devolve a string, depois `await asyncio.gather(*[...])` envolvido
      em `list(...)`.

      O bloco dois é a missão 5, sem mudança: `sums = [None] * len(computes)`, uma função
      interna recebendo posição e tamanho, `enumerate` para construir e iniciar as threads,
      um segundo laço para juntá-las.

      O bloco três é a missão 8, só sobre as esperas. `sum(waits) * 1000` e
      `len(waits) * overhead_us + max(waits, default=0) * 1000`. O custo já está em
      microssegundos, então é o único termo que não é multiplicado.
  - level: 3
    text: |
      A última peça, já que as outras duas estão nas missões 4 e 5 — o veredito, escrito
      sozinho:

          def verdict(delays_ms, per_branch_us):
              one_by_one = sum(delays_ms) * 1000
              together = len(delays_ms) * per_branch_us + max(delays_ms, default=0) * 1000

              return "together" if together < one_by_one else "one_by_one"


          print(verdict([30, 10, 20], 500))     # together
          print(verdict([15], 500))             # one_by_one

      O seu devolve `"concurrent"` e `"sequential"` no lugar, e informa os dois totais junto
      da palavra.

solution: |
  import asyncio
  import threading


  async def whole_voyage(waits, computes, overhead_us):
      finished = []

      async def run(ms):
          await asyncio.sleep(ms / 1000)
          finished.append(ms)
          return f"waited {ms}ms"

      results = list(await asyncio.gather(*[run(ms) for ms in waits]))

      sums = [None] * len(computes)

      def crunch(index, size):
          sums[index] = sum(range(size))

      threads = []
      for index, size in enumerate(computes):
          thread = threading.Thread(target=crunch, args=(index, size))
          threads.append(thread)
          thread.start()

      for thread in threads:
          thread.join()

      sequential_us = sum(waits) * 1000
      concurrent_us = len(waits) * overhead_us + max(waits, default=0) * 1000
      choice = "concurrent" if concurrent_us < sequential_us else "sequential"

      return {
          "results": results,
          "finished": finished,
          "sums": sums,
          "sequential_us": sequential_us,
          "concurrent_us": concurrent_us,
          "choice": choice,
      }
