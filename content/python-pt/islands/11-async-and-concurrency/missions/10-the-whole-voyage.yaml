teaching:
  analogy: |
    A última manhã na capitania.

    Três telegramas são despachados de uma vez e ninguém fica olhando nenhum deles. Três
    livros-caixa vão para três escriturários que disputam a mesma caneta. E antes de o
    capitão assinar qualquer coisa, alguém calcula no papel se todo esse arranjo valeu o
    trabalho.

    Nada na sala é novo. Hoje a sala roda.

  explanation: |
    Esta missão não introduz nada. Ela pede que você ponha quatro coisas na ordem certa sem
    que lhe digam qual vai onde, que é a parte que nenhum painel consegue ensinar.

    A versão curta de cada decisão, para a próxima vez que você a encontrar.

    **É espera ou é trabalho?** Tudo nesta ilha pende dessa única pergunta, e ela é
    respondida medindo, não chutando. Espera pode ser sobreposta. Trabalho não, e recorrer à
    concorrência ali é uma reescrita que não compra nada.

    **`asyncio` ou threads?** Se o código já fala o dialeto async até o fim da cadeia,
    `gather` é o ramo mais barato que existe. Se não fala — um arquivo, um driver antigo,
    algo que você não vai reescrever — uma thread roda aquilo sem alteração, que é exatamente
    o que você está pagando.

    **Em que ordem os resultados voltam?** `gather` te dá ordem de argumento e essa garantia
    é o que o torna utilizável. Threads não te dão nada: ou você escolhe uma posição de
    antemão ou aceita cara ou coroa. Ordem de conclusão é um fato sobre o relógio, e só vale
    registrar quando você quer ver a sobreposição.

    **Alguma coisa disso valeu a pena?** Conte os ramos, conte a espera, compare. Cem ramos
    a quinhentos microssegundos são cinquenta milissegundos gastos antes de qualquer
    trabalho acontecer, e se os serviços eram de cinquenta microssegundos cada você acabou
    de deixar um programa rápido lento e difícil de ler ao mesmo tempo.

    Nenhuma das quatro tem resposta que valha em todo lugar. Elas têm uma resposta aqui, e
    conseguir dizer por quê é para o que a ilha serviu.

  worked_example: |
    # Os mesmos dois motores lado a lado, sobre um carregamento em vez de durações
    import asyncio
    import threading


    async def unload(holds, crates):
        landed = []

        async def open_hold(seconds):
            await asyncio.sleep(seconds)
            landed.append(seconds)
            return f"hold {seconds} clear"

        called = list(await asyncio.gather(*[open_hold(s) for s in holds]))

        weights = [None] * len(crates)

        def weigh(slot, size):
            weights[slot] = size * 2

        hands = []
        for slot, size in enumerate(crates):
            hand = threading.Thread(target=weigh, args=(slot, size))
            hands.append(hand)
            hand.start()
        for hand in hands:
            hand.join()

        return {"called": called, "landed": landed, "weights": weights}


    print(asyncio.run(unload([0.02, 0.01], [3, 4])))
    # {'called': ['hold 0.02 clear', 'hold 0.01 clear'], 'landed': [0.01, 0.02], 'weights': [6, 8]}
    # Ordem de argumento em `called`, ordem do relógio em `landed`, ordem de posição em `weights`.

  key_points:
    - "Responda 'espera ou trabalho' primeiro. Todo o resto desta ilha vem depois disso, e só medir responde."
    - "`gather` para corrotinas, threads para código bloqueante que você não vai reescrever. A segunda é mais pesada e não pede nada ao código."
    - "`gather` devolve ordem de argumento. Threads não devolvem nada — escolha uma posição de antemão, ou aceite cara ou coroa."
    - "Ordem de conclusão é evidência de que as esperas se sobrepuseram, e evidência é a única coisa para que ela serve."
    - "Conte os ramos contra a espera antes de construir qualquer coisa. A resposta certa às vezes é um laço `for`."

brief: |
  Rode a capitania inteira, uma última vez.

  Escreva uma corrotina chamada whole_voyage que recebe uma lista de `waits` em
  milissegundos, uma lista de `computes` em tamanhos, e um `overhead_us` fixo, e devolve:

      {"results": ..., "finished": ..., "sums": ...,
       "sequential_us": ..., "concurrent_us": ..., "choice": ...}

  **As esperas, concorrentes.** Dê a cada uma a própria corrotina, que aguarda
  `asyncio.sleep(ms / 1000)`, acrescenta os `ms` dela a uma lista compartilhada, e devolve
  `"waited {ms}ms"`. Inicie todas com um `asyncio.gather`. `results` é o que o `gather`
  devolveu, como lista — ordem de argumento. `finished` é a lista compartilhada — ordem de
  conclusão. Todas as durações de um caso são diferentes, então nunca há empate.

  **Os cálculos, em threads.** Dê a cada tamanho a própria `threading.Thread` escrevendo
  `sum(range(size))` na própria posição de `sums`, para `sums` seguir a ordem da entrada.
  Inicie todas, depois junte todas. A missão 7 te disse que threads não vão deixar isso mais
  rápido; você está rodando ali mesmo assim para o último campo poder te dizer o que custou.

  **O veredito, só sobre as esperas.** Usando o modelo da missão 8, em microssegundos:

      sequential_us = sum(waits) * 1000
      concurrent_us = len(waits) * overhead_us + max(waits, default=0) * 1000

  `choice` é `"concurrent"` quando `concurrent_us` for **estritamente menor** que
  `sequential_us`, e `"sequential"` caso contrário.

  Duas listas vazias dão duas listas vazias, um `sums` vazio, 0, 0 e `"sequential"`.

  Importe `asyncio` e `threading` você mesmo. O motor aguarda a sua função — não chame
  `asyncio.run`.

signature:
  entrypoint: whole_voyage
  stub: |
    async def whole_voyage(waits, computes, overhead_us):
        # Reúna as esperas. Mande os cálculos para threads. Depois veja se valeu a pena.
        # seu código aqui
        pass

