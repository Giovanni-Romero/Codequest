constraints:
  forbidden_builtins: [sum]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: [100, [["rope", 12], ["sail", 30]], 80]
      expect: {load: 42, free: 38, capacity: 80}
    - args: [100, [], 50]
      expect: {load: 0, free: 50, capacity: 50}
  hidden:
    # Relicensing below what is already aboard. The setter's own rule.
    - args: [100, [["rope", 60]], 50]
      raises: OverloadError
    # Exactly at the load is allowed, and leaves no room.
    - args: [100, [["rope", 60]], 60]
      expect: {load: 60, free: 0, capacity: 60}
    # A negative capacity is a ValueError, not an OverloadError. Two rules, two names.
    - args: [100, [], -1]
      raises: ValueError
    # The starting capacity goes through the same setter, so this fails before any crate
    # is built. It is what proves __init__ assigned rather than stored directly.
    - args: [-5, [], 10]
      raises: ValueError
    # A crate that does not fit. `add` refuses, and retrim does not catch it.
    - args: [10, [["rope", 12]], 10]
      raises: OverloadError
    # Growing the licence. `free` follows without anything being recomputed by hand.
    - args: [100, [["rope", 12]], 500]
      expect: {load: 12, free: 488, capacity: 500}
    # A zero-weight crate is still a crate, and it moves nothing.
    - args: [10, [["letters", 0]], 10]
      expect: {load: 0, free: 10, capacity: 10}
    # Nothing anywhere. Every property still has to answer.
    - args: [0, [], 0]
      expect: {load: 0, free: 0, capacity: 0}
    # Several crates, added one at a time, each checked against the running load.
    - args: [50, [["a", 10], ["b", 10], ["c", 10]], 30]
      expect: {load: 30, free: 0, capacity: 30}

hints:
  - level: 1
    text: |
      `load` is not stored anywhere. So when `add` asks "would this crate fit?", where does
      the number it compares against come from?

      And in `__init__`: the capacity setter needs to know the current load. What does the
      load need to exist before it can be computed?
  - level: 2
    text: |
      `load` is a loop over `self.crates` with a running total, returned. `free` is one
      subtraction using `self.load` - no parentheses, because it is a property.

      The `capacity` getter returns `self._capacity`. The setter checks `value < 0` first,
      then `value < self.load`, then assigns `self._capacity = value`. Never
      `self.capacity = value` in there.

      `__init__` is two lines and the empty list comes first.
  - level: 3
    text: |
      The same two kinds of property, on a car park:

          class FullError(Exception):
              pass


          class CarPark:
              def __init__(self, spaces):
                  self.cars = []
                  self.spaces = spaces

              @property
              def taken(self):
                  total = 0
                  for car in self.cars:
                      total = total + 1
                  return total

              @property
              def spaces(self):
                  return self._spaces

              @spaces.setter
              def spaces(self, value):
                  if value < 0:
                      raise ValueError("a car park cannot have negative spaces")
                  if value < self.taken:
                      raise FullError(f"{self.taken} cars are already parked")
                  self._spaces = value

      Yours adds weights rather than counting cars, and it has a third property that
      subtracts.

solution: |
  from dataclasses import dataclass


  class OverloadError(Exception):
      pass


  @dataclass
  class Crate:
      name: str
      weight: int


  class Hold:
      def __init__(self, capacity):
          self.crates = []
          self.capacity = capacity

      @property
      def load(self):
          total = 0
          for crate in self.crates:
              total = total + crate.weight
          return total

      @property
      def free(self):
          return self.capacity - self.load

      @property
      def capacity(self):
          return self._capacity

      @capacity.setter
      def capacity(self, value):
          if value < 0:
              raise ValueError(f"{value} is not a capacity")
          if value < self.load:
              raise OverloadError(f"{self.load} is already aboard")
          self._capacity = value

      def add(self, crate):
          if self.load + crate.weight > self.capacity:
              raise OverloadError(f"{crate.weight} would take the load past {self.capacity}")
          self.crates.append(crate)


  def retrim(start_capacity, entries, new_capacity):
      hold = Hold(start_capacity)

      for name, weight in entries:
          hold.add(Crate(name, weight))

      hold.capacity = new_capacity

      return {"load": hold.load, "free": hold.free, "capacity": hold.capacity}
