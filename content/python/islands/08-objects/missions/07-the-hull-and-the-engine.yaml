tests:
  visible:
    - args: ["Aurora", 800, 400, 900]
      expect:
        ship: "Ship('Aurora', 1200)"
        engine: "Engine(400, 900)"
        total: 1200
        powered: true
    - args: ["Petrel", 800, 400, 100]
      expect:
        ship: "Ship('Petrel', 1200)"
        engine: "Engine(400, 100)"
        total: 1200
        powered: false
  hidden:
    # Power exactly half the total. "At least" means this one is powered.
    - args: ["Aurora", 800, 400, 600]
      expect:
        ship: "Ship('Aurora', 1200)"
        engine: "Engine(400, 600)"
        total: 1200
        powered: true
    # One unit under half. The boundary, from the other side.
    - args: ["Aurora", 800, 400, 599]
      expect:
        ship: "Ship('Aurora', 1200)"
        engine: "Engine(400, 599)"
        total: 1200
        powered: false
    # A weightless hull. The total is the engine alone, so a total_weight that forgot to
    # add the engine returns 0 here and is caught.
    - args: ["Skiff", 0, 50, 25]
      expect:
        ship: "Ship('Skiff', 50)"
        engine: "Engine(50, 25)"
        total: 50
        powered: true
    # A weightless engine. The mirror case: a total_weight that forgot the hull fails.
    - args: ["Barge", 900, 0, 450]
      expect:
        ship: "Ship('Barge', 900)"
        engine: "Engine(0, 450)"
        total: 900
        powered: true
    # No power at all, and nothing to move.
    - args: ["Hulk", 0, 0, 0]
      expect:
        ship: "Ship('Hulk', 0)"
        engine: "Engine(0, 0)"
        total: 0
        powered: true
    # An empty name still gets its quotes in the repr.
    - args: ["", 100, 100, 500]
      expect:
        ship: "Ship('', 200)"
        engine: "Engine(100, 500)"
        total: 200
        powered: true
    # Large and lopsided, so a hardcoded answer has nowhere to hide.
    - args: ["Leviathan", 9000, 1000, 4000]
      expect:
        ship: "Ship('Leviathan', 10000)"
        engine: "Engine(1000, 4000)"
        total: 10000
        powered: false

hints:
  - level: 1
    text: |
      `Ship.__init__` receives an Engine that is already built. What does it store - the
      engine, or the numbers taken out of it? One of those two answers lets you swap the
      engine later, and the other does not.
  - level: 2
    text: |
      `self.engine = engine`, with no unpacking. The engine's weight is then
      `self.engine.weight` everywhere you need it.

      `total_weight` is one `return` with an addition. `is_powered` compares the engine's
      power against half of what `total_weight()` gives back - and yes, a method may call
      another method on the same instance through `self`.

      `Ship.__repr__` also calls `total_weight()`, so the label is never out of date.
  - level: 3
    text: |
      The same two-class shape, for a bicycle:

          class Wheel:
              def __init__(self, weight, size):
                  self.weight = weight
                  self.size = size

              def __repr__(self):
                  return f"Wheel({self.weight}, {self.size})"


          class Bicycle:
              def __init__(self, owner, frame_weight, wheel):
                  self.owner = owner
                  self.frame_weight = frame_weight
                  self.wheel = wheel

              def total_weight(self):
                  return self.frame_weight + self.wheel.weight * 2

              def __repr__(self):
                  return f"Bicycle({self.owner!r}, {self.total_weight()})"

      Yours holds one engine rather than two wheels, and it has a second method that
      answers a yes-or-no question.

solution: |
  class Engine:
      def __init__(self, weight, power):
          self.weight = weight
          self.power = power

      def __repr__(self):
          return f"Engine({self.weight}, {self.power})"


  class Ship:
      def __init__(self, name, hull_weight, engine):
          self.name = name
          self.hull_weight = hull_weight
          self.engine = engine

      def total_weight(self):
          return self.hull_weight + self.engine.weight

      def is_powered(self):
          return self.engine.power >= self.total_weight() / 2

      def __repr__(self):
          return f"Ship({self.name!r}, {self.total_weight()})"


  def assemble(name, hull_weight, engine_weight, engine_power):
      engine = Engine(engine_weight, engine_power)
      ship = Ship(name, hull_weight, engine)

      return {
          "ship": repr(ship),
          "engine": repr(engine),
          "total": ship.total_weight(),
          "powered": ship.is_powered(),
      }
