constraints:
  forbidden_builtins: [sum]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["A1", 5000, [["Aurora", 800], ["Petrel", 400]], 5000]
      expect:
        berth: "Berth('A1', 1200/5000)"
        used: 1200
        same: true
    - args: ["A1", 5000, [["Aurora", 800]], 4000]
      expect:
        berth: "Berth('A1', 800/4000)"
        used: 800
        same: true
  hidden:
    # Nothing moored anywhere. Every property still answers.
    - args: ["B2", 100, [], 100]
      expect:
        berth: "Berth('B2', 0/100)"
        used: 0
        same: true
    # The new limit lands exactly on what is moored. Allowed, and it leaves no room.
    - args: ["A1", 5000, [["Aurora", 800]], 800]
      expect:
        berth: "Berth('A1', 800/800)"
        used: 800
        same: true
    # One tonne below what is already moored.
    - args: ["A1", 5000, [["Aurora", 800]], 799]
      raises: BerthFullError
    # A negative limit is a ValueError, not a BerthFullError. Two failures, two names.
    - args: ["A1", 5000, [], -1]
      raises: ValueError
    # The starting limit goes through the same setter, so this fails before any vessel exists.
    - args: ["A1", -5, [], 10]
      raises: ValueError
    # A vessel that does not fit. `moor` refuses and harbour does not catch it.
    - args: ["A1", 500, [["Leviathan", 900]], 500]
      raises: BerthFullError
    # Moored one at a time, each checked against the running total. The third is one over.
    - args: ["A1", 1000, [["a", 400], ["b", 400], ["c", 400]], 1000]
      raises: BerthFullError
    # A zero-tonnage vessel is still a vessel, and it moves nothing.
    - args: ["A1", 10, [["Raft", 0]], 10]
      expect:
        berth: "Berth('A1', 0/10)"
        used: 0
        same: true
    # An empty code still gets its quotes.
    - args: ["", 50, [["Skiff", 10]], 50]
      expect:
        berth: "Berth('', 10/50)"
        used: 10
        same: true

hints:
  - level: 1
    text: |
      Go through the brief one line at a time and label each item before you write anything:
      is this a fact you read, an action you take, or a question the language asks?

      Three labels, and each one tells you whether it is a property, a method or a dunder.
  - level: 2
    text: |
      `used` and `limit` are properties, `moor` is a method, `__repr__` and `__eq__` are
      dunders. The setter stores under `self._limit`, and `__init__` sets `self.vessels = []`
      before it touches `self.limit`.

      `__eq__` compares `self.code == other.code and self.limit == other.limit` - two
      attributes, not three, because the brief says the vessels do not count.

      That is why `same` is True even when the first berth is loaded: the second berth is
      built with the *new* limit, which is what the first one now has.
  - level: 3
    text: |
      You have written every one of these pieces in missions 4, 5, 7, 8, 9 and 10. Open the
      teaching panel of mission 9 for the property-with-a-setter shape, and mission 4 for
      the two dunders.

      The only genuinely new line is the repr, and it is one f-string:

          def __repr__(self):
              return f"Locker({self.code!r}, {self.taken}/{self.slots})"

      Yours says Berth, and its two numbers come from a property and a property.

solution: |
  from dataclasses import dataclass


  class BerthFullError(Exception):
      pass


  @dataclass
  class Vessel:
      name: str
      tonnage: int


  class Berth:
      def __init__(self, code, limit):
          self.vessels = []
          self.code = code
          self.limit = limit

      @property
      def used(self):
          total = 0
          for vessel in self.vessels:
              total = total + vessel.tonnage
          return total

      @property
      def limit(self):
          return self._limit

      @limit.setter
      def limit(self, value):
          if value < 0:
              raise ValueError(f"{value} is not a limit")
          if value < self.used:
              raise BerthFullError(f"{self.used} is already moored")
          self._limit = value

      def moor(self, vessel):
          if self.used + vessel.tonnage > self.limit:
              raise BerthFullError(f"{vessel.tonnage} would take the berth past {self.limit}")
          self.vessels.append(vessel)

      def __repr__(self):
          return f"Berth({self.code!r}, {self.used}/{self.limit})"

      def __eq__(self, other):
          return self.code == other.code and self.limit == other.limit


  def harbour(code, limit, entries, new_limit):
      berth = Berth(code, limit)

      for name, tonnage in entries:
          berth.moor(Vessel(name, tonnage))

      berth.limit = new_limit

      other = Berth(code, new_limit)

      return {
          "berth": repr(berth),
          "used": berth.used,
          "same": berth == other,
      }
