# Mission 8 of Strings and Text. Introduces: encoding-basics.
# Reinforces: string-methods.
#
# ENGINE CONSTRAINT: `bytes` does not cross the JSON boundary between the game and the
# sandbox - engine/harness.py falls back to repr for anything json.dumps cannot carry.
# So this mission never hands the player a bytes object nor asks for one back. It works
# in COUNTS, which is the part of the lesson that matters anyway and crosses cleanly as
# integers. See docs/curriculum/python-syllabus.md, Island 4.
# Schema reference: docs/mission-schema.md

id: py-strings-08
title: The weight of words
track: python
island: strings-and-text
order: 8
difficulty: simple
tags: [encoding, utf-8, bytes]
xp: 20

concepts:
  - encoding-basics

teaching:
  analogy: |
    A telegraph operator is paid by the character but charged by the pulse. For plain
    Latin letters the two match and nobody thinks about it. The day a message goes out
    with an accented name in it, the character count is unchanged and the bill is higher,
    because some characters simply take longer to send.

  explanation: |
    A string is a sequence of characters. It has no encoding - that is not something a
    string carries around.

    Bytes are what a file or a network actually stores, and *those* have an encoding. An
    encoding is the rule for turning characters into bytes and back.

    text.encode("utf-8") applies that rule and gives you bytes. In UTF-8 the plain ASCII
    characters cost one byte each, which is exactly why the difference stays invisible
    until you write a name like "José" or a word in Greek. Accented letters cost two,
    and many other scripts cost three or four.

    So len(text) and len(text.encode("utf-8")) answer different questions. The first is
    "how many characters". The second is "how much space does this take". Confusing them
    is what truncates a name mid-character and leaves a broken symbol on someone's
    screen.

  worked_example: |
    # Measuring a greeting rather than a manifest word
    plain = "hello"
    accented = "olá"

    print(len(plain), len(plain.encode("utf-8")))          # 5 5 - identical
    print(len(accented), len(accented.encode("utf-8")))    # 3 4 - one character costs 2

    # One character at a time:
    for ch in accented:
        print(ch, len(ch.encode("utf-8")))                 # o 1 / l 1 / á 2

  key_points:
    - A string is characters. Bytes are storage. An encoding is the rule between them.
    - "In UTF-8 an ASCII character costs one byte; accented and non-Latin characters cost more."
    - "len(text) and len(text.encode('utf-8')) answer different questions and often disagree."
    - Measuring a limit in bytes when you meant characters is how names get cut in half.

brief: |
  Write a function called text_weight that takes a piece of text and returns a list of
  exactly three whole numbers, in order:

    - how many characters the text has
    - how many bytes it takes when encoded as UTF-8
    - how many of its characters cost more than one byte

  text_weight("cafe") returns [4, 4, 0], and text_weight("café") returns [4, 5, 1].

  Empty text returns [0, 0, 0].

signature:
  entrypoint: text_weight
  stub: |
    def text_weight(text):
        # Two whole-string measurements, then one per-character count.
        # your code here
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["cafe"]
      expect: [4, 4, 0]
    - args: ["café"]
      expect: [4, 5, 1]
  hidden:
    - args: [""]
      expect: [0, 0, 0]
    - args: ["abc"]
      expect: [3, 3, 0]
    - args: ["ãé"]
      expect: [2, 4, 2]
    - args: ["a b"]
      expect: [3, 3, 0]
    - args: ["Ação"]
      expect: [4, 6, 2]
    - args: ["ç"]
      expect: [1, 2, 1]

hints:
  - level: 1
    text: |
      The first two numbers are one measurement each on the whole text. The third cannot
      be - it needs you to look at the characters one at a time. What can you measure
      about a single character?
  - level: 2
    text: |
      len(text) gives the first. len(text.encode("utf-8")) gives the second. For the
      third, loop over the characters and count the ones where
      len(character.encode("utf-8")) is greater than 1.
  - level: 3
    text: |
      The per-character half, counting something else:

          wide = 0
          for ch in text:
              if len(ch.encode("utf-8")) > 2:
                  wide = wide + 1

      Yours uses a different threshold and pairs the count with two whole-string
      measurements.

solution: |
  def text_weight(text):
      characters = len(text)
      byte_count = len(text.encode("utf-8"))

      multibyte = 0
      for character in text:
          if len(character.encode("utf-8")) > 1:
              multibyte = multibyte + 1

      return [characters, byte_count, multibyte]
