# Mission 7 of Algorithms. Introduces: sorting.
# Reinforces: big-o, linear-search.
#
# The player writes a sort and is then told not to ship it. That is not a trick: `sorted`
# is C, stable and better than any first attempt - but a player who has never written one
# cannot say what "stable" means, and will not recognise an accidental O(n^2) when they
# nest a `.index()` inside a loop next year.
#
# Selection sort is chosen over bubble sort because its comparison count is n(n-1)/2
# regardless of the data. A data-independent count is a graded count that cannot be argued
# with, and it is the same number mission 2 already produced for `pairs`.
# Schema reference: docs/mission-schema.md

id: py-algorithms-07
title: Put them in order
track: python
island: algorithms
order: 7
difficulty: challenging
tags: [algorithms, sorting, complexity]
xp: 45

concepts:
  - sorting

teaching:
  analogy: |
    You have ten crates to line up by weight, and one scale that compares two at a time.

    The simplest honest method: look at all ten, find the lightest, put it first. Look at
    the remaining nine, find the lightest of those, put it second. Nine comparisons, then
    eight, then seven - forty-five in all before the line is right.

    Forty-five for ten crates. A hundred crates is not ten times that, it is a hundred
    times: 4950. This is mission 2's `pairs` number again, arriving from a different
    direction, and it is the reason nobody sorts a warehouse this way.

  explanation: |
    **Selection sort** repeatedly finds the smallest of what is left and puts it in place:

        for i in range(len(values)):
            lowest = i
            for j in range(i + 1, len(values)):
                if values[j] < values[lowest]:
                    lowest = j
            values[i], values[lowest] = values[lowest], values[i]

    The comparison count is `n * (n - 1) / 2` - **the same on every input**. Sorted,
    reversed or shuffled, selection sort does identical work, because it never stops early.
    That makes it a clean thing to count and a bad thing to ship.

    Python's own sort is O(n log n): 10 items in about 33 comparisons rather than 45, 1000
    in about 10,000 rather than 500,000. It is also written in C and it is **stable** -
    items that compare equal keep the order they came in. Stability is what lets you sort
    by two keys in two passes: sort by name, then sort by date, and inside each date the
    names are still in order.

    Two things about the standard library that people get wrong:

        values.sort()       sorts in place, returns None
        sorted(values)      returns a new list, leaves the original alone

    `x = values.sort()` is a common way to end up holding `None`.

    And the habit worth taking from the count: sorting is not free, so sorting **inside** a
    loop is usually a mistake. Sort once, outside.

  worked_example: |
    # Selection sort over letters, which is not what this mission asks for
    def ordered_letters(word):
        letters = list(word)
        looks = 0

        for i in range(len(letters)):
            smallest = i
            for j in range(i + 1, len(letters)):
                looks = looks + 1
                if letters[j] < letters[smallest]:
                    smallest = j
            letters[i], letters[smallest] = letters[smallest], letters[i]

        return {"letters": letters, "looks": looks}


    print(ordered_letters("dab"))     # {'letters': ['a', 'b', 'd'], 'looks': 3}
    print(ordered_letters("abd"))     # {'letters': ['a', 'b', 'd'], 'looks': 3}
    # Already sorted, and it did the same three comparisons. It never checks.

  key_points:
    - "Selection sort does n(n-1)/2 comparisons on every input, sorted or not. It has no best case because it never stops early."
    - "`sorted(values)` returns a new list; `values.sort()` returns None and mutates. `x = values.sort()` leaves x holding None."
    - "Python's sort is O(n log n) and written in C. Hand-written sorts are for learning, not for shipping."
    - "A stable sort keeps equal items in their original order, which is what lets you sort by two keys in two passes."
    - "Sorting inside a loop turns an O(n log n) cost into an O(n^2 log n) one. Sort once, outside the loop."

brief: |
  Sort by hand, count what it cost, and then check yourself against the standard library.

  Write a function called order that takes a list of numbers and returns a dict:

      {"order": ..., "comparisons": ..., "same": ...}

  `order` is the numbers sorted from smallest to largest, as a new list. Do not modify the
  list you were given.

  Sort it with **selection sort**, exactly this way, because the count is graded:

    - for each position `i` from the start to the end, assume the value at `i` is the
      smallest of what remains
    - look at every position `j` after `i`; count one comparison for each; if the value
      there is smaller, that becomes the new smallest
    - when the inner walk finishes, swap the value at `i` with the smallest one found

  `comparisons` is that count.

  `same` is `True` when your sorted list equals `sorted(values)`. You are allowed to use
  `sorted` for this one field, and only for it - it is there so you can see that the
  built-in agrees with you, before you are told to use it from now on.

  An empty list gives `[]`, 0 comparisons and `True`.

signature:
  entrypoint: order
  stub: |
    def order(values):
        # Copy the list first. Then: outermost position, innermost search, swap.
        # your code here
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    # Four numbers: 3 + 2 + 1 = 6 comparisons.
    - args: [[5, 2, 9, 1]]
      expect:
        order: [1, 2, 5, 9]
        comparisons: 6
        same: true
    # Already sorted, and the count is unchanged. Selection sort has no best case.
    - args: [[1, 2, 3]]
      expect:
        order: [1, 2, 3]
        comparisons: 3
        same: true
  hidden:
    # Empty. The outer loop never runs.
    - args: [[]]
      expect:
        order: []
        comparisons: 0
        same: true
    # One item. The outer loop runs once and the inner one never does.
    - args: [[4]]
      expect:
        order: [4]
        comparisons: 0
        same: true
    # All equal. Three comparisons, no swap that changes anything.
    - args: [[3, 3, 3]]
      expect:
        order: [3, 3, 3]
        comparisons: 3
        same: true
    - args: [[2, 1]]
      expect:
        order: [1, 2]
        comparisons: 1
        same: true
    # Negatives and a zero, because the comparison is just `<`.
    - args: [[-1, 5, -9, 0]]
      expect:
        order: [-9, -1, 0, 5]
        comparisons: 6
        same: true
    # Six items reversed: the worst arrangement, and still 15 - the same as any other.
    - args: [[10, 9, 8, 7, 6, 5]]
      expect:
        order: [5, 6, 7, 8, 9, 10]
        comparisons: 15
        same: true

hints:
  - level: 1
    text: |
      The count is the same for a sorted list as for a shuffled one. If yours differs
      between the two visible cases, you added an early exit the brief did not ask for.

      And before anything else: how do you sort a copy without touching the original?
  - level: 2
    text: |
      `order = list(values)` gives you the copy.

      Outer: `for i in range(len(order))`. Track `lowest = i`. Inner:
      `for j in range(i + 1, len(order))`, count, compare `order[j] < order[lowest]`, update
      `lowest`.

      The swap is one line: `order[i], order[lowest] = order[lowest], order[i]`. Unpacking,
      from Island 9.
  - level: 3
    text: |
      The same two loops, finding the largest first instead of the smallest:

          def descending(numbers):
              result = list(numbers)
              looks = 0

              for i in range(len(result)):
                  biggest = i
                  for j in range(i + 1, len(result)):
                      looks = looks + 1
                      if result[j] > result[biggest]:
                          biggest = j
                  result[i], result[biggest] = result[biggest], result[i]

              return {"result": result, "looks": looks}

      Yours goes the other way, and it returns a third field comparing itself with the
      built-in.

solution: |
  def order(values):
      result = list(values)
      comparisons = 0

      for i in range(len(result)):
          lowest = i
          for j in range(i + 1, len(result)):
              comparisons = comparisons + 1
              if result[j] < result[lowest]:
                  lowest = j
          result[i], result[lowest] = result[lowest], result[i]

      return {
          "order": result,
          "comparisons": comparisons,
          "same": result == sorted(values),
      }
