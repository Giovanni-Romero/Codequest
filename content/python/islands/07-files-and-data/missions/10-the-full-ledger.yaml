# Mission 10 of Files and Data. Introduces nothing. Closing mission.
# Reinforces: open-and-read, context-managers, writing-files, json, csv, paths - all six
# concepts of the island, in one call.
#
# Back at the island's moderate band. Nothing here is harder than mission 7 or 9 on its
# own; what is new is holding three files with three different shapes at once, which is
# what real work with data actually feels like.
# Schema reference: docs/mission-schema.md

id: py-files-10
title: The full ledger
track: python
island: files-and-data
order: 10
difficulty: moderate
tags: [files, csv, json, paths, closing]
xp: 30

concepts:
  - csv
  - json
  - writing-files
  - paths
  - context-managers

teaching:
  analogy: |
    An audit is two documents and one question. The captain's declaration says the hold
    carries forty-two tonnes. The dock's own tally says what was actually carried aboard.
    Nobody is accused of anything; the job is to put both numbers on one page and say
    whether they agree.

    What makes it an audit rather than an opinion is that the page gets written down and
    kept, whichever way the answer came out.

  explanation: |
    Nothing new is introduced here. The island's six pieces, in one function:

    - `json.load` for the declaration, which is nested and has names
    - `csv.DictReader` for the tally, which is tabular and all strings
    - `Path(...).stem` for naming the source without typing a separator
    - a `with` block in mode `"w"` to write the report, and another to read it back

    The only thing worth planning is the order. You need the ship's name from the JSON
    before you can start the report, and you need every CSV row before you can write the
    total. So: load the manifest, then walk the rows building both the lines and the sum,
    then finish the report, then write it.

    Comparing the two totals gives a boolean, and that boolean is a real answer. `False`
    here does not mean the function failed - it means the audit found a discrepancy, which
    is the entire reason anyone runs it.

  worked_example: |
    # Reconciling a stock count, which is not what this mission asks for
    import csv
    import json

    def reconcile(expected_path, counted_path):
        with open(expected_path, encoding="utf-8") as handle:
            expected = json.load(handle)["count"]

        counted = 0
        with open(counted_path, newline="", encoding="utf-8") as handle:
            for row in csv.DictReader(handle):
                counted = counted + int(row["qty"])

        return {"expected": expected, "counted": counted, "matches": expected == counted}

  key_points:
    - Load the manifest before the loop. The report's first line needs the ship's name, which only the JSON has.
    - "Build the lines and the total in the same pass. Reading the CSV twice works and costs you a second open for nothing."
    - "Every CSV field is a string and every JSON number is already a number. The int() calls belong on one side only."
    - "A False result is an answer, not a failure. The report gets written either way - that is what makes it an audit."
    - "Return what you read back from the report file, not the list you built. They should be the same, and if they are not you want to know."

brief: |
  Two files describe the same voyage and they may disagree.

  The manifest is JSON:

      {"ship": "Aurora", "declared_total": 42}

  The cargo is CSV with three columns - port, item and weight. Some item names are quoted
  because they contain a comma.

  Write a function called close_the_books that takes a cargo filename, a manifest
  filename and a report filename.

  Build the report, one line each:

    - the ship's name
    - one line per cargo row, as "item: weight"
    - "total: N", the weights added together
    - "source: S", where S is the cargo filename without its extension

  Write it to the report file, every line ending in a newline, then read it back.

  Return a dict with five keys:

    - "ship" - the ship's name
    - "declared" - declared_total from the manifest
    - "actual" - the total you added up
    - "matches" - True when the two totals are equal, False when they are not
    - "report" - the report file's lines, read back, as a list of strings

  You may not use split or eval.

  These files already exist in your working directory: cargo.csv, manifest.json,
  short.csv, short.json, bare.csv and bare.json.

files:
  cargo.csv: |
    port,item,weight
    Lisbon,"rope, tarred",12
    Porto,sailcloth,30
  manifest.json: |
    {"ship": "Aurora", "declared_total": 42}
  short.csv: |
    port,item,weight
    Faro,salt,7
  short.json: |
    {"ship": "Petrel", "declared_total": 10}
  bare.csv: |
    port,item,weight
  bare.json: |
    {"ship": "Wren", "declared_total": 0}

