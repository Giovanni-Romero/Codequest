tests:
  visible:
    - args: ["cargo.csv", "manifest.json", "report.txt"]
      expect:
        ship: Aurora
        declared: 42
        actual: 42
        matches: true
        report: [Aurora, "rope, tarred: 12", "sailcloth: 30", "total: 42", "source: cargo"]
    - args: ["short.csv", "short.json", "report.txt"]
      expect:
        ship: Petrel
        declared: 10
        actual: 7
        matches: false
        report: [Petrel, "salt: 7", "total: 7", "source: short"]
  hidden:
    # No cargo at all. The report still has its title, its total and its source line.
    - args: ["bare.csv", "bare.json", "report.txt"]
      expect:
        ship: Wren
        declared: 0
        actual: 0
        matches: true
        report: [Wren, "total: 0", "source: bare"]
    # Mismatched pair on purpose: Aurora's cargo against Petrel's declaration. The ship
    # name comes from the manifest and the source line from the CSV, so a solution that
    # takes either from the wrong file shows it here.
    - args: ["cargo.csv", "short.json", "report.txt"]
      expect:
        ship: Petrel
        declared: 10
        actual: 42
        matches: false
        report: [Petrel, "rope, tarred: 12", "sailcloth: 30", "total: 42", "source: cargo"]
    # The first visible case again. The fixtures are restored between cases and mode "w"
    # empties the report, so this must not have grown.
    - args: ["cargo.csv", "manifest.json", "report.txt"]
      expect:
        ship: Aurora
        declared: 42
        actual: 42
        matches: true
        report: [Aurora, "rope, tarred: 12", "sailcloth: 30", "total: 42", "source: cargo"]
    # A different report target. Nothing in the content depends on where it is written.
    - args: ["short.csv", "short.json", "audit.log"]
      expect:
        ship: Petrel
        declared: 10
        actual: 7
        matches: false
        report: [Petrel, "salt: 7", "total: 7", "source: short"]
    - args: ["cargo.csv", "nowhere.json", "report.txt"]
      raises: FileNotFoundError

hints:
  - level: 1
    text: |
      Three files, and one of them has to be read before you can write the first line of
      the report. Which one, and why?
  - level: 2
    text: |
      Open the manifest with json.load and start your lines list with the ship's name.
      Then loop the DictReader rows once, adding int(row["weight"]) to a total and
      appending "item: weight" to the lines.

      After the loop, append the total line and the source line built from
      Path(cargo_path).stem. Then write with "\n".join(lines) + "\n" and read it back.
  - level: 3
    text: |
      The two readers side by side, on a different pair of files:

          with open(config_path, encoding="utf-8") as handle:
              config = json.load(handle)

          rows = []
          with open(data_path, newline="", encoding="utf-8") as handle:
              for row in csv.DictReader(handle):
                  rows.append(row["label"])

          summary = {"title": config["title"], "labels": rows}

      Yours also totals a column, writes a report file, and reads it back.

solution: |
  import csv
  import json
  from pathlib import Path


  def close_the_books(cargo_path, manifest_path, report_path):
      with open(manifest_path, encoding="utf-8") as handle:
          manifest = json.load(handle)

      lines = [manifest["ship"]]
      actual = 0

      with open(cargo_path, newline="", encoding="utf-8") as handle:
          for row in csv.DictReader(handle):
              weight = int(row["weight"])
              actual = actual + weight
              lines.append(row["item"] + ": " + str(weight))

      lines.append("total: " + str(actual))
      lines.append("source: " + Path(cargo_path).stem)

      with open(report_path, "w", encoding="utf-8") as handle:
          handle.write("\n".join(lines) + "\n")

      with open(report_path, encoding="utf-8") as handle:
          written = handle.read().splitlines()

      return {
          "ship": manifest["ship"],
          "declared": manifest["declared_total"],
          "actual": actual,
          "matches": actual == manifest["declared_total"],
          "report": written,
      }
