constraints:
  forbidden_builtins: [list, range, map]
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: ["harbour", 100, 3]
      expect:
        log: ["open harbour", "shut harbour"]
        lines: ["1: 303", "2: 306", "3: 309"]
        calls: 3
        name: measure
    - args: ["harbour", 0, 2]
      expect:
        log: ["open harbour", "shut harbour"]
        lines: ["1: 3", "2: 6"]
        calls: 2
        name: measure
  hidden:
    # Nothing wanted. The gate still opens and shuts, and measure is never called.
    - args: ["harbour", 100, 0]
      expect:
        log: ["open harbour", "shut harbour"]
        lines: []
        calls: 0
        name: measure
    # One wanted, and it is the first value past the threshold rather than the threshold.
    - args: ["north", 10, 1]
      expect:
        log: ["open north", "shut north"]
        lines: ["1: 33"]
        calls: 1
        name: measure
    # Strictly greater: 5 does not qualify against a threshold of 5.
    - args: ["north", 5, 2]
      expect:
        log: ["open north", "shut north"]
        lines: ["1: 18", "2: 21"]
        calls: 2
        name: measure
    # A threshold far out, so the lazy filter genuinely has to walk to it.
    - args: ["deep", 10000, 2]
      expect:
        log: ["open deep", "shut deep"]
        lines: ["1: 30003", "2: 30006"]
        calls: 2
        name: measure
    # An empty name still builds both log lines.
    - args: ["", 0, 1]
      expect:
        log: ["open ", "shut "]
        lines: ["1: 3"]
        calls: 1
        name: measure
    # Longer, so the numbering, the tripling and the count are each doing their own job.
    - args: ["long", 0, 6]
      expect:
        log: ["open long", "shut long"]
        lines: ["1: 3", "2: 6", "3: 9", "4: 12", "5: 15", "6: 18"]
        calls: 6
        name: measure

hints:
  - level: 1
    text: |
      Work out the order of operations before you write anything. Which happens first -
      filtering, taking, tripling or numbering? Two of those four can swap places without
      changing the answer, and two cannot.

      Then check the source: what stops `current()` if nothing in your code does?
  - level: 2
    text: |
      Four pieces, and three of them are copied from missions 6 to 10 with different words.

      Inside the block: build the filtered generator with round brackets, then a `while count
      > 0` pulling with `next` - or a `for` with a `break`. Call `measure` on each value you
      pull, keep your own position counter starting at 1, and append the string.

      `measure.calls` is read after the block, and it will already be right because the
      wrapper was counting the whole time.
  - level: 3
    text: |
      Every piece of this exists in an earlier mission on this island. Open mission 8's panel
      for the decorator, mission 10's for `@contextmanager`, and mission 7's for the filter
      over an endless source.

      The only assembly question is where `measure` is called, and the answer is the same
      place the string is built:

          line = f"{position}: {measure(value)}"

      Yours needs the position to advance, and the filter to have run before any of this.

solution: |
  from contextlib import contextmanager
  from functools import wraps


  def tallied(func):
      @wraps(func)
      def wrapper(*args, **kwargs):
          wrapper.calls = wrapper.calls + 1
          return func(*args, **kwargs)

      wrapper.calls = 0
      return wrapper


  @contextmanager
  def gate(log, name):
      log.append(f"open {name}")
      try:
          yield log
      finally:
          log.append(f"shut {name}")


  def current():
      value = 1
      while True:
          yield value
          value = value + 1


  @tallied
  def measure(value):
      return value * 3


  def survey(name, threshold, count):
      log = []
      lines = []

      with gate(log, name):
          strong = (value for value in current() if value > threshold)

          position = 1
          while count > 0:
              value = next(strong)
              lines.append(f"{position}: {measure(value)}")
              position = position + 1
              count = count - 1

      return {
          "log": log,
          "lines": lines,
          "calls": measure.calls,
          "name": measure.__name__,
      }
