# Mission 11 of Pythonic Patterns. Introduces nothing. Closing mission.
# Reinforces: all seven concepts of the island.
#
# Combine, do not learn. Every piece was taught earlier: a decorator that counts, a generator
# that filters an endless source lazily, a context manager that always closes, and a
# numbered walk over two sequences held together.
#
# The endless source is what stops this being solvable eagerly, and it is deliberate for a
# closing mission: the player has to have internalised the laziness, not merely copied the
# syntax, because a list comprehension anywhere in the chain turns the whole thing into a
# timeout.
# Schema reference: docs/mission-schema.md

id: py-patterns-11
title: The whole current
track: python
island: pythonic-patterns
order: 11
difficulty: challenging
tags: [patterns, closing, generators, decorators]
xp: 45

concepts:
  - unpacking
  - enumerate-zip
  - iterators
  - yield
  - generators
  - decorators
  - custom-context-managers

teaching:
  analogy: |
    The current runs whether or not anybody is watching. The harbour takes what it needs from
    it, keeps a note of how often it reached in, and closes the gate on the way out.

    Nothing about today is new. Today the harbour runs.

  explanation: |
    This mission introduces nothing. It asks you to put four tools in a row without being
    told which goes where, which is the part no panel can teach.

    The short version of each decision, for the next time you meet it.

    **List or generator?** If the source is endless, huge, or walked once, generator. If you
    need `len`, an index, or a second pass, list. Getting this wrong in the generator
    direction gives you a quiet empty second pass; getting it wrong in the list direction
    gives you a program that never returns.

    **Decorator or a call inside the function?** If the behaviour belongs to *every* call of
    a function, decorate it - the value is that no call site can forget. If it belongs to this
    one place, write the line.

    **Context manager or `try`/`finally`?** If the same pairing of setup and cleanup happens
    more than once, it wants a manager and a name. Once, in one function, is what
    `try`/`finally` is for.

    None of the three has an answer that holds everywhere. They have an answer here, and
    being able to say why is what the island was for.

  worked_example: |
    # The same four pieces, for a radio station
    from contextlib import contextmanager
    from functools import wraps


    def tallied(func):
        @wraps(func)
        def wrapper(*args, **kwargs):
            wrapper.plays = wrapper.plays + 1
            return func(*args, **kwargs)

        wrapper.plays = 0
        return wrapper


    @contextmanager
    def broadcast(log):
        log.append("on air")
        try:
            yield log
        finally:
            log.append("off air")


    def signal():
        beat = 1
        while True:
            yield beat
            beat = beat + 1

  key_points:
    - "A generator anywhere in a chain keeps the whole chain lazy. One list comprehension in the middle makes all of it eager again."
    - "Decorate when every call needs the behaviour. Write the line when this one call does."
    - "A context manager pays for itself the second time the same setup-and-cleanup pair appears."
    - "`enumerate(zip(a, b), 1)` is one header for three names, and it is worth recognising on sight."
    - "Everything on this island trades doing the work now for describing the work. The saving is real, and the price is that you can only walk the description once."

brief: |
  Run the whole current.

  Write a decorator called tallied. It counts calls in `wrapper.calls`, starting at 0, passes
  every argument through, returns what the wrapped function returned, and preserves
  `__name__` with `functools.wraps`.

  Write a context manager called gate, using `@contextmanager`, taking a log and a name. On
  entry it appends `"open <name>"` and yields the log. On exit it appends `"shut <name>"`,
  even when the block raises.

  Write a **generator function** called current that yields 1, 2, 3, 4 and so on, forever.

  Write a function called measure, decorated with `@tallied`, that takes a value and returns
  it tripled.

  Then write a function called survey that takes a name, a threshold and a count, and returns
  a dict:

      {"log": [...], "lines": [...], "calls": ..., "name": ...}

  Inside a `with gate(log, name)` block:

    - filter `current()` with a **generator expression** down to the values strictly greater
      than the threshold
    - take the first `count` of them, calling `measure` on each
    - build one string per value, numbered from 1, shaped `"1: 300"` - the number, a colon
      and a space, then what `measure` returned

  `log` is the log after everything. `lines` is that list of strings. `calls` is
  `measure.calls`. `name` is `measure.__name__`, which must be `"measure"`.

  A count of 0 gives no lines and no calls, and the gate still opens and shuts.

  You cannot use list, range or map. The source has no end, so anything that asks for all of
  it does not fail - it simply never returns.

