tests:
  visible:
    - args: [[10, 3, 8, 2]]
      expect: 2
    - args: [[10, 3, 8, 2], "worst"]
      expect: 2
  hidden:
    - args: [[10, 3, 8, 2], "list"]
      expect: [3, 2]
    - args: [[9, 9], "worst"]
      expect: null
    - args: [[9, 9], "count"]
      expect: 0
    - args: [[5, 5], "count", 5]
      expect: 0
    - args: [[5, 5], "count", 5]
      kwargs: { include_equal: true }
      expect: 2
    - args: [[], "list"]
      expect: []
    - args: [[1, 2], "nonsense"]
      expect: null
    - args: [[1, 20, 2], "list", 10]
      expect: [1, 2]
    - args: [[7], "worst", 10]
      expect: 7

hints:
  - level: 1
    text: |
      Three decisions have to happen before any report is produced, and one of them
      changes what "breach" even means. Write them down in order before writing code.
  - level: 2
    text: |
      Start by replacing limit with DEFAULT_LIMIT when it came in as None. Then build the
      list of breaches with a comprehension, choosing < or <= based on
      flags.get("include_equal"). Then look mode up in your dictionary of reporters,
      return None if it is missing, and otherwise call it on the breaches.
  - level: 3
    text: |
      The resolve-then-filter half, on a different report:

          if threshold is None:
              threshold = DEFAULT_THRESHOLD
          if flags.get("inclusive"):
              hits = [v for v in values if v <= threshold]
          else:
              hits = [v for v in values if v < threshold]

      The dispatch half is exactly the order book's, with three reporters instead of
      three drills.

solution: |
  DEFAULT_LIMIT = 5


  def count_of(breaches):
      return len(breaches)


  def worst_of(breaches):
      if not breaches:
          return None
      return min(breaches)


  def list_of(breaches):
      return list(breaches)


  def watch_report(readings, mode="count", limit=None, **flags):
      if limit is None:
          limit = DEFAULT_LIMIT

      if flags.get("include_equal"):
          breaches = [reading for reading in readings if reading <= limit]
      else:
          breaches = [reading for reading in readings if reading < limit]

      reporter = {"count": count_of, "worst": worst_of, "list": list_of}.get(mode)
      if reporter is None:
          return None
      return reporter(breaches)
