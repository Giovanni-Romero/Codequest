# Mission 12 of Functions. Closing mission. Introduces nothing.
# Combines all eight concepts of the island.
# Schema reference: docs/mission-schema.md

id: py-functions-12
title: The full watch
track: python
island: functions
order: 12
difficulty: simple
tags: [dispatch-table, sentinel, defaults, kwargs]
xp: 20

concepts:
  - parameters
  - return-values
  - default-arguments
  - mutable-default-trap
