teaching:
  analogy: |
    End of watch. The officer writes one report, and what goes in it depends on who
    asked: the captain wants a number, the navigator wants the worst reading, the
    engineer wants the whole list. One function, three questions, one standing limit on
    the wall that anybody may override for their own watch.

  explanation: |
    Nothing new. Every piece of this has its own mission behind it:

      - a parameter with a default, so the usual call is short
      - the None sentinel, so an optional value that could have been a list is safe and
        can fall back to the constant on the wall
      - a module-level constant, read but never reassigned
      - a dictionary of names to functions instead of an if/elif chain
      - **flags for the occasional adjustment
      - and a report that never modifies the readings it was handed

    The only real work is deciding the order things happen in. Work out the limit first,
    then which readings breached it, then hand that to whichever reporter was asked for.

  worked_example: |
    # A shop's end-of-day report, same assembly, different subject
    DEFAULT_FLOOR = 10

    def how_many(rows):
        return len(rows)

    def lowest(rows):
        if not rows:
            return None
        return min(rows)

    REPORTS = {"count": how_many, "lowest": lowest}

    def day_report(sales, mode="count", floor=None, **flags):
        if floor is None:
            floor = DEFAULT_FLOOR
        if flags.get("include_equal"):
            poor = [s for s in sales if s <= floor]
        else:
            poor = [s for s in sales if s < floor]
        reporter = REPORTS.get(mode)
        if reporter is None:
            return None
        return reporter(poor)

    print(day_report([20, 5, 3]))                        # 2
    print(day_report([20, 5, 3], "lowest"))              # 3
    print(day_report([10, 20], "count", include_equal=True))   # 1

  key_points:
    - A closing mission asks you to assemble, not to learn. Every construct here already has a mission behind it.
    - "Order of operations is the real design work: resolve the limit, then filter, then report."
    - The None sentinel is the safe default for anything optional, and it reads clearly even when the value is a number.
    - Filtering with a comprehension builds a new list, so the readings you were handed survive untouched.

brief: |
  The stub has one standing order on the wall: DEFAULT_LIMIT. Leave it there.

  Write a function called watch_report that takes:

    - readings: a list of depth numbers
    - mode: which report to produce, defaulting to "count"
    - limit: the shallow-water limit, defaulting to None, meaning "use DEFAULT_LIMIT"
    - any number of keyword flags

  A reading is a breach when it is strictly below the limit. When the flag include_equal
  is True, a reading exactly equal to the limit counts as a breach too.

  The reports, which you must dispatch through a dictionary rather than an if/elif chain:

    - "count": how many breaches there were
    - "worst": the lowest breaching reading, or None when there were none
    - "list": the breaching readings, in the order they appeared, as a new list

  If mode is not one of the three, return None.

  Whatever you do, the readings list you were handed must come out unchanged.

