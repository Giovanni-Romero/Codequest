        # your code here
        pass


    def biggest(values):
        # your code here
        pass


    def smallest(values):
        # your code here
        pass


    def survey(numbers, how="count", **options):
        # Filter if asked, pick the survey out of the book, run it on what is left.
        # your code here
        pass

constraints:
  max_runtime_ms: 2000
  max_memory_mb: 128

tests:
  visible:
    - args: [[3, 9, 1]]
      expect: 3
    - args: [[3, 9, 1], "biggest"]
      expect: 9
  hidden:
    - args: [[3, 9, 1], "smallest"]
      expect: 1
    - args: [[-5, 2, 7], "smallest"]
      expect: -5
    - args: [[-5, 2, 7], "smallest"]
      kwargs: { ignore_negatives: true }
      expect: 2
    - args: [[-5, -2], "count"]
      kwargs: { ignore_negatives: true }
      expect: 0
    - args: [[], "biggest"]
      expect: 0
    - args: [[1, 2], "hoist"]
      expect: 0
    - args: [[4]]
      expect: 1
    - args: [[-1, -2, 5], "count"]
      expect: 3

hints:
  - level: 1
    text: |
      Three things happen in order here, and getting the order right is most of the work.
      Which has to happen before the survey runs, and which decides whether it runs at
      all?
  - level: 2
    text: |
      First, if options.get("ignore_negatives") is true, rebuild numbers as a filtered
      copy. Then, if the list is empty, return 0. Then look how up in your dictionary of
      surveys with .get, return 0 when it is missing, and otherwise call it on the list.
  - level: 3
    text: |
      The filter and the lookup, on a different survey:

          if options.get("only_paid"):
              rows = [r for r in rows if r > 0]
          tool = TOOLS.get(kind)
          if tool is None:
              return 0
          return tool(rows)

      Yours also has to decide what an empty list means before it reaches the tool.

solution: |
  def count(values):
      return len(values)


  def biggest(values):
      return max(values)


  def smallest(values):
      return min(values)


  def survey(numbers, how="count", **options):
      if options.get("ignore_negatives"):
          numbers = [number for number in numbers if number >= 0]

      if not numbers:
          return 0

      tool = {"count": count, "biggest": biggest, "smallest": smallest}.get(how)
      if tool is None:
          return 0
      return tool(numbers)
