# Mission 11 of Functions. Relief mission. Introduces nothing.
# Reinforces: first-class-functions, args-kwargs, default-arguments.
# Schema reference: docs/mission-schema.md

id: py-functions-11
title: Choosing the tool
track: python
island: functions
order: 11
difficulty: elementary
tags: [dispatch-table, defaults, kwargs]
xp: 10

concepts:
  - first-class-functions
  - args-kwargs
  - default-arguments

teaching:
  analogy: |
    A surveyor arrives at the hold with one question to answer and a bag of instruments.
    Which instrument depends on the question, and there is one she reaches for by habit
    when nobody says otherwise. Occasionally she is told to ignore part of the cargo
    before measuring.

  explanation: |
    Nothing new. This is the dispatch table from the order book, given a default so the
    common question needs no arguments at all, and a bag of keyword options for the
    unusual request.

    Three things you already have, sitting next to each other:

      - a parameter with a default, for the survey people ask for most
      - a dictionary of names to functions, so adding a fourth survey is one line
      - **options, so a caller can adjust the run without the signature growing

    When an option is not passed at all, options simply has no such key - which is
    exactly what .get with a fallback is for.

  worked_example: |
    # Surveying a shelf of books rather than a hold
    def newest(years):
        return max(years)

    def oldest(years):
        return min(years)

    SURVEYS = {"newest": newest, "oldest": oldest}

    def shelf(years, kind="newest", **options):
        if options.get("since"):
            years = [y for y in years if y >= options["since"]]
        if not years:
            return 0
        return SURVEYS[kind](years)

    print(shelf([1990, 2005, 2020]))                     # 2020 - the default survey
    print(shelf([1990, 2005, 2020], "oldest"))           # 1990
    print(shelf([1990, 2005, 2020], "oldest", since=2000))  # 2005

  key_points:
    - A default turns the most common call into the shortest one.
    - "**options lets a caller adjust behaviour without every possible setting appearing in the signature."
    - "options.get(name) returns None when the caller never mentioned it - no need to check membership first."
    - Reassigning a parameter to a filtered copy is safe. Filtering with a comprehension builds a new list, so the caller's list is untouched.

brief: |
  Write a function called survey that measures a hold of cargo weights.

  It takes:

    - numbers: a list of weights
    - how: which survey to run, defaulting to "count"
    - any number of keyword options

  The surveys are:

    - "count": how many weights there are
    - "biggest": the largest weight
    - "smallest": the smallest weight

  Build a dictionary from those names to three small functions, the same way the order
  book did. If how is not one of the three, return 0.

  One option is recognised: when ignore_negatives is True, drop every negative weight
  before running the survey. Leave the caller's list alone while you do it.

  An empty list of weights - whether it arrived empty or became empty after filtering -
  returns 0 for every survey.

signature:
  entrypoint: survey
  stub: |
