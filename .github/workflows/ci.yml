name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest tests/unit

      - name: Content tests
        run: pytest tests/content

      - name: Integration tests
        run: pytest tests/integration

  ai-ml:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,ai-ml]"

      - name: AI/ML content
        run: pytest tests/content/test_all_missions.py -k "pytorch or transformers"

  # The Windows fallback in engine/runners/python.py now exists: no rlimits, so the
  # runner degrades to a wall-clock timeout plus taskkill /T on the process tree.
  # That path is exactly the code that breaks silently, which is why it gets its own job
  # rather than being assumed equivalent to the Linux one.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/unit

      - name: Content tests
        run: pytest tests/content

      - name: Integration tests
        run: pytest tests/integration
